      React.useEffect(() => {
        if (!SERVER_MODE || !activePath) return undefined;
        const refreshSeconds = Number(window.__PRD_REFRESH_SECONDS__ || 0);
        if (!refreshSeconds) return undefined;
        let cancelled = false;
        async function tick() {
          try {
            const r = await fetch(
              "/api/prd?path=" + encodeURIComponent(activePath) + "&t=" + Date.now(),
              { cache: "no-store" }
            );
            if (!r.ok) {
              const err = await r.json().catch(() => ({}));
              throw new Error(err.error || ("HTTP " + r.status));
            }
            const raw = await r.json();
            const normalized = {
              ...raw,
              path: raw.path || activePath,
              sourceUrl: "",
              stories: Array.isArray(raw.stories) ? raw.stories : [],
              epics: Array.isArray(raw.epics) ? raw.epics : [],
              stats: raw.stats || { total: 0, complete: 0, pending: 0, completionPct: 0 }
            };
            if (!cancelled) {
              setProjects([normalized]);
              setSyncStatus("Auto-refreshed " + new Date().toLocaleTimeString());
              setSyncError(false);
            }
          } catch (err) {
            if (!cancelled) {
              setSyncStatus("Auto-refresh failed: " + (err.message || "unknown"));
              setSyncError(true);
            }
          }
        }
        const timer = window.setInterval(tick, refreshSeconds * 1000);
        return () => { cancelled = true; window.clearInterval(timer); };
      }, [activePath]);

      // SERVER MODE: persist hide-completed + selected story per PRD.
      React.useEffect(() => {
        if (!SERVER_MODE) return;
        setCookie(COOKIE_HIDE_COMPLETED, hideCompleted ? "true" : "false");
      }, [hideCompleted]);

      React.useEffect(() => {
        if (!SERVER_MODE || !activePath || !selectedStoryId) return;
        setCookie(COOKIE_LAST_SELECTION, JSON.stringify({ path: activePath, storyId: selectedStoryId }));
      }, [activePath, selectedStoryId]);

      // SERVER MODE: close picker after selection.
      React.useEffect(() => {
        if (SERVER_MODE) setPickerOpen(false);
      }, [activePath]);

      React.useEffect(() => {
        if (!project) return;
        const stories = project.stories || [];
        if (!stories.length) {
          setSelectedStoryId("");
          return;
        }
        if (!stories.some((story) => story.id === selectedStoryId)) {
          setSelectedStoryId(stories[0].id);
        }
      }, [projectIndex]);

      const filteredStories = React.useMemo(() => {
        if (!project) return [];
        const normalized = query.trim().toLowerCase();
        const epic = (epicFilter || "all").toUpperCase();
        return project.stories.filter((story) => {
          const matchesEpic =
            epic === "ALL" ||
            (story.epicId || "").toUpperCase() === epic;
          const matchesStatus =
            statusFilter === "all" ||
            (statusFilter === "complete" && story.passes) ||
            (statusFilter === "pending" && !story.passes);
          const matchesUrgency =
            urgencyFilter === "all" ||
            (urgencyFilter === "high" && story.priority <= 5) ||
            (urgencyFilter === "medium" && story.priority > 5 && story.priority <= 10) ||
            (urgencyFilter === "low" && story.priority > 10);
          if (!matchesEpic || !matchesStatus || !matchesUrgency) return false;
          const haystack = [
            story.id,
            story.title,
            story.description,
            story.notes,
            ...story.acceptanceCriteria
          ].join("\n").toLowerCase();
          return !normalized || haystack.includes(normalized);
        });
      }, [project, query, statusFilter, urgencyFilter, epicFilter]);

      const selectedStory =
        filteredStories.find((story) => story.id === selectedStoryId) ||
        (filteredStories.length ? filteredStories[0] : null);

      React.useEffect(() => {
        if (selectedStory && selectedStory.id !== selectedStoryId) {
          setSelectedStoryId(selectedStory.id);
        }
      }, [selectedStory ? selectedStory.id : ""]);

      if (!project) {
        return e("div", { className: "app" },
          e("div", { className: "shell" },
            e("h1", null, "PRD Visualization"),
            e("p", { className: "subtitle" }, "No PRD data loaded.")
          )
        );
      }

      return e("div", { className: "app" },
        e("div", { className: "shell" },
          e("div", { className: "top-bar" },
            SERVER_MODE
              ? e(PrdPicker, {
                  options: scanFiles,
                  activePath: activePath,
                  open: pickerOpen,
                  hideCompleted: hideCompleted,
                  scanRoot: SCAN_ROOT,
                  onToggle: () => setPickerOpen((cur) => !cur),
                  onClose: () => setPickerOpen(false),
                  onSelect: (path) => {
                    if (path !== activePath) {
                      setActivePath(path);
                      setQuery("");
                      setStatusFilter("all");
                      setUrgencyFilter("all");
                      setEpicFilter("all");
                    }
                    setPickerOpen(false);
                  },
                  onToggleHideCompleted: setHideCompleted
                })
              : (projects.length > 1 ? e("div", { className: "project-tabs" },
                  projects.map((item, index) =>
                    e("button", {
                      key: item.path,
                      className: "project-tab" + (index === projectIndex ? " active" : ""),
                      onClick: () => {
                        setProjectIndex(index);
                        setQuery("");
                        setStatusFilter("all");
                        setUrgencyFilter("all");
                        setEpicFilter("all");
                        setSelectedStoryId(item.stories[0] ? item.stories[0].id : "");
                      }
                    }, item.project)
                  )
                ) : e("div", null)),
            e("label", { className: "theme-picker" },
              e("span", { className: "theme-picker-label" }, "Theme"),
              e("select", {
                className: "theme-select",
                value: theme,
                onChange: (ev) => handleThemeChange(ev.target.value)
              },
                THEMES.map((t) => e("option", { key: t.id, value: t.id }, t.label))
              )
            )
          ),
          syncStatus ? e("div", { className: "sync-status" + (syncError ? " error" : "") }, syncStatus) : null,
          e("div", { className: "main-grid", ref: gridRef },
            e("aside", { className: "sidebar" },
              e(StoryListPane, {
                project: project,
                query: query,
                statusFilter: statusFilter,
                urgencyFilter: urgencyFilter,
                epicFilter: epicFilter,
                filteredStories: filteredStories,
                selectedStory: selectedStory,
                onQueryChange: setQuery,
                onStatusFilterChange: setStatusFilter,
                onUrgencyFilterChange: setUrgencyFilter,
                onEpicFilterChange: setEpicFilter,
                onSelectStory: setSelectedStoryId
              })
            ),
            e("div", { className: "resizer resizer-1", onPointerDown: beginDrag(1), title: "Drag to resize" }),
            e("section", { className: "summary-pane" },
              e(SummaryPane, { project: project, story: selectedStory })
            ),
            e("div", { className: "resizer resizer-2", onPointerDown: beginDrag(2), title: "Drag to resize" }),
            e("section", { className: "details" },
              e(DetailsPane, { project: project, story: selectedStory })
            )
          ),
          e("div", { className: "mobile-accordion" },
            e("details", { className: "mobile-panel", open: true },
              e("summary", null, "Tickets"),
              e("div", { className: "mobile-panel-body" },
                e("div", { className: "sidebar" },
                  e(StoryListPane, {
                    project: project,
                    query: query,
                    statusFilter: statusFilter,
                    urgencyFilter: urgencyFilter,
                    epicFilter: epicFilter,
                    filteredStories: filteredStories,
                    selectedStory: selectedStory,
                    onQueryChange: setQuery,
                    onStatusFilterChange: setStatusFilter,
                    onUrgencyFilterChange: setUrgencyFilter,
                    onEpicFilterChange: setEpicFilter,
                    onSelectStory: setSelectedStoryId
                  })
                )
              )
            ),
            e("details", { className: "mobile-panel", open: true },
              e("summary", null, "Description"),
              e("div", { className: "mobile-panel-body" },
                e("div", { className: "summary-pane" },
                  e(SummaryPane, { project: project, story: selectedStory })
                )
              )
            ),
            e("details", { className: "mobile-panel" },
              e("summary", null, "Details"),
              e("div", { className: "mobile-panel-body" },
                e("div", { className: "details" },
                  e(DetailsPane, { project: project, story: selectedStory })
                )
              )
            )
          )
        )
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(e(App));
  </script>
</body>
</html>

uired (exit 2) is unchanged in behavior and still emitted by the existing decisions flow", "CommandFailure (exit 1) is preserved for routine handled failures (symbol-not-found, file-not-found, bad input from within commands)", "Symbol-not-found exits 1 with stderr \"Error: <symbol description>\" â€” never an unhandled exception", "Invalid CLI argument combinations exit 3 (ValidationError) with stderr \"Error: <message>\"", "File-not-found for --solution path exits 1 with clean stderr message", "When RtContext.Format == OutputFormat.Json and a failure occurs, stdout emits a JSON object: {\"status\":\"failed\",\"exitCode\":N,\"error\":{\"message\":\"...\"}}", "JSON failure output does not include the stack trace unless --verbose", "A unit test verifies RtExitCodes constants have the documented integer values", "A unit test verifies App.RunAsync returns 3 when a handler throws ArgumentException", "A unit test verifies App.RunAsync returns 10 when a handler throws an unexpected Exception (e.g., NullReferenceException)", "A unit test verifies App.RunAsync returns 0 on successful command", "A unit test verifies App.RunAsync returns 2 when a command signals decisions required", "A unit test verifies stderr does not contain \"   at \" (stack trace frames) on ValidationError", "A unit test verifies stderr contains stack trace frames when --verbose is set on InternalError", "A unit test verifies JSON failure envelope shape when --json is set and a failure occurs", "Existing tests asserting exit code 1 for command failures still pass", "All commands continue to use the existing exit-code patterns (no behavior regressions)", "dotnet build RoslynTools.slnx passes", "dotnet test RoslynTools.slnx passes", "dotnet format RoslynTools.slnx --verify-no-changes passes"], "priority": 37, "passes": false, "notes": "Add static class RtExitCodes: Success=0, CommandFailure=1, DecisionsRequired=2, ValidationError=3, InternalError=10, VerificationFailed=4. Update App.RunAsync top-level exception handler. JSON-mode failures emit machine-readable envelope. --verbose flag for stack traces on InternalError. Affected files: src/RoslynTools/Core/RtExitCodes.cs (new), src/RoslynTools.Cli/App.cs.\n\n[2026-05-05] Partial: 4cc5a1e added CommandHandlerConstants with Success/Error only (not the full RtExitCodes set: ValidationError, DecisionsRequired, InternalError). App.RunAsync hardening (try/catch for ArgumentException/InvalidOperationException) not yet done.", "epicId": "EP-008"}, {"id": "US-038", "title": "Add rt verify command that wraps dotnet build and dotnet test and emits structured JSON", "description": "As an LLM caller, I want rt verify --solution X --build --test --json to run build and/or test and emit a structured JSON result without me having to parse raw dotnet output so that I can confirm code correctness after a refactor.", "acceptanceCriteria": ["A new file src/RoslynTools/Commands/VerifyCommand.cs exists and defines internal sealed class VerifyCommand implementing IRtCommand", "VerifyCommand.Info.Name == \"verify\"", "VerifyCommand.Info.Category is one of \"inspect\", \"analyze\", \"refactor\", or a newly registered category â€” choice documented in code comment", "VerifyCommand.Info.Mutates == false", "VerifyCommand.Info.JsonOutput == true", "VerifyCommand.Info.SupportedFormats includes OutputFormat.Json", "VerifyCommand.Info.Examples includes at least one example with --build, --test, --json", "A new file src/RoslynTools/Services/VerifyService.cs exists with a method like static async Task<VerifyResult> RunAsync(string solution, bool build, bool test, int timeoutSeconds, CancellationToken ct)", "RtExitCodes.VerificationFailed = 4 is added (depends on US-037)", "Running `rt verify --solution X --build --json` invokes `dotnet build <solution>` as a subprocess", "Running `rt verify --solution X --test --json` invokes `dotnet test <solution>` as a subprocess", "Running `rt verify --solution X --build --test --json` invokes both, in order build then test", "Build stdout/stderr is redirected to .rt/logs/verify/build.log", "Test stdout/stderr is redirected to .rt/logs/verify/test.log", "The .rt/logs/verify directory is created if it does not exist", "JSON output matches: {\"status\":\"succeeded|failed\",\"solution\":\"...\",\"durationMs\":<int>,\"build\":{\"executed\":<bool>,\"succeeded\":<bool>,\"logPath\":\"...\"},\"tests\":{\"executed\":<bool>,\"succeeded\":<bool>,\"logPath\":\"...\"}}", "build.executed == false and tests.executed == false when the corresponding flag is not passed", "build.succeeded reflects exit code 0 of dotnet build", "tests.succeeded reflects exit code 0 of dotnet test", "status == \"succeeded\" only when all executed stages succeeded", "status == \"failed\" when any executed stage failed", "Exit code is RtExitCodes.Success (0) when status == \"succeeded\"", "Exit code is RtExitCodes.VerificationFailed (4) when status == \"failed\"", "durationMs is the wall-clock time in milliseconds for the entire verify run", "--timeout-seconds defaults to 120", "--timeout-seconds value is honored: subprocess is killed after the timeout and the stage records succeeded == false", "Specifying neither --build nor --test exits with RtExitCodes.ValidationError (3) and stderr message about needing at least one stage", "--solution is required; missing --solution exits 3 with clean error", "Logs are not parsed (no TRX/binlog parsing in this stage) â€” only exit codes and raw redirected output", "logPath in JSON is the absolute path to the log file", "Pre-existing log files from a previous run are overwritten or rotated (behavior is documented and tested)", "Test for happy-path build success against a small fixture solution", "Test for build failure scenario (introduce a syntax error fixture) returns succeeded:false and exit 4", "Test for test failure scenario (introduce a failing test fixture) returns succeeded:false and exit 4", "Test for timeout scenario (sleep fixture) returns succeeded:false", "Test verifies log files are created and contain captured stdout/stderr", "Output written via RtSerializer.Write following ListSmellsCommand pattern", "dotnet build RoslynTools.slnx passes", "dotnet test RoslynTools.slnx passes", "dotnet format RoslynTools.slnx --verify-no-changes passes"], "priority": 38, "passes": false, "notes": "Stage 1 only â€” no TRX/binlog parsing. Emit: status, solution, durationMs, build.{executed,succeeded,logPath}, tests.{executed,succeeded,logPath}. Exit 4 on failure. Logs to .rt/logs/verify/. --timeout-seconds default 120. DEPENDS ON: US-037 (RtExitCodes.VerificationFailed=4). Affected files: src/RoslynTools/Commands/VerifyCommand.cs (new), src/RoslynTools/Services/VerifyService.cs (new).", "epicId": "EP-008"}, {"id": "US-039", "title": "Add rt test-outline command that lists test classes, methods, and attributes via Roslyn", "description": "As an LLM caller about to modify tests, I want rt test-outline --solution X --json to emit a structured list of all test classes, methods, [Fact]/[Theory] kinds, DisplayName, and [Trait] attributes so that I have compact factual context about test structure before making changes.", "acceptanceCriteria": ["A new file src/RoslynTools/Commands/Inspect/TestOutlineCommand.cs exists and defines internal sealed class TestOutlineCommand implementing IRtCommand", "TestOutlineCommand.Info.Name == \"test-outline\" (or documented equivalent)", "TestOutlineCommand.Info.Category == \"inspect\"", "TestOutlineCommand.Info.Mutates == false", "TestOutlineCommand.Info.JsonOutput == true", "TestOutlineCommand.Info.SupportedFormats includes OutputFormat.Json", "TestOutlineCommand.Info.Examples includes at least one example with --solution and --json", "A new file src/RoslynTools/Services/TestOutlineService.cs exists with a method like static async Task<TestOutlineResult> AnalyzeAsync(Solution sln, ...)", "Test projects are detected by inspecting MetadataReferences for xunit or xunit.core (initially xunit only, per notes)", "Non-t slnx --verify-no-changes passes"], "priority": 39, "passes": false, "notes": "Detect test projects by MetadataReferences to xunit/xunit.core. Supports --solution, --project, --file scopes. Output deterministically sorted. Reuse SymbolLocator and existing attribute analysis patterns. Affected files: src/RoslynTools/Commands/Inspect/TestOutlineCommand.cs (new), src/RoslynTools/Services/TestOutlineService.cs (new).", "epicId": "EP-008"}, {"id": "US-040", "title": "Add rt find-tests command that finds tests referencing a production symbol", "description": "As a developer about to refactor a type or method, I want rt find-tests <symbol> --solution X --json to return test classes and methods that reference that symbol so I can run targeted tests using the returned dotnet test --filter strings.", "acceptanceCriteria": ["A new file src/RoslynTools/Commands/Inspect/FindTestsCommand.cs exists and defines internal sealed class FindTestsCommand implementing IRtCommand", "FindTestsCommand.Info.Name == \"find-tests\"", "FindTestsCommand.Info.Category == \"inspect\"", "FindTestsCommand.Info.Mutates == false", "FindTestsCommand.Info.JsonOutput == true", "FindTestsCommand.Info.SupportedFormats includes OutputFormat.Json", "FindTestsCommand.Info.Examples includes at least one example invoking with a fully-qualified type name", "A new file src/RoslynTools/Services/FindTestsService.cs exists with a method that takes (Solution sln, ISymbol target) and returns test references", "Service detects test projects via NuGet/MetadataReference to xunit, xunit.core, NUnit.Framework, or MSTest.TestFramework", "Service reuses FindRefsService internals (no copy-paste of reference-finding logic)", "Service filters references to only those located in test projects", "Output JSON matches: {\"symbol\":\"...\",\"testReferences\":[{\"testClass\":\"...\",\"testMethod\":\"...\",\"file\":\"...\",\"line\":<int>,\"filterString\":\"FullyQualifiedName~ClassName.MethodName\"}]}", "filterString uses xUnit/dotnet-t "id": "US-041", "title": "Add rt fix-file-name command that renames a .cs file to match its primary type", "description": "As a developer who has just renamed a type, I want rt fix-file-name --file src/Foo/OldName.cs --dry-run to detect the primary type and show a rename so that file names stay in sync with type names without manual intervention.", "acceptanceCriteria": ["A new file src/RoslynTools/Commands/Refactor/FixFileNameCommand.cs exists and defines internal sealed class FixFileNameCommand implementing IRtCommand", "FixFileNameCommand.Info.Name == \"fix-file-name\"", "FixFileNameCommand.Info.Category == \"refactor\"", "FixFileNameCommand.Info.Mutates == true", "FixFileNameCommand.Info.Examples includes at least one --dry-run example", "A new file src/RoslynTools/Services/FixFileNameService.cs exists with a method to detect primary type and compute the new file name", "Primary type detection: the first top-level public or internal class, record, interface, enum, or struct in the file", "If exactly one top-level non-nested type is found, that's the primary type", "If multiple top-level non-nested types exist and --type is not specified, the command exits 1 with stderr explaining ambiguity", "--type <FQN> override forces a specific primary type", "Computed new file name is <PrimaryTypeName>.cs", "Files where the file name already matches the primary type name are no-ops (exit 0, message \"already correct\")", "Files with // <auto-generated> header in the first 10 lines are skipped (exit 0, message about being skipped)", "Files matching *.Designer.cs are skipped by default", "--include-generated flag overrides the auto-generated/.Designer.cs skip", "If destination file already exists at the new path, the command exits 1 with stderr \"Error: destination already exists: <path>\"", "--dry-run prints the planned rename to stdout (e.g. \"src/Foo/OldName.cs -> src/Foo/NewName.cs\") and does not perform any file operation", "Without --dry-run, when the working directory stified", "No service-layer files in `src/RoslynTools/Services/` are modified", "dotnet build RoslynTools.slnx passes", "dotnet build RoslynTools.slnx -c Release passes", "dotnet test RoslynTools.slnx -v minimal passes (all existing tests plus new MCP tests)", "dotnet format RoslynTools.slnx --verify-no-changes passes", "rt dump-help runs successfully and includes the new mcp command", "Running rt inspect describe, rt inspect find-refs, and rt refactor rename against RoslynTools.slnx produces identical output to pre-change behavior (dogfood smoke check)"], "priority": 43, "passes": false, "notes": "Add internal sealed record RtParameter(string Name, string Description, string Type, bool Required, string? Default = null, string[]? Enum = null) to Core/. Add RtParameter[]? OperationParameters = null to RtCommandInfo. Populate for describe, find-refs, rename. rt mcp --solution X mode in RoslynTools.Cli (single binary). ModelContextProtocol NuGet (latest stable). Workspace as singleton IHostedService. MCP tool schemas derived from RtOperationParameters (not hand-coded). 3 tools: describe, find-refs, rename. Zero service-layer changes. Include claude_desktop_config.json example. DEPENDS ON: US-022 (DI host), US-036 (capabilities). CLI and MCP are the two first surfaces over the shared abstraction â€” US-044 (rt serve) is the third.\n\n[2026-05-05] Partial: MCP server shipped (3de338c, bbedbcf — RoslynTools.Mcp project with FindReferences + Rename handlers), but using hand-written Schemas/*Request.cs rather than generating from a shared RtParameter/RtCommandInfo.OperationParameters abstraction. The framework-agnostic abstraction (AC#1–4) is the remaining work.", "epicId": "EP-009"}, {"id": "US-044", "title": "Add rt serve command â€” HTTP server with embedded web UI exposing all operations as REST API", "description": "As a developer or tool integrator, I want rt serve --solution X --port 7890 to start a local HTTP server with an embedded web UI that auto-generates forms from the operation registry, supports dry-run diff preview, and allows applying changes â€” so that any browser, VS Code webview, or HTTP client can use rt operations without CLI invocations.", "acceptanceCriteria": ["A new `rt serve` command is registered in `App.cs` with `--solution <path>` and `--port <int>` options (default port 7890)", "`rt serve` without `--solution` either errors with exit code 1 or auto-detects a solution per the existing `--solution` auto-detection convention used by other commands", "`rt serve` with a non-existent solution path exits with code 1 and prints an error to stderr", "`rt serve` with an already-in-use port exits with code 1 and prints a clear error message to stderr", "`rt serve` with an invalid port (negative, >65535, non-numeric) exits with code 1 with a clear error", "`RoslynTools.Cli.csproj` references `Microsoft.AspNetCore.App` framework reference (or the project SDK is changed to `Microsoft.NET.Sdk.Web`) so that ASP.NET Core minimal API types are available", "The server is implemented using ASP.NET Core minimal API (no MVC controllers required)", "`MsBuildBootstrap.Register()` is invoked before any Roslyn workspace type is loaded in the serve startup path", "The MSBuildWorkspace and Solution are loaded exactly once at server startup and registered as singletons in the DI container", "The MSBuildWorkspace is disposed when the server stops (Ctrl+C / SIGINT triggers a graceful shutdown)", "The server responds to Ctrl+C / SIGINT by shutting down within a reasonable timeout (e.g. <5 seconds) without hanging", "`GET /api/capabilities` returns HTTP 200 with `Content-Type: application/json` and a body matching the shape of `rt capabilities --json`", "`GET /api/capabilities` JSON includes every command discovered by the reflection-based registry (count matches `App` discovery)", "`GET /api/capabilities` JSON includes `OperationParameters` for the 3 adapted commands (describe, find-refs, rename) from US-043", "`GET /api/status` returns HTTP 200 with JSON body containing `solution` (absolute path string), `commandCount` (int), and `uptime` (ISO 8601 duration or human-readable string)", "`POST /api/execute` with body `{command: \"describe\", params: {symbol: \"...\"}, dryRun: false}` returns HTTP 200 with the structured result JSON from `InspectService`", "`POST /api/execute` with `dryRun: true` for a mutation command (e.g. rename) returns the diff/preview without writing any files to disk", "`POST /api/execute` with an unknown command name returns HTTP 404 with a JSON error body containing `error` and `message` fields", "`POST /api/execute` with a known command but missing required parameters returns HTTP 400 with a JSON error body listing the missing parameters", "`POST /api/execute` with malformed JSON body returns HTTP 400 with a JSON error body", "`POST /api/execute` with an invalid parameter type (e.g. integer where string expected) returns HTTP 400 with a JSON error body", "`POST /api/execute` for a non-mutating command ignores the `dryRun` flag (or returns 200 normally)", "Parameter validation for `POST /api/execute` is driven by the command's `RtCommandInfo.OperationParameters` metadata (not hand-coded per command)", "`GET /` returns HTTP 200 with `Content-Type: text/html` serving the embedded web UI", "The web UI HTML and JS are embedded as resources in the `RoslynTools.Cli` assembly (verified by inspecting assembly resources) â€” they are NOT written to or read from disk at runtime", "The web UI loads with no external CDN/script/stylesheet dependencies (works fully offline)", "The web UI has no NPM build step â€” source HTML/JS is committed and served as-is", "The web UI on load fetches `GET /api/capabilities` and renders a command browser grouped by `Category` (inspect / analyze / refactor)", "The command browser supports text-search filtering across command names and descriptions", "Selecting a command in the UI displays a form whose fields are auto-generated from that command's `OperationParameters` (one input per parameter, with type-appropriate widget: text, checkbox, select for enums)", "The form marks required parameters visually (e.g. asterisk or required attribute)", "The form has a `dryRun` toggle (checkbox) that controls the `dryRun` flag in the POST body", "Clicking the `Preview` button calls `POST /api/execute` with `dryRun: true` and renders the response in a `<pre>` element", "Clicking the `Apply` button calls `POST /api/execute` with `dryRun: false` and renders the result", "The dry-run diff response is rendered with colored added/removed lines using CSS (e.g. green for + lines, red for - lines)", "Error responses (400, 404) from `POST /api/execute` are displayed in the UI as a clearly-styled error message (not silently dropped)", "An integration test starts the server on an ephemeral port, performs `GET /api/capabilities`, and asserts the JSON contains the expected commands", "An integration test performs `POST /api/execute` for `describe` with a valid symbol against a fixture solution and asserts a structured success response", "An integration test performs `POST /api/execute` for `rename` with `dryRun: true` and asserts no files on disk are modified after the call", "An integration test performs `POST /api/execute` with an unknown command name and asserts HTTP 404 with the expected error body shape", "An integration test performs `POST /api/execute` with missing required params and asserts HTTP 400 with the expected error body shape", "An integration test performs `GET /` and asserts the response is HTML containing a marker element from the embedded UI", "An integration test asserts the server starts and then stops cleanly (host lifetime ends without exception) when the cancellation token is signaled", "An integration test asserts the workspace is loaded exactly once across multiple sequential `POST /api/execute` calls (singleton behavior)", "`ServeCommand.Info.Category` is a valid category accepted by `App.RunAsync`'s category guard, or the guard is updated to accept `serve` as a top-level mode", "`ServeCommand.Info.Mutates` is `false`", "`ServeCommand.Info.JsonOutput` is set appropriately", "`ServeCommand.Info.Examples` includes at least one realistic invocation (e.g. `rt serve --solution RoslynTools.slnx --port 7890`)", "`ServeCommand.Info.WhenToUse` is populated with a clear use-case description", "`dotnet build RoslynTools.slnx` passes with no errors or warnings", "`dotnet build RoslynTools.slnx -c Release` passes with no errors or warnings", "`dotnet test RoslynTools.slnx -v minimal` passes (all existing tests plus new serve tests)", "`dotnet format RoslynTools.slnx --verify-no-changes` passes", "`rt dump-help` runs successfully after the build and includes the new `serve` command", "Running `rt serve --solution RoslynTools.slnx --port <ephemeral>` starts the server, serves the UI at `/`, and serves capabilities at `/api/capabilities` (dogfood smoke check)"], "priority": 44, "passes": false, "notes": "ASP.NET Core minimal API. Workspace loaded once at startup, kept alive as singleton. Endpoints: GET /api/capabilities (same shape as rt capabilities --json), POST /api/execute ({command, params, dryRun}), GET /api/status, GET / (embedded web UI). Web UI: vanilla JS, no NPM, embedded resource, auto-generates forms from RtOperationParameters, dry-run diff viewer with colored lines, Preview+Apply workflow. DEPENDS ON: US-043 (RtOperationParameters must be populated on describe/find-refs/rename for the form generation). Affected files: src/RoslynTools/Commands/ServeCommand.cs (new), src/RoslynTools/Services/ServeService.cs (new), embedded UI resources, tests/RoslynTools.Tests/ServeCommandTests.cs (new).", "epicId": "EP-009"}, {"id": "US-053", "title": "Add rt inspect list-methods command for agent method discovery", "description": "As an LLM agent (or developer) inspecting unfamiliar C# code, I want `rt inspect list-methods <type>` to list every method on the matched type(s) with file path and line numbers, so I can quickly discover and navigate to methods of interest. If the type name is ambiguous, list methods for ALL matching types — ambiguity is the desired path, not an error.", "acceptanceCriteria": ["Running `rt inspect list-methods <type> --solution RoslynTools.slnx` against a uniquely-named type exits 0 and emits a JSON array with one element per matched type", "Each top-level element has shape `{ type: <FQN>, project: <projectName>, methods: [...] }`", "Each method entry has the keys: name, signature, returnType, parameters, accessibility, isStatic, file, line, column", "`file` is the absolute path to the source file containing the method declaration; `line` and `column` are 1-based integers pointing at the method identifier — these are the primary affordance the command exists for (agent uses them to navigate to source)", "When the type name is ambiguous (multiple matches across the solution), the command exits 0 WITHOUT prompting and emits one element per matching type — every candidate is listed", "Ambiguous invocation succeeds with NO `--decisions` file involvement (never exits 2). The whole point is bulk discovery; disambiguation is intentionally bypassed", "Each parameter object has at least `name` and `type`; parameterless methods emit `parameters: []`", "`signature` is a human-readable C#-style signature including return type, name, generic parameters, and parameter list (e.g. `Task<int> RunAsync(string[] args)`)", "Property accessors (get_/set_), event accessors (add_/remove_), constructors, finalizers, and compiler-generated methods (IsImplicitlyDeclared or [CompilerGenerated]) are excluded from `methods`", "Operator overloads and conversion operators ARE included (they are user-authored discoverable surface)", "Default behaviour lists only methods declared directly on the type. `--include-inherited` adds inherited methods and includes `declaringType` (FQN) on each entry so the agent can tell where it came from", "Running with a name that matches no type exits 1, writes a clear error to stderr (mentioning the input name), writes nothing to stdout, no unhandled exception", "All progress / workspace-load / ambiguity messages go to stderr; stdout contains ONLY the JSON array, parseable by `JsonDocument.Parse` with no preamble", "`--solution <path>` is optional and auto-detected from cwd when a single .sln/.slnx is found (parity with other inspect commands)", "`ListMethodsService` is `internal sealed class` (instance, NOT static) under `src/RoslynTools/Services/`, registered in `Bootstrap.RegisterServices`, and resolved from DI by the command handler (no `new ListMethodsService()` in the handler)", "`ListMethodsCommand` is `internal sealed class ListMethodsCommand : IRtCommand` with static `Info` and static `Build()`, picked up by the reflection-based registry without manual list edits", "`Info.Name` == \"list-methods\", `Info.Category` == \"inspect\", `Info.Mutates` == false, `Info.JsonOutput` == true", "`Info.Examples` includes the canonical `rt inspect list-methods <type> --solution <path>` form and one demonstrating `--include-inherited`", "`rt dump-help` lists `list-methods` under the inspect category with description, examples, and flags populated from `Info`", "Method ordering inside each `methods` array is deterministic across runs (e.g. by source location ascending) so test snapshots are stable; documented in a service-level comment", "Tests live at `tests/RoslynTools.Tests/Inspect/ListMethodsTests.cs`, follow `with_<scenario>_<outcome>` naming, use a real `.slnx` fixture (no Roslyn API mocks)", "Integration test loads RoslynTools.slnx and asserts `list-methods RoslynTools.Core.WorkspaceLoader` returns at least one known method whose `file` exists on disk and whose `line` is > 0", "Integration test exercises ambiguous-name path against a fixture (or a name with multiple matches in RoslynTools.slnx) and asserts >= 2 elements in the output array", "Integration test asserts no-match exits 1 with the input name appearing in stderr", "Integration test asserts property/event accessors and record-generated members are filtered out (uses a fixture type that has at least one property and one record-generated method)", "Integration test asserts `--include-inherited` adds inherited methods and that omitting it yields strictly fewer methods on the same type", "DI test resolves `ListMethodsService` via `provider.GetRequiredService<ListMethodsService>()` without throwing", "`dotnet build \"RoslynTools.slnx\"` completes with zero errors and zero new warnings", "`dotnet format \"RoslynTools.slnx\" --verify-no-changes` exits 0", "`dotnet test \"tests/RoslynTools.Tests/RoslynTools.Tests.csproj\" -v minimal --filter \"FullyQualifiedName~ListMethods\"` is all green", "Smoke run: `rt inspect list-methods RoslynTools.Core.WorkspaceLoader --solution RoslynTools.slnx` exits 0, emits valid JSON, and at least one entry's `file` points to an existing file under `src/RoslynTools/Core/`"], "priority": 50, "passes": false, "notes": "Inspect command for agent-driven discovery. Output: JSON array, one element per matched type, each method entry includes file + line + column for direct navigation. Ambiguity intentionally bypassed (no --decisions prompt). Service MUST be instance class (per EP-006 static-to-instance migration), wired via Bootstrap.RegisterServices and resolved from DI. Affected files: src/RoslynTools/Commands/ListMethodsCommand.cs (new), src/RoslynTools/Services/ListMethodsService.cs (new, instance class), src/RoslynTools.Cli/Bootstrap.cs (register service), tests/RoslynTools.Tests/Inspect/ListMethodsTests.cs (new). Skip property/event accessors, constructors, finalizers, compiler-generated. --include-inherited optional flag adds base-type methods with declaringType field.", "epicId": "EP-003"}, {"id": "US-054", "title": "Add rt refactor migrate-to-ioptions command", "description": "As a developer modernizing legacy IConfiguration-based settings, I want `rt refactor migrate-to-ioptions` to convert a config key or whole config section into a strongly-typed IOptions<T> POCO + DI registration + rewritten read sites, so consumers get type-safe, testable, DI-friendly configuration without hand-editing every call site.", "acceptanceCriteria": ["Given a solution with `IConfiguration[\"MyFeature:ApiUrl\"]` read sites, when running `rt refactor migrate-to-ioptions --key MyFeature:ApiUrl --name MyFeatureOptions --solution Fixture.slnx`, then a new file containing `internal sealed class MyFeatureOptions` with a single `public string ApiUrl { get; init; } = string.Empty;` property is written under the inferred host project.", "Given a `--key` invocation with the parent path `MyFeature`, when the command completes, then `services.Configure<MyFeatureOptions>(configuration.GetSection(\"MyFeature\"))` is inserted into the located DI registration site and stdout lists the registration file as changed.", "Given multiple read sites for the targeted key in different files, when the command runs, then every consuming class has `IConfiguration` usage replaced by a constructor-injected `IOptions<MyFeatureOptions> options` parameter and reads rewritten to `options.Value.ApiUrl`.", "Given a `--section MyFeature` invocation with `--name MyFeatureOptions`, when the solution contains reads of `MyFeature:ApiUrl`, `MyFeature:Timeout` (`GetValue<int>`), and an appsettings.json with `MyFeature:RetryCount` (int), then the generated POCO has three properties (`ApiUrl: string`, `Timeout: int`, `RetryCount: int`) with primitive types inferred from `GetValue<T>` and JSON value kinds.", "Given a `--section` invocation, when the command runs, then exactly one `services.Configure<MyFeatureOptions>(configuration.GetSection(\"MyFeature\"))` registration line is emitted (no duplicates per leaf key).", "Given `--key` is omitted and `--section` is omitted, when the command runs, then it exits 1 and stderr contains a message indicating one of `--key` or `--section` is required.", "Given both `--key` and `--section` are supplied simultaneously, when the command runs, then it exits 1 and stderr explains the flags are mutually exclusive.", "Given `--name` is omitted, when the command runs, then it exits 1 and stderr contains a message indicating `--name` is required.", "Given `--name myfeatureoptions` (not PascalCase), when the command runs, then it exits 1 with a stderr message stating the type name must be PascalCase, and no files are written.", "Given `--key \"\"` or a malformed key like `--key \":foo\"` or `--key \"foo::bar\"`, when the command runs, then it exits 1 with a stderr message describing the malformed key, and no files are written.", "Given `--namespace` is omitted and the host project's root namespace is `Acme.Service`, when the POCO is generated, then it is emitted under namespace `Acme.Service.Options`.", "Given `--namespace Acme.Custom.Settings` is supplied, when the POCO is generated, then the file uses `namespace Acme.Custom.Settings;` (file-scoped) verbatim.", "Given `--project Acme.Other` is supplied, when the POCO is generated, then the new file is added to the `Acme.Other` project regardless of which project hosts the registration site.", "Given `--solution` is omitted, when the cwd contains exactly one `.slnx`/`.sln`, then the command auto-detects it (matches behaviour of other refactor commands).", "Given a previous successful run created the POCO and the `Configure<>` registration, when the same command is invoked again with identical args, then it exits 0, no files are modified, and stdout reports the migration as already applied.", "Given `--dry-run` is supplied on a fresh solution, when the command runs, then a unified DiffPlex-style diff is written to stdout, no files on disk are modified, and stderr indicates dry-run mode.", "Given `--dry-run` is supplied, when the diff is produced, then it includes the synthesized POCO file as an addition (e.g. `+++ b/.../MyFeatureOptions.cs`) alongside the registration and read-site edits.", "Given multiple candidate registration sites (e.g. two `IServiceCollection` extension methods) and no `--decisions` file, when the command runs, then it writes a YAML file of pending decisions to the path supplied via `--decisions <path>` and exits 2 without mutating any source.", "Given the `--decisions` YAML from the previous run is filled in with `choose:` indices, when the command is re-run with the same `--decisions <path>`, then it exits 0 and applies the chosen registration site.", "Given a read site of the form `cfg.GetValue<int>(\"MyFeature:Timeout\")`, when the command runs with `--key MyFeature:Timeout`, then the call is rewritten to `options.Value.Timeout` and the inferred POCO property is typed `int`.", "Given a read site of the form `cfg.GetSection(\"MyFeature\").GetValue<string>(\"ApiUrl\")`, when the command runs with `--key MyFeature:ApiUrl`, then the call is rewritten to `options.Value.ApiUrl`.", "Given a consumer class with a primary constructor `public sealed class Foo(IConfiguration cfg)`, when the read-site rewrite runs, then the primary constructor parameter list gains `IOptions<MyFeatureOptions> options` and the IConfiguration parameter is removed if it has no other uses.", "Given a consumer class with a classic constructor injecting `IConfiguration`, when the read-site rewrite runs, then the constructor parameter list gains `IOptions<MyFeatureOptions> options`, a private readonly field is introduced, and the IConfiguration field is dropped if no longer referenced.", "Given a `record Foo(IConfiguration Cfg)` consumer, when the read-site rewrite runs, then the record's parameter list gains `IOptions<MyFeatureOptions> Options` and reads via `Cfg[...]` are rewritten to `Options.Value.<Prop>`.", "Given a consumer that already has an `IOptions<OtherOptions>` parameter injected, when the read-site rewrite runs, then a second `IOptions<MyFeatureOptions>` parameter is added rather than mutating the existing one.", "Given `--name MyFeatureOptions` collides with an existing type `MyFeatureOptions` in the target namespace that is not the migration POCO, when the command runs, then it exits 1 with a stderr message identifying the collision and no files are written.", "Given the workspace fails to load (e.g. `--solution NoSuch.slnx`), when the command runs, then it exits 1 with a stderr message describing the load failure and no unhandled exception escapes to the process boundary.", "Given a solution with read sites distributed across many files, when the command runs, then the list of changed files printed to stdout is sorted by path in invariant culture (deterministic ordering across runs/OS).", "Given the command runs successfully, then stdout is plain text (not JSON) listing the POCO file created, the registration file modified, and each read-site file modified; diagnostics/progress messages appear on stderr only.", "Given the generated POCO file, when inspected, then it uses a file-scoped namespace, is `internal sealed`, every property is `{ get; init; }` with a primitive default (`string.Empty` for string, `default` for value types), and the file passes `dotnet format --verify-no-changes`.", "Given the source tree after a successful run, then `dotnet build \"RoslynTools.slnx\" -c Release` exits 0.", "Given the source tree after a successful run, then `dotnet format \"RoslynTools.slnx\" --verify-no-changes` exits 0 (no formatting drift introduced by the new command's source or its generated POCO template).", "Given the source tree after a successful run, then `dotnet test \"RoslynTools.slnx\" -v minimal` exits 0 with the new `MigrateToIOptionsCommand` test class included.", "Given the CLI is invoked as `rt dump-help`, then the output lists `migrate-to-ioptions` under the `refactor` group with `Mutates=true`, `JsonOutput=false`, and `Examples` containing at least one `--key`, one `--section`, and one `--dry-run` invocation.", "Given the CLI is started, then the compile-time `IRtCommand` contract assertion in `App.cs` does not throw — i.e. `MigrateToIOptionsCommand` exposes static `RtCommandInfo Info` with `Category = \"refactor\"` and a static `Command Build()` method, and is reflection-discovered into the registry without manual registration."], "priority": 51, "passes": false, "notes": "Two flag-driven modes: --key (single setting) and --section (whole-section bound POCO). Required: --name. Optional: --namespace (defaults to host project root ns + .Options), --project, --solution (auto-detect per repo convention), --dry-run, --decisions. Rewrites ALL read sites in the solution to constructor-injected IOptions<T>; supports primary ctor, classic ctor, and record consumers; adds a second IOptions<T> param when one already exists. POCO: internal sealed, file-scoped ns, init-only props, primitives inferred from GetValue<T> + appsettings*.json. Idempotent on re-run. Adds command at src/RoslynTools.Cli/Commands/MigrateToIOptionsCommand.cs implementing IRtCommand (Category=refactor, Mutates=true, JsonOutput=false). Service logic likely in src/RoslynTools/Services/. Tests in tests/RoslynTools.Tests/ using real .slnx fixtures (no Roslyn mocks). stdout=plain text, stderr=diagnostics, exit codes 0/1/2 (2 = decisions pending).", "epicId": "EP-004"}, {"id": "US-051", "title": "Harden rt refactor extract-class: rewrite external call sites, preserve access modifiers, fix indentation", "description": "The extract-class command has three bugs: (1) does not rewrite external call sites (callers of extracted members still call old class, breaking the build), (2) does not preserve internal access modifier on generated class (becomes public instead), (3) strips indentation from member bodies (all code at column 0). These three issues make extract-class unsafe to use without manual follow-up edits.", "acceptanceCriteria": ["ExtractClassService now calls SymbolFinder.FindReferencesAsync for each extracted member and updates qualified references in external documents", "Generated class inherits access modifier from source class (internal stays internal, public stays public)", "Member indentation is preserved in generated file (use NormalizeWhitespace or SyntaxFactory rebuild)", "Integration test: extract multiple members from a service class, verify external callers compile without manual edits"], "priority": 9999, "passes": false, "notes": "Discovered during US-030 refactoring (2026-05-02). Example: extracting RemoveParamAsync from ChangeSignatureService leaves ChangeSignatureCommand.cs calling non-existent ChangeSignatureService.RemoveParamAsync.", "epicId": ""}, {"id": "US-052", "title": "Add rt refactor remove-unused-usings command", "description": "No rt command exists to remove dead using directives. During refactoring work (breaking Core<->Services circular dependency), falling back to manual Edit. New command: rt refactor remove-unused-usings <file|--solution> that identifies using directives where no symbol in the file resolves from that namespace, and removes them.", "acceptanceCriteria": ["Command accepts --solution flag to operate on all files in a solution, or a single file path", "For each using directive, check if any symbol in the file resolves from that namespace via SemanticModel", "Remove unused directives (preserve comment if present)", "Test: solution with multiple unused usings across different namespaces, verify all are removed"], "priority": 9999, "passes": false, "notes": "Feature request from 2026-05-02. Typical use: removing a dead using RoslynTools.Services after moving all members out.", "epicId": ""}, {"id": "US-001", "title": "Fix string.Format() decomposition in console-logging conversion", "description": "As a developer running rt refactor convert-console-logging, I want string.Format(\"...\", args) used as the first argument to Console.Write/WriteLine to be decomposed into a structured ILogger message template with named placeholders so that converted logging keeps semantic placeholders instead of an opaque {Value} wrapping the entire call.", "acceptanceCriteria": ["Locate the console-logging conversion service (verify whether file is now src/RoslynTools/Services/ConsoleLoggingService.cs after the Core/ to Services/ rename, otherwise src/RoslynTools/Core/ConsoleLoggingCore.cs) and confirm before editing", "Add a handler in ConvertMessageExpression that recognises an InvocationExpressionSyntax whose target is string.Format (System.String.Format) when used as the first argument to Console.Write / Console.WriteLine", "Decompose the format string literal into the same structured template the existing literal-string path produces, preserving the order of arguments after the format string as message-template arguments", "Support both the (string format, params object[] args) overload and (IFormatProvider, string, params object[]) overloads (the latter degrades gracefully or is rejected with a TODO comment)", "Numeric placeholders ({0}, {1}, ...) are translated into named placeholders consistent with how the existing decomposer names parameters (e.g. {Arg0}, {Arg1}) â€” match existing naming convention if any, otherwise document the chosen scheme in code comments", "Non-string.Format invocations passed as the first argument continue to fall back to the existing {Value} placeholder â€” no behaviour regression for unrelated code", "Add xUnit tests under tests/RoslynTools.Tests/ covering: (a) Console.WriteLine(string.Format(\"x={0}\", x)), (b) Console.Write with two args, (c) string.Format with no args (constant string â€” should be treated as plain string), (d) string.Format with IFormatProvider overload, (e) negative case ensuring a non-string.Format invocation still uses the {Value} fallback", "dotnet build \"RoslynTools.slnx\" passes with zero errors and zero new warnings", "dotnet test \"tests/RoslynTools.Tests/RoslynTools.Tests.csproj\" -v minimal passes with all new and existing tests green", "dotnet format \"RoslynTools.slnx\" --verify-no-changes passes"], "priority": 1, "passes": true, "notes": "Affected files: src/RoslynTools/Services/ConsoleLoggingService.cs (verify exact path post-rename), tests/RoslynTools.Tests/<new ConsoleLoggingService tests file>. Bug, no live regression yet but pre-emptive. Conservative scope: only handle string.Format as direct first arg to Console.Write/WriteLine; nested expressions (e.g. ternary returning string.Format) remain on fallback path.", "epicId": "EP-001"}, {"id": "US-002", "title": "Fix silent failure in rt extract-method on conditional expression blocks", "description": "As a developer running rt refactor extract-method against a method containing ternary or conditional-expression statements, I want the command to either succeed or fail with a clear, actionable error so that I do not see exit 0 with no output and no file change.", "acceptanceCriteria": ["Reproduce the silent failure: write a fixture method roughly mirroring the AdminScrapingController.ParseAiImages shape (a ternary spanning a list/select projection) and run rt extract-method against it; capture exit code, stdout, stderr", "Determine the root cause: either the line-range selection misses the statements, MethodExtractor returns an empty change set, or the SolutionWriter swallows it. Record findings in the commit message", "If the cause is missing line-range argument support, add validation: when no explicit range is supplied and the heuristic fails, exit non-zero with a message like \"extract-method: could not infer statement range; pass --start-line and --end-line\"", "If the cause is conditional-expression handling, extend the statement-selection / dataflow logic in src/RoslynTools/Services/MethodExtractor* to recurse into ConditionalExpressionSyntax / parenthesised conditional bodies", "When extraction genuinely cannot succeed (e.g. crosses a yield-return boundary), exit code 1 with a single-line stderr diagnostic naming the obstruction; never exit 0 silently", "Add an xUnit regression test using the reproducing fixture asserting either successful extraction or non-zero exit with the expected stderr message", "Ensure no other extract-method tests regress â€” run the full filter `--filter \"FullyQualifiedName~ExtractMethod\"` and report timings", "dotnet build \"RoslynTools.slnx\" passes with zero errors and zero new warnings", "dotnet test \"tests/RoslynTools.Tests/RoslynTools.Tests.csproj\" -v minimal passes", "dotnet format \"RoslynTools.slnx\" --verify-no-changes passes"], "priority": 2, "passes": true, "notes": "Affected files: src/RoslynTools/Services/MethodExtractor.cs and friends, src/RoslynTools/Commands/ExtractMethodCommand.cs (only if validation surface changes), tests/RoslynTools.Tests/ExtractMethodTests.cs. Conservative interpretation: prefer the validation/error path over speculative AST work if root-cause analysis is inconclusive in one session â€” silent exit-0 is the bug to kill first.", "epicId": "EP-001"}, {"id": "US-003", "title": "Fix line-range drift in MethodExtractorDuplicates.ReplaceDuplicatesAsync", "description": "As a developer running rt extract-method --replace-duplicates against a file with multiple matches, I want every duplicate to be replaced correctly so that earlier replacements do not shift later line ranges and cause SelectStatementsInRange to pick the wrong statements.", "acceptanceCriteria": ["Add a regression test that constructs a file with three identical extractable blocks and asserts all three are replaced after a single ReplaceDuplicatesAsync call", "Choose one of the three documented fix strategies and apply it: (a) sort matches per-file in descending start-line order then replace bottom-up, (b) re-run FindMatchesAsync between replacements, or (c) annotate matched nodes with SyntaxAnnotation and rewrite by annotation rather than line range. The chosen strategy is documented in the commit message", "Cross-file behaviour is preserved: when matches span multiple files, the order they are processed across files does not affect correctness", "Existing single-match path remains untouched and its tests stay green", "Edge case: two matches that share a starting line (overlapping) are handled deterministically â€” either both replaced (if non-overlapping spans) or one rejected with a warning (if overlapping); behaviour documented in test", "Edge case: a match whose line range spans across the file boundary or onto the last line of the file does not throw", "dotnet build \"RoslynTools.slnx\" passes with zero errors and zero new warnings", "dotnet test \"tests/RoslynTools.Tests/RoslynTools.Tests.csproj\" -v minimal passes", "dotnet format \"RoslynTools.slnx\" --verify-no-changes passes"], "priority": 3, "passes": true, "notes": "Affected files: src/RoslynTools/Services/MethodExtractorDuplicates.cs (verify post-rename), tests/RoslynTools.Tests/MethodExtractorDuplicatesTests.cs. From US-016 in the gap log. Recommend strategy (c) SyntaxAnnotation as the most robust, but accept (a) bottom-up if simpler.", "epicId": "EP-001"}, {"id": "US-010", "title": "Auto-detect nearest solution when --solution is omitted", "description": "As a developer running any rt command from inside a repo, I want the command to auto-detect the nearest .sln/.slnx (walking up from cwd) when --solution is not passed so that I do not have to type the path on every invocation, falling back to a clear error naming the expected file.", "acceptanceCriteria": ["Add solution auto-detection helper to src/RoslynTools/Services/ (or extend WorkspaceLoader) â€” walks up from cwd looking for *.slnx then *.sln, returns the nearest, or null if none found", "Wire the helper into the WorkspaceLoader entry point so every command picks up auto-detection without per-command code changes", "When auto-detection succeeds, emit a stderr line `[INFO] Using solution: <relative path>` (relative to cwd) so the user sees what was picked", "When auto-detection fails, exit code 1 with a stderr message naming the expected files: `error: no .slnx or .sln found in <cwd> or any parent. Pass --solution <path>.`", "When --solution is passed explicitly, skip auto-detection and honour the passed path (no behaviour change)", "Optional .rtconfig support is OUT OF SCOPE for this story â€” file an explicit follow-up if needed; conservative scope keeps the story to one session", "Update all command-tests that previously required --solution to verify they still pass when --solution is passed; add new tests for the auto-detect path (cwd inside repo with a single .slnx) and the failure path (cwd in /tmp)", "rt dump-help notes the auto-detection behaviour in either the global help section or each command's --solution help text", "dotnet build \"RoslynTools.slnx\" passes with zero errors and zero new warnings", "dotnet test \"tests/RoslynTools.Tests/RoslynTools.Tests.csproj\" -v minimal passes", "dotnet format \"RoslynTools.slnx\" --verify-no-changes passes"], "priority": 10, "passes": true, "notes": "Affected files: src/RoslynTools/Services/WorkspaceLoader.cs, src/RoslynTools/Commands/* (only --solution help text), tests/RoslynTools.Tests/WorkspaceLoaderTests.cs (new), tests/RoslynTools.Tests/Cli/<command>Tests.cs. Item 17 in the gap log. CONSERVATIVE: .rtconfig is split out â€” adds config-file format and parser surface that won't fit one session.", "epicId": "EP-003"}, {"id": "US-013", "title": "Add rt analyze interface member-usage command", "description": "As a developer doing interface-segregation work, I want rt analyze interface <fqn> --solution <sln> to produce a consumer-by-consumer member-usage view so that I can see which members each consumer actually calls and identify candidates for narrower interfaces.", "acceptanceCriteria": ["Add new src/RoslynTools/Commands/AnalyzeInterfaceCommand.cs implementing IRtCommand with Info.Category = \"analyze\", Info.JsonOutput = true, Info.Mutates = false", "Build() registers the command under the analyze group as `interface` (so `rt analyze interface <fqn>`), positional <fqn>, plus --solution", "JSON output shape: `{ \"diagnostics\": [...], \"results\": { \"interface\": \"FQN\", \"consumers\": [ { \"consumer\": \"FQN\", \"membersUsed\": [\"MemberA\",\"MemberB\"], \"membersUnused\": [\"MemberC\"], \"locations\": [{\"file\":\"...\",\"line\":N}] } ], \"unusedAcrossAllConsumers\": [\"MemberD\"] } }`", "Consumer detection: any type that takes the interface as a constructor parameter, field, property, method parameter, or local â€” covers DI-injected and direct-use cases", "Member usage detection: usages within the consumer that resolve (via SemanticModel) to one of the interface's members through that injected reference", "Edge case: interface has zero implementations / zero consumers -> empty consumers array, full member list under unusedAcrossAllConsumers, exit 0", "Edge case: interface FQN not found -> exit 1 with clear message", "Add xUnit tests using a fixture interface with three members and three consumers each calling a different subset; assert membersUsed/membersUnused per consumer and unusedAcrossAllConsumers", "Self-test: run against IRtCommand or another interface in roslyn-tools and inspect output for sanity", "Static-class hosts (transitional): when the analysis encounters a static class as a consumer or implementer, emit a diagnostic note (e.g. `[INFO] static class \"<FQN>\" cannot consume an interface â€” skipped`) and continue. This is transitional behaviour during the static-to-instance migration (EP-006); do not over-invest in adapting the analysis to operate on static hosts", "rt dump-help shows the new command and Info.Examples reflects the actual invocation", "dotnet build \"RoslynTools.slnx\" passes with zero errors and zero new warnings", "dotnet test \"tests/RoslynTools.Tests/RoslynTools.Tests.csproj\" -v minimal passes", "dotnet format \"RoslynTools.slnx\" --verify-no-changes passes"], "priority": 13, "passes": true, "notes": "Affected files: src/RoslynTools/Commands/AnalyzeInterfaceCommand.cs (new), src/RoslynTools/Services/AnalyzeInterfaceService.cs (new), tests/RoslynTools.Tests/AnalyzeInterfaceCommandTests.cs (new). Item 19 in the gap log. CONSERVATIVE: the gap log mentions sub-commands `why-type-needed` and `unused-members-on-interface` â€” split into US-014 to keep this story sized for one session.", "epicId": "EP-003"}, {"id": "US-021", "title": "Add rt refactor narrow-dependency / extract-narrow-interface command", "description": "As a developer following up on rt analyze interface output, I want rt refactor extract-narrow-interface --interface <fqn> --members <comma-list> --new-interface <fqn> --solution <sln> --dry-run to extract selected members into a new narrower interface and narrow constructor parameter and field types in consumers so that I can implement Interface Segregation safely.", "acceptanceCriteria": ["Add src/RoslynTools/Commands/ExtractNarrowInterfaceCommand.cs implementing IRtCommand with Info.Category = \"refactor\", Info.JsonOutput = false, Info.Mutates = true", "Build() accepts: --interface <fqn>, --members <comma-list>, --new-interface <fqn>, --narrow-consumers <comma-list-of-consumer-fqns> (optional, defaults to all consumers using only the listed members), --add-di-registration (optional), --solution, --dry-run", "Behaviour: (a) generates the new interface file with the listed members, (b) makes the original interface inherit from it (or duplicates members â€” pick one strategy and document; inheriting is preferred), (c) for each named consumer (or auto-detected eligible consumer), changes its constructor parameter and field type from the original interface to the new one, (d) if --add-di-registration is set, scans for typical DI registration patterns (`services.AddScoped<IFoo, Foo>()`) and adds a forwarding registration `services.AddScoped<INarrowFoo>(sp => sp.GetRequiredService<IFoo>())`", "Edge case: --members references a member not on --interface -> exit 1 with the missing member listed", "Edge case: a named consumer in --narrow-consumers actually uses members not in --members -> exit 1 with usage breakdown (consumer, extra members) so the user can adjust", "Edge case: --new-interface FQN already exists -> exit 1 with conflict description", "--dry-run emits a unified diff covering all affected files; without --dry-run, files are written", "Add xUnit tests using fixtures from US-013/US-014 covering: (a) inheritance strategy, (b) auto-detected eligible consumers, (c) named-consumer-with-extra-members error, (d) DI registration injection (if a DI registration is in the fixture)", "Self-test: run with --dry-run against IRtCommand or another small interface in RoslynTools.slnx, narrowing it for a single consumer", "Static-class consumers (transitional): detect IsStatic on consumer types and emit a diagnostic (e.g. `[INFO] static class \"<FQN>\" cannot have constructor injection narrowed â€” skipped`); continue with non-static consumers. Transitional behaviour during the static-to-instance migration (EP-006) â€” the long-term expectation is that consumers become instance classes via destatic-class", "rt dump-help shows the new command and Info.Examples reflects the actual invocation", "dotnet build \"RoslynTools.slnx\" passes with zero errors and zero new warnings", "dotnet test \"tests/RoslynTools.Tests/RoslynTools.Tests.csproj\" -v minimal passes", "dotnet format \"RoslynTools.slnx\" --verify-no-changes passes"], "priority": 21, "passes": true, "notes": "Affected files: src/RoslynTools/Commands/ExtractNarrowInterfaceCommand.cs (new), src/RoslynTools/Services/ExtractNarrowInterfaceService.cs (new), tests/RoslynTools.Tests/ExtractNarrowInterfaceCommandTests.cs (new). DEPENDS ON: US-013 (consumer/member-usage analysis is the natural input). Item 20 in the gap log. CONSERVATIVE: --add-di-registration is the most fragile part of the spec (requires recognising arbitrary DI patterns); if it does not fit the session, ship it as `[NotImplemented]` exiting 1 with a follow-up story rather than half-implement.", "epicId": "EP-004"}, {"id": "US-022", "title": "Set up DI host in RoslynTools.Cli", "description": "As a maintainer preparing for the static-to-instance migration, I want Microsoft.Extensions.Hosting + DI container scaffolded in RoslynTools.Cli's startup so that subsequent destatic refactors have a registration target and a place to thread injected dependencies through.", "acceptanceCriteria": ["Add Microsoft.Extensions.Hosting and Microsoft.Extensions.DependencyInjection packages to src/RoslynTools.Cli/RoslynTools.Cli.csproj â€” pin to versions compatible with .NET 8", "Wire a Host builder in Program.cs that runs after MsBuildBootstrap.Register() and before App.RunAsync(args). Service registration lives in a single Bootstrap.RegisterServices(IServiceCollection) method in src/RoslynTools.Cli/Bootstrap.cs", "Initial registrations: leave services as static for now (do not migrate yet) â€” the deliverable of this story is the scaffold, not the migration. Bootstrap.RegisterServices may be empty or contain only placeholder comments", "App.RunAsync receives the IServiceProvider so command handlers can resolve services in subsequent stories. Existing commands continue to call static services unchanged â€” no behavioural diff", "dump-help fast path remains untouched (still skips MSBuildBootstrap and the host)", "Add xUnit test that builds the host and asserts Bootstrap.RegisterServices runs without throwing", "Self-test: `rt inspect describe \"RoslynTools.Core.WorkspaceLoader\" --solution RoslynTools.slnx` continues to succeed, byte-for-byte identical to pre-change output (run before and diff)", "dotnet build \"RoslynTools.slnx\" passes with zero errors and zero new warnings", "dotnet test \"tests/RoslynTools.Tests/RoslynTools.Tests.csproj\" -v minimal passes", "dotnet format \"RoslynTools.slnx\" --verify-no-changes passes"], "priority": 22, "passes": true, "notes": "Affected files: src/RoslynTools.Cli/RoslynTools.Cli.csproj, src/RoslynTools.Cli/Program.cs, src/RoslynTools.Cli/Bootstrap.cs (new), src/RoslynTools.Cli/App.cs (signature change), tests/RoslynTools.Tests/BootstrapTests.cs (new). MUST PRECEDE: US-023 (destatic command depends on this for DI registration injection).", "epicId": "EP-006"}, {"id": "US-024", "title": "Add rt analyze static-class-inventory command", "description": "As a maintainer planning the static-to-instance migration, I want rt analyze static-class-inventory --solution <sln> to list every static class with call-site count, member count, and inbound static-class coupling so that I can sequence the migration leaves-first.", "acceptanceCriteria": ["Add src/RoslynTools/Commands/StaticClassInventoryCommand.cs implementing IRtCommand with Info.Category = \"analyze\", Info.JsonOutput = true, Info.Mutates = false", "JSON output shape: `{ \"diagnostics\": [...], \"results\": { \"totalStaticClasses\": N, \"classes\": [ { \"fqn\": \"...\", \"file\": \"...\", \"memberCount\": N, \"callSiteCount\": N, \"calledFromStaticClasses\": [\"FQN\", ...], \"calledFromInstanceClasses\": [\"FQN\", ...], \"migrationDifficulty\": \"leaf|mid|hub\" } ] } }`", "migrationDifficulty heuristic: leaf = called only from instance classes (safe to destatic now); mid = called from <=3 static classes; hub = called from >3 static classes (defer or migrate after the static callers)", "Sort results by (migrationDifficulty asc, callSiteCount asc) so the easiest leaves come first in the output", "Add xUnit tests using a fixture with a leaf service, a mid service, and a hub service; assert classification", "Self-test: run against RoslynTools.slnx â€” should classify the ~34 services in src/RoslynTools/Services/ with sensible difficulty bands", "rt dump-help shows the new command and Info.Examples reflects the actual invocation", "dotnet build \"RoslynTools.slnx\" passes with zero errors and zero new warnings", "dotnet test \"tests/RoslynTools.Tests/RoslynTools.Tests.csproj\" -v minimal passes", "dotnet format \"RoslynTools.slnx\" --verify-no-changes passes"], "priority": 24, "passes": true, "notes": "Affected files: src/RoslynTools/Commands/StaticClassInventoryCommand.cs (new), src/RoslynTools/Services/StaticClassInventoryService.cs (new), tests/RoslynTools.Tests/StaticClassInventoryCommandTests.cs (new). Independent of US-022/US-023 â€” read-only analysis, can be built first to inform sequencing of the pilot.", "epicId": "EP-006"}, {"id": "US-027", "title": "Break circular dependency between Core and Services namespaces", "description": "As an architect maintaining clean dependencies, I want the circular Core â†’ Services â†’ Core dependency broken so that the codebase follows proper layering where Services depends on Core but never vice versa.", "acceptanceCriteria": ["ArchitectureTests.Core_and_Services_must_not_have_circular_dependency test currently documents the cycle; run rt circular-deps to confirm RoslynTools.Core -> RoslynTools.Services -> RoslynTools.Core", "Identify which Services types are referenced by Core types by inspecting import statements and method signatures across src/RoslynTools/Core/", "Choose a solution: (a) move problematic types to a new RoslynTools.Contracts namespace, (b) use dependency inversion (interfaces in Core, implementations in Services), or (c) restructure to eliminate the dependency. Document the chosen strategy.", "Apply the fix using rt refactor move --type and rt refactor rename as much as possible; log any gaps to dogfood-gaps.md", "Update ArchitectureTests to assert no cycles exist after the refactoring", "Verify no other circular dependencies exist by running rt circular-deps and confirming empty output", "dotnet build RoslynTools.slnx passes with zero errors and zero new warnings", "dotnet test RoslynTools.Tests.csproj -v minimal passes with all tests green", "dotnet format RoslynTools.slnx --verify-no-changes passes"], "priority": 27, "passes": true, "notes": "Affected files: src/RoslynTools/Core/*, src/RoslynTools/Services/*. Use rt refactor move and rename extensively. CRITICAL: blocks ArchitectureTests from passing.", "epicId": "EP-007"}, {"id": "US-028", "title": "Extract duplicate Option declarations across 12 Command.Build() methods", "description": "As a developer maintaining command builders, I want the 12 identical --namespace Option declarations in Command.Build() methods extracted to a shared helper factory so that option definitions are DRY and schema changes don't require updates in 12 places.", "acceptanceCriteria": ["Run rt find-duplicates --solution RoslynTools.slnx to confirm Group 1 (GRP-5-8b78aeaf) with 12 occurrences of the --namespace Option pattern", "Create a static helper class src/RoslynTools.Cli/CommandOptionFactory.cs with factory methods for common options: CreateNamespaceOption(), CreateTypeOption(), CreateFileOption(), CreateSolutionOption() â€” one per identified pattern", "Use rt refactor extract-method to pull each option declaration into a factory call, or apply manually if rt cannot handle it; log failures to dogfood-gaps.md", "Update all 12 Command.Build() methods to call the appropriate factory method instead of inlining the declaration", "Verify option properties (default value, help text, aliases) are byte-identical to original: use rt inspect describe on the option types before/after or snapshot the --help output", "Run rt find-duplicates again and confirm the --namespace pattern no longer appears in the top groups", "Add xUnit test asserting CreateNamespaceOption() returns an option with expected properties", "dotnet build RoslynTools.slnx passes with zero errors and zero new warnings", "dotnet test RoslynTools.Tests.csproj -v minimal passes with all tests green", "dotnet format RoslynTools.slnx --verify-no-changes passes"], "priority": 28, "passes": true, "notes": "Affected files: src/RoslynTools.Cli/Commands/*.cs (12 files), src/RoslynTools.Cli/CommandOptionFactory.cs (new). Extractable duplication, high value. Largest single duplicate group.", "epicId": "EP-007"}, {"id": "US-030", "title": "Refactor ChangeSignatureService (733 lines) into smaller, single-responsibility classes", "description": "As a maintainer managing large classes, I want ChangeSignatureService split into focused classes (ReorderService, AddParamService, RemoveParamService) so that each class has one reason to change and tests are easier to write.", "acceptanceCriteria": ["Analyze ChangeSignatureService to identify responsibility boundaries (reorder, add param, remove param are distinct workflows sharing state)", "Design the split: extract ReorderParamsService, AddParamService, RemoveParamService, and a common ParameterChangeHelper with shared utilities", "Use rt refactor extract-method to carve out common helpers and then rt refactor move to relocate logic to new service classes", "Update ChangeSignatureCommand to use the new services instead of ChangeSignatureService directly", "Run rt list-smells and confirm ChangeSignatureService no longer appears as a LargeClass (or drops below 400 lines)", "Verify all existing ChangeSignatureService tests still pass (update imports/references as needed)", "Add a new test for the extracted ParamChangeHelper verifying its public methods are well-tested", "dotnet build RoslynTools.slnx passes with zero errors and zero new warnings", "dotnet test RoslynTools.Tests.csproj -v minimal passes with all tests green", "dotnet format RoslynTools.slnx --verify-no-changes passes"], "priority": 30, "passes": true, "notes": "Affected files: src/RoslynTools/Services/ChangeSignatureService.cs (split), src/RoslynTools/Services/ReorderParamsService.cs (new), src/RoslynTools/Services/AddParamService.cs (new), src/RoslynTools/Services/RemoveParamService.cs (new), tests/RoslynTools.Tests/Mutation/ChangeSignatureTests.cs. Large class refactor; ~4hr session expected.", "epicId": "EP-007"}, {"id": "US-031", "title": "Refactor NarrowDependencyService (540 lines) to extract interface analysis from rewriting", "description": "As a maintainer managing large classes, I want NarrowDependencyService split so that the interface analysis logic (GetUsedMembersAsync, BuildInterfaceText) is separate from the rewriting logic (NarrowConsumersAsync, FindConsumersAsync) enabling easier testing and reuse.", "acceptanceCriteria": ["Identify two sub-concerns in NarrowDependencyService: (a) InterfaceAnalyzer - member usage analysis, (b) ConsumerNarrower - consumer rewriting. Design class split.", "Extract InterfaceAnalyzerService with methods: GetUsedMembersAsync(type, consumer), BuildInterfaceText(members) â€” these are pure analysis functions", "Keep ConsumerNarrowerService focused on: FindConsumersAsync(type), NarrowConsumersAsync(type, interface) â€” rewriting logic", "Update NarrowDependencyCommand to use both services appropriately", "Use rt extract-method and rt move extensively to pull logic apart; log rt gaps", "Run rt list-smells and confirm NarrowDependencyService drops below 300 lines (or no longer appears as LargeClass)", "Verify all existing NarrowDependencyService tests pass; add at least one test to InterfaceAnalyzerService verifying GetUsedMembersAsync returns expected members", "dotnet build RoslynTools.slnx passes with zero errors and zero new warnings", "dotnet test RoslynTools.Tests.csproj -v minimal passes with all tests green", "dotnet format RoslynTools.slnx --verify-no-changes passes"], "priority": 31, "passes": true, "notes": "Affected files: src/RoslynTools/Services/NarrowDependencyService.cs (split), src/RoslynTools/Services/InterfaceAnalyzerService.cs (new), src/RoslynTools/Services/ConsumerNarrowerService.cs (new), tests/RoslynTools.Tests/Mutation/NarrowDependencyTests.cs. Large class refactor; ~3hr session expected.", "epicId": "EP-007"}, {"id": "US-033", "title": "Thin App.RunAsync (95 lines) and DumpHelpCommand.RenderMarkdown (97 lines)", "description": "As a maintainer applying thin-shell and single-responsibility rules, I want App.RunAsync split into phases and DumpHelpCommand.RenderMarkdown split into section-building helpers otes": "Medium complexity. Build on MethodExtractor's existing dataflow analysis (used for return-value detection). Conservative: v1 handles simple value types and reference types; mutable struct semantics edge cases can be a follow-up.", "epicId": "EP-010"}, {"id": "US-049", "title": "Extract-method: Support generic type parameterization (Phase 6)", "description": "As a developer with duplicates differing only in generic type arguments (List<T> vs Dictionary<T>, IEnumerable<T> vs IAsyncEnumerable<T>), I want rt refactor extract-method --replace-duplicates to detect type-parameter variations and generate generic methods so that I can consolidate ~10-15 additional duplicate groups.", "acceptanceCriteria": ["Analyze the ~10-15 type-parameter-blocked groups in tasks/us-032-duplicate-types.md and identify generic patterns (List<T> vs Dict<T>, sync vs async collections, different generic constraints)", "Design GenericParameterDetector to identify type-positions that vary across duplicates and propose generic type parameter names (T, TKey, TValue, etc.)", "Generate generic method signature: TResult MethodName<T, TKey>(List<T> input, ...) where constraints match the extracted pattern", "Implement constraint inference: detect use of generic methods/properties and infer necessary where clauses (T : IEnumerable, etc.)", "Extend call sites to pass type arguments: MethodName<int>(intList, ...) or MethodName<string, object>(dict, ...)", "Add xUnit tests: single type parameter, multiple type parameters with constraints, nested generics", "Verify ~10-15 roslyn-tools groups now become extractable", "dotnet build, dotnet test, dotnet format all pass"], "priority": 49, "passes": true, "notes": "High complexity: constraint inference and type-parameter-position detection require careful semantic analysis. Build on Phase 1-4 infrastructure. Dogfood: test against real codebases with collection/LINQ duplicate groups.", "epicId": "EP-010"}, {"id": "US-050", "title": "Fix extract-method sou     window.__PRD_LINKED_DOCS__ = {"C:\\code\\roslyn-tools\\ralph\\prd.json": {"US-046": [{"path": "tasks/us-032-duplicate-types.md", "content": "# US-032 Duplicate Types Analysis\n\n## Summary\n- **Total groups found**: 114\n- **Groups after suppression**: 65  \n- **Currently extractable**: Limited (need to count)\n- **Discovery-only (blocked)**: Majority\n\n## Duplicate Types Currently NOT Extractable (Future Work)\n\n### 1. Control Flow Escape: Return Statements\n**Issue**: Block contains early return/break/continue statements  \n**Impact**: Can't cleanly extract because the return/break/continue would be lost at call site\n\n```csharp\n// Example: Can't extract because method returns different values\nvar methodOpt = new Option<string>(\"--method\", \"...\");\nreturn someCondition ? methodOpt : null;  // ← return statement blocks extraction\n```\n\n**Workaround for future**: Could extract method returning a value, or use ref/out parameters\n\n**Examples**:\n- MakeInstanceCommand.Build vs MakeStaticCommand.Build (Group 57)\n- ConvertToRecordCommand.Build vs MakeSealedCommand.Build (Group 58)\n- ExtractInterfaceService.BuildAccessors vs InterfaceAnalyzerService.BuildAccessors (Group 59)\n- JsonRenderer.ConvertValue vs YamlRenderer.ConvertValue (Group 60)\n\n---\n\n### 2. Multiple Output Variables  \n**Issue**: Block produces 2+ outward variables; would need tuple return or out-params  \n**Impact**: Can't extract without changing signature significantly\n\n```csharp\n// Example: Two outputs (methodSpec and newTypeName)\nvar methodSpec = BuildSpec(/* ... */);\nvar newTypeName = GetNewName(/* ... */);\n// Can't extract both without tuple return\n```\n\n**Workaround for future**: \n- Support tuple returns\n- Support out-parameters\n- Create wrapper class/record\n\n**Examples**:\n- TransformParametersService.RunNewTypeAsync vs RunExistingTypeAsync (Group 62)\n\n---\n\n### 3. Identifier Mapping Complexity\n**Issue**: Identifiers differ across duplicates in non-literal ways  \n**Impact**: Can't parameterize identifier names (only literals currently)\n\n```csharp\n// Different identifier names, not just literals\nvar otpauthUri = AddUsingDirective(root, directive);  // One way\nvar globalUri = AddUsingDirective(root, directive);   // Different name\n```\n\n**Workaround for future**:\n- Support identifier parameter substitution\n- Detect and map identifier variations\n\n**Examples**:\n- ImportDirectiveService.AddStaticUsingAsync vs AddGlobalUsingAsync (Group 56 - actually extractable!)\n- Dictionary variable names: JsonRenderer vs YamlRenderer (Group 63)\n\n---\n\n### 4. Special Return Statements (Not Simple Return)\n**Issue**: Block has control flow that's hard to extract  \n**Impact**: Pattern matching can't handle complex control flow\n\n```csharp\n// Early returns make extraction impossible\nif (string.IsNullOrWhiteSpace(filePath))\n    return false;  // ← Early return blocks extraction\n```\n\n**Workaround for future**: Extract the guard condition separately, then extract body\n\n**Examples**:\n- RoslynSyntax.FindDocumentId vs ConvertToRecordService.FindDocumentId (Group 61)\n- ImportDirectiveService.IsGeneratedOrIntermediate vs MagicStringService.IsGeneratedOrIntermediate (Group 65)\n\n---\n\n## Current Solution: US-032 Parameterization\n\n✅ **Now extractable**: Duplicates differing only in **string literal values**\n\nExample:\n```csharp\n// Before\npublic void PrintA() { Console.WriteLine(\"hello\"); Console.WriteLine(\"world\"); }\npublic void PrintB() { Console.WriteLine(\"goodbye\"); Console.WriteLine(\"universe\"); }\n\n// After parameterization\npublic void PrintMessages(string param0, string param1) \n{\n    Console.WriteLine(param0); \n    Console.WriteLine(param1);\n}\n// Call sites: PrintMessages(\"hello\", \"world\"); PrintMessages(\"goodbye\", \"universe\");\n```\n\n---\n\n## Next Project Candidates (Priority Order)\n\n### 1. **Literal Identifier Parameters** (Medium Complexity)\n- Similar to parameterization, but parameterize variable/field names  \n- Impact: ~5-10% more duplicates\n- Example: `var x = val` vs `var name = val`\n\n### 2. **Control Flow Unwinding** (High Complexity)\n- Extract methods with early returns as nested/guard clauses\n- Impact: ~15-20% more duplicates  \n- Example: Extract return statements as failures/guards\n\n### 3. **Multiple Output Variables (Tuple Returns)** (Medium Complexity)\n- Support C# tuple return types for methods with 2+ outputs\n- Impact: ~5-10% more duplicates\n- Example: `var (a, b) = Extract(); return (a, b);`\n\n### 4. **Out/Ref Parameter Support** (Medium Complexity)\n- Generate methods with `out` parameters for modified local variables\n- Impact: ~5-10% more duplicates\n\n### 5. **Type Parameter Variations** (High Complexity)\n- Detect generic pattern variations and make extracted method generic\n- Impact: ~10-15% more duplicates  \n- Example: `List<T>` vs `Dictionary<T>`\n\n---\n\n## Metrics (roslyn-tools dogfood)\n\n| Category | Count | Status |\n|----------|-------|--------|\n| Extractable (current) | ~1-2 | ✅ Implemented |\n| Control flow escape | ~20-25 | 🔲 Future |\n| Multiple outputs | ~2-3 | 🔲 Future |\n| Identifier variations | ~10-15 | 🔲 Future |\n| Type parameters | ~5-10 | 🔲 Future |\n| Other | ~15-20 | 🔲 Future |\n| **Total** | **65** | **Suppressed** |\n\n---\n\n## Architecture Notes\n\n- **PatternMatcher**: Structurally identical code detection (agnostic to literal values)\n- **MethodExtractorDuplicates**: Semantic validation + parameterization\n- **Semantic Validation**: String literal set comparison (allows variations at specific positions)\n- **Parameterization Pipeline**: 4 phases (detect → regenerate signature → rewrite body → update calls)\n"}], "US-047": [{"path": "tasks/us-032-duplicate-types.md", "content": "# US-032 Duplicate Types Analysis\n\n## Summary\n- **Total groups found**: 114\n- **Groups after suppression**: 65  \n- **Currently extractable**: Limited (need to count)\n- **Discovery-only (blocked)*   <script>
    const e = React.createElement;

    function normalizeStory(story) {
      const acceptance = Array.isArray(story && story.acceptanceCriteria) ? story.acceptanceCriteria : [];
      return {
        id: String(story && story.id || ""),
        title: String(story && story.title || ""),
        description: String(story && story.description || ""),
        acceptanceCriteria: acceptance.map((item) => String(item)),
        priority: Number(story && story.priority || 9999),
        passes: Boolean(story && story.passes),
        notes: String(story && story.notes || ""),
        epicId: String(story && story.epicId || "")
      };
    }

    function normalizeEpic(epic) {
      return {
        id: String(epic && epic.id || ""),
        title: String(epic && epic.title || ""),
        description: String(epic && epic.description || ""),
        notes: String(epic && epic.notes || "")
      };
    }

    function normalizeProject(raw, fallback) {
      const stories = Array.isArray(raw && raw.userStories) ? raw.userStories.map(normalizeStory) : [];
      const epics = Array.isArray(raw && raw.epics) ? raw.epics.map(normalizeEpic) : [];
      const sortedStories = stories.slice().sort((left, right) => {
        if (left.passes !== right.passes) return left.passes ? 1 : -1;
        if (left.priority !== right.priority) return left.priority - right.priority;
        return left.id.localeCompare(right.id);
      });
      const total = sortedStories.length;
      const complete = sortedStories.filter((story) => story.passes).length;
      const pending = total - complete;
      return {
        project: String(raw && raw.project || fallback.project || "PRD"),
        branchName: String(raw && raw.branchName || fallback.branchName || ""),
        description: String(raw && raw.description || fallback.description || ""),
        path: fallback.path || "",
        sourceUrl: fallback.sourceUrl || "",
        stats: {
          total: total,
          complete: complete,
          pending: pending,
          completionPct: total ? Math.round((complete / total) * 100) : 0
        },
        epics: epics,
        stories: sortedStories
      };
    }

    function escapeHtml(value) {
      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");

      let value = escapeHtml(text);
      value = value.replace(/`([^`]+)`/g, "<code>$1</code>");
      value = value.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
      value = value.replace(/\*([^*]+)\*/g, "<em>$1</em>");
      return value;
    }

    function renderMarkdown(text) {
      const value = String(text || "").replace(/\r\n/g, "\n").trim();
      if (!value) return "";

      const lines = value.split("\n");
      const parts = [];
      let inList = false;

      function closeList() {
        if (inList) {
          parts.push("</ul>");
          inList = false;
        }
      }

      for (const rawLine of lines) {
        const line = rawLine.trim();
        if (!line) {
          closeList();
          continue;
        }

        if (line.startsWith("- ") || line.startsWith("* ")) {
          if (!inList) {
            parts.push("<ul>");
            inList = true;
          }
          parts.push("<li>" + renderInlineMarkdown(line.slice(2).trim()) + "</li>");
          continue;
        }

        closeList();

        if (line.startsWith("### ")) {
          parts.push("<h5>" + renderInlineMarkdown(line.slice(4)) + "</h5>");
        } else if (line.startsWith("## ")) {
          parts.push("<h4>" + renderInlineMarkdown(line.slice(3)) + "</h4>");
        } else if (line.startsWith("# ")) {
          parts.push("<h3>" + renderInlineMarkdown(line.slice(2)) + "</h3>");
        } else {
          parts.push("<p>" + renderInlineMarkdown(line) + "</p>");
        }
      }

      closeList();
      return parts.join("");
    }

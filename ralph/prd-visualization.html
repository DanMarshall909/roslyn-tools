<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PRD Visualization</title>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    :root, [data-theme="cream"] {
      --bg: #ece4d4;
      --panel: #fffdf7;
      --panel-2: #f8f1e6;
      --ink: #1d2433;
      --muted: #687387;
      --line: #d7cdbb;
      --accent: #0f766e;
      --accent-soft: #d8f0ec;
      --warn: #9a3412;
      --warn-soft: #ffedd5;
      --done: #166534;
      --done-soft: #dcfce7;
      --shadow: 0 20px 50px rgba(74, 59, 34, 0.12);
      --radius: 22px;
      --body-bg: radial-gradient(circle at top left, #fff8ea 0, transparent 28%), linear-gradient(180deg, #f3ecdf 0%, #e9dfcd 100%);
      --shell-bg: rgba(255, 253, 247, 0.7);
      --shell-border: rgba(215, 205, 187, 0.8);
      --card-bg: #ffffff;
      --card-bg-hover: #fffaf0;
      --card-bg-active: #fff6e8;
      --card-border-hover: #b9a88c;
      --card-border-active: #c89e58;
      --card-shadow-active: rgba(200, 158, 88, 0.22);
      --pill-bg: #f7efe2;
      --pill-priority-bg: #f8efe1;
      --pill-epic-bg: #e8ddf3;
      --pill-epic-fg: #5b3a8c;
      --pill-epic-border: #c9b6e0;
      --pill-pending-border: #f3c89d;
      --pill-complete-border: #b7e4c7;
      --epic-bar-bg: #fcf7ee;
      --acceptance-bg: #fcf7ee;
      --code-bg: #f1eadf;
      --summary-bg: linear-gradient(180deg, #fffdf7 0%, #faf4e8 100%);
      --sidebar-top-bg: linear-gradient(180deg, #fffdf7 0%, #faf4e8 100%);
      --mobile-panel-bg: linear-gradient(180deg, #fffdf7 0%, #faf4e8 100%);
      --mobile-summary-bg: #fffaf0;
      --mobile-panel-body-bg: #ffffff;
      --font-family: Georgia, "Times New Roman", serif;
      --resizer-color: rgba(215, 205, 187, 0.6);
      --resizer-color-hover: #c89e58;
    }
    [data-theme="dark"] {
      --bg: #0f1419;
      --panel: #1a2028;
      --panel-2: #232b36;
      --ink: #e6edf3;
      --muted: #8b949e;
      --line: #30363d;
      --accent: #58a6ff;
      --accent-soft: #1f2d43;
      --warn: #f0883e;
      --warn-soft: #3a220f;
      --done: #3fb950;
      --done-soft: #0f2e19;
      --shadow: 0 20px 50px rgba(0, 0, 0, 0.45);
      --radius: 22px;
      --body-bg: radial-gradient(circle at top left, #1a2430 0, transparent 30%), linear-gradient(180deg, #0d1117 0%, #161b22 100%);
      --shell-bg: rgba(26, 32, 40, 0.7);
      --shell-border: rgba(48, 54, 61, 0.8);
      --card-bg: #161b22;
      --card-bg-hover: #1c232c;
      --card-bg-active: #22303f;
      --card-border-hover: #444c56;
      --card-border-active: #58a6ff;
      --card-shadow-active: rgba(88, 166, 255, 0.22);
      --pill-bg: #22272e;
      --pill-priority-bg: #2a2e37;
      --pill-epic-bg: #2d2640;
      --pill-epic-fg: #c9a9ff;
      --pill-epic-border: #3d345a;
      --pill-pending-border: #3a220f;
      --pill-complete-border: #0f2e19;
      --epic-bar-bg: #161b22;
      --acceptance-bg: #161b22;
      --code-bg: #0d1117;
      --summary-bg: linear-gradient(180deg, #1a2028 0%, #141920 100%);
      --sidebar-top-bg: linear-gradient(180deg, #1a2028 0%, #141920 100%);
      --mobile-panel-bg: linear-gradient(180deg, #1a2028 0%, #141920 100%);
      --mobile-summary-bg: #1c232c;
      --mobile-panel-body-bg: #161b22;
      --font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --resizer-color: rgba(48, 54, 61, 0.8);
      --resizer-color-hover: #58a6ff;
    }
    [data-theme="paper"] {
      --bg: #f5f5f5;
      --panel: #ffffff;
      --panel-2: #fafafa;
      --ink: #111111;
      --muted: #666666;
      --line: #e0e0e0;
      --accent: #1a73e8;
      --accent-soft: #e8f0fe;
      --warn: #c5221f;
      --warn-soft: #fce8e6;
      --done: #137333;
      --done-soft: #e6f4ea;
      --shadow: 0 4px 14px rgba(0, 0, 0, 0.08);
      --radius: 10px;
      --body-bg: #f5f5f5;
      --shell-bg: #ffffff;
      --shell-border: #e0e0e0;
      --card-bg: #ffffff;
      --card-bg-hover: #f7f7f7;
      --card-bg-active: #e8f0fe;
      --card-border-hover: #bdbdbd;
      --card-border-active: #1a73e8;
      --card-shadow-active: rgba(26, 115, 232, 0.18);
      --pill-bg: #f0f0f0;
      --pill-priority-bg: #f0f0f0;
      --pill-epic-bg: #f3e8fd;
      --pill-epic-fg: #6b3fa0;
      --pill-epic-border: #d6c3ef;
      --pill-pending-border: #f9c7c5;
      --pill-complete-border: #b7e1c0;
      --epic-bar-bg: #fafafa;
      --acceptance-bg: #fafafa;
      --code-bg: #f0f0f0;
      --summary-bg: #ffffff;
      --sidebar-top-bg: #ffffff;
      --mobile-panel-bg: #ffffff;
      --mobile-summary-bg: #fafafa;
      --mobile-panel-body-bg: #ffffff;
      --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --resizer-color: #e0e0e0;
      --resizer-color-hover: #1a73e8;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; overflow: hidden; }
    body {
      margin: 0;
      color: var(--ink);
      background: var(--body-bg);
      font-family: var(--font-family);
    }
    #root { height: 100%; }
    .app {
      height: 100vh;
      margin: 0 auto;
      padding: 16px;
      max-width: none;
    }
    .shell {
      height: 100%;
      background: var(--shell-bg);
      border: 1px solid var(--shell-border);
      border-radius: 28px;
      padding: 18px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(10px);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .eyebrow {
      text-transform: uppercase;
      letter-spacing: 0.08em;
      font-size: 0.76rem;
      color: var(--muted);
      margin-bottom: 6px;
    }
    h1, h2, h3, h4, h5, p { margin: 0; }
    .subtitle {
      color: var(--muted);
      margin-top: 6px;
    }
    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      margin-bottom: 14px;
      flex-wrap: wrap;
    }
    .theme-picker {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 0.85rem;
      color: var(--muted);
      white-space: nowrap;
    }
    .theme-picker-label {
      text-transform: uppercase;
      letter-spacing: 0.08em;
      font-size: 0.72rem;
    }
    .theme-select {
      border: 1px solid var(--line);
      background: var(--card-bg);
      color: var(--ink);
      border-radius: 999px;
      padding: 6px 12px;
      font: inherit;
      cursor: pointer;
    }
    .project-tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }
    .project-tab {
      border: 1px solid var(--line);
      background: var(--card-bg);
      color: var(--ink);
      border-radius: 999px;
      padding: 10px 14px;
      cursor: pointer;
      font: inherit;
    }
    .project-tab.active {
      background: var(--accent);
      border-color: var(--accent);
      color: white;
    }
    .prd-picker {
      position: relative;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    .prd-picker-trigger {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      border: 1px solid var(--line);
      background: var(--card-bg);
      color: var(--ink);
      border-radius: 999px;
      padding: 8px 14px;
      cursor: pointer;
      font: inherit;
      max-width: 360px;
    }
    .prd-picker-trigger:hover {
      border-color: var(--card-border-hover);
      background: var(--card-bg-hover);
    }
    .prd-picker-trigger.open {
      border-color: var(--card-border-active);
      background: var(--card-bg-active);
    }
    .prd-picker-icon {
      width: 16px;
      height: 16px;
      flex: 0 0 auto;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .prd-picker-label {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-weight: 600;
    }
    .prd-picker-caret {
      color: var(--muted);
      font-size: 0.7rem;
      flex: 0 0 auto;
    }
    .prd-picker-menu {
      position: absolute;
      top: calc(100% + 8px);
      left: 0;
      width: min(640px, calc(100vw - 48px));
      max-height: 420px;
      overflow: auto;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: var(--panel);
      box-shadow: var(--shadow);
      padding: 10px;
      z-index: 30;
    }
    .prd-picker-toggle {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 10px 12px;
      border-bottom: 1px solid var(--line);
      margin-bottom: 10px;
      font-size: 0.84rem;
      color: var(--muted);
    }
    .prd-picker-toggle input {
      margin: 0;
    }
    .prd-option {
      display: block;
      width: 100%;
      border: 1px solid transparent;
      background: var(--card-bg);
      border-radius: 14px;
      padding: 12px 14px;
      color: var(--ink);
      font: inherit;
      text-align: left;
      cursor: pointer;
    }
    .prd-option + .prd-option {
      margin-top: 8px;
    }
    .prd-option:hover,
    .prd-option.active {
      border-color: var(--card-border-active);
      background: var(--card-bg-active);
    }
    .prd-option-top {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: center;
    }
    .prd-option-title {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-weight: 700;
    }
    .prd-option-subtitle {
      margin-top: 4px;
      color: var(--muted);
      font-size: 0.82rem;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .sync-status {
      padding: 0 6px 12px;
      font-size: 0.84rem;
      color: var(--muted);
    }
    .sync-status.error {
      color: var(--warn);
    }
    .main-grid {
      flex: 1 1 auto;
      display: grid;
      grid-template-columns: var(--col-1, 28%) 6px var(--col-2, 32%) 6px minmax(0, 1fr);
      gap: 0;
      min-height: 0;
    }
    .resizer {
      background: transparent;
      cursor: col-resize;
      position: relative;
      user-select: none;
      touch-action: none;
    }
    .resizer::before {
      content: "";
      position: absolute;
      top: 10%;
      bottom: 10%;
      left: 2px;
      right: 2px;
      background: var(--resizer-color);
      border-radius: 2px;
      transition: background 0.12s ease;
    }
    .resizer:hover::before,
    .resizer.dragging::before {
      background: var(--resizer-color-hover);
    }
    .sidebar, .summary-pane, .details {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--panel);
      overflow: hidden;
    }
    .sidebar {
      display: flex;
      flex-direction: column;
      min-width: 0;
      min-height: 0;
    }
    .sidebar-top {
      padding: 18px;
      border-bottom: 1px solid var(--line);
      background: var(--sidebar-top-bg);
    }
    .filters {
      display: grid;
      grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr) minmax(0, 1fr);
      gap: 10px;
    }
    .filter-select {
      width: 100%;
      border: 1px solid var(--line);
      background: var(--card-bg);
      border-radius: 14px;
      padding: 11px 13px;
      font: inherit;
      color: var(--ink);
    }
    .search {
      width: 100%;
      border: 1px solid var(--line);
      background: var(--card-bg);
      border-radius: 14px;
      padding: 11px 13px;
      font: inherit;
      color: var(--ink);
    }
    .search:focus {
      outline: 2px solid var(--accent-soft);
      border-color: var(--accent);
    }
    .story-list {
      flex: 1 1 auto;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 10px;
      display: grid;
      gap: 10px;
      min-height: 0;
      min-width: 0;
    }
    .story-row {
      border: 1px solid var(--line);
      background: var(--card-bg);
      border-radius: 16px;
      padding: 14px;
      cursor: pointer;
      text-align: left;
      font: inherit;
      color: inherit;
      display: grid;
      gap: 8px;
    }
    .story-row:hover {
      border-color: var(--card-border-hover);
      background: var(--card-bg-hover);
    }
    .story-row.active {
      background: var(--card-bg-active);
      border-color: var(--card-border-active);
      box-shadow: inset 0 0 0 1px var(--card-shadow-active);
    }
    .story-row-top {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: flex-start;
    }
    .story-id {
      font-size: 0.76rem;
      letter-spacing: 0.08em;
      color: var(--muted);
      text-transform: uppercase;
    }
    .story-title {
      font-size: 1rem;
      line-height: 1.25;
    }
    .story-desc-preview {
      color: var(--muted);
      font-size: 0.92rem;
      line-height: 1.35;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .pill-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .pill {
      border-radius: 999px;
      padding: 4px 10px;
      font-size: 0.78rem;
      border: 1px solid var(--line);
      white-space: nowrap;
      background: var(--pill-bg);
    }
    .pill.pending {
      background: var(--warn-soft);
      color: var(--warn);
      border-color: var(--pill-pending-border);
    }
    .pill.complete {
      background: var(--done-soft);
      color: var(--done);
      border-color: var(--pill-complete-border);
    }
    .pill.priority {
      background: var(--pill-priority-bg);
    }
    .pill.epic {
      background: var(--pill-epic-bg);
      color: var(--pill-epic-fg);
      border-color: var(--pill-epic-border);
    }
    .epic-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      padding: 10px 12px;
      border-bottom: 1px solid var(--line);
      background: var(--epic-bar-bg);
    }
    .epic-chip {
      background: var(--card-bg);
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 4px 10px;
      font-size: 0.78rem;
      color: var(--ink);
      font: inherit;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .epic-chip:hover {
      border-color: var(--card-border-hover);
      background: var(--card-bg-hover);
    }
    .epic-chip.active {
      background: var(--pill-epic-bg);
      border-color: var(--pill-epic-border);
      box-shadow: inset 0 0 0 1px var(--card-shadow-active);
    }
    .epic-chip .epic-id {
      color: var(--pill-epic-fg);
      font-weight: 600;
    }
    .epic-chip .epic-count {
      color: var(--muted);
    }
    .details {
      display: flex;
      flex-direction: column;
      min-width: 0;
      min-height: 0;
    }
    .summary-pane {
      display: flex;
      flex-direction: column;
      min-width: 0;
      min-height: 0;
    }
    .summary-inner {
      flex: 1 1 auto;
      padding: 22px;
      overflow-y: auto;
      overflow-x: hidden;
      min-height: 0;
      min-width: 0;
      background: var(--summary-bg);
    }
    .summary-title {
      font-size: 1.35rem;
      line-height: 1.25;
    }
    .summary-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 14px 0 18px;
    }
    .summary-preview {
      color: var(--muted);
      margin-top: 18px;
      font-size: 0.95rem;
      line-height: 1.45;
    }
    .details-inner {
      flex: 1 1 auto;
      padding: 28px;
      overflow-y: auto;
      overflow-x: hidden;
      min-height: 0;
      min-width: 0;
    }
    .details-top {
      display: flex;
      justify-content: space-between;
      gap: 18px;
      align-items: flex-start;
      margin-bottom: 18px;
    }
    .details-path {
      margin-top: 8px;
      color: var(--muted);
      word-break: break-word;
    }
    .section {
      margin-top: 24px;
      padding-top: 20px;
      border-top: 1px solid var(--line);
    }
    .section h4 {
      margin-bottom: 12px;
      font-size: 1rem;
    }
    .markdown {
      color: var(--ink);
      line-height: 1.55;
    }
    .markdown p {
      margin: 0 0 12px;
    }
    .markdown p:last-child {
      margin-bottom: 0;
    }
    .markdown ul, .markdown ol {
      margin: 0 0 12px 22px;
      padding: 0;
    }
    .markdown li + li {
      margin-top: 8px;
    }
    .markdown code {
      font-family: Consolas, "Courier New", monospace;
      background: var(--code-bg);
      padding: 1px 5px;
      border-radius: 6px;
      font-size: 0.92em;
    }
    .linked-docs {
      margin-top: 24px;
      padding-top: 20px;
      border-top: 1px solid var(--line);
      display: grid;
      gap: 18px;
    }
    .linked-doc-path {
      font-family: Consolas, "Courier New", monospace;
      font-size: 0.82rem;
      color: var(--muted);
      margin-bottom: 10px;
      word-break: break-all;
    }
    .spec-markdown {
      font-size: 0.95rem;
      line-height: 1.55;
      min-width: 0;
      overflow-wrap: break-word;
      word-break: break-word;
    }
    .spec-markdown img { max-width: 100%; height: auto; }
    .spec-markdown table {
      display: block;
      max-width: 100%;
      overflow-x: auto;
    }
    .spec-markdown h1, .spec-markdown h2, .spec-markdown h3 {
      margin: 18px 0 8px;
      line-height: 1.2;
    }
    .spec-markdown h1 { font-size: 1.25rem; }
    .spec-markdown h2 { font-size: 1.1rem; }
    .spec-markdown h3 { font-size: 1rem; }
    .spec-markdown p { margin: 0 0 12px; }
    .spec-markdown ul, .spec-markdown ol { margin: 0 0 12px 22px; }
    .spec-markdown li + li { margin-top: 6px; }
    .spec-markdown pre {
      background: var(--code-bg);
      padding: 12px;
      border-radius: 8px;
      overflow-x: auto;
      max-width: 100%;
      font-size: 0.88em;
      line-height: 1.45;
    }
    .spec-markdown code {
      font-family: Consolas, "Courier New", monospace;
      background: var(--code-bg);
      padding: 1px 5px;
      border-radius: 6px;
      font-size: 0.92em;
    }
    .spec-markdown pre code { background: none; padding: 0; }
    .spec-markdown table {
      border-collapse: collapse;
      margin: 12px 0;
      font-size: 0.9em;
    }
    .spec-markdown th, .spec-markdown td {
      border: 1px solid var(--line);
      padding: 6px 10px;
    }
    .spec-markdown blockquote {
      margin: 12px 0;
      padding: 4px 14px;
      border-left: 3px solid var(--line);
      color: var(--muted);
    }
    .acceptance-list {
      display: grid;
      gap: 12px;
      padding: 0;
      margin: 0;
      list-style: none;
    }
    .acceptance-item {
      background: var(--acceptance-bg);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 14px 16px;
    }
    .acceptance-index {
      display: inline-block;
      min-width: 28px;
      margin-right: 8px;
      color: var(--muted);
      font-size: 0.8rem;
    }
    .empty {
      padding: 28px;
      color: var(--muted);
    }
    .mobile-summary {
      display: none;
      margin-bottom: 14px;
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 14px;
      background: var(--mobile-summary-bg);
    }
    .mobile-accordion {
      display: none;
    }
    .mobile-panel {
      border: 1px solid var(--line);
      border-radius: 18px;
      background: var(--panel);
      overflow: hidden;
      margin-top: 14px;
    }
    .mobile-panel summary {
      list-style: none;
      cursor: pointer;
      padding: 14px 16px;
      background: var(--mobile-panel-bg);
      font-weight: 700;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }
    .mobile-panel summary::-webkit-details-marker {
      display: none;
    }
    .mobile-panel summary::after {
      content: "+";
      color: var(--muted);
      font-size: 1.1rem;
      line-height: 1;
    }
    .mobile-panel[open] summary::after {
      content: "−";
    }
    .mobile-panel-body {
      padding: 12px;
      border-top: 1px solid var(--line);
      background: var(--mobile-panel-body-bg);
    }
    @media (max-width: 1350px) {
      .main-grid {
        grid-template-columns: var(--col-1, 28%) 6px minmax(0, 1fr) !important;
      }
      .summary-pane, .resizer.resizer-2 {
        display: none;
      }
    }
    @media (max-width: 900px) {
      .app {
        padding: 14px;
        height: 100vh;
      }
      .shell {
        padding: 12px;
        border-radius: 20px;
      }
      .main-grid {
        display: none;
      }
      .mobile-accordion {
        display: block;
      }
      .mobile-summary {
        display: block;
      }
      .details-inner {
        padding: 18px;
      }
    }

    window.__PRD_DATA__ = [{"project": "roslyn-tools", "branchName": "backlog", "description": "Triaged backlog", "path": "C:\\code\\roslyn-tools\\ralph\\backlog-prd.json", "stats": {"total": 36, "complete": 1, "pending": 35, "completionPct": 3}, "epics": [{"id": "EP-005", "title": "codebase consistency sweep", "description": "Fix formatting violations and consolidate structural duplication identified in the May 2026 consistency analysis.", "notes": "Findings from rt analyze list-smells + find-duplicates sweep on 2026-05-11."}, {"id": "EP-006", "title": "SOLID Adherence Analysis", "description": "Family of rt analyze solid subcommands that detect likely SOLID-principle violations using Roslyn semantic model. One detector per principle; output is JSON grouped by detector name.", "notes": "P2. Five child stories: SRP, ISP, DIP, OCP, LSP. Each independently shippable."}, {"id": "EP-007", "title": "Add structured JSON output to all inspect/analyze commands", "description": "All rt inspect and rt analyze commands should support --json output so automation consumers (agents, scripts, CI tools) can pipe results without text parsing. Eight commands currently output plain text only.", "notes": "P2. Affects: find-refs, find-callers, find-undocumented, find-unused, circular-deps, find-magic-strings, list-imports, list-smells. Template: see describe/outline/find-impl which already have JSON output."}, {"id": "EP-008", "title": "Platform abstractions: IWorkspaceSessionFactory + ISolutionApplier", "description": "Introduce injectable abstractions for WorkspaceLoader and SolutionWriter so commands depend on interfaces, not static helpers. Enables testability without AsyncLocal overrides and unblocks daemon workspace caching. Must be a single coordinated change across all ~30 commands.", "notes": "P2. Architecture gate NoStaticWorkspaceLoaderUse already exists in tests/. rt-006 + rt-007 from issues backlog. Must ship together — splitting doubles the 30-command churn."}, {"id": "EP-009", "title": "Consistent command contracts and migration ratchets", "description": "Make rt commands consistent across handler structure, option vocabulary, metadata, output envelopes, and symbol resolution so dogfooding workflows are predictable and architecture tests can ratchet progress.", "notes": "From rt dogfooding consistency discussion on 2026-05-15."}], "stories": [{"id": "US-033", "title": "rt analyze solid: ISP detector — flag fat interfaces and NotImplementedException members", "description": "As a developer, I want rt analyze solid --principle ISP to flag over-broad interfaces and implementing classes that throw on members they cannot fulfill.", "acceptanceCriteria": ["rt analyze solid --principle ISP --solution <sln> exits 0 and emits JSON to stdout", "Output has a top-level 'ISP' key with sub-arrays for 'FatInterfaces' and 'UnimplementedMembers'", "Each FatInterface item includes: InterfaceName, FilePath, Line, MemberCount", "Each UnimplementedMember item includes: TypeName, MemberName, InterfaceName, FilePath, Line", "--min-members <N> (default 7) is configurable for the fat-interface threshold", "Classes throwing NotImplementedException or NotSupportedException on implemented interface members are flagged under UnimplementedMembers", "rt analyze solid --principle all includes ISP results"], "priority": 33, "passes": false, "notes": "P2. Two sub-checks: (1) interfaces with member count above threshold; (2) classes implementing an interface but throwing NotImplementedException/NotSupportedException on one or more members. Output grouped under 'ISP' detector key.", "epicId": "EP-006"}, {"id": "US-034", "title": "rt analyze solid: DIP detector — flag concrete constructor params and inline new calls", "description": "As a developer, I want rt analyze solid --principle DIP to flag high-level classes that depend directly on concrete types rather than abstractions.", "acceptanceCriteria": ["rt analyze solid --principle DIP --solution <sln> exits 0 and emits JSON to stdout", "Output has a top-level 'DIP' key with sub-arrays for 'ConcreteConstructorParams' and 'InlineNewCalls'", "Each ConcreteConstructorParam item includes: TypeName, ParamName, ConcreteType, FilePath, Line", "Each InlineNewCall item includes: TypeName, MemberName, ConcreteType, FilePath, Line", "Value types, record types, and Exception-derived types are excluded from InlineNewCalls", "Classes named *Factory, *Builder, or *Provider are excluded from InlineNewCalls (they are expected to new things)", "rt analyze solid --principle all includes DIP results"], "priority": 34, "passes": false, "notes": "P2. Two sub-checks: (1) constructors accepting concrete class params (not interfaces/abstract); (2) non-factory class bodies calling new ConcreteType() where ConcreteType is not a value type, DTO, or exception. Output grouped under 'DIP' detector key.", "epicId": "EP-006"}, {"id": "US-035", "title": "rt analyze solid: OCP detector — flag switch/if chains branching on concrete types", "description": "As a developer, I want rt analyze solid --principle OCP to flag code that must be modified every time a new concrete type is added.", "acceptanceCriteria": ["rt analyze solid --principle OCP --solution <sln> exits 0 and emits JSON to stdout", "Output has a top-level 'OCP' key containing an array of violation items", "Each item includes: TypeName, MemberName, FilePath, Line, BranchCount, ViolationType ('switch' or 'if-chain')", "Flags switch expressions/statements matching on 'is ConcreteType' patterns", "Flags if/else chains using 'is ConcreteType' or 'obj.GetType() == typeof(X)' with 2 or more concrete-type branches", "--min-branches <N> (default 2) is configurable", "rt analyze solid --principle all includes OCP results"], "priority": 35, "passes": false, "notes": "P2. Detects: (1) switch expressions/statements matching on 'is ConcreteType'; (2) if/else chains using 'is ConcreteType' or obj.GetType() == typeof(X) with 2+ branches. Output grouped under 'OCP' detector key.", "epicId": "EP-006"}, {"id": "US-036", "title": "rt analyze solid: LSP detector — flag overrides throwing or narrowing contracts", "description": "As a developer, I want rt analyze solid --principle LSP to flag override methods that break Liskov substitutability so that I can identify types that cannot safely replace their base.", "acceptanceCriteria": ["rt analyze solid --principle LSP --solution <sln> exits 0 and emits JSON to stdout", "Output has a top-level 'LSP' key with sub-arrays for 'ThrowingOverrides' and 'ContractNarrowings'", "Each ThrowingOverride item includes: TypeName, MemberName, ExceptionType, FilePath, Line", "Each ContractNarrowing item includes: TypeName, MemberName, BaseType, FilePath, Line", "Flags override methods whose body contains throw new NotImplementedException() or NotSupportedException()", "Flags explicit interface implementations that throw on every code path", "rt analyze solid --principle all includes LSP results"], "priority": 36, "passes": false, "notes": "P2. Two sub-checks: (1) override methods whose body throws NotImplementedException/NotSupportedException; (2) explicit interface implementations that throw on every code path. Output grouped under 'LSP' detector key.", "epicId": "EP-006"}, {"id": "US-037", "title": "rt: convert-static-class — interface generation", "description": "When --no-interface is not passed, generate an I<TypeName> interface file alongside the destated class, extracting all public/internal instance methods and properties. Interface only matters when consumers need to mock the dependency in tests. Discovered during US-027 df pass; command currently warns and skips.", "acceptanceCriteria": ["rt analyze solid --principle LSP --solution <sln> exits 0 and emits JSON to stdout", "Output has a top-level 'LSP' key with sub-arrays for 'ThrowingOverrides' and 'ContractNarrowings'", "Each ThrowingOverride item includes: TypeName, MemberName, ExceptionType, FilePath, Line", "Each ContractNarrowing item includes: TypeName, MemberName, BaseType, FilePath, Line", "Flags override methods whose body contains throw new NotImplementedException() or NotSupportedException()", "Flags explicit interface implementations that throw on every code path", "rt analyze solid --principle all includes LSP results"], "priority": 37, "passes": false, "notes": "P2. Enables mock-friendly DI patterns in roslyn-tools tests. Relates to US-027 df.", "epicId": ""}, {"id": "US-038", "title": "rt: convert-static-class — DI registration in Bootstrap.cs", "description": "When --no-di-registration is not passed, find a Bootstrap.RegisterServices method in the solution and add a services.Add<Lifetime><ITypeName, TypeName>() line. Discovered during US-027 df pass; command currently warns and skips.", "acceptanceCriteria": ["When --no-di-registration is not passed and a Bootstrap.RegisterServices method exists in the solution, a services.AddSingleton<ITypeName, TypeName>() line is added", "If --lifetime is scoped or transient, the correct Add method is used", "If no Bootstrap-style registration method is found, a warning is emitted and the step is skipped", "Running with --dry-run shows the Bootstrap.cs diff without writing it", "If --no-interface was also passed (no interface generated), registers the concrete type: services.AddSingleton<TypeName>()"], "priority": 38, "passes": false, "notes": "P2. Pairs with US-037 (interface gen). Relates to US-027 df.", "epicId": ""}, {"id": "US-039", "title": "rt: convert-static-class — fix field and ctor formatting in existing-constructor path", "description": "When a consumer class already has constructors, AddConstructorInjection inserts the new field without a trailing newline, causing it to merge with the existing first member on the same line. Similarly, AddConstructorParameter inserts parameters without comma spacing and prepends assignments without newlines before the closing brace. dotnet format corrects these cosmetically but they should be emitted correctly. Discovered during US-027 df dry-run.", "acceptanceCriteria": ["When a consumer class already has a constructor, the injected field is inserted on its own line (with correct indentation), not concatenated with the existing first member on the same line", "When AddConstructorParameter adds a parameter to an existing constructor, a space follows the preceding comma in the parameter list", "When AddConstructorParameter prepends an assignment to the constructor body, the assignment is on its own line before the closing brace", "All three fixes apply when multiple constructors are present in the consumer class", "Existing tests for add_dependencies_to_existing_instance_constructors remain green"], "priority": 39, "passes": false, "notes": "P2. df dogfood bug. Sibling of the no-constructor formatting bug fixed in the df/convert-static-class-interface-and-di branch commit 1fcf269.", "epicId": ""}, {"id": "US-040", "title": "Suppress MSBuild workspace warnings by default; opt in with --show-workspace-warnings", "description": "As a developer using rt, I want MSBuild workspace warnings suppressed by default so that NuGet audit noise and compatibility warnings from the loaded solution don't pollute rt's output.", "acceptanceCriteria": ["All MSBuild workspace warnings are suppressed from stderr by default when rt loads a solution", "A --show-workspace-warnings flag (or equivalent) re-enables them for debugging", "Genuine solution load errors that prevent rt from running still exit 1 with a clear message", "The [workspace-warnings] block does not appear in normal output"], "priority": 40, "passes": false, "notes": "P2. Affects WorkspaceLoader / MSBuildWorkspace diagnostic handling. Suppress all MSBuildWorkspace diagnostics by default; add --show-workspace-warnings global flag to restore them. Genuine load errors (exit 1) must still surface.", "epicId": ""}, {"id": "US-041", "title": "Convert solution-not-found crash to clean exit-1 error message", "description": "As a developer using rt, I want a missing solution file to produce a clear error message and exit 1, not an unhandled FileNotFoundException stack trace.", "acceptanceCriteria": ["When the --solution path does not exist, rt prints a single error line to stderr (e.g. 'Error: solution not found: <path>') and exits 1 — no stack trace", "The same clean exit-1 pattern applies to any FileNotFoundException thrown during solution loading", "The UseExceptionHandler in App.cs (or equivalent top-level handler) catches FileNotFoundException and formats it as a user-facing error", "Exit code is 1 (not 0, not unhandled crash code)", "No stack trace or 'Unhandled exception:' prefix appears in output"], "priority": 41, "passes": false, "notes": "P1. WorkspaceLoader.cs:84 throws FileNotFoundException; it propagates unhandled through the System.CommandLine pipeline. Catch at the top-level UseExceptionHandler in App.cs (or at the throw site) and emit a single stderr line. No stack trace in normal output.", "epicId": ""}, {"id": "US-042", "title": "Catch common exception types in UseExceptionHandler and emit clean exit-1 messages", "description": "As a developer using rt, I want routine exceptions (bad file, bad JSON, not-found) to produce a single clean error line to stderr, not an unhandled exception stack trace.", "acceptanceCriteria": ["UseExceptionHandler in App.cs catches FileNotFoundException, IOException, InvalidOperationException, JsonException, and YamlException and emits a single 'Error: <message>' line to stderr with exit code 1", "No stack trace or 'Unhandled exception:' prefix appears for these exception types", "Exceptions from DecisionStore.Load/Save (FileNotFoundException, YamlException, IOException) are handled the same way", "Exceptions from AddXmlDocCommand JSON file loading are handled the same way", "Unexpected exceptions (not in the list above) still surface as unhandled so they are visible during development"], "priority": 42, "passes": false, "notes": "P1. App.cs UseExceptionHandler currently does not catch typed exceptions. Catch: FileNotFoundException, IOException, InvalidOperationException, JsonException, YamlException. Format as 'Error: <ex.Message>' to stderr, exit 1. Covers: WorkspaceLoader throws beyond the missing-solution case (US-041), DecisionStore.Load/Save, AddXmlDocCommand JSON load, MigrateToIOptionsService.", "epicId": ""}, {"id": "US-043", "title": "Replace Environment.Exit(1) in OutlineCommand with context.ExitCode = 1", "description": "As a developer, I want OutlineCommand to exit consistently with all other commands so that graceful cleanup runs on error.", "acceptanceCriteria": ["OutlineCommand no longer calls Environment.Exit(1) for any error condition", "Error cases in OutlineCommand set context.ExitCode = 1 and return, consistent with all other commands", "Process exit allows graceful cleanup (log flushing, disposables) to run"], "priority": 43, "passes": false, "notes": "P2. OutlineCommand.cs line ~90 calls Environment.Exit(1). Replace with context.ExitCode = 1; return; — same pattern as every other command in the codebase.", "epicId": ""}, {"id": "US-044", "title": "Guard .First()/.Last() calls in SymbolLocator and MethodExtractor against empty sequences", "description": "As a developer using rt, I want empty-sequence edge cases to produce a clear error rather than an InvalidOperationException crash.", "acceptanceCriteria": ["No .First() or .Last() call in SymbolLocator or MethodExtractor throws InvalidOperationException when the sequence is empty", "Each call site uses FirstOrDefault with a null check, or validates the collection is non-empty before calling First/Last", "When an expected symbol or statement is not found, the command emits a descriptive error to stderr and exits 1 rather than crashing"], "priority": 44, "passes": false, "notes": "P2. SymbolLocator.cs lines ~49, 96, 135, 188 and MethodExtractor.cs lines ~57, 164, 168, 378, 501, 529-532 call .First()/.Last() on sequences that could be empty under certain inputs. Replace with FirstOrDefault + null check or add pre-call validation.", "epicId": ""}, {"id": "US-045", "title": "rt inspect find-refs: structured JSON output", "description": "As an automation consumer, I want rt inspect find-refs to emit a JSON array when --json is passed so I can process symbol references without parsing plain text.", "acceptanceCriteria": ["--json outputs a JSON array to stdout; each element has {file, line, column, kind, snippet}", "Without --json, plain-text output is unchanged (backward compatible)", "No references found produces [] not a blank line or error", "RtCommandInfo.JsonOutput is set to true", "rt dump-help shows JSON output for find-refs", "kind field distinguishes between read/write/nameof/other reference types"], "priority": 45, "passes": false, "notes": "P2. Command: src/RoslynTools.Cli/Commands/FindRefsCommand.cs. Set RtCommandInfo.JsonOutput=true and branch on RtContext.Format==OutputFormat.Json.", "epicId": "EP-007"}, {"id": "US-046", "title": "rt inspect find-callers: structured JSON output", "description": "As an automation consumer, I want rt inspect find-callers to emit a JSON array when --json is passed so call-site data can be used programmatically.", "acceptanceCriteria": ["--json outputs a JSON array; each element has {file, line, column, snippet}", "Without --json, plain-text output is unchanged", "No callers found produces [] not a blank line", "RtCommandInfo.JsonOutput is set to true", "rt dump-help shows JSON output for find-callers"], "priority": 46, "passes": false, "notes": "P2. Command: src/RoslynTools.Cli/Commands/FindCallersCommand.cs. Set RtCommandInfo.JsonOutput=true.", "epicId": "EP-007"}, {"id": "US-047", "title": "rt inspect find-undocumented: structured JSON output", "description": "As an automation consumer, I want rt inspect find-undocumented to emit a JSON array when --json is passed so missing-doc reports can feed CI or doc generation tooling.", "acceptanceCriteria": ["--json outputs a JSON array; each element has {fqn, kind, file, line}", "kind distinguishes between type, method, property, etc.", "Without --json, plain-text output is unchanged", "No undocumented members produces [] not blank", "RtCommandInfo.JsonOutput is set to true", "rt dump-help shows JSON output for find-undocumented"], "priority": 47, "passes": false, "notes": "P2. Command: src/RoslynTools.Cli/Commands/FindUndocumentedCommand.cs. Set RtCommandInfo.JsonOutput=true.", "epicId": "EP-007"}, {"id": "US-048", "title": "rt inspect find-unused: structured JSON output", "description": "As an automation consumer, I want rt inspect find-unused to emit a JSON array when --json is passed so dead-code reports can drive automated safe-delete workflows.", "acceptanceCriteria": ["--json outputs a JSON array; each element has {fqn, kind, file, line}", "Without --json, plain-text output is unchanged", "No unused symbols produces [] not blank", "RtCommandInfo.JsonOutput is set to true", "rt dump-help shows JSON output for find-unused"], "priority": 48, "passes": false, "notes": "P2. Command: src/RoslynTools.Cli/Commands/FindUnusedCommand.cs. Set RtCommandInfo.JsonOutput=true.", "epicId": "EP-007"}, {"id": "US-049", "title": "rt analyze circular-deps: structured JSON output", "description": "As an automation consumer, I want rt analyze circular-deps to emit a JSON array of cycle objects when --json is passed so dependency violations can be processed programmatically.", "acceptanceCriteria": ["--json outputs a JSON array of cycle objects; each has {cycle: [namespace, namespace, ...]}", "Without --json, plain-text output is unchanged", "No cycles produces [] not blank or zero-line", "RtCommandInfo.JsonOutput is set to true", "rt dump-help shows JSON output for circular-deps"], "priority": 49, "passes": false, "notes": "P2. Command: src/RoslynTools.Cli/Commands/CircularDepsCommand.cs. Set RtCommandInfo.JsonOutput=true.", "epicId": "EP-007"}, {"id": "US-050", "title": "rt analyze find-magic-strings: structured JSON output", "description": "As an automation consumer, I want rt analyze find-magic-strings to emit a JSON array when --json is passed so repeated literals can be fed into automated extract-string-constant workflows.", "acceptanceCriteria": ["--json outputs a JSON array; each element has {value, count, occurrences: [{file, line}]}", "occurrences is sorted by file then line", "Without --json, plain-text output is unchanged", "No magic strings produces [] not blank", "RtCommandInfo.JsonOutput is set to true", "rt dump-help shows JSON output for find-magic-strings"], "priority": 50, "passes": false, "notes": "P2. Command: src/RoslynTools.Cli/Commands/FindMagicStringsCommand.cs. Set RtCommandInfo.JsonOutput=true.", "epicId": "EP-007"}, {"id": "US-051", "title": "rt analyze list-imports: structured JSON output", "description": "As an automation consumer, I want rt analyze list-imports to emit a JSON array per-file when --json is passed so import audits can be processed programmatically.", "acceptanceCriteria": ["--json outputs a JSON array; each element has {file, usings: [{namespace, isGlobal, isStatic}]}", "Without --json, plain-text output is unchanged", "File with no usings is omitted or represented as {file, usings: []}", "RtCommandInfo.JsonOutput is set to true", "rt dump-help shows JSON output for list-imports"], "priority": 51, "passes": false, "notes": "P2. Command: src/RoslynTools.Cli/Commands/ListImportsCommand.cs. Set RtCommandInfo.JsonOutput=true.", "epicId": "EP-007"}, {"id": "US-052", "title": "rt analyze list-smells: structured JSON output", "description": "As an automation consumer, I want rt analyze list-smells to emit a JSON array when --json is passed so code smell reports can feed automated refactor planning.", "acceptanceCriteria": ["--json outputs a JSON array; each element has {kind, description, fqn, file, line, severity}", "severity is one of: warning, info", "Without --json, plain-text output is unchanged", "No smells produces [] not blank", "RtCommandInfo.JsonOutput is set to true", "rt dump-help shows JSON output for list-smells"], "priority": 52, "passes": false, "notes": "P2. Command: src/RoslynTools.Cli/Commands/ListSmellsCommand.cs. Set RtCommandInfo.JsonOutput=true.", "epicId": "EP-007"}, {"id": "US-053", "title": "Introduce IWorkspaceSessionFactory + WorkspaceSession (rt-006)", "description": "As a developer, I want all commands to depend on IWorkspaceSessionFactory instead of calling WorkspaceLoader.LoadAsync directly so that the static coupling is broken and daemon workspace caching becomes possible.", "acceptanceCriteria": ["IWorkspaceSessionFactory interface defined in Core/ with LoadAsync(string? solutionPath) signature", "WorkspaceSession : IWorkspaceSessionFactory introduced — instance wrapper delegating to static WorkspaceLoader internals", "All ~30 production command handlers accept IWorkspaceSessionFactory, not WorkspaceLoader directly", "No command file imports WorkspaceLoader after the change", "rt inspect find-refs --symbol WorkspaceLoader --solution RoslynTools.slnx shows 0 production call sites", "Architecture gate NoStaticWorkspaceLoaderUse (tests/RoslynTools.Tests/Architecture/) passes", "All existing tests pass — WorkspaceLoader.UseOverride pattern updated to stub IWorkspaceSessionFactory", "Must ship in same PR as US-054 (ISolutionApplier) — partial rollout is not safe"], "priority": 53, "passes": false, "notes": "P2. Blast radius: 30 production call sites + 100+ test references (WorkspaceLoader.UseOverride). Architecture gate already exists. WorkspaceLoader is static so cannot implement the interface — WorkspaceSession wrapper is the bridge. From issue rt-006.", "epicId": "EP-008"}, {"id": "US-054", "title": "Introduce ISolutionApplier and update mutation commands (rt-007)", "description": "As a developer, I want all mutation commands to depend on ISolutionApplier instead of calling SolutionWriter.ApplyChangesAsync directly, bundled with US-053 so the 30-command update happens once.", "acceptanceCriteria": ["ISolutionApplier interface defined: Task ApplyAsync(Solution original, Solution updated, bool dryRun)", "SolutionWriter implements ISolutionApplier", "All mutation commands accept ISolutionApplier, not SolutionWriter directly", "rt inspect find-refs --symbol SolutionWriter --solution RoslynTools.slnx shows 0 production call sites after change", "All existing tests pass", "Implemented in the same PR as US-053"], "priority": 54, "passes": false, "notes": "P2. 22 fan-in from Commands scope. Must ship with US-053 — splitting doubles the churn across all 30 commands. From issue rt-007.", "epicId": "EP-008"}, {"id": "US-055", "title": "Add rt refactor extract-orchestrator command (rt-003)", "description": "As a developer, I want rt refactor extract-orchestrator to pull a command's SetHandler lambda body into a dedicated <Feature>Handler class so commands become thin CLI adapters with no workspace or business logic.", "acceptanceCriteria": ["rt refactor extract-orchestrator --type RoslynTools.Commands.ChangeSignatureCommand --name RenameParameterHandler --request RenameParameterRequest --namespace RoslynTools.Features.ChangeSignature --solution RoslynTools.slnx --dry-run produces the diff from ralph/sessions/2026-04-21-change-signature-2.md step 5", "ChangeSignatureCommand.Build() drops from 76 to ~42 lines after apply", "Command file no longer imports WorkspaceLoader or SolutionWriter after apply", "Created handler class has signature: static async Task<int> HandleAsync(<RequestType> request)", "Lambda body replaced with: context.ExitCode = await <HandlerName>.HandleAsync(new <RequestType>(...))", "Using directives in the command file updated to reference the new handler namespace", "--dry-run shows diff without writing; without flag, writes files", "IRtCommand contract satisfied; command registered under rt refactor group", "Test suite passes after apply (no broken imports)"], "priority": 55, "passes": false, "notes"     window.__PRD_LINKED_DOCS__ = {"C:\\code\\roslyn-tools\\ralph\\backlog-prd.json": {"US-056": [{"path": "ralph/sessions/2026-05-04-daemon-protocol.md", "content": "# Session: 2026-05-04 — Daemon Protocol\n\n**Goal:** Design the rt daemon: workspace caching, git-state invalidation, and composable pipe chains.\n**Solution:** RoslynTools.slnx\n\n---\n\n## Design constraints established before simulation\n\n1. **Single global daemon.** Exactly one `rt` daemon process at a time, machine-wide. Not per-solution.\n2. **Cache key:** `solutionPath + gitHeadSha + (dirty ? gitIndexMtime : \"clean\")`. Sent by client on every request; daemon reloads if any field mismatches (including solution path change).\n3. **Git is the invalidation oracle.** No file watcher. Works because `.rt-solution` is checked in — its changes appear in git state automatically.\n4. **State lives in `~/.rt/`** — single `daemon.json`, no per-solution subdirectories, no repo pollution.\n5. **Transport: named pipe** (`\\\\.\\pipe\\rt-daemon` on Windows, fixed name). One pipe, one daemon.\n6. **Protocol: newline-delimited JSON** (request → streaming responses → exit).\n7. **Auto-start:** if no daemon is running when `rt` is invoked, start one in background and wait for it to signal ready. Transparent to the user.\n8. **Opt-out:** `RT_NO_DAEMON=1` or `rt --no-daemon` falls back to in-process (current behaviour).\n\n---\n\n## Wire format\n\n### Client → Daemon (one JSON line per request)\n\n```json\n{\n  \"requestId\": \"a1b2c3d4\",\n  \"args\": [\"inspect\", \"find-refs\", \"--symbol\", \"WorkspaceLoader\", \"--solution\", \"RoslynTools.slnx\"],\n  \"gitState\": {\n    \"head\": \"8f44e7f3a\",\n    \"dirty\": false,\n    \"indexMtime\": null\n  },\n  \"stdin\": null\n}\n```\n\n`stdin` is base64-encoded bytes when the client is itself receiving piped input (enables `rt find-refs Foo | rt rename Bar` chains through the daemon).\n\n### Daemon → Client (streaming, newline-delimited)\n\n```json\n{ \"requestId\": \"a1b2c3d4\", \"type\": \"stderr\", \"data\": \"Finding references to 'RoslynTools.Core.WorkspaceLoader'...\\n\" }\n{ \"requestId\": \"a1b2c3d4\", \"type\": \"stdout\", \"data\": \"{\\\"symbol\\\":\\\"RoslynTools.Core.WorkspaceLoader\\\",\\\"references\\\":[...]}\\n\" }\n{ \"requestId\": \"a1b2c3d4\", \"type\": \"exit\", \"code\": 0 }\n```\n\nTypes: `stderr` | `stdout` | `exit`. Client forwards stderr → its own stderr, stdout → its own stdout, then exits with `code`.\n\n### Daemon state file: `~/.rt/daemon.json`\n\n```json\n{\n  \"pid\": 18432,\n  \"pipeName\": \"rt-daemon\",\n  \"solution\": \"C:/code/roslyn-tools/RoslynTools.slnx\",\n  \"cachedHead\": \"8f44e7f3a\",\n  \"cachedDirty\": false,\n  \"cachedIndexMtime\": null,\n  \"startedAt\": \"2026-05-04T09:45:00Z\",\n  \"rtVersion\": \"0.9.0\"\n}\n```\n\n---\n\n## Step 1 — rt daemon start [SIMULATED]\n\n```\nrt daemon start --solution RoslynTools.slnx\n```\n\n```\nStarting daemon for RoslynTools.slnx...\nLoading workspace (first load may take a few seconds)...\n  Loaded 3 projects, 0 diagnostics.\nDaemon ready. PID 18432, pipe: rt-a9f3c17b\nState written to C:\\Users\\DanMarshall\\.rt\\daemon.json\n```\n\nExit 0. Subsequent `rt` invocations in this directory will connect to this daemon transparently.\n\n---\n\n## Step 2 — rt daemon status [SIMULATED]\n\n```\nrt daemon status\n```\n\n```\nDaemon: RUNNING (PID 18432)\nSolution: C:\\code\\roslyn-tools\\RoslynTools.slnx\nCache:    HEAD=8f44e7f3a  dirty=false  (clean)\nUptime:   0h 2m 14s\nPipe:     \\\\.\\pipe\\rt-daemon\n```\n\nExit 0.\n\n---\n\n## Step 3 — rt inspect find-refs via daemon [REAL, but currently in-process]\n\n```\nrt inspect find-refs --symbol WorkspaceLoader --solution RoslynTools.slnx\n```\n\n**Current (in-process) timing:** ~3.8s (workspace load + query)\n\n**Expected via daemon (workspace already cached):**\n```\nFinding references to 'RoslynTools.Core.WorkspaceLoader'...\n```\n```json\n{\n  \"symbol\": \"RoslynTools.Core.WorkspaceLoader\",\n  \"fullyQualifiedName\": \"RoslynTools.Core.WorkspaceLoader\",\n  \"references\": [\n    { \"file\": \"src/RoslynTools.Cli/Program.cs\", \"line\": 1, \"column\": 5, \"snippet\": \"using RoslynTools.Core;\" },\n    { \"file\": \"src/RoslynTools.Cli/Bootstrap.cs\", \"line\": 12, \"column\": 9, \"snippet\": \"services.AddSingleton<WorkspaceLoader>();\" }\n  ],\n  \"count\": 2\n}\n```\n\n**Expected timing via daemon:** ~200ms (no workspace load, just query).\n\n---\n\n## Step 4 — pipe chain: find-refs → rename [SIMULATED]\n\n```\nrt inspect find-refs --symbol WorkspaceLoader --json | rt refactor rename --new-name SolutionLoader --dry-run\n```\n\nThe second command reads the symbol stream from stdin when stdin is not a TTY. It extracts the `fullyQualifiedName` field and uses it as the rename target — no `--symbol` arg needed.\n\n```\n[daemon] Renaming 'RoslynTools.Core.WorkspaceLoader' → 'SolutionLoader'...\n```\n```diff\n--- a/src/RoslynTools/Core/WorkspaceLoader.cs\n+++ b/src/RoslynTools/Core/WorkspaceLoader.cs\n@@ -8,7 +8,7 @@ namespace RoslynTools.Core;\n-internal sealed class WorkspaceLoader\n+internal sealed class SolutionLoader\n {\n--- a/src/RoslynTools.Cli/Program.cs\n+++ b/src/RoslynTools.Cli/Program.cs\n@@ -1,5 +1,5 @@\n-using RoslynTools.Core; // WorkspaceLoader\n+using RoslynTools.Core; // SolutionLoader\n```\n\n> **[ISSUE: rt-008]** written — `rename` command must accept symbol FQN from stdin JSON when piped; currently only accepts positional `<symbol>` argument.\n\n---\n\n## Step 5 — git commit invalidates cache [SIMULATED]\n\nUser commits a change. Next `rt` command sends new HEAD sha.\n\n```\nrt inspect find-refs --symbol WorkspaceLoader --solution RoslynTools.slnx\n```\n\nDaemon receives: `\"head\": \"c7e90a1f\"` (new) vs cached `\"head\": \"8f44e7f3a\"`.\n\n```\n[daemon] Git state changed (HEAD: 8f44e7f3a → c7e90a1f). Reloading workspace...\n  Loaded 3 projects, 0 diagnostics.\nFinding references to 'RoslynTools.Core.WorkspaceLoader'...\n```\n\nReload is ~3.8s; subsequent commands in same HEAD are fast again.\n\n---\n\n## Step 6 — dirty working tree [SIMULATED]\n\nUser edits a file without committing.\n\n```\nrt inspect find-refs --symbol WorkspaceLoader\n```\n\nClient sends: `\"dirty\": true, \"indexMtime\": 1746368400`.\n\nIf `indexMtime` matches daemon's cached value → still cache-hit (same edits).\nIf `indexMtime` differs → daemon reloads.\n\n```\n[daemon] Working tree changed (index mtime updated). Reloading workspace...\n```\n\n---\n\n## Step 7 — rt daemon stop [SIMULATED]\n\n```\nrt daemon stop\n```\n\n```\nStopping daemon (PID 18432)...\nDaemon stopped. State removed from C:\\Users\\DanMarshall\\.rt\\daemon.json\n```\n\nExit 0. Subsequent `rt` commands fall back to in-process (or auto-start a new daemon).\n\n---\n\n## Step 8 — version mismatch (rt binary rebuilt) [SIMULATED]\n\nUser rebuilds `rt` after a code change. Client and daemon have different `rtVersion`.\n\n```\nrt inspect find-refs --symbol WorkspaceLoader\n```\n\n```\n[daemon] Version mismatch (daemon: 0.9.0, client: 0.10.0). Restarting daemon...\nStarting daemon for RoslynTools.slnx...\n  Loaded 3 projects, 0 diagnostics.\nDaemon ready. PID 19110, pipe: rt-a9f3c17b\nFinding references to 'RoslynTools.Core.WorkspaceLoader'...\n```\n\nVersion is embedded in the binary at build time (e.g. from `git describe`). Mismatch → daemon kills itself, client starts a new one.\n\n---\n\n## Retrospective\n\n### Real commands used\n- `rt inspect find-refs` (Step 3 — run in-process to establish baseline timing)\n\n### Simulated commands → rt candidates\n\n| Command | Value | Feasibility |\n|---|---|---|\n| `rt daemon start` | Core lifecycle | High — named pipe + background process |\n| `rt daemon stop` | Core lifecycle | High |\n| `rt daemon status` | Observability | High |\n| `rt refactor rename` (stdin) | Pipe chains | Medium — needs stdin reader in rename handler |\n\n### Architecture decisions confirmed\n\n- **Transport:** Named pipe, one per solution hash. Cross-platform: named pipes on Windows, Unix domain sockets on Linux/Mac (same abstraction via `System.IO.Pipes`).\n- **State dir:** `~/.rt/` — single `daemon.json`, no repo impact, no per-solution subdirectories.\n- **Invalidation:** Client sends git state on every request. Daemon reloads on mismatch. No file watchers.\n- **Pipe chains:** stdin JSON consumed when `!Console.IsInputRedirected` is false. Commands extract `fullyQualifiedName` from stream.\n- **Version guard:** `rtVersion` in `daemon.json` compared to client version. Mismatch triggers daemon restart.\n- **Fallback:** `RT_NO_DAEMON=1` or `--no-daemon` for in-process execution (tests, CI).\n\n### Gaps logged\n\n- 2026-05-04: `rename` must accept piped stdin JSON — see rt-008\n- 2026-05-04: `rt daemon start/stop/status` commands do not exist\n- 2026-05-04: Client has no IPC layer — currently always runs in-process\n\n### Implementation order\n\n1. **DaemonClient** — connect to named pipe, send request, stream responses to stdout/stderr\n2. **DaemonServer** — named pipe listener, request deserialiser, workspace cache with git-state check\n3. **`rt daemon` subcommands** — start, stop, status (thin wrappers over DaemonServer lifecycle)\n4. **Auto-start** — if no daemon.json or pipe is dead, start daemon and wait for ready signal\n5. **Stdin pipe reader** — make mutation commands accept `fullyQualifiedName` from stdin JSON (rt-008)\n\n### Next session\n- Implement DaemonServer: named pipe listener + workspace cache\n- Implement DaemonClient: pipe connection + request/response streaming\n- Wire auto-start into Program.Main (between MsBuildBootstrap and App.RunAsync)\n"}]}};

  <script>
    const e = React.createElement;

    function normalizeStory(story) {
      const acceptance = Array.isArray(story && story.acceptanceCriteria) ? story.acceptanceCriteria : [];
      return {
        id: String(story && story.id || ""),
        title: String(story && story.title || ""),
        description: String(story && story.description || ""),
        acceptanceCriteria: acceptance.map((item) => String(item)),
        priority: Number(story && story.priority || 9999),
        passes: Boolean(story && story.passes),
        notes: String(story && story.notes || ""),
        epicId: String(story && story.epicId || "")
      };
    }

    function normalizeEpic(epic) {
      return {
        id: String(epic && epic.id || ""),
        title: String(epic && epic.title || ""),
        description: String(epic && epic.description || ""),
        notes: String(epic && epic.notes || "")
      };
    }

    function normalizeProject(raw, fallback) {
      const stories = Array.isArray(raw && raw.userStories) ? raw.userStories.map(normalizeStory) : [];
      const epics = Array.isArray(raw && raw.epics) ? raw.epics.map(normalizeEpic) : [];
      const sortedStories = stories.slice().sort((left, right) => {
        if (left.passes !== right.passes) return left.passes ? 1 : -1;
        if (left.priority !== right.priority) return left.priority - right.priority;
        return left.id.localeCompare(right.id);
      });
      const total = sortedStories.length;
      const complete = sortedStories.filter((story) => story.passes).length;
      const pending = total - complete;
      return {
        project: String(raw && raw.project || fallback.project || "PRD"),
        branchName: String(raw && raw.branchName || fallback.branchName || ""),
        description: String(raw && raw.description || fallback.description || ""),
        path: fallback.path || "",
        sourceUrl: fallback.sourceUrl || "",
        stats: {
          total: total,
          complete: complete,
          pending: pending,
          completionPct: total ? Math.round((complete / total) * 100) : 0
        },
        epics: epics,
        stories: sortedStories
      };
    }

    function escapeHtml(value) {
      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");
    }

    function renderInlineMarkdown(text) {
      let value = escapeHtml(text);
      value = value.replace(/`([^`]+)`/g, "<code>$1</code>");
      value = value.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
      value = value.replace(/\*([^*]+)\*/g, "<em>$1</em>");
      return value;
    }

    function renderMarkdown(text) {
      const value = String(text || "").replace(/\r\n/g, "\n").trim();
      if (!value) return "";

      const lines = value.split("\n");
      const parts = [];
      let inList = false;

      function closeList() {
        if (inList) {
          parts.push("</ul>");
          inList = false;
        }
      }

      for (const rawLine of lines) {
        const line = rawLine.trim();
        if (!line) {
          closeList();
          continue;
        }

        if (line.startsWith("- ") || line.startsWith("* ")) {
          if (!inList) {
            parts.push("<ul>");
            inList = true;
          }
          parts.push("<li>" + renderInlineMarkdown(line.slice(2).trim()) + "</li>");
          continue;
        }

        closeList();

        if (line.startsWith("### ")) {
          parts.push("<h5>" + renderInlineMarkdown(line.slice(4)) + "</h5>");
        } else if (line.startsWith("## ")) {
          parts.push("<h4>" + renderInlineMarkdown(line.slice(3)) + "</h4>");
        } else if (line.startsWith("# ")) {
          parts.push("<h3>" + renderInlineMarkdown(line.slice(2)) + "</h3>");
        } else {
          parts.push("<p>" + renderInlineMarkdown(line) + "</p>");
        }
      }

      closeList();
      return parts.join("");
    }

    function MarkdownBlock(props) {
      return e("div", {
        className: props.className || "markdown",
        dangerouslySetInnerHTML: { __html: renderMarkdown(props.text) }
      });
    }

    function renderSpecMarkdown(text) {
      if (typeof marked === "undefined") {
        return renderMarkdown(text);
      }
      return marked.parse(String(text || ""), { gfm: true, breaks: false });
    }

    function DetailsPane(props) {
      const project = props.project;
      const story = props.story;

      if (!project || !story) {
        return e("div", { className: "empty" }, "Select a story.");

      return e("div", { className: "details-inner" },

                e("span", { className: "acceptance-index" }, String(index + 1).padStart(2, "0")),
                e(MarkdownBlock, { text: item })
              )
            )
          )
        )
      );
    }

        return e("div", { className: "empty" }, "Select a story.");

      const allDocs = window.__PRD_LINKED_DOCS__ || {};

      return e("div", { className: "summary-inner" },

        e("h3", { className: "summary-title" }, story.title),
        e("div", { className: "summary-meta" },
          e("span", { className: "pill priority" }, "P" + story.priority),
          e("span", { className: "pill " + (story.passes ? "complete" : "pending") }, story.passes ? "Complete" : "Pending"),
          e("span", { className: "pill" }, story.acceptanceCriteria.length + " ACs")
        ),
        e(MarkdownBlock, { className: "markdown", text: story.description }),
        docs.length ? e("div", { className: "linked-docs" },

            e("article", { key: doc.path + "-" + i, className: "linked-doc" },

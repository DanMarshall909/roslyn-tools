, "acceptanceCriteria": ["Inverse pairs seeded: extract-method ↔ inline-method, make-static ↔ make-instance, convert-static-class ↔ (no inverse; one-way operation). Each pair lists the other in its SeeAlso.", "Find-* sibling family seeded: find-refs, find-callers, find-impl, find-pattern, find-unused, find-undocumented each list the others in their SeeAlso (or a curated subset where the relationship is strong).", "Workflow chains seeded (downstream-direction, not bidirectional): find-unused → safe-delete; find-magic-strings → extract-string-constant; find-duplicates → extract-method; find-undocumented → add-xml-doc; static-class-inventory → convert-static-class; analyze-interface → narrow-dependency. The downstream operation does not necessarily back-link to the find command (these are workflows, not inverses).", "Make-* sibling family seeded: make-async, make-static, make-instance, make-sealed each list the others in their SeeAlso.", "DI-injection family seeded: add-dependency, replace-datetime, migrate-to-ioptions, convert-console-logging each list the others (all are DI-injection patterns the LLM might mix up).", "Analyze/quality family seeded: solid, list-smells, complexity, find-duplicates each list the related ones.", "Deps family seeded: circular-deps, dependency-graph, list-imports each list the related ones.", "Each seed cluster lands as a separate commit (~5–10 command files touched per commit) so the SeeAlso data is reviewable in coherent units.", "After each commit, rt dump-help is run and the See-also sections render in the expected places.", "No story breaks: rt <cmd> --help for unmodified commands still shows no See-also section (since their SeeAlso is null); only seeded commands gain the section.", "Validator from Story 2 (US-088) continues to pass at every commit — no unknown command names, no self-references, no duplicates.", "dotnet build clean; dotnet format --verify-no-changes clean; existing tests pass; the architecture test from Story 2 stays green.", "Final commit removes the marker comment 'EP-011 SeeAlso seed in progress' from docs/COMMANDS.md (added at the start of seeding) once all clusters are landed."], "priority": 90, "passes": false, "notes": "Third of 4 stories under EP-011. Source plan step 10. Depends on the SeeAlso schema (previous story) landing first. Each cluster (inverse pairs / find-* / make-* / DI-injection / analyze-quality / deps) lands as a separate commit.", "epicId": "EP-011"}, {"id": "US-090", "title": "Unknown-command fallback: reuse Bm25Scorer to suggest matches on parse errors", "description": "As an LLM agent typing a hallucinated or semantically-correct-but-wrong command name (rt destatic-class, rt rm-method, rt rename-symbol), I want rt to suggest the closest real command via the same BM25 engine that powers rt suggest, so I can recover without reading the full help page. System.CommandLine middleware that runs after parse-error detection.", "acceptanceCriteria": ["System.CommandLine middleware registered in App.RunCoreAsync near the existing exception handler runs AFTER parsing and detects 'unknown command' parse errors at the root or group level.", "When an unknown token is detected at a top-level or group context, the middleware: (a) emits a single 'Error: <token> is not a recognised command.' line to stderr; (b) runs Bm25Scorer.Score(App.Commands.Select(c => c.Info).ToList(), unknownToken, top: 3) to get ranked candidates; (c) if any candidate scores above a configurable threshold, prints 'Did you mean one of these?' followed by each candidate's name + first-line WhenToUse; (d) prints 'Or run: rt suggest \"<task in plain English>\"' as a recovery hint; (e) sets context.ExitCode = 1.", "When no candidate scores above the threshold (gibberish input), the 'Did you mean' block is suppressed — only the 'is not a recognised command' line + 'Or run: rt suggest ...' hint appears. Printing low-confidence suggestions for gibberish is worse than printing nothing.", "Threshold lives in Bm25Scorer as a tunable constant (e.g. MinSuggestionScore); tests pin the threshold by exercising the gibberish case.", "The pure-function Bm25Scorer is shared with the rt suggest command (Story 1) — the middleware is just another caller of the same engine; the seeded synonyms apply automatically.", "Output channel: stderr per CLAUDE.md 'diagnostics to stderr' convention. Exit code 1 consistent with other user-error exits.", "JSON mode honour: if --json was parsed cleanly before the parse error, the 'Did you mean' block is JSON; otherwise plain text.", "Theory test tests/RoslynTools.Tests/Cli/UnknownCommandFallbackTests.cs pins (typed-token, expected-top-result) pairs: ('destatic-class','convert-static-class'), ('rm-method','inline-method' or 'safe-delete' depending on tuning), ('rename-symbol','rename'), ('seal','make-sealed'), ('blah',null /*gibberish — no high-scoring suggestion*/).", "Existing System.CommandLine UseTypoCorrections() still works for short-Levenshtein typos; this middleware is the layer above for semantic matches that Levenshtein won't catch.", "Backwards-compat: invocations that already succeed (every existing command) are unchanged; no measurable startup overhead from the middleware on the happy path (BM25 only runs on parse failure).", "dotnet build clean; dotnet format --verify-no-changes clean; existing tests pass; new theory tests green.", "Dogfood smoke: rt destatic-class prints 'Did you mean convert-static-class?' to stderr and exits 1; rt blah-blah-blah prints only the 'not a recognised command' line + 'rt suggest' hint and exits 1; rt rename --help still works (no false positives on known commands)."], "priority": 91, "passes": false, "notes": "Fourth of 4 stories under EP-011. Source plan step 11. Highest-leverage piece of the epic — most invalid invocations happen because the LLM guessed a name, and the right answer is usually one BM25 score away. Depends on Story 1 (BM25 engine + synonyms) landing first.", "epicId": "EP-011"}, {"id": "US-091", "title": "Enrich C# diff syntax highlighting with type-name and method-call heuristics", "description": "As a developer reviewing rt's --dry-run diffs in the terminal, I want type names and method calls visually distinguished from regular identifiers so that identifier-heavy lines (e.g. property assignments inside object initialisers) aren't a wall of white text.", "acceptanceCriteria": ["Diff content for .cs files renders type-name identifiers (PascalCase after new/:/<<>>/class/interface/struct/record/enum/namespace) in a distinct colour from regular identifiers", "Identifiers immediately followed by `(` (method-call syntax) render in a colour distinct from both keywords and type names", "Existing keyword / string-literal / numeric-literal / comment colouring is preserved unchanged", "Non-.cs diffs remain unaffected — no false-positive colouring on JSON, props, markdown, etc.", "Unit tests in tests/RoslynTools.Tests/Cli/CSharpHighlighter.cs cover each new heuristic with positive cases (correct colour applied) and negative cases (no colour where the heuristic should not fire)"], "priority": 92, "passes": false, "notes": "P3. Deferred from the colour-rendering feature (Spectre.Console adapter). Current CSharpHighlighter at src/RoslynTools.Cli/Rendering/CSharpHighlighter.cs is purely lexical — only keywords/strings/numbers/comments are coloured. Next step is two lexical heuristics: PascalCase identifier preceded by new/:/<\/class/etc → type colour (suggest aquamarine3); identifier immediately followed by ( → method colour (suggest gold3). Further-future: full Roslyn semantic classification via Microsoft.CodeAnalysis.Classification.Classifier.GetClassifiedSpansAsync for IDE-quality output.", "epicId": ""}, {"id": "US-092", "title": "Stable fix IDs in dry-run + --apply / --skip filters for batch mutation commands", "description": "As an LLM agent or interactive user reviewing a batch rt refactor --dry-run, I want each proposed fix labelled with a stable deterministic ID, and I want to re-invoke the command with --apply <ids,...> or --skip <ids,...> to land exactly the subset I've decided is safe. Without this, accepting 5 of 8 proposed make-sealed changes requires hand-editing or splitting the batch by symbol name.", "acceptanceCriteria": ["Every fix proposed by a batch mutation command (make-sealed, add-null-checks, add-global-import, convert-console-logging, replace-xunit-asserts, replace-datetime, add-xml-doc) is tagged with an 8-char hex fix ID derived from SHA-256 over (commandName + targetSymbolFqnOrRepoRelativePath + mutationKind); the ID is deterministic across runs as long as the inputs haven't changed.", "When the target has no FQN (file-scoped operations), the hash falls back to repo-relative path + mutation kind — stable across runs as long as the file isn't moved/renamed.", "Dry-run text output prefixes each diff section with `[fix <id>]` on its own line above the `--- path` header so the ID is grep-pable.", "Dry-run JSON output (for commands that already emit JSON, or as a follow-up for those that don't) wraps each fix in `{ id, command, target, files: [{ path, diff }] }`.", "A `--apply <id,id,...>` option, when present, narrows the applied set to fixes whose ID is in the list; unknown IDs are reported to stderr and exit 1.", "A `--skip <id,id,...>` option, when present, applies all fixes except those listed; unknown IDs are reported to stderr and exit 1.", "Passing both --apply and --skip in the same invocation is a usage error: exit 1 with a clear stderr message.", "Neither --apply nor --skip require --dry-run to have been run first; IDs are deterministic so the user can compute them once and pass them later.", "When --apply selects zero fixes (empty list or all IDs unknown), the command exits 0 with `No changes.` (existing no-op message) rather than failing.", "Single-target commands (rename, move, extract-method, inline-method, safe-delete) emit a single fix ID in their dry-run header for consistency, but --apply/--skip are *not* registered on them (no benefit and adds parse-time noise).", "Integration tests under tests/RoslynTools.Tests/Mutation/ cover: (a) determinism — same input twice produces same ID; (b) --apply picks subset; (c) --skip drops subset; (d) both flags error; (e) unknown ID errors; (f) ID stability across an unrelated edit elsewhere in the project.", "dotnet build clean; dotnet format --verify-no-changes clean; existing tests pass."], "priority": 93, "passes": false, "notes": "P2. Centralise ID generation in a new FixId helper in src/RoslynTools/Core/. Each batch command's service exposes the candidate fix list (already does internally — just needs to lift it before SolutionWriter.ApplyChangesAsync) so the command host can apply --apply/--skip filtering before workspace changes are computed. Option registration: extend CommandOptionFactory with CreateApplyOption()/CreateSkipOption() and a shared parser. Scope: batch commands only (single-target commands gain nothing from --apply/--skip). Out of scope for MVP: backporting --apply/--skip to single-target commands; JSON envelope for commands that today emit only text diffs (track as a follow-up under EP-007 if useful).", "epicId": ""}, {"id": "US-093", "title": "Route command exit codes through System.CommandLine middleware (replace Environment.ExitCode)", "description": "As an rt maintainer, I want CLI commands to set exit codes via the InvocationContext (ctx.ExitCode) rather than Environment.ExitCode so that the documented middleware contract in App.cs is honoured, test parallelism is safe, and exit-code routing composes with CommandLineBuilder.", "acceptanceCriteria": ["No command under src/RoslynTools.Cli/Commands/ references Environment.ExitCode — grep returns zero hits.", "DaemonServer.cs is the only file in src/ permitted to read/write Environment.ExitCode (it propagates exit codes across the sub-pipe scope).", "ExtractMethodCommand no longer wraps its handler in try/catch for InvalidOperationException or ArgumentOutOfRangeException; the middleware translates these to exit 1 + a single 'Error: <message>' line on stderr.", "Bad-input behaviour of every touched command is observably unchanged: exit 1, single 'Error: ...' line on stderr, no stack trace.", "New architecture test bans Environment.ExitCode references in src/ outside DaemonServer.cs.", "dotnet build clean, dotnet format --verify-no-changes clean, full test suite passes.", "Integration test exercises one previously-affected command (e.g. make-static on bad input) end-to-end and asserts exit 1 + single stderr line."], "priority": 94, "passes": false, "notes": "P1. Source: architectural audit on 2026-05-24. 8 commands bypass App.cs:407 TryHandleUserErrorAsync — AddTestCommand (6 sites), FindPatternCommand, ListSmellsCommand, MakeStaticCommand, MoveMethodCommand, SafeDeleteCommand, TransformParametersCommand. ExtractMethodCommand has redundant try/catch for the exact types the middleware handles. Anchors to feedback_no_exceptions_for_results memory. Independent of US-077 (which is about Result types in core services).", "epicId": ""}, {"id": "US-094", "title": "Architectural ratchet test for native MCP handler coverage", "description": "As an rt maintainer, I want a failing architectural test that names every command without a native IMcpHandler, so the test itself drives the migration tickets — each command-migration commit shrinks the allow-list until the test passes with zero exemptions.", "acceptanceCriteria": ["Test file under tests/RoslynTools.Tests.Mcp/Architecture/ (e.g. EveryCommandHasNativeMcpHandler.cs) enumerates every IRtCommand in App.Commands and asserts each has a registered IMcpHandler whose ToolName matches the command's RtCommandInfo.Name (after the `-`→`_` substitution the bridge already applies).", "An explicit allow-list inside the test enumerates every command that does NOT yet have a native handler. The list starts populated with all ~50 commands currently routed through CliCommandBridge — only `suggest_command` and `outline` are exempt-by-handler (they already have native impls).", "Test failure message names the violating command(s) + points at docs/pattern-core-service.md + lists the migration steps (extract service, add Request/Result DTOs, write *Handler : IMcpHandler, register in McpServiceRegistration).", "If a command has BOTH an allow-list entry AND a native handler, the test fails with a 'remove allow-list entry; handler is in place' message — keeps the allow-list shrinking honestly.", "Test is wired into the default dotnet test run; no skip attributes, no opt-in.", "RoslynTools.Cli.csproj (or RoslynTools.csproj) has InternalsVisibleTo for RoslynTools.Tests.Mcp added if it's not already in place so the test can read App.Commands.", "Test passes today (with the full ~50-command allow-list intact). After each EP-012 migration commit removes one entry, the test continues to pass."], "priority": 95, "passes": false, "notes": "P1. Drives the rest of EP-012. Implementation ~50 lines: reflection over IMcpHandler implementers in the Mcp assembly, intersect with App.Commands names, diff against allow-list. Bonus: also assert no allow-list entries that DON'T correspond to a real command (keeps the list honest as commands are renamed/added/removed).", "epicId": "EP-012"}, {"id": "US-095", "title": "Migrate read-only inspect commands to native MCP handlers", "description": "As an LLM agent invoking rt via MCP, I want read-only inspect commands to return structured JSON (not CLI-formatted JSON wrapped in a text string), so I can parse and pipe results without a string-to-JSON round-trip.", "acceptanceCriteria": ["describe — native IMcpHandler wrapping the existing service; returns DescribeResult JSON directly.", "find-refs — native handler returning the structured reference list.", "find-callers — native handler returning the structured caller list.", "find-impl — native handler returning the structured implementations list.", "find-unused — native handler returning structured dead-code list.", "find-undocumented — native handler returning structured undocumented-symbol list.", "find-pattern — native handler returning structured pattern-match list.", "source — native handler returning structured source-text payload.", "Each handler is registered in McpServiceRegistration; the corresponding name is REMOVED from the EP-012 ratchet test's allow-list as that command's handler lands.", "For each command, if the CLI side does not already use a Request DTO (post-US-072 commands like OutlineCommand do), introduce one in the Core service so the handler does not duplicate parsing logic.", "ToolRegistry routes each migrated command to its native handler instead of falling through to CliCommandBridge.", "MCP integration test (or extending tests/RoslynTools.Tests.Mcp/) confirms each migrated tool returns JSON in ToolResult.content (parseable as JSON, not just a string of JSON wrapped in quotes)."], "priority": 96, "passes": false, "notes": "P2. Eight commands; each one's a small commit. Sequence by dependency: describe and find-refs first (most-used by agents), then the find-* family, then source. The CLI side for most of these is already ctor-injected post-US-072 — the work is consolidating ad-hoc parameters into a Request DTO + writing the native handler.", "epicId": "EP-012"}, {"id": "US-096", "title": "Migrate analyze commands to native MCP handlers", "description": "As an LLM agent running cross-cutting analysis via MCP, I want analyze commands to return structured JSON directly so I can ingest the results without the text-capture round-trip.", "acceptanceCriteria": ["circular-deps — native handler.", "dependency-graph — native handler.", "complexity — native handler.", "solid — native handler.", "list-smells — native handler.", "list-imports — native handler.", "analyze-interface — native handler.", "find-duplicates — native handler.", "find-magic-strings — native handler.", "static-class-inventory — native handler.", "Each removes its name from the ratchet test's allow-list.", "Each handler registered in McpServiceRegistration; ToolRegistry routes accordingly.", "Per-command MCP integration test confirms native-JSON shape."], "priority": 97, "passes": false, "notes": "P2. Ten analyze commands. Same shape as the inspect migration — many are already ctor-injected so the work is mostly DTO consolidation + handler wiring. 'debug' is intentionally excluded (it's an LLM-trace debugger meta-command, not a Roslyn analyser).", "epicId": "EP-012"}, {"id": "US-097", "title": "Decide MCP shape for mutating refactor commands", "description": "As an rt maintainer, I want a documented decision about how mutating refactor commands (rename, extract-method, safe-delete, etc.) surface through MCP — today they all force --dry-run via CliCommandBridge, which means MCP users never actually apply changes; native handlers raise the question of whether MCP should permit mutations and, if so, with what approval UX.", "acceptanceCriteria": ["Decision recorded in docs/pattern-core-service.md (new section: 'Mutating commands and MCP') covering options: (a) Native handlers that always run dry-run and return a diff JSON, with a separate confirm-and-apply tool; (b) Native handlers that take an apply: bool input and trust the MCP client to gate it; (c) Refuse mutating commands at the MCP layer entirely and document that mutations are CLI-only.", "Decision applied to one tracer refactor command (recommend rename, since it already has a RenameSymbolHandler scaffolded in src/RoslynTools.Mcp/Handlers/) so the pattern is concrete before scaling.", "If option (a) is chosen, an additional Decision section documents the diff-JSON contract (DiffPlex-style hunks vs file-text-pairs vs Solution-changes-tree).", "Update the EP-012 ratchet test to either: (a) include refactor commands in the migration list (if a path is chosen); (b) exempt them with an explicit reason (carve-out commented in the allow-list)."], "priority": 98, "passes": false, "notes": "P2. Owner decision needed — the options trade UX/safety differently. Recommend (b) with the MCP client's tool-approval flow as the gate, since that matches how every other MCP server works in practice. RenameSymbolHandler already exists as dead code (zero refs) — repurposing it as the tracer turns scaffolding into shipping work.", "epicId": "EP-012"}, {"id": "US-098", "title": "Drop the RoslynTools.Mcp -> RoslynTools.Cli project reference", "description": "As an rt maintainer, I want the unusual exec-to-exec project dependency (Mcp references the Cli executable) removed, so each host depends only on shared library code. The bridge moves to a shared assembly; the catalog moves with it; CLI and MCP become equal-status consumers of the same lower layer.", "acceptanceCriteria": ["New project src/RoslynTools.Commands/ (or RoslynTools.Hosting/) contains: the IRtCommand registry (formerly App.Commands), App.Discover, the auto-bridge / CliCommandBridge (or whatever remains after the inspect + analyze migrations), and the ICommandCatalog implementation.", "RoslynTools.Mcp.csproj no longer ProjectReferences RoslynTools.Cli.csproj — it references RoslynTools.Commands and RoslynTools (Core) only.", "RoslynTools.Cli.csproj also references RoslynTools.Commands instead of holding the registry itself.", "MsBuildBootstrap stays in RoslynTools.Cli (it's an entry-point concern, only used by Cli's Program.Main).", "Bootstrap.RegisterServices remains shared (called by both hosts) — moves to RoslynTools.Commands or stays as-is depending on what makes the boundary cleanest.", "All existing tests pass; dotnet format clean; dotnet stryker scope expanded to include the new project.", "The EP-012 ratchet test still passes (no regression in MCP handler coverage)."], "priority": 99, "passes": false, "notes": "P2. Should land AFTER the inspect + analyze migrations — once enough commands have native handlers, CliCommandBridge shrinks to a tail of commands (mutations + edge cases) and the move is mechanical. Trying this before the migration means moving a fat bridge plus all 50 commands; doing it after means moving a thin bridge plus a slim catalog. Verifies the architectural goal of EP-012: hosts are peers, not master-slave.", "epicId": "EP-012"}, {"id": "US-099", "title": "Extract IRtCommand registry into a new RoslynTools.Commands project so MCP stops depending on the Cli host", "description": "As an rt maintainer, I want the command registry, App.Discover, the ICommandCatalog implementation, and the auto-bridge (CliCommandBridge) extracted into a new project (RoslynTools.Commands or RoslynTools.Hosting) so both RoslynTools.Cli and RoslynTools.Mcp can reference it without MCP transitively depending on the Cli exe.", "acceptanceCriteria": ["New project src/RoslynTools.Commands/ (or RoslynTools.Hosting/) contains: the IRtCommand registry (formerly App.Commands), App.Discover, the auto-bridge / CliCommandBridge (or whatever remains after the inspect + analyze migrations), and the ICommandCatalog implementation.", "RoslynTools.Mcp.csproj no longer ProjectReferences RoslynTools.Cli.csproj — it references RoslynTools.Commands and RoslynTools (Core) only.", "RoslynTools.Cli.csproj also references RoslynTools.Commands instead of holding the registry itself.", "MsBuildBootstrap stays in RoslynTools.Cli (it's an entry-point concern, only used by Cli's Program.Main).", "Bootstrap.RegisterServices remains shared (called by both hosts) — moves to RoslynTools.Commands or stays as-is depending on what makes the boundary cleanest.", "All existing tests pass; dotnet format clean; dotnet stryker scope expanded to include the new project.", "The EP-012 ratchet test still passes (no regression in MCP handler coverage)."], "priority": 100, "passes": false, "notes": "P2. Source: 2026-05-24 design note. Relates to EP-012 (thin-host-adapter migration) — the epic description flags the unusual RoslynTools.Mcp → RoslynTools.Cli exe-to-exe project reference. This story removes that coupling by promoting the registry / discovery / bridge to a shared library project. Naming: RoslynTools.Commands vs RoslynTools.Hosting decision happens at planning time based on which scopes cleaner.", "epicId": "EP-012"}, {"id": "US-100", "title": "Unify RtResultRenderer call shape and enforce IStructuredOutputCommand for every JSON-output command", "description": "As an rt maintainer, I want every structured-output command to call RtResultRenderer through one consistent entry point and to declare its JSON output by implementing IStructuredOutputCommand, so renderer behaviour cannot drift between commands and RtCommandInfo.JsonOutput=true is reliably synchronised with the interface implementation.", "acceptanceCriteria": ["RtResultRenderer exposes one canonical method that structured-output commands call (the default JSON options are encapsulated inside the renderer; callers do not pass options).", "The previously-divergent overload (Write with explicit JsonOptions) is removed, or restricted to a clearly-scoped use case that no command currently needs.", "Every command with RtCommandInfo.JsonOutput=true implements IStructuredOutputCommand; every command that implements IStructuredOutputCommand has JsonOutput=true.", "App.cs startup validator enforces this biconditional and fails at startup (and therefore fails post-build docs/COMMANDS.md generation) if a new command violates it.", "rt inspect find-refs --json, rt inspect find-callers --json, and rt inspect find-impl --json produce byte-identical output before and after the change.", "Architecture test under tests/RoslynTools.Tests/Architecture/ covers the biconditional invariant by exercising the validator against the live command registry.", "dotnet build clean, dotnet format --verify-no-changes clean, full test suite passes."], "priority": 101, "passes": false, "notes": "P2. Source: architectural audit on 2026-05-24. RtResultRenderer exposes three methods: Write(RtResult<T>, JsonOptions), WriteOutput<T>(RtResult<T>), WriteText(RtResult<string>). Today FindRefsCommand:58 and FindCallersCommand:61 call WriteOutput, while FindImplementationsCommand:79-81 calls Write(..., SymbolFormatter.DefaultJsonOptions). IStructuredOutputCommand marker exists but only FindImplementationsCommand implements it; the other two do not. App.cs has a static-ctor check that the category enum stays in sync — extend it to enforce the JsonOutput=true ⇔ IStructuredOutputCommand biconditional.", "epicId": ""}, {"id": "US-101", "title": "Decompose SolidAnalyzer into per-principle analyzers behind a thin orchestrator", "description": "As an rt maintainer, I want each SOLID principle's analysis logic to live in its own class so the 700-line static SolidAnalyzer shrinks to a thin orchestrator, mutation coverage can be measured per principle, and adding a new principle becomes a new file rather than an edit to a single megaclass.", "acceptanceCriteria": ["Five new classes under src/RoslynTools/Core/Solid/ (or similar): SrpAnalyzer, IspAnalyzer, DipAnalyzer, OcpAnalyzer, LspAnalyzer. Each owns the logic that lived in the corresponding AnalyzeXxxAsync method.", "Each per-principle analyzer implements a uniform interface (ISolidPrincipleAnalyzer or similar) with one method that returns a list of violations for a given solution + scope.", "SolidAnalyzer becomes a thin orchestrator: it accepts IReadOnlyList<ISolidPrincipleAnalyzer> via DI and fans out to them based on the user's --principle selection.", "Bootstrap.cs registers all five analyzers with the DI container.", "rt analyze solid --principle SRP|ISP|DIP|OCP|LSP|all produces byte-identical output (text and JSON) on the roslyn-tools solution before and after the change.", "Architecture test asserts every type ending in 'Analyzer' under src/RoslynTools/Core/Solid/ implements ISolidPrincipleAnalyzer.", "Stryker mutate config extended to cover each new per-principle analyzer file; mutation score targets per file are documented (baseline set in the PR).", "dotnet build clean, dotnet format --verify-no-changes clean, existing tests pass."], "priority": 102, "passes": false, "notes": "P2. Source: architectural audit on 2026-05-24. Today SolidAnalyzer.cs is a single internal static class containing five AnalyzeXxxAsync methods (SRP at line 56, ISP at line 118, DIP at line 279, OCP at line 470, LSP at line 666). Genuine SRP violation. ComplexityAnalyzer was originally flagged in the audit but on inspection it computes only 2 metrics (Cyclomatic + Cognitive) — out of scope. Naturally pairs with the ISmellRule work (US-095) since both lean on a shared rule/analyzer abstraction.", "epicId": ""}, {"id": "US-102", "title": "Complete the IWorkspaceSessionFactory migration — remove LoadWorkspaceAsync compat surface", "description": "As an rt maintainer, I want every command to consume the workspace via GetSolutionAsync and LoadWorkspaceAsync removed from the interface, so the factory owns workspace lifetime end-to-end and the `using (workspace) { ... }` pattern (which suggests caller-owned disposal) disappears from the codebase.", "acceptanceCriteria": ["Every production caller of LoadWorkspaceAsync is migrated to GetSolutionAsync; the `using (workspace) { ... }` wrappers around the returned solution are removed (the factory singleton owns disposal via its own lifecycle).", "LoadWorkspaceAsync is removed from IWorkspaceSessionFactory and from the WorkspaceLoader implementation.", "The MCP handlers (OutlineHandler, ChangeSignatureCommandHandlers) also migrate; the only remaining LoadWorkspaceAsync-shaped surface is internal helper code or test fixtures.", "Grep for `LoadWorkspaceAsync` in src/ returns zero hits.", "Architecture test asserts no production code references LoadWorkspaceAsync and no command wraps IWorkspaceSessionFactory results in `using`.", "rt dump-help smoke matrix from CLAUDE.md exits 0 across the listed commands.", "dotnet build clean, dotnet format --verify-no-changes clean, full test suite passes."], "priority": 103, "passes": false, "notes": "P2. Source: architectural audit on 2026-05-24. US-053 introduced IWorkspaceSessionFactory and US-072 finished ctor-injection — both shipped. Compat surface LoadWorkspaceAsync still has 39 callers (37 production commands/services + 2 MCP handlers) per grep on 2026-05-24. The `using (workspace) { ... }` pattern in every refactor command suggests caller-owned disposal, which contradicts the factory-owned-singleton design. Mechanical migration per command.", "epicId": "EP-008"}, {"id": "US-103", "title": "Eliminate parameterless service ctors that hand-roll concrete dependencies", "description": "As an rt maintainer, I want every service under src/RoslynTools/Services/ to be constructed exclusively via DI, with no parameterless ctor that hand-rolls new SolutionChangeWriter() / new RtConsoleLogger / sibling services, so test code is forced through RoslynTools.Bootstrap.RegisterServices (per feedback_test_di_resolution) and there is no second construction path that masks missing wiring.", "acceptanceCriteria": ["No service under src/RoslynTools/Services/ exposes a parameterless ctor that constructs its dependencies; the only public ctor accepts the dependencies as parameters.", "Production services that compose other services (ChangeSignatureService, AnalyzeInterfaceService, NarrowDependencyService) take their composed services via constructor injection rather than `new`.", "Every test file in tests/ that currently uses `new <Service>()` is migrated to resolve via _services.Resolve<TService>() from the existing RtServicesFixture.", "Grep for `new \\w+Service\\(\\)` in tests/ returns zero hits (allowing only test-double types defined under tests/ namespaces).", "The architecture test from US-098 is extended to enforce: no test under tests/ may construct a class deriving from IRtService via `new`.", "dotnet build clean, dotnet format --verify-no-changes clean, full test suite passes.", "rt dump-help smoke matrix from CLAUDE.md exits 0."], "priority": 104, "passes": false, "notes": "P2. Source: architectural audit on 2026-05-24. 34 services have legacy parameterless ctors that chain to a parameterised ctor via : this(new ...) — e.g. ImportDirectiveService.cs:33-35. Used by 14 test files (tests/RoslynTools.Tests/Mutation/RenameIntegration.cs, etc.) and 3 production services that compose siblings via new (ChangeSignatureService, AnalyzeInterfaceService, NarrowDependencyService). Follows the spirit of US-072 (RtServiceProvider removal, shipped 2026-05-21) — completes the DI story at the service tier. US-098 overlaps at the test-level no-new rule; the architecture test introduced there is extended here to cover the full service inventory.", "epicId": ""}, {"id": "US-104", "title": "rt change-signature: native MCP handler with explicit input schema", "description": "As an MCP caller, I want change_signature to expose a real input schema with required fields so the LLM knows what to pass. Today the auto-bridge produces an empty {\"type\":\"object\"} inputSchema, leaving the tool effectively unusable through the MCP.", "acceptanceCriteria": ["src/RoslynTools.Mcp/Handlers/ChangeSignatureHandler.cs exists, implements IMcpHandler, ToolName = \"change_signature\"", "Definition.inputSchema declares required fields explicitly (no empty {\"type\":\"object\"} like the current auto-bridge produces) and covers every flag the CLI exposes (e.g. symbol, new-signature, kind, solution)", "HandleAsync calls the existing Core ChangeSignatureService (or equivalent) directly and returns structured JSON; if it mutates, dry-run defaults to true per US-097", "Registered in src/RoslynTools.Mcp/McpServiceRegistration.AddMcpServices as services.AddSingleton<IMcpHandler, ChangeSignatureHandler>()", "tests/RoslynTools.Tests.Mcp/Handlers/ChangeSignatureHandlerTests.cs parses returned JSON (no string.Contains) and asserts at least: happy path field shape, missing-required-field error path", "tools/list snapshot test (US-094) refreshed to include the new schema once US-094 lands", "Run the Per-Command Consistency Checklist (docs/per-command-checklist.md) for change-signature before merge", "Pattern reference: commit 6d767b1 (feat(mcp): wire find_refs and rename as native MCP handlers). Canonical files: FindReferencesHandler.cs, RenameSymbolHandler.cs, OutlineHandler.cs.", "dotnet build RoslynTools.slnx clean; dotnet format --verify-no-changes clean; existing tests pass; new handler tests added"], "priority": 105, "passes": false, "notes": "P2. EP-012 schema bug. Native handler is the preferred fix (eliminates bridge ambiguity), per the same pattern as 6d767b1.", "epicId": "EP-012"}, {"id": "US-105", "title": "rt move: declare required MCP input fields (native handler preferred)", "description": "As an MCP caller, I want `move` to fail at the schema layer when neither --type nor --namespace is provided, instead of dispatching into the command and erroring there. Today the MCP schema has properties but an empty required array.", "acceptanceCriteria": ["MCP `move` tool no longer reports zero required fields; the schema declares the actually-required inputs the CLI enforces (either type + to-namespace OR namespace + to-namespace) so invoking the tool with neither fails at the schema layer, not inside the command body", "Preferred: src/RoslynTools.Mcp/Handlers/MoveHandler.cs exists and implements IMcpHandler with ToolName = \"move\". Acceptable alternative: fix the auto-bridge so it derives the right `required` array from the System.CommandLine option metadata (must apply to all bridged commands, not just move)", "If native: HandleAsync calls the existing MoveService Core service and returns structured JSON {moved: [{from, to}], changedFiles: int, changedFilePaths: [string], applied: bool}", "If native: dry-run defaults to true per US-097", "tests/RoslynTools.Tests.Mcp/Handlers/MoveHandlerTests.cs (or the bridge equivalent test) covers: happy path single-type move, happy path namespace move, missing-both-type-and-namespace error, --solution auto-detect path", "tools/list snapshot test (US-094) refreshed to include the new schema once US-094 lands", "Run the Per-Command Consistency Checklist (docs/per-command-checklist.md) for move before merge", "Pattern reference: commit 6d767b1 (feat(mcp): wire find_refs and rename as native MCP handlers). Canonical files: FindReferencesHandler.cs, RenameSymbolHandler.cs, OutlineHandler.cs.", "dotnet build RoslynTools.slnx clean; dotnet format --verify-no-changes clean; existing tests pass; new handler tests added"], "priority": 106, "passes": false, "notes": "P2. EP-012 schema bug. Native handler preferred; bridge fix is acceptable only if it generalises to all auto-bridged commands. dry-run defaults to true per US-097.", "epicId": "EP-012"}, {"id": "US-106", "title": "Align native MCP suggest naming with CLI rt suggest", "description": "As an MCP caller, I expect `mcp__rt-mcp__suggest` to mirror `rt suggest` from the CLI. Today the native handler is registered as `suggest_command` because the CLI meta-command `rt suggest` is filtered out of the auto-bridge — the two name systems diverged and force users to learn both vocabularies.", "acceptanceCriteria": ["Native MCP tool is reachable under the same name as the CLI command: `mcp__rt-mcp__suggest` exists in tools/list and returns the SuggestService response", "SuggestHandler.ToolName changed from \"suggest_command\" to \"suggest\" (preferred), OR both names route to the same handler and one is marked deprecated in the description", "Existing tests under tests/RoslynTools.Tests.Mcp/Handlers/SuggestHandler*.cs reference the new ToolName and continue to pass", "tools/list snapshot test (US-094) refreshed to reflect the new tool name once US-094 lands", "docs/pattern-core-service.md or docs/per-command-checklist.md notes the convention: native MCP ToolName mirrors the CLI command name (hyphens → underscores) so callers don't have to learn a second vocabulary", "Manual handshake check: piping initialize + tools/list to the rebuilt RoslynTools.Mcp.exe shows a `suggest` entry with the SuggestRequest schema (query required, top optional)", "Pattern reference: commit 6d767b1 (feat(mcp): wire find_refs and rename as native MCP handlers). Canonical files: FindReferencesHandler.cs, RenameSymbolHandler.cs, OutlineHandler.cs.", "dotnet build RoslynTools.slnx clean; dotnet format --verify-no-changes clean"], "priority": 107, "passes": false, "notes": "P3. EP-012 naming consistency. Preferred resolution: rename native ToolName to 'suggest'. Acceptable: dual-name with a deprecation note. Sequencing: best landed alongside US-087 (rt suggest BM25 command) so the CLI and MCP names settle together.", "epicId": "EP-012"}, {"id": "US-107", "title": "Category + capability interfaces to enforce command consistency at the type system", "description": "As a maintainer, I want IInspectCommand/IAnalyzeCommand/IRefactorCommand marker interfaces plus capability interfaces (IMutatingCommand, IStructuredOutputCommand, IBatchMutationCommand, INativeMcpExposable) so the compiler and architecture tests enforce category-specific contracts (mutates, JSON output, dry-run, MCP exposure), replacing several rows of the per-command checklist with mechanical checks.", "acceptanceCriteria": ["src/RoslynTools/Core/ defines three marker category interfaces inheriting from IRtCommand: IInspectCommand, IAnalyzeCommand, IRefactorCommand. They are empty subinterfaces — no member additions — so existing commands implement them by declaration only.", "Every concrete *Command class in src/RoslynTools/Commands/ implements exactly one of the three category interfaces. Picking zero or more than one is a compile error or an architecture-test failure.", "Capability interfaces also defined in src/RoslynTools/Core/: IMutatingCommand (commands that produce file changes; must expose a dry-run option and emit a diff or change summary), IStructuredOutputCommand (commands that emit JSON; consolidates with the US-100 IStructuredOutputCommand if that lands first), IBatchMutationCommand (commands that use the BatchMutationRunner/FixId pipeline; ties into US-092), INativeMcpExposable (commands that should have a corresponding native IMcpHandler; ties into US-094).", "Architecture test (under tests/RoslynTools.Tests/Architecture/) asserts: every IInspectCommand has Info.Category == \"inspect\", Info.Mutates == false, Info.JsonOutput == true", "Architecture test asserts: every IAnalyzeCommand has Info.Category == \"analyze\", Info.Mutates == false, Info.JsonOutput == true", "Architecture test asserts: every IRefactorCommand has Info.Category == \"refactor\", Info.Mutates == true, implements IMutatingCommand, and its Build() registers a --dry-run option (detected by inspecting the System.CommandLine surface)", "Architecture test asserts: every IInspectCommand and IAnalyzeCommand also implements INativeMcpExposable AND has a registered IMcpHandler with matching ToolName (replaces the bespoke ratchet from US-094 if US-094 hasn't landed yet, or extends it if it has)", "Awkward outliers are handled explicitly, not by relaxing the rules: debug (analyze category but operates on a JSONL trace, not the solution) gets an explicit ITraceAnalyzeCommand subinterface OR a documented [DoesNotRequireSolution] marker so the solution-scoped checks skip it", "docs/per-command-checklist.md updated: every checklist row that is now compiler- or test-enforced is annotated with \"(enforced)\" and dropped from the manual checklist. The remaining manual items are the genuinely-human ones (Examples freshness, SeeAlso correctness, behaviour-vs-Mutates accuracy).", "All 52 existing commands compile and pass after the interfaces are introduced (no behaviour change; pure type-system + ratchet)", "dotnet build RoslynTools.slnx clean; dotnet format --verify-no-changes clean; existing tests pass; new architecture tests green", "Pattern reference: commit 6d767b1 (feat(mcp): wire find_refs and rename as native MCP handlers) for the native-handler conventions the INativeMcpExposable rule encodes"], "priority": 108, "passes": false, "notes": "P2. EP-009 consistency enabler. Shrinks docs/per-command-checklist.md to the genuinely-human items. Composes with: US-094 (MCP ratchet — INativeMcpExposable encodes this), US-100 (IStructuredOutputCommand — consolidate), US-092 (BatchMutationRunner — IBatchMutationCommand marks adopters), US-097 (refactor MCP shape — IRefactorCommand + IMutatingCommand contract owns this). Awkward commands (debug, outline) get explicit carve-out subinterfaces or markers — do NOT relax the universal rules to fit them.", "epicId": "EP-009"}, {"id": "US-108", "title": "Delete redundant RtCommandInfo.Category and Info.Mutates after category interfaces land", "description": "As a maintainer, I want a single source of truth for a command's category and mutation behaviour: the interface it implements. Today Info.Category and Info.Mutates duplicate that signal and will drift after US-107 introduces category and capability interfaces.", "acceptanceCriteria": ["RtCommandInfo no longer carries a string Category field. The category is determined exclusively by which marker interface (IInspectCommand/IAnalyzeCommand/IRefactorCommand) the command implements.", "RtCommandInfo no longer carries a bool Mutates field. Whether a command mutates is determined exclusively by whether it implements IMutatingCommand (or by being an IRefactorCommand — pick one canonical rule and document it).", "All callers that previously read Info.Category — including DumpHelpCommand, App.RunAsync startup check, ToolSchemaBuilder, and rt suggest scoring — now read the category from the interface via a single helper (e.g. CategoryOf(IRtCommand) returning a `Category` enum)", "All callers that previously read Info.Mutates — including ToolSchemaBuilder, DumpHelpCommand, the MCP auto-bridge — now read it from the interface check", "If Info.Category / Info.Mutates can not be cleanly deleted in one pass (e.g. external scripts depend on the dump-help JSON shape), they are kept as read-only computed properties derived from the interface and the derivation is the single source of truth — no setter, no constructor parameter", "Architecture test asserts no command supplies a Category or Mutates value in its RtCommandInfo constructor (compile-time enforcement preferred via property removal)", "docs/COMMANDS.md regenerates with the same category labels and Mutates indicators as before this change (no consumer-visible regression)", "docs/per-command-checklist.md updated: the rows for Info.Category and Info.Mutates accuracy are dropped (now mechanical)", "Depends on US-107. Cannot land before US-107 because the interfaces it references must exist first.", "dotnet build RoslynTools.slnx clean; dotnet format --verify-no-changes clean; existing tests pass"], "priority": 109, "passes": false, "notes": "P2. EP-009 follow-up. Depends on US-107 (interfaces must exist first). Strict deletion preferred; derived read-only property is the acceptable fallback if external consumers rely on the dump-help JSON shape.", "epicId": "EP-009"}, {"id": "US-109", "title": "Extend shared output-format pipeline to every command (JSON/YAML/text for mutating commands too)", "description": "As an automation consumer, I want every rt command — including refactor/mutating commands — to support a consistent --format flag (json, yaml, text) routed through the same RtResultRenderer, so I can pipe any command's result through the same parser. Today refactor commands print free-form plain text; only inspect/analyze commands flow through the structured renderer.", "acceptanceCriteria": ["Every command — including refactor/mutating commands — supports a consistent --format flag with values json, yaml, text (and any other formats the renderer already supports such as markdown). The flag lives at the global level, not per-command.", "Mutating commands (IRefactorCommand / IMutatingCommand) now expose a structured result type implementing IRtOutput, so their output flows through the same RtResultRenderer that inspect/analyze commands use", "Examples of mutating-command JSON output that now exists: rt refactor rename in JSON mode returns { symbol, newName, changedFiles, changedFilePaths[], applied, dryRun } — the same shape the native MCP RenameHandler returns today (see commit 6d767b1)", "IStructuredOutputCommand is no longer restricted to JSON-output read commands. Every IRtCommand whose result has a meaningful structured shape implements it. The biconditional with Info.JsonOutput from US-100 either becomes a biconditional with the interface alone, or is deleted once Info.JsonOutput is removed", "Default format per category stays as today: inspect/analyze defaults to json (read-only commands are JSON-by-default); refactor defaults to text (mutating commands print diffs / 'wrote N files'); --format json overrides per the user's request", "MCP host always serves the JSON form regardless of CLI --format (MCP is a structured protocol); the CLI --format flag is purely a terminal-rendering choice", "Architecture test asserts: every command produces output via RtResultRenderer (no direct Console.WriteLine for results — diagnostics to stderr is fine); every IStructuredOutputCommand has a non-null result type", "docs/per-command-checklist.md universal-checklist row 'Diagnostics → stderr; results → stdout' tightens to 'Results flow through RtResultRenderer'", "Depends on US-100 (renderer consolidation), US-107 (interfaces). Composes with US-097 (mutating-MCP shape) — mutating commands' JSON shape becomes the native MCP handler's response shape", "dotnet build RoslynTools.slnx clean; dotnet format --verify-no-changes clean; existing tests pass; mutating commands now have JSON-mode tests"], "priority": 110, "passes": false, "notes": "P2. EP-009 extension of US-100. Composes with US-097 (mutating-MCP shape) and EP-012: the mutating-command JSON shape becomes the native MCP handler response shape. Depends on US-100 (renderer consolidation) and US-107 (interfaces).", "epicId": "EP-009"}, {"id": "US-110", "title": "Modernise MCP result shape: structuredContent, outputSchema, typed content array", "description": "As an MCP client (LLM agent), I want native handler responses to follow current MCP best practices — typed content[] array, structuredContent for typed responses, outputSchema declared in tools/list — so I can validate response shape, avoid double-JSON-parsing, and rely on the protocol's typed result contract. Today ToolResult flattens the entire JSON response into a single content string.", "acceptanceCriteria": ["Audit the current MCP wire format produced by Server.HandleCallToolAsync against the MCP CallToolResult schema. Document any divergence (e.g. content returned as a single string vs. as a content[] array of typed items).", "Server returns CallToolResult with a typed content array: {content: [{type: \"text\", text: \"...\"}], isError: bool}. Today our ToolResult(bool isError, string content) flattens the structured result into a single text item — if that is already happening server-side, document it; if not, fix it", "Evaluate upgrading the MCP protocolVersion declared in HandleInitialize (currently \"2024-11-05\") to a revision that supports structuredContent and outputSchema (e.g. \"2025-06-18\" or later). Decision recorded in docs/pattern-core-service.md.", "If upgrading: tools/list entries declare outputSchema alongside inputSchema for every native IMcpHandler. The outputSchema describes the response shape so callers can validate and type-check.", "If upgrading: tools/call responses include structuredContent (the typed object) alongside a text fallback in content[] for legacy clients. The native handler stops serialising to JSON-string and instead returns the typed object directly through a new ToolResult shape (e.g. ToolResult.Structured(object) / ToolResult.Error(string)).", "If NOT upgrading (decision documented): at minimum verify the existing 2024-11-05 wire format is correct — content[] array of typed items, isError flag, error responses use isError=true not JSON-RPC error.", "Every native handler (Outline, Suggest, FindRefs, Rename, plus the EP-012 backlog) emits the modernised result shape. Tests under tests/RoslynTools.Tests.Mcp/ assert the wire format against the schema.", "MCP best-practice checklist added as a section of docs/pattern-core-service.md or docs/per-command-checklist.md: ToolName naming convention, required-field declaration, structuredContent + outputSchema usage, error vs success conventions, content[] vs structuredContent guidance, when to set isError=true", "Pattern reference: commit 6d767b1 (feat(mcp): wire find_refs and rename as native MCP handlers). The new ToolResult shape and any protocol-version uplift propagates to those handlers and to OutlineHandler / SuggestHandler.", "Composes with US-094 (the MCP-handler ratchet test should also assert outputSchema is declared for every native handler if the protocol-version uplift lands)", "dotnet build RoslynTools.slnx clean; dotnet format --verify-no-changes clean; existing MCP tests pass with the new wire format; manual handshake against the rebuilt RoslynTools.Mcp.exe shows the upgraded schema"], "priority": 111, "passes": false, "notes": "P2. EP-012 protocol modernisation. Audit current wire format first, then decide whether to upgrade protocolVersion from 2024-11-05 to a revision that supports structuredContent/outputSchema (2025-06-18 or later). Pattern reference: commit 6d767b1.", "epicId": "EP-012"}, {"id": "US-025", "title": "fix formatting violations: CRLF and encoding errors in 4 files", "description": "As a contributor, I want all source files to pass dotnet format so that CI and editor tooling agree on line endings and encoding.", "acceptanceCriteria": ["dotnet format RoslynTools.slnx --verify-no-changes exits 0", "TransformParametersService.cs uses LF line endings", "ControlFlowUnwinder.cs, ConsumerNarrowerService.cs, InterfaceAnalyzerService.cs use project-standard encoding (no BOM)"], "priority": 25, "passes": true, "notes": "P1. Run dotnet format RoslynTools.slnx to auto-fix. Affected: src/RoslynTools/Services/TransformParametersService.cs (CRLF lines 13-14), src/RoslynTools/Core/ControlFlowUnwinder.cs, src/RoslynTools/Services/ConsumerNarrowerService.cs, src/RoslynTools/Services/InterfaceAnalyzerService.cs (encoding).", "epicId": "EP-005"}, {"id": "US-037", "title": "rt: convert-static-class — interface generation", "description": "When --no-interface is not passed, generate an I<TypeName> interface file alongside the destated class, extracting all public/internal instance methods and properties. Interface only matters when consumers need to mock the dependency in tests. Discovered during US-027 df pass; command currently warns and skips.", "acceptanceCriteria": ["rt analyze solid --principle LSP --solution <sln> exits 0 and emits JSON to stdout", "Output has a top-level 'LSP' key with sub-arrays for 'ThrowingOverrides' and 'ContractNarrowings'", "Each ThrowingOverride item includes: TypeName, MemberName, ExceptionType, FilePath, Line", "Each ContractNarrowing item includes: TypeName, MemberName, BaseType, FilePath, Line", "Flags override methods whose body contains throw new NotImplementedException() or NotSupportedException()", "Flags explicit interface implementations that throw on every code path", "rt analyze solid --principle all includes LSP results"], "priority": 37, "passes": true, "notes": "P2. Enables mock-friendly DI patterns in roslyn-tools tests. Relates to US-027 df.", "epicId": ""}, {"id": "US-038", "title": "rt: convert-static-class — DI registration in Bootstrap.cs", "description": "When --no-di-registration is not passed, find a Bootstrap.RegisterServices method in the solution and add a services.Add<Lifetime><ITypeName, TypeName>() line. Discovered during US-027 df pass; command currently warns and skips.", "acceptanceCriteria": ["When --no-di-registration is not passed and a Bootstrap.RegisterServices method exists in the solution, a services.AddSingleton<ITypeName, TypeName>() line is added", "If --lifetime is scoped or transient, the correct Add method is used", "If no Bootstrap-style registration method is found, a warning is emitted and the step is skipped", "Running with --dry-run shows the Bootstrap.cs diff without writing it", "If --no-interface was also passed (no interface generated), registers the concrete type: services.AddSingleton<TypeName>()"], "priority": 38, "passes": true, "notes": "P2. Pairs with US-037 (interface gen). Relates to US-027 df.", "epicId": ""}, {"id": "US-039", "title": "rt: convert-static-class — fix field and ctor formatting in existing-constructor path", "description": "When a consumer class already has constructors, AddConstructorInjection inserts the new field without a trailing newline, causing it to merge with the existing first member on the same line. Similarly, AddConstructorParameter inserts parameters without comma spacing and prepends assignments without newlines before the closing brace. dotnet format corrects these cosmetically but they should be emitted correctly. Discovered during US-027 df dry-run.", "acceptanceCriteria": ["When a consumer class already has a constructor, the injected field is inserted on its own line (with correct indentation), not concatenated with the existing first member on the same line", "When AddConstructorParameter adds a parameter to an existing constructor, a space follows the preceding comma in the parameter list", "When AddConstructorParameter prepends an assignment to the constructor body, the assignment is on its own line before the closing brace", "All three fixes apply when multiple constructors are present in the consumer class", "Existing tests for add_dependencies_to_existing_instance_constructors remain green"], "priority": 39, "passes": true, "note }, {"id": "US-050", "title": "rt analyze find-magic-strings: structured JSON output", "description": "As an automation consumer, I want rt analyze find-magic-strings to emit a JSON array when --json is passed so repeated literals can be fed into automated extract-string-constant workflows.", "acceptanceCriteria": ["--json outputs a JSON array; each element has {value, count, occurrences: [{file, line}]}", "occurrences is sorted by file then line", "Without --json, plain-text output is unchanged", "No magic strings produces [] not blank", "RtCommandInfo.JsonOutput is set to true", "rt dump-help shows JSON output for find-magic-strings"], "priority": 50, "passes": true, "notes": "P2. Command: src/RoslynTools.Cli/Commands/FindMagicStringsCommand.cs. Set RtCommandInfo.JsonOutput=true.", "epicId": "EP-007"}, {"id": "US-051", "title": "rt analyze list-imports: structured JSON output", "description": "As an automation consumer, I want rt analyze list-imports to emit a JSON array per-file when --json is passed so import audits can be processed programmatically.", "acceptanceCriteria": ["--json outputs a JSON array; each element has {file, usings: [{namespace, isGlobal, isStatic}]}", "Without --json, plain-text output is unchanged", "File with no usings is omitted or represented as {file, usings: []}", "RtCommandInfo.JsonOutput is set to true", "rt dump-help shows JSON output for list-imports"], "priority": 51, "passes": true, "notes": "P2. Command: src/RoslynTools.Cli/Commands/ListImportsCommand.cs. Set RtCommandInfo.JsonOutput=true.", "epicId": "EP-007"}, {"id": "US-052", "title": "rt analyze list-smells: structured JSON output", "description": "As an automation consumer, I want rt analyze list-smells to emit a JSON array when --json is passed so code smell reports can feed automated refactor planning.", "acceptanceCriteria": ["--json outputs a JSON array; each element has {kind, description, fqn, file, line, severity}", "severity is one of: warning, info", "Without --json otes": "P2. Existing foundation (instance-API WorkspaceLoader, DI registration, AsyncLocal Override, passing NoStaticWorkspaceLoaderUse gate) reduces remaining work from a full re-architecture to an interface-extraction + type-reference migration. Real blast radius: 57 production call sites (45 LoadWorkspaceAsync + 12 GetSolutionAsync) and 27 test files. From issue rt-006.", "epicId": "EP-008"}, {"id": "US-054", "title": "Migrate direct SolutionWriter call sites to ISolutionChangeWriter (rt-007)", "description": "As a developer, I want all production code that mutates a solution to depend on ISolutionChangeWriter instead of calling the static SolutionWriter.ApplyChangesAsync directly, so that mutation tests can stub the writer and daemon caching doesn't fight per-call workspace ownership. Bundled with US-053 so the related command churn ships once.", "acceptanceCriteria": ["ISolutionChangeWriter interface (already defined in src/RoslynTools/Services/SolutionChangeWriter.cs with Task ApplyChangesAsync(Solution, Solution, bool dryRun)) is the sole production path to SolutionWriter — the existing name is kept; renaming to ISolutionApplier is out of scope", "5 direct SolutionWriter.ApplyChangesAsync call sites migrated to ISolutionChangeWriter via DI: src/RoslynTools/Core/ConsoleLoggingCore.cs:76, src/RoslynTools.Cli/CommandHandlers/ChangeSignatureCommandHandlers.cs (lines 32, 62, 94, 126), src/RoslynTools.Cli/Commands/ConvertConsoleLoggingCommand.cs:194, src/RoslynTools.Cli/Commands/ExtractMethodCommand.cs:112", "New architecture gate NoDirectSolutionWriterUse added under tests/RoslynTools.Tests/Architecture/, mirroring NoStaticWorkspaceLoaderUse, banning direct SolutionWriter.ApplyChangesAsync calls from src/ outside the SolutionChangeWriter adapter", "AsyncLocal Override pattern added to ISolutionChangeWriter so mutation tests can capture writes without disk I/O (matches WorkspaceLoader.UseOverride ergonomics)", "rt inspect find-refs --symbol SolutionWriter --solution RoslynTools.slnx shows only the SolutionChangeWriter adapter and SolutionWriter's own type-declaration locations after the change", "All existing tests pass", "Implemented in the same PR as US-053"], "priority": 54, "passes": true, "notes": "P2. ISolutionChangeWriter + SolutionChangeWriter adapter already exist (src/RoslynTools/Services/SolutionChangeWriter.cs) and are DI-registered. Real blast radius: 5 direct call sites (much smaller than the original '22 fan-in' estimate, because the adapter already siphons most callers). From issue rt-007.", "epicId": "EP-008"}, {"id": "US-058", "title": "Standardize common CLI options through option factories", "description": "As an rt maintainer, I want common options to be created by shared factories so aliases, descriptions, defaults, and required flags do not drift between commands.", "acceptanceCriteria": ["CommandOptionFactory exposes factories for solution, format/json, scope, top, symbol, type, dry-run, and verbose options", "Existing migrated commands use the shared factories instead of manually declaring equivalent options", "Factory-created options preserve current public CLI behavior unless explicitly documented", "Tests assert consistent aliases and descriptions for at least solution, format/json, scope, and top", "An architecture test flags manual declarations of common options in migrated command files"], "priority": 58, "passes": true, "notes": "P2. This should precede broad command migration to reduce repeated churn.", "epicId": "EP-009"}, {"id": "US-059", "title": "Add machine-readable command capabilities to RtCommandInfo", "description": "As an automation consumer, I want every command to declare its capabilities so agents can choose commands and output formats without scraping prose help.", "acceptanceCriteria": ["RtCommandInfo includes supported formats, scope support, top support, solution requirement, prompt support, and mutation flags", "All existing commands compile with explicit capability values", ports, rather than blocks, feature work.", "epicId": "EP-009"}, {"id": "US-064", "title": "Add migration ratchets for command consistency", "description": "As an rt maintainer, I want architecture tests to enforce only migrated command slices so consistency improves without forcing unsafe all-at-once rewrites.", "acceptanceCriteria": ["A migrated-command allowlist or marker exists for each enforced convention", "Architecture tests fail when a marked command regresses from the wrapper, option factory, result contract, or metadata conventions", "Tests report actionable command names and violated rules", "Adding a command to the migrated set requires no test code duplication", "The ratchet strategy is documented in the migration playbook"], "priority": 64, "passes": true, "notes": "P2. This formalizes the dogfooding approach used during the command output migration.", "epicId": "EP-009"}, {"id": "US-065", "title": "Make dump-help metadata-driven and consistency-tested", "description": "As an automation consumer, I want rt dump-help to reflect command metadata and options consistently so it can be trusted as the command contract.", "acceptanceCriteria": ["dump-help derives command categories, output formats, and capabilities from RtCommandInfo where available", "dump-help includes consistent option metadata for common option factories", "Tests verify every registered command appears in dump-help", "Tests verify commands declaring JSON or structured formats expose matching options", "Human-readable help remains concise and does not duplicate stale hand-written metadata"], "priority": 65, "passes": true, "notes": "P2. This turns command metadata into a visible contract for agents.", "epicId": "EP-009"}, {"id": "US-066", "title": "Create a command migration playbook", "description": "As an rt contributor, I want a concise migration playbook so future command refactors follow the same sequence and know which architecture ratchets to update.", "acceptanceCriteria": ["A playbook documents the recommended order: result contract, option factories, handler wrapper, capabilities, symbol query, and ratchet update", "The playbook includes a before/after checklist for one migrated command", "The playbook explains when to use feedback for missing rt affordances", "The playbook lists verification commands including architecture tests and targeted command tests", "The playbook is linked from the relevant backlog epic or developer docs"], "priority": 66, "passes": true, "notes": "P3. Keep this short and operational; it should support ongoing dogfooding rather than becoming a design document.", "epicId": "EP-009"}, {"id": "RT-001", "title": "rt dump-help --json: emit machine-readable command catalog", "description": "As an LLM agent, I want `rt dump-help --json` to emit the full RtCommandInfo catalog as structured JSON so I can ingest the command surface programmatically instead of parsing prose.", "acceptanceCriteria": ["`rt dump-help --json` exits 0 and writes valid JSON to stdout.", "The JSON document includes every command discovered by the reflection-based registry — the command count equals what plain `rt dump-help` reports.", "Each command entry includes Name, Category, Mutates, JsonOutput, Aliases, WhenToUse, Examples, KnownIssues, and SupportedFormats from RtCommandInfo. Missing or null fields are represented explicitly (no silent drops).", "The plain `rt dump-help` (no flag) text output is byte-identical to today's — JSON is purely additive.", "An LLM can parse the JSON output and reconstruct the command surface without reading any source file or markdown.", "If `--strict-json` is passed alongside, the output is RFC 8259 compliant (non-ASCII escaped as \\uXXXX)."], "priority": 69, "passes": true, "notes": "P2. Deferred from LLM-ergonomics quick-wins plan. The RtCommandInfo record and reflection-discovered registry in App.cs already expose every field — wiring it through JsonRenderer should be near-free. Affected files: src/RoslynTools.Cli/Commands/DumpHelpCommand.cs, src/RoslynTools/Core/RtCommandInfo.cs.", "epicId": ""}, {"id": "RT-004", "title": "Finish stderr discipline migration: Console.Write to RtLog/RtConsole", "description": "As an LLM agent piping stdout to a parser and stderr to logs, I want every rt command to honour the stdout=results, stderr=diagnostics contract so I can rely on stream separation without per-command quirks.", "acceptanceCriteria": ["No remaining `Console.Write*` calls exist in src/RoslynTools/Commands/ or src/RoslynTools.Cli/Commands/ (verified by grep, gated in CI or a unit test).", "All progress and diagnostic messages from command handlers route through RtLog.* (stderr).", "All primary command results route through RtConsole.Write (stdout).", "Existing tests pass without modification (output contracts preserved).", "docs/logging-standards.md is updated to remove the \"migration incomplete\" notice and document the now-enforced convention.", "An LLM piping stdout to a JSON parser and stderr to logs gets clean separation across every command."], "priority": 72, "passes": true, "notes": "P2. Deferred from LLM-ergonomics quick-wins plan. docs/logging-standards.md acknowledges the migration is in progress; several commands still call Console.Write directly. Maintenance work — does not change LLM behaviour at runtime today, but eliminates a future regression vector.", "epicId": ""}, {"id": "US-069", "title": "Bring src/RoslynTools.Cli/ into Stryker mutation pilot", "description": "src/RoslynTools.Cli/Commands/MakeSealedCommand.cs, DebugCommand.cs, and Results/DebugResult.cs are matched by stryker-config.json mutate globs but silently skipped by Stryker because the configured project is src/RoslynTools/RoslynTools.csproj (core library only). The pre-commit gate fires the glob-coverage check but Stryker never mutates Cli-project code, so the contract is paper-only.", "acceptanceCriteria": ["stryker-config.json `project` is extended (or a second config introduced) so that files under `src/RoslynTools.Cli/` actually get mutated when matched by mutate globs", "Existing globs `**/Commands/MakeSealedCommand.cs`, `**/Commands/DebugCommand.cs`, `**/Commands/Results/DebugResult.cs` produce non-zero mutant counts in the Stryker report (currently zero — silently skipped)", "Each of those files reaches 100% mutation score (kill, delete, or mark equivalent per CLAUDE.md)", "Pre-commit gate continues to block on staged Cli production files that aren't covered"], "priority": 73, "passes": true, "notes": "Discovered 2026-05-20 while landing the Debug 100% mutation work. Existing Cli files in mutate globs were authored under the assumption that Stryker would cover them.", "epicId": ""}, {"id": "US-070", "title": "Bring src/RoslynTools.Mcp/ into Stryker mutation pilot", "description": "src/RoslynTools.Mcp/ is a separate csproj from the core library and the existing Cli. stryker-config.json's project field points at the core library, so Mcp files are never matched by the Stryker run even when added to mutate globs. The pre-commit gate currently has no useful path other than RT_MUTATION_ALLOW_UNSCOPED=1 when any Mcp file is staged.", "acceptanceCriteria": ["src/RoslynTools.Mcp/RoslynTools.Mcp.csproj has a matching Stryker config or is included in the existing one such that its production files participate in mutation testing", "src/RoslynTools.Mcp/Tools/CliCommandBridge.cs and ToolSchemaBuilder.cs reach 100% mutation score (kill, delete, or mark equivalent)", "Pre-commit gate runs Stryker against Mcp files when staged — RT_MUTATION_ALLOW_UNSCOPED=1 is no longer needed for Mcp commits", "tests/RoslynTools.Tests.Mcp/ is used as the Stryker test-projects entry (already present)"], "priority": 74, "passes": true, "notes": "Discovered 2026-05-20: committed df9e43a (MCP array pass-through) used the bypass for this reason. Likely solved together with the Cli pilot story (US-069) by switching to a multi-project or per-project Stryker setup.", "epicId": ""}, {"id": "US-072", "title": "Eliminate RtServiceProvider.Get<T> service locator in favour of ctor injection", "description": "As a roslyn-tools developer, I want commands to depend on services via constructor injection so the ambient service-locator anti-pattern (RtServiceProvider.Get<T>()) disappears and command dependencies become explicit and testable.", "acceptanceCriteria": ["IRtCommand contract revised to support instance classes — each command class is constructed by the DI container with required services injected via the constructor; the static Build() pattern is replaced with an instance Build() that closes over the injected services", "App.Discover (or its replacement) resolves each command via the service provider rather than calling a static factory", "All ~50 commands under src/RoslynTools.Cli/Commands/ (and src/RoslynTools.Cli/CommandHandlers/) refactored to declare their service dependencies as constructor parameters and reference them via private readonly fields", "All 64 RtServiceProvider.Get<T>() and RtServiceProvider.GetOrDefault<T>(…) call sites removed from src/", "RtServiceProvider class deleted (or kept only if it has remaining non-Get callers, e.g. the AsyncLocal Use scope; document the remaining surface in that case)", "New architecture gate NoRtServiceProviderInProduction added under tests/RoslynTools.Tests/Architecture/, mirroring NoConcreteWorkspaceLoaderInProduction; flags any production reference to RtServiceProvider.Get or .GetOrDefault outside the class declaration itself", "rt dump-help startup succeeds, every command listed, every Info.Examples invocation still works end-to-end (dogfood smoke matrix)", "All existing tests pass; mutation tests that previously relied on WorkspaceLoader.UseOverride continue to pass via the same AsyncLocal hook", "dotnet build, dotnet format --verify-no-changes, and the full test suite all clean"], "priority": 76, "passes": true, "notes": "P2. Follow-on from EP-008 (US-053/US-054). Scope: 64 RtServiceProvider.Get/GetOrDefault call sites across 46 files. Approach approved 2026-05-21: convert IRtCommand from static Build() factory to instance class so DI can ctor-inject services. App.Discover resolves each command via the service provider. RtServiceProvider class deleted (or shrunk to just the AsyncLocal Use scope if needed). New NoRtServiceProviderInProduction architecture gate mirrors NoConcreteWorkspaceLoaderInProduction. Trunk-based delivery.", "epicId": "EP-008"}], "sourceUrl": "backlog-prd.json"}];
    window.__PRD_LINKED_DOCS__ = {"C:\\code\\roslyn-tools\\ralph\\backlog-prd.json": {"US-056": [{"path": "ralph/sessions/2026-05-04-daemon-protocol.md", "content": "# Session: 2026-05-04 — Daemon Protocol\n\n**Goal:** Design the rt daemon: workspace caching, git-state invalidation, and composable pipe chains.\n**Solution:** RoslynTools.slnx\n\n---\n\n## Design constraints established before simulation\n\n1. **Single global daemon.** Exactly one `rt` daemon process at a time, machine-wide. Not per-solution.\n2. **Cache key:** `solutionPath + gitHeadSha + (dirty ? gitIndexMtime : \"clean\")`. Sent by client on every request; daemon reloads if any field mismatches (including solution path change).\n3. **Git is the invalidation oracle.** No file watcher. Works because `.rt-solution` is checked in — its changes appear in git state automatically.\n4. **State lives in `~/.rt/`** — single `daemon.json`, no per-solution subdirectories, no repo pollution.\n5. **Transport: named pipe** (`\\\\.\\pipe\\rt-daemon` on Windows, fixed name). One pipe, one daemon.\n6. **Protocol: newline-delimited JSON** (request → streaming responses → exit).\n7. **Auto-start:** if no daemon is running when `rt` is invoked, start one in background and wait for it to signal ready. Transparent to the user.\n8. **Opt-out:** `RT_NO_DAEMON=1` or `rt --no-daemon` falls back to in-process (current behaviour).\n\n---\n\n## Wire format\n\n### Client → Daemon (one JSON line per request)\n\n```json\n{\n  \"requestId\": \"a1b2c3d4\",\n  \"args\": [\"inspect\", \"find-refs\", \"--symbol\", \"WorkspaceLoader\", \"--solution\", \"RoslynTools.slnx\"],\n  \"gitState\": {\n    \"head\": \"8f44e7f3a\",\n    \"dirty\": false,\n    \"indexMtime\": null\n  },\n  \"stdin\": null\n}\n```\n\n`stdin` is base64-encoded bytes when the client is itself receiving piped input (enables `rt find-refs Foo | rt rename Bar` chains through the daemon).\n\n### Daemon → Client (streaming, newline-delimited)\n\n```json\n{ \"requestId\": \"a1b2c3d4\", \"type\": \"stderr\", \"data\": \"Finding references to 'RoslynTools.Core.WorkspaceLoader'...\\n\" }\n{ \"requestId\": \"a1b2c3d4\", \"type\": \"stdout\", \"data\": \"{\\\"symbol\\\":\\\"RoslynTools.Core.WorkspaceLoader\\\",\\\"references\\\":[...]}\\n\" }\n{ \"requestId\": \"a1b2c3d4\", \"type\": \"exit\", \"code\": 0 }\n```\n\nTypes: `stderr` | `stdout` | `exit`. Client forwards stderr → its own stderr, stdout → its own stdout, then exits with `code`.\n\n### Daemon state file: `~/.rt/daemon.json`\n\n```json\n{\n  \"pid\": 18432,\n  \"pipeName\": \"rt-daemon\",\n  \"solution\": \"C:/code/roslyn-tools/RoslynTools.slnx\",\n  \"cachedHead\": \"8f44e7f3a\",\n  \"cachedDirty\": false,\n  \"cachedIndexMtime\": null,\n  \"startedAt\": \"2026-05-04T09:45:00Z\",\n  \"rtVersion\": \"0.9.0\"\n}\n```\n\n---\n\n## Step 1 — rt daemon start [SIMULATED]\n\n```\nrt daemon start --solution RoslynTools.slnx\n```\n\n```\nStarting daemon for RoslynTools.slnx...\nLoading workspace (first load may take a few seconds)...\n  Loaded 3 projects, 0 diagnostics.\nDaemon ready. PID 18432, pipe: rt-a9f3c17b\nState written to C:\\Users\\DanMarshall\\.rt\\daemon.json\n```\n\nExit 0. Subsequent `rt` invocations in this directory will connect to this daemon transparently.\n\n---\n\n## Step 2 — rt daemon status [SIMULATED]\n\n```\nrt daemon status\n```\n\n```\nDaemon: RUNNING (PID 18432)\nSolution: C:\\code\\roslyn-tools\\RoslynTools.slnx\nCache:    HEAD=8f44e7f3a  dirty=false  (clean)\nUptime:   0h 2m 14s\nPipe:     \\\\.\\pipe\\rt-daemon\n```\n\nExit 0.\n\n---\n\n## Step 3 — rt inspect find-refs via daemon [REAL, but currently in-process]\n\n```\nrt inspect find-refs --symbol WorkspaceLoader --solution RoslynTools.slnx\n```\n\n**Current (in-process) timing:** ~3.8s (workspace load + query)\n\n**Expected via daemon (workspace already cached):**\n```\nFinding references to 'RoslynTools.Core.WorkspaceLoader'...\n```\n```json\n{\n  \"symbol\": \"RoslynTools.Core.WorkspaceLoader\",\n  \"fullyQualifiedName\": \"RoslynTools.Core.WorkspaceLoader\",\n  \"references\": [\n    { \"file\": \"src/RoslynTools.Cli/Program.cs\", \"line\": 1, \"column\": 5, \"snippet\": \"using RoslynTools.Core;\" },\n    { \"file\": \"src/RoslynTools.Cli/Bootstrap.cs\", \"line\": 12, \"column\": 9, \"snippet\": \"services.AddSingleton<WorkspaceLoader>();\" }\n  ],\n  \"count\": 2\n}\n```\n\n**Expected timing via daemon:** ~200ms (no workspace load, just query).\n\n---\n\n## Step 4 — pipe chain: find-refs → rename [SIMULATED]\n\n```\nrt inspect find-refs --symbol WorkspaceLoader --json | rt refactor rename --new-name SolutionLoader --dry-run\n```\n\nThe second command reads the symbol stream from stdin when stdin is not a TTY. It extracts the `fullyQualifiedName` field and uses it as the rename target — no `--symbol` arg needed.\n\n```\n[daemon] Renaming 'RoslynTools.Core.WorkspaceLoader' → 'SolutionLoader'...\n```\n```diff\n--- a/src/RoslynTools/Core/WorkspaceLoader.cs\n+++ b/src/RoslynTools/Core/WorkspaceLoader.cs\n@@ -8,7 +8,7 @@ namespace RoslynTools.Core;\n-internal sealed class WorkspaceLoader\n+internal sealed class SolutionLoader\n {\n--- a/src/RoslynTools.Cli/Program.cs\n+++ b/src/RoslynTools.Cli/Program.cs\n@@ -1,5 +1,5 @@\n-using RoslynTools.Core; // WorkspaceLoader\n+using RoslynTools.Core; // SolutionLoader\n```\n\n> **[ISSUE: rt-008]** written — `rename` command must accept symbol FQN from stdin JSON when piped; currently only accepts positional `<symbol>` argument.\n\n---\n\n## Step 5 — git commit invalidates cache [SIMULATED]\n\nUser commits a change. Next `rt` command sends new HEAD sha.\n\n```\nrt inspect find-refs --symbol WorkspaceLoader --solution RoslynTools.slnx\n```\n\nDaemon receives: `\"head\": \"c7e90a1f\"` (new) vs cached `\"head\": \"8f44e7f3a\"`.\n\n```\n[daemon] Git state changed (HEAD: 8f44e7f3a → c7e90a1f). Reloading workspace...\n  Loaded 3 projects, 0 diagnostics.\nFinding references to 'RoslynTools.Core.WorkspaceLoader'...\n```\n\nReload is ~3

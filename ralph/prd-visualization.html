<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PRD Visualization</title>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    :root, [data-theme="cream"] {
      --bg: #ece4d4;
      --panel: #fffdf7;
      --panel-2: #f8f1e6;
      --ink: #1d2433;
      --muted: #687387;
      --line: #d7cdbb;
      --accent: #0f766e;
      --accent-soft: #d8f0ec;
      --warn: #9a3412;
      --warn-soft: #ffedd5;
      --done: #166534;
      --done-soft: #dcfce7;
      --shadow: 0 20px 50px rgba(74, 59, 34, 0.12);
      --radius: 22px;
      --body-bg: radial-gradient(circle at top left, #fff8ea 0, transparent 28%), linear-gradient(180deg, #f3ecdf 0%, #e9dfcd 100%);
      --shell-bg: rgba(255, 253, 247, 0.7);
      --shell-border: rgba(215, 205, 187, 0.8);
      --card-bg: #ffffff;
      --card-bg-hover: #fffaf0;
      --card-bg-active: #fff6e8;
      --card-border-hover: #b9a88c;
      --card-border-active: #c89e58;
      --card-shadow-active: rgba(200, 158, 88, 0.22);
      --pill-bg: #f7efe2;
      --pill-priority-bg: #f8efe1;
      --pill-epic-bg: #e8ddf3;
      --pill-epic-fg: #5b3a8c;
      --pill-epic-border: #c9b6e0;
      --pill-pending-border: #f3c89d;
      --pill-complete-border: #b7e4c7;
      --epic-bar-bg: #fcf7ee;
      --acceptance-bg: #fcf7ee;
      --code-bg: #f1eadf;
      --summary-bg: linear-gradient(180deg, #fffdf7 0%, #faf4e8 100%);
      --sidebar-top-bg: linear-gradient(180deg, #fffdf7 0%, #faf4e8 100%);
      --mobile-panel-bg: linear-gradient(180deg, #fffdf7 0%, #faf4e8 100%);
      --mobile-summary-bg: #fffaf0;
      --mobile-panel-body-bg: #ffffff;
      --font-family: Georgia, "Times New Roman", serif;
      --resizer-color: rgba(215, 205, 187, 0.6);
      --resizer-color-hover: #c89e58;
    }
    [data-theme="dark"] {
      --bg: #0f1419;
      --panel: #1a2028;
      --panel-2: #232b36;
      --ink: #e6edf3;
      --muted: #8b949e;
      --line: #30363d;
      --accent: #58a6ff;
      --accent-soft: #1f2d43;
      --warn: #f0883e;
      --warn-soft: #3a220f;
      --done: #3fb950;
      --done-soft: #0f2e19;
      --shadow: 0 20px 50px rgba(0, 0, 0, 0.45);
      --radius: 22px;
      --body-bg: radial-gradient(circle at top left, #1a2430 0, transparent 30%), linear-gradient(180deg, #0d1117 0%, #161b22 100%);
      --shell-bg: rgba(26, 32, 40, 0.7);
      --shell-border: rgba(48, 54, 61, 0.8);
      --card-bg: #161b22;
      --card-bg-hover: #1c232c;
      --card-bg-active: #22303f;
      --card-border-hover: #444c56;
      --card-border-active: #58a6ff;
      --card-shadow-active: rgba(88, 166, 255, 0.22);
      --pill-bg: #22272e;
      --pill-priority-bg: #2a2e37;
      --pill-epic-bg: #2d2640;
      --pill-epic-fg: #c9a9ff;
      --pill-epic-border: #3d345a;
      --pill-pending-border: #3a220f;
      --pill-complete-border: #0f2e19;
      --epic-bar-bg: #161b22;
      --acceptance-bg: #161b22;
      --code-bg: #0d1117;
      --summary-bg: linear-gradient(180deg, #1a2028 0%, #141920 100%);
      --sidebar-top-bg: linear-gradient(180deg, #1a2028 0%, #141920 100%);
      --mobile-panel-bg: linear-gradient(180deg, #1a2028 0%, #141920 100%);
      --mobile-summary-bg: #1c232c;
      --mobile-panel-body-bg: #161b22;
      --font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --resizer-color: rgba(48, 54, 61, 0.8);
      --resizer-color-hover: #58a6ff;
    }
    [data-theme="paper"] {
      --bg: #f5f5f5;
      --panel: #ffffff;
      --panel-2: #fafafa;
      --ink: #111111;
      --muted: #666666;
      --line: #e0e0e0;
      --accent: #1a73e8;
      --accent-soft: #e8f0fe;
      --warn: #c5221f;
      --warn-soft: #fce8e6;
      --done: #137333;
      --done-soft: #e6f4ea;
      --shadow: 0 4px 14px rgba(0, 0, 0, 0.08);
      --radius: 10px;
      --body-bg: #f5f5f5;
      --shell-bg: #ffffff;
      --shell-border: #e0e0e0;
      --card-bg: #ffffff;
      --card-bg-hover: #f7f7f7;
      --card-bg-active: #e8f0fe;
      --card-border-hover: #bdbdbd;
      --card-border-active: #1a73e8;
      --card-shadow-active: rgba(26, 115, 232, 0.18);
      --pill-bg: #f0f0f0;
      --pill-priority-bg: #f0f0f0;
      --pill-epic-bg: #f3e8fd;
      --pill-epic-fg: #6b3fa0;
      --pill-epic-border: #d6c3ef;
      --pill-pending-border: #f9c7c5;
      --pill-complete-border: #b7e1c0;
      --epic-bar-bg: #fafafa;
      --acceptance-bg: #fafafa;
      --code-bg: #f0f0f0;
      --summary-bg: #ffffff;
      --sidebar-top-bg: #ffffff;
      --mobile-panel-bg: #ffffff;
      --mobile-summary-bg: #fafafa;
      --mobile-panel-body-bg: #ffffff;
      --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --resizer-color: #e0e0e0;
      --resizer-color-hover: #1a73e8;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; overflow: hidden; }
    body {
      margin: 0;
      color: var(--ink);
      background: var(--body-bg);
      font-family: var(--font-family);
    }
    #root { height: 100%; }
    .app {
      height: 100vh;
      margin: 0 auto;
      padding: 16px;
      max-width: none;
    }
    .shell {
      height: 100%;
      background: var(--shell-bg);
      border: 1px solid var(--shell-border);
      border-radius: 28px;
      padding: 18px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(10px);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .eyebrow {
      text-transform: uppercase;
      letter-spacing: 0.08em;
      font-size: 0.76rem;
      color: var(--muted);
      margin-bottom: 6px;
    }
    h1, h2, h3, h4, h5, p { margin: 0; }
    .subtitle {
      color: var(--muted);
      margin-top: 6px;
    }
    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      margin-bottom: 14px;
      flex-wrap: wrap;
    }
    .theme-picker {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 0.85rem;
      color: var(--muted);
      white-space: nowrap;
    }
    .theme-picker-label {
      text-transform: uppercase;
      letter-spacing: 0.08em;
      font-size: 0.72rem;
    }
    .theme-select {
      border: 1px solid var(--line);
      background: var(--card-bg);
      color: var(--ink);
      border-radius: 999px;
      padding: 6px 12px;
      font: inherit;
      cursor: pointer;
    }
    .project-tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }
    .project-tab {
      border: 1px solid var(--line);
      background: var(--card-bg);
      color: var(--ink);
      border-radius: 999px;
      padding: 10px 14px;
      cursor: pointer;
      font: inherit;
    }
    .project-tab.active {
      background: var(--accent);
      border-color: var(--accent);
      color: white;
    }
    .prd-picker {
      position: relative;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    .prd-picker-trigger {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      border: 1px solid var(--line);
      background: var(--card-bg);
      color: var(--ink);
      border-radius: 999px;
      padding: 8px 14px;
      cursor: pointer;
      font: inherit;
      max-width: 360px;
    }
    .prd-picker-trigger:hover {
      border-color: var(--card-border-hover);
      background: var(--card-bg-hover);
    }
    .prd-picker-trigger.open {
      border-color: var(--card-border-active);
      background: var(--card-bg-active);
    }
    .prd-picker-icon {
      width: 16px;
      height: 16px;
      flex: 0 0 auto;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .prd-picker-label {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-weight: 600;
    }
    .prd-picker-caret {
      color: var(--muted);
      font-size: 0.7rem;
      flex: 0 0 auto;
    }
    .prd-picker-menu {
      position: absolute;
      top: calc(100% + 8px);
      left: 0;
      width: min(640px, calc(100vw - 48px));
      max-height: 420px;
      overflow: auto;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: var(--panel);
      box-shadow: var(--shadow);
      padding: 10px;
      z-index: 30;
    }
    .prd-picker-toggle {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 10px 12px;
      border-bottom: 1px solid var(--line);
      margin-bottom: 10px;
      font-size: 0.84rem;
      color: var(--muted);
    }
    .prd-picker-toggle input {
      margin: 0;
    }
    .prd-option {
      display: block;
      width: 100%;
      border: 1px solid transparent;
      background: var(--card-bg);
      border-radius: 14px;
      padding: 12px 14px;
      color: var(--ink);
      font: inherit;
      text-align: left;
      cursor: pointer;
    }
    .prd-option + .prd-option {
      margin-top: 8px;
    }
    .prd-option:hover,
    .prd-option.active {
      border-color: var(--card-border-active);
      background: var(--card-bg-active);
    }
    .prd-option-top {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: center;
    }
    .prd-option-title {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-weight: 700;
    }
    .prd-option-subtitle {
      margin-top: 4px;
      color: var(--muted);
      font-size: 0.82rem;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .sync-status {
      padding: 0 6px 12px;
      font-size: 0.84rem;
      color: var(--muted);
    }
    .sync-status.error {
      color: var(--warn);
    }
    .main-grid {
      flex: 1 1 auto;
      display: grid;
      grid-template-columns: var(--col-1, 28%) 6px var(--col-2, 32%) 6px minmax(0, 1fr);
      gap: 0;
      min-height: 0;
    }
    .resizer {
      background: transparent;
      cursor: col-resize;
      position: relative;
      user-select: none;
      touch-action: none;
    }
    .resizer::before {
      content: "";
      position: absolute;
      top: 10%;
      bottom: 10%;
      left: 2px;
      right: 2px;
      background: var(--resizer-color);
      border-radius: 2px;
      transition: background 0.12s ease;
    }
    .resizer:hover::before,
    .resizer.dragging::before {
      background: var(--resizer-color-hover);
    }
    .sidebar, .summary-pane, .details {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--panel);
      overflow: hidden;
    }
    .sidebar {
      display: flex;
      flex-direction: column;
      min-width: 0;
      min-height: 0;
    }
    .sidebar-top {
      padding: 18px;
      border-bottom: 1px solid var(--line);
      background: var(--sidebar-top-bg);
    }
    .filters {
      display: grid;
      grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr) minmax(0, 1fr);
      gap: 10px;
    }
    .filter-select {
      width: 100%;
      border: 1px solid var(--line);
      background: var(--card-bg);
      border-radius: 14px;
      padding: 11px 13px;
      font: inherit;
      color: var(--ink);
    }
    .search {
      width: 100%;
      border: 1px solid var(--line);
      background: var(--card-bg);
      border-radius: 14px;
      padding: 11px 13px;
      font: inherit;
      color: var(--ink);
    }
    .search:focus {
      outline: 2px solid var(--accent-soft);
      border-color: var(--accent);
    }
    .story-list {
      flex: 1 1 auto;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 10px;
      display: grid;
      gap: 10px;
      min-height: 0;
      min-width: 0;
    }
    .story-row {
      border: 1px solid var(--line);
      background: var(--card-bg);
      border-radius: 16px;
      padding: 14px;
      cursor: pointer;
      text-align: left;
      font: inherit;
      color: inherit;
      display: grid;
      gap: 8px;
    }
    .story-row:hover {
      border-color: var(--card-border-hover);
      background: var(--card-bg-hover);
    }
    .story-row.active {
      background: var(--card-bg-active);
      border-color: var(--card-border-active);
      box-shadow: inset 0 0 0 1px var(--card-shadow-active);
    }
    .story-row-top {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: flex-start;
    }
    .story-id {
      font-size: 0.76rem;
      letter-spacing: 0.08em;
      color: var(--muted);
      text-transform: uppercase;
    }
    .story-title {
      font-size: 1rem;
      line-height: 1.25;
    }
    .story-desc-preview {
      color: var(--muted);
      font-size: 0.92rem;
      line-height: 1.35;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .pill-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .pill {
      border-radius: 999px;
      padding: 4px 10px;
      font-size: 0.78rem;
      border: 1px solid var(--line);
      white-space: nowrap;
      background: var(--pill-bg);
    }
    .pill.pending {
      background: var(--warn-soft);
      color: var(--warn);
      border-color: var(--pill-pending-border);
    }
    .pill.complete {
      background: var(--done-soft);
      color: var(--done);
      border-color: var(--pill-complete-border);
    }
    .pill.priority {
      background: var(--pill-priority-bg);
    }
    .pill.epic {
      background: var(--pill-epic-bg);
      color: var(--pill-epic-fg);
      border-color: var(--pill-epic-border);
    }
    .epic-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      padding: 10px 12px;
      border-bottom: 1px solid var(--line);
      background: var(--epic-bar-bg);
    }
    .epic-chip {
      background: var(--card-bg);
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 4px 10px;
      font-size: 0.78rem;
      color: var(--ink);
      font: inherit;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .epic-chip:hover {
      border-color: var(--card-border-hover);
      background: var(--card-bg-hover);
    }
    .epic-chip.active {
      background: var(--pill-epic-bg);
      border-color: var(--pill-epic-border);
      box-shadow: inset 0 0 0 1px var(--card-shadow-active);
    }
    .epic-chip .epic-id {
      color: var(--pill-epic-fg);
      font-weight: 600;
    }
    .epic-chip .epic-count {
      color: var(--muted);
    }
    .details {
      display: flex;
      flex-direction: column;
      min-width: 0;
      min-height: 0;
    }
    .summary-pane {
      display: flex;
      flex-direction: column;
      min-width: 0;
      min-height: 0;
    }
    .summary-inner {
      flex: 1 1 auto;
      padding: 22px;
      overflow-y: auto;
      overflow-x: hidden;
      min-height: 0;
      min-width: 0;
      background: var(--summary-bg);
    }
    .summary-title {
      font-size: 1.35rem;
      line-height: 1.25;
    }
    .summary-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 14px 0 18px;
    }
    .summary-preview {
      color: var(--muted);
      margin-top: 18px;
      font-size: 0.95rem;
      line-height: 1.45;
    }
    .details-inner {
      flex: 1 1 auto;
      padding: 28px;
      overflow-y: auto;
      overflow-x: hidden;
      min-height: 0;
      min-width: 0;
    }
    .details-top {
      display: flex;
      justify-content: space-between;
      gap: 18px;
      align-items: flex-start;
      margin-bottom: 18px;
    }
    .details-path {
      margin-top: 8px;
      color: var(--muted);
      word-break: break-word;
    }
    .section {
      margin-top: 24px;
      padding-top: 20px;
      border-top: 1px solid var(--line);
    }
    .section h4 {
      margin-bottom: 12px;
      font-size: 1rem;
    }
    .markdown {
      color: var(--ink);
      line-height: 1.55;
    }
    .markdown p {
      margin: 0 0 12px;
    }
    .markdown p:last-child {
      margin-bottom: 0;
    }
    .markdown ul, .markdown ol {
      margin: 0 0 12px 22px;
      padding: 0;
    }
    .markdown li + li {
      margin-top: 8px;
    }
    .markdown code {
      font-family: Consolas, "Courier New", monospace;
      background: var(--code-bg);
      padding: 1px 5px;
      border-radius: 6px;
      font-size: 0.92em;
    }
    .linked-docs {
      margin-top: 24px;
      padding-top: 20px;
      border-top: 1px solid var(--line);
      display: grid;
      gap: 18px;
    }
    .linked-doc-path {
      font-family: Consolas, "Courier New", monospace;
      font-size: 0.82rem;
      color: var(--muted);
      margin-bottom: 10px;
      word-break: break-all;
    }
    .spec-markdown {
      font-size: 0.95rem;
      line-height: 1.55;
      min-width: 0;
      overflow-wrap: break-word;
      word-break: break-word;
    }
    .spec-markdown img { max-width: 100%; height: auto; }
    .spec-markdown table {
      display: block;
      max-width: 100%;
      overflow-x: auto;
    }
    .spec-markdown h1, .spec-markdown h2, .spec-markdown h3 {
      margin: 18px 0 8px;
      line-height: 1.2;
    }
    .spec-markdown h1 { font-size: 1.25rem; }
    .spec-markdown h2 { font-size: 1.1rem; }
    .spec-markdown h3 { font-size: 1rem; }
    .spec-markdown p { margin: 0 0 12px; }
    .spec-markdown ul, .spec-markdown ol { margin: 0 0 12px 22px; }
    .spec-markdown li + li { margin-top: 6px; }
    .spec-markdown pre {
      background: var(--code-bg);
      padding: 12px;
      border-radius: 8px;
      overflow-x: auto;
      max-width: 100%;
      font-size: 0.88em;
      line-height: 1.45;
    }
    .spec-markdown code {
      font-family: Consolas, "Courier New", monospace;
      background: var(--code-bg);
      padding: 1px 5px;
      border-radius: 6px;
      font-size: 0.92em;
    }
    .spec-markdown pre code { background: none; padding: 0; }
    .spec-markdown table {
      border-collapse: collapse;
      margin: 12px 0;
      font-size: 0.9em;
    }
    .spec-markdown th, .spec-markdown td {
      border: 1px solid var(--line);
      padding: 6px 10px;
    }
    .spec-markdown blockquote {
      margin: 12px 0;
      padding: 4px 14px;
      border-left: 3px solid var(--line);
      color: var(--muted);
    }
    .acceptance-list {
      display: grid;
      gap: 12px;
      padding: 0;
      margin: 0;
      list-style: none;
    }
    .acceptance-item {
      background: var(--acceptance-bg);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 14px 16px;
    }
    .acceptance-index {
      display: inline-block;
      min-width: 28px;
      margin-right: 8px;
      color: var(--muted);
      font-size: 0.8rem;
    }
    .empty {
      padding: 28px;
      color: var(--muted);
    }
    .mobile-summary {
      display: none;
      margin-bottom: 14px;
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 14px;
      background: var(--mobile-summary-bg);
    }
    .mobile-accordion {
      display: none;
    }
    .mobile-panel {
      border: 1px solid var(--line);
      border-radius: 18px;
      background: var(--panel);
      overflow: hidden;
      margin-top: 14px;
    }
    .mobile-panel summary {
      list-style: none;
      cursor: pointer;
      padding: 14px 16px;
      background: var(--mobile-panel-bg);
      font-weight: 700;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }
    .mobile-panel summary::-webkit-details-marker {
      display: none;
    }

      }

ontrol flow patterns, tuple returns, generic types, and out/ref parameters. Phase 1 (string literal parameterization) is complete; Phases 2-5 unlock ~55 additional duplicate groups across real codebases.", "notes": "Phase 1 (literal parameterization) completed 2026-05-02. Roadmap: Phase 2 (identifiers, ~10-15 groups), Phase 3 (control flow, ~20-25 groups), Phase 4 (tuple returns, ~2-3 groups), Phase 5 (generic types, ~10-15 groups). Total potential: 85-90% of all duplicates extractable. See tasks/us-032-duplicate-types.md for detailed analysis and examples."}], "stories": [{"id": "US-004", "title": "Migrate MoveService WARNING messages to RtLog.Warning", "description": "As a maintainer cleaning up the RtConsole/RtLog migration, I want the two residual WARNING:-prefixed messages in MoveService.cs (formerly MoveCore.cs) routed through RtLog.Warning so that warning routing is consistent across the codebase and stderr-grep consumers see a uniform [WARNING] prefix.", "acceptanceCriteria": ["Locate the two WARNING: messages (formerly lines 328 and 344 of MoveCore.cs; verify exact lines in MoveService.cs after the rename)", "Replace each `RtConsole.WriteLine(Result, \"WARNING: ...\")` call with `RtLog.Warning(\"...\")`, dropping the inline WARNING: prefix since RtLog.Warning prepends [WARNING]", "Confirm the messages are now routed to stderr (matching RtLog.Warning's existing behaviour) and not stdout", "Verify no test or downstream consumer parses the literal string `WARNING:` from MoveCommand stdout â€” search for `WARNING:` across tests/ and update any dependent assertion to match the new `[WARNING]` prefix on stderr", "Add or update a MoveCommand test asserting (a) the warning text appears on stderr with the [WARNING] prefix and (b) stdout no longer contains the WARNING: prefix", "dotnet build \"RoslynTools.slnx\" passes with zero errors and zero new warnings", "dotnet test \"tests/RoslynTools.Tests/RoslynTools.Tests.csproj\" -v minimal passes", "dotnet format \"RoslynTools.slnx\" --verify-no-changes passes"], "priority": 4, "passes": false, "notes": "Affected files: src/RoslynTools/Services/MoveService.cs (verify), tests/RoslynTools.Tests/MoveCommandTests.cs (or equivalent). Item 2 in the gap log. Format change for stderr-grep consumers â€” call out in commit message and changelog.", "epicId": "EP-002"}, {"id": "US-005", "title": "Repair non-buildable commit 0445c01 via interactive rebase", "description": "As a maintainer who relies on git bisect, I want commit 0445c01 to build standalone so that bisect across the US-012/US-016 range does not fail spuriously.", "acceptanceCriteria": ["Confirm the failure: `git checkout 0445c01 && dotnet build \"RoslynTools.slnx\"` fails because MethodExtractor.ExtractAsync(replaceDuplicates: ...) does not yet exist", "Plan the interactive rebase: identify the ExtractMethodCommand.cs hunk in 0445c01 that references the not-yet-added parameter and identify 31765bc as the commit where the parameter is added", "Move the offending ExtractMethodCommand.cs hunk forward from 0445c01 into 31765bc, leaving 0445c01 with only US-012 changes that build standalone", "After the rebase, verify both commits build: checkout 0445c01 -> dotnet build passes; checkout 31765bc -> dotnet build passes; checkout HEAD -> full test suite passes", "Run a smoke bisect: `git bisect start HEAD <commit before 0445c01> -- src/RoslynTools/Services/MethodExtractor*.cs` then bisect run dotnet build to confirm no spurious failures across the range", "Force-push only after a fast-forward dry-run on the dev branch confirms no other branches/PRs are based on the rewritten commits â€” if any are, document a coordination plan in the commit/PR description rather than rewriting unilaterally", "dotnet build \"RoslynTools.slnx\" passes at HEAD with zero errors and zero new warnings", "dotnet test \"tests/RoslynTools.Tests/RoslynTools.Tests.csproj\" -v minimal passes", "dotnet format \"RoslynTools.slnx\" --verify-no-changes passes"], "priority": 5, "passes": false, "notes": "Affected files: history rewrite of commits 0445c01 and 31765bc. From the gap log bisect-hazard entry. CONSERVATIVE: history rewrites are risky on shared branches â€” a session may end with the rebase staged but not pushed if any other branch is based on the affected commits. Document blockers and stop rather than coordinate force-pushes mid-session.", "epicId": "EP-005"}, {"id": "US-006", "title": "Extract ExtractMethodHandler.RunAsync to enforce thin-shell rule on ExtractMethodCommand", "description": "As a maintainer applying the \"Command ExecuteAsync â‰¤ 20 lines\" thin-shell rule, I want the ~40-line SetHandler lambda in ExtractMethodCommand pulled into a Services-side ExtractMethodHandler.RunAsync(ctx) helper so that the command class stays a thin CLI shell.", "acceptanceCriteria": ["Create src/RoslynTools/Services/ExtractMethodHandler.cs with `internal static class ExtractMethodHandler` exposing `RunAsync(ExtractMethodContext ctx)` (or equivalent record/struct carrying the parsed CLI args)", "Move all logic currently in the SetHandler lambda into RunAsync, leaving the lambda body short â€” read options, build the context, await ExtractMethodHandler.RunAsync, return the int exit code", "Lambda body is â‰¤ 20 lines (counted exclusive of brace lines per the team rule)", "Define an ExtractMethodContext record (or similar) at the top of the new file capturing exactly the inputs the handler needs â€” no leakage of System.CommandLine types into the Services layer", "Update existing ExtractMethodCommand tests if they reference internals; add at least one direct unit test for ExtractMethodHandler.RunAsync that bypasses the command-line layer", "rt dump-help shows the same examples and Info as before (Info.Examples reflects actual invocation)", "Output (stdout/stderr/exit code) is byte-stable across the refactor â€” confirm with a snapshot test or a before/after diff captured in the commit message", "dotnet build \"RoslynTools.slnx\" passes with zero errors and zero new warnings", "dotnet test \"tests/RoslynTools.Tests/RoslynTools.Tests.csproj\" -v minimal passes", "dotnet format \"RoslynTools.slnx\" --verify-no-changes passes"], "priority": 6, "passes": false, "notes": "Affected files: src/RoslynTools/Commands/ExtractMethodCommand.cs, src/RoslynTools/Services/ExtractMethodHandler.cs (new), tests/RoslynTools.Tests/. Item 12 in the gap log.", "epicId": "EP-005"}, {"id": "US-007", "title": "Audit RtCommandInfo fields exposed in dump-help --json", "description": "As a maintainer enforcing the external-action rule, I want every RtCommandInfo field either exposed in dump-help --json output or deleted as cruft so that no field is unobservable to external consumers.", "acceptanceCriteria": ["List every field of RtCommandInfo (Name, Category, Mutates, JsonOutput, Examples, KnownIssues, plus any others) and check whether each is currently included in DumpHelpCommand --json output", "For each field not exposed, decide: expose it (preferred for Category, Mutates, JsonOutput) or delete it. Decision and rationale for each is documented in the commit message", "Update DumpHelpCommand to serialise the agreed-upon set of fields under stable JSON keys (camelCase to match existing convention; verify by looking at current output)", "Add an xUnit test asserting the JSON shape against a small sample command (one field per type â€” string, bool, string[]) â€” uses Verify.Xunit if already adopted in the project, otherwise a strict-equality assertion", "Run rt dump-help --json against the full command set and confirm it parses as valid JSON (`| ConvertFrom-Json` round-trip)", "Update any KnownIssues entries on commands that are now resolved by this change", "rt dump-help shows the audited shape and Info.Examples reflects the actual invocation", "dotnet build \"RoslynTools.slnx\" passes with zero errors and zero new warnings", "dotnet test \"tests/RoslynTools.Tests/RoslynTools.Tests.csproj\" -v minimal passes", "dotnet format \"RoslynTools.slnx\" --verify-no-changes passes"], "priority": 7, "passes": false, "notes": "Affected files: src/RoslynTools/Core/RtCommandInfo.cs (verify path), src/RoslynTools/Commands/DumpHelpCommand.cs, tests/RoslynTools.Tests/DumpHelpCommandTests.cs. Item 16 in the gap log. Conservative default: expose rather than delete for ambiguous fields â€” deletion is reversible only by re-implementing.", "epicId": "EP-003"}, {"id": "US-008", "title": "Add rt dump-help --json --normalize for stable snapshots", "description": "As a maintainer using Verify.Xunit snapshots over dump-help output, I want a --normalize flag on dump-help --json that strips non-deterministic fields (version strings, absolute paths, build timestamps) so that snapshots stop churning across machines and builds.", "acceptanceCriteria": ["Add a `--normalize` boolean flag to DumpHelpCommand alongside the existing `--json` flag (use --normalize without --json -> error with explanatory message, or apply normalization to plain output too â€” pick one; document in Info.Examples)", "When --normalize is set, the JSON output: (a) replaces absolute paths under cwd with relative paths, (b) replaces or omits any version field, (c) omits any timestamp field, (d) sorts arrays/object keys deterministically where ordering is not semantic", "Run dump-help --json --normalize twice on the same machine and assert byte-for-byte identical output (same hash)", "Run dump-help --json --normalize on Windows and (if reachable in CI) on Linux/macOS â€” output should match modulo line endings; document any platform-specific stripping", "Add a Verify.Xunit (or assertion-based) snapshot test using --normalize, demonstrating stable output", "Without --normalize, output is unchanged byte-for-byte (no behaviour regression)", "rt dump-help shows the new flag and Info.Examples reflects the actual invocation including --normalize", "dotnet build \"RoslynTools.slnx\" passes with zero errors and zero new warnings", "dotnet test \"tests/RoslynTools.Tests/RoslynTools.Tests.csproj\" -v minimal passes", "dotnet format \"RoslynTools.slnx\" --verify-no-changes passes"], "priority": 8, "passes": false, "notes": "Affected files: src/RoslynTools/Commands/DumpHelpCommand.cs, tests/RoslynTools.Tests/DumpHelpCommandTests.cs. Item 15 in the gap log. DEPENDS ON: US-007 (audit settles which fields exist in --json before normalisation rules are written).", "epicId": "EP-005"}, {"id": "US-009", "title": "Add rt add-test --cli mode for CLI-invocation test scaffolding", "description": "As a developer adding a new rt command, I want rt add-test --cli <CommandClass> to scaffold a CLI-invocation test class that runs `Command.Parse(...).InvokeAsync(...)` and asserts on stdout/stderr/exit-code so that my new command gets coverage for required-arg-missing, help output, and a dry-run happy-path without me hand-writing boilerplate.", "acceptanceCriteria": ["Add `--cli` flag to AddTestCommand; when set, scaffolding emits a test class targeting CLI invocation rather than Core/Service unit tests", "Generated class includes at minimum three test methods: (a) RequiredArgsMissing_ReturnsNonZeroExit, (b) HelpFlag_PrintsHelpAndExitsZero, (c) DryRun_HappyPath_ReturnsZeroAndProducesExpectedDiff", "Generated tests use Command.Parse(...).InvokeAsync(...) (or the project's equivalent harness if one exists â€” search for existing patterns first)", "Stdout/stderr capture uses TextWriter / TextReader redirection that survives parallel xUnit runs (or marks the class non-parallel if the harness is process-global)", "Generated file path: tests/RoslynTools.Tests/Cli/<CommandName>CliTests.cs (verify Cli/ subfolder convention by looking at existing layout â€” fall back to flat tests/RoslynTools.Tests/ if no Cli/ folder exists)", "Without --cli, AddTestCommand behaviour is unchanged (regression coverage on existing scaffolding tests)", "Self-test: run `rt add-test --cli ExtractMethodCommand --dry-run`, capture diff, assert it includes the three test methods and compiles when applied to a scratch branch", "rt dump-help shows --cli flag and Info.Examples reflects the actual invocation", "dotnet build \"RoslynTools.slnx\" passes with zero errors and zero new warnings", "dotnet test \"tests/RoslynTools.Tests/RoslynTools.Tests.csproj\" -v minimal passes", "dotnet format \"RoslynTools.slnx\" --verify-no-changes passes"], "priority": 9, "passes": false, "notes": "Affected files: src/RoslynTools/Commands/AddTestCommand.cs, src/RoslynTools/Services/AddTestService.cs (or similar â€” verify), tests/RoslynTools.Tests/AddTestCommandTests.cs. Item 14 in the gap log.", "epicId": "EP-005"}, {"id": "US-011", "title": "Separate workspace diagnostics from results in --json output", "description": "As a developer running an rt analyze/inspect command in --json mode, I want non-fatal workspace warnings (NuGet audit warnings, locked obj/dll files) to appear under a separate `diagnostics:` key rather than mixed into results so that I can pipe results into jq without filtering noise.", "acceptanceCriteria": ["Pick a single helper (likely in WorkspaceLoader or a new RtDiagnosticsCollector) that captures non-fatal Roslyn workspace diagnostics during load", "Top-level --json envelope across all read-only commands is `{ \"diagnostics\": [ ... ], \"results\": <command-specific> }` â€” `diagnostics` is always present (empty array if none), `results` shape is unchanged", "Each diagnostic item has at minimum: `severity` (info/warning/error), `message`, `source` (e.g. \"workspace-load\", \"nuget-audit\", \"file-lock\")", "When --json is not set, diagnostics are written to stderr in their existing form â€” no behaviour change for plain-text consumers", "Apply the envelope to at least three representative read-only commands (e.g. inspect describe, inspect find-refs, analyze dependency-graph) and add tests for each", "Add a test that loads a workspace producing at least one warning (e.g. a project with a deliberately broken NuGet reference in a fixture) and asserts the warning appears under diagnostics with empty/normal results", "rt dump-help notes the envelope shape in either global help or per-command help; Info.Examples updated where appropriate", "dotnet build \"RoslynTools.slnx\" passes with zero errors and zero new warnings", "dotnet test \"tests/RoslynTools.Tests/RoslynTools.Tests.csproj\" -v minimal passes", "dotnet format \"RoslynTools.slnx\" --verify-no-changes passes"], "priority": 11, "passes": false, "notes": "Affected files: src/RoslynTools/Services/WorkspaceLoader.cs, src/RoslynTools/Services/SymbolFormatter.cs (or similar JSON envelope helper), src/RoslynTools/Commands/* (per-command JSON serialisation), tests/RoslynTools.Tests/. Item 18 in the gap log. CONSERVATIVE: rolling out across all read-only commands at once may exceed one session â€” apply to three representative commands and file a follow-up to extend coverage.\n\n[2026-05-05] Partial: US-220 (0d584c0) separated workspace diagnostics from stderr success-path output. The full {diagnostics, results} JSON envelope across read-only commands (AC#2, AC#5) is not yet implemented.", "epicId": "EP-003"}, {"id": "US-012", "title": "Add rt analyze responsibility-map command", "description": "As a developer hunting SoC violations in fat command/handler classes, I want rt analyze responsibility-map <type> --solution <sln> to classify the type's members by AST pattern (parsing, business logic, IO, presentation) and output a heatmap-style JSON summary so that I can target the worst offenders for refactoring.", "acceptanceCriteria": ["Add new src/RoslynTools/Commands/ResponsibilityMapCommand.cs implementing IRtCommand with Info.Category = \"analyze\", Info.JsonOutput = true, Info.Mutates = false", "Build() registers the command under the analyze group and accepts a positional <type> (FQN) plus the global --solution", "Classification rules â€” at minimum: (a) parsing â€” methods invoking string.Split / Regex / int.Parse / JsonSerializer.Deserialize, (b) IO â€” methods invoking File.* / Directory.* / Process.Start / HttpClient.*, (c) presentation â€” methods invoking Console.* / RtConsole.* / ILogger.* / RtLog.*, (d) business â€” anything else. Each rule documented in code comment", "JSON output shape: `{ \"diagnostics\": [...], \"results\": { \"type\": \"FQN\", \"members\": [ { \"name\": \"...\", \"kind\": \"method\", \"categories\": [\"parsing\",\"io\"], \"locationPath\": \"...\", \"line\": 42 } ], \"summary\": { \"parsing\": 3, \"businessLogic\": 5, \"io\": 2, \"presentation\": 1 } } }`", "Members with multiple categories are reported under each (no double-counting in summary; summary counts unique members per category)", "Edge cases: type not found -> exit 1 with clear message; type has no members -> empty members array, all-zero summary, exit 0", "Add xUnit tests using a fixture with one method per category plus one mixed-category method; assert classification and summary", "Self-test: run against ChangeSignatureCommand on RoslynTools.slnx and inspect output for sanity (member count > 0, categories non-empty)", "rt dump-help shows the new command and Info.Examples reflects the actual invocation", "dotnet build \"RoslynTools.slnx\" passes with zero errors and zero new warnings", "dotnet test \"tests/RoslynTools.Tests/RoslynTools.Tests.csproj\" -v minimal passes", "dotnet format \"RoslynTools.slnx\" --verify-no-changes passes"], "priority": 12, "passes": false, "notes": "Affected files: src/RoslynTools/Commands/ResponsibilityMapCommand.cs (new), src/RoslynTools/Services/ResponsibilityMapService.cs (new), tests/RoslynTools.Tests/ResponsibilityMapCommandTests.cs (new). Item 5 in the gap log.", "epicId": "EP-003"}, {"id": "US-014", "title": "Add rt analyze why-type-needed and unused-members-on-interface sub-commands", "description": "As a developer following up the analyze-interface output, I want rt analyze why-type-needed <interface> <consumer> and rt analyze unused-members-on-interface <interface> --within <project> so that I can drill into a single consumer's reason for needing the interface and scope unused-member analysis to a single project.", "acceptanceCriteria": ["Add src/RoslynTools/Commands/WhyTypeNeededCommand.cs (analyze category, JSON output, no mutate) â€” positional <interface> <consumer>, returns the exact members and call sites the consumer uses", "Add src/RoslynTools/Commands/UnusedMembersOnInterfaceCommand.cs (analyze category, JSON output, no mutate) â€” positional <interface> with --within <project> filter; returns members not called by any consumer in that project", "Reuse the AnalyzeInterfaceService from US-013 â€” these sub-commands are filtered/projected views of the same underlying analysis", "JSON shapes: why-type-needed -> `{ \"diagnostics\": [...], \"results\": { \"consumer\": \"FQN\", \"membersUsed\": [...], \"locations\": [...] } }`; unused-members-on-interface -> `{ \"diagnostics\": [...], \"results\": { \"project\": \"...\", \"unusedMembers\": [...] } }`", "Edge cases: consumer does not depend on interface -> empty result with diagnostic note, exit 0; project does not contain interface or consumers -> empty result, exit 0; consumer or interface FQN not found -> exit 1", "Add xUnit tests for both commands using fixtures from US-013", "rt dump-help shows both new commands and Info.Examples reflects the actual invocations", "dotnet build \"RoslynTools.slnx\" passes with zero errors and zero new warnings", "dotnet test \"tests/RoslynTools.Tests/RoslynTools.Tests.csproj\" -v minimal passes", "dotnet format \"RoslynTools.slnx\" --verify-no-changes passes"], "priority": 14, "passes": false, "notes": "Affected files: src/RoslynTools/Commands/WhyTypeNeededCommand.cs (new), src/RoslynTools/Commands/UnusedMembersOnInterfaceCommand.cs (new), tests/RoslynTools.Tests/. DEPENDS ON: US-013 (reuses AnalyzeInterfaceService). Item 19 sub-commands in the gap log.", "epicId": "EP-003"}, {"id": "US-015", "title": "Add rt analyze architecture-verify command with config-driven rules", "description": "As a developer enforcing layering, I want rt analyze architecture-verify --rules <path> to validate the codebase against declared boundary rules (e.g. \"Commands may not reference Microsoft.CodeAnalysis directly\") so that violations are reported with file/line locations.", "acceptanceCriteria": ["Add src/RoslynTools/Commands/ArchitectureVerifyCommand.cs implementing IRtCommand with Info.Category = \"analyze\", Info.JsonOutput = true, Info.Mutates = false", "Add a YAML rule schema (re-using YamlDotNet already in the project): `rules: [ { id, fromNamespace, mustNotReference: [<namespace>...] } ]`. Schema file lives at src/RoslynTools/Services/Architecture/RuleSchema.cs (or similar)", "Default rules path: `.rtarch.yaml` at the solution root if --rules is not passed; if neither flag nor default exists, exit 1 with explanatory message", "JSON output shape: `{ \"diagnostics\": [...], \"results\": { \"rulesEvaluated\": N, \"violations\": [ { \"ruleId\": \"...\", \"violatingType\": \"FQN\", \"violatingFile\": \"...\", \"line\": N, \"referencedNamespace\": \"...\" } ] } }`", "Exit code: 0 if zero violations, 1 if violations found (so it can be wired into CI as a gate)", "Edge cases: rules file missing -> exit 1 with \"no rules file found\"; rules file empty/no rules -> exit 0 with empty violations and a diagnostic note; malformed YAML -> exit 1 with parse error including line number", "Bootstrap a sample rules file at .rtarch.yaml committed in the repo encoding at least: `Commands must not reference Microsoft.CodeAnalysis directly` (the analyze-interface lesson)", "Add xUnit tests with fixture rules + fixture violations across at least three rule types (banned namespace, banned type, banned project reference)", "rt dump-help shows the new command and Info.Examples reflects the actual invocation", "dotnet build \"RoslynTools.slnx\" passes with zero errors and zero new warnings", "dotnet test \"tests/RoslynTools.Tests/RoslynTools.Tests.csproj\" -v minimal passes", "dotnet format \"RoslynTools.slnx\" --verify-no-changes passes"], "priority": 15, "passes": false, "notes": "Affected files: src/RoslynTools/Commands/ArchitectureVerifyCommand.cs (new), src/RoslynTools/Services/Architecture/* (new), tests/RoslynTools.Tests/ArchitectureVerifyCommandTests.cs (new), .rtarch.yaml (new, committed). Item 7 in the gap log.", "epicId": "EP-003"}, {"id": "US-016", "title": "Add rt refactor introduce-record command", "description": "As a developer with a long method signature, I want rt refactor introduce-record --method <symbol> --record-name <name> --solution <sln> to extract a record type from selected parameter names/types so that I can collapse the parameter list and update all call sites.", "acceptanceCriteria": ["Add src/RoslynTools/Commands/IntroduceRecordCommand.cs implementing IRtCommand with Info.Category = \"refactor\", Info.JsonOutput = false, Info.Mutates = true", "Build() registers the command and accepts: --method <symbol-fqn-with-method>, --record-name <Name>, --record-namespace <ns> (optional, defaults to method's containing namespace), --parameters <comma-separated list> (optional, defaults to all parameters), --solution, --dry-run", "Behaviour: emits a new file <RecordName>.cs with `internal record <RecordName>(<Type1> <Param1>, ...)`, rewrites the method to take a single `<RecordName> request` parameter, rewrites all call sites to construct `new <RecordName>(...)` from existing arguments", "Parameter ordering in the record matches the method's parameter order (consistent with the team's first-reference rule for extract-method? â€” verify against MEMORY.md feedback_tdd_and_style and follow whichever convention is established; document the chosen convention in the commit message)", "Edge case: method has zero parameters -> exit 1 with explanatory message; method is overloaded and FQN ambiguous -> use the existing decisions/disambiguation flow (exit 2)", "Edge case: --parameters references a name not on the method -> exit 1 with the typo highlighted", "--dry-run emits a unified diff to stdout; without --dry-run, files are written. Both modes pass byte-stable output for the same input (same hash)", "Add xUnit tests covering: (a) full-parameter extraction with two call sites, (b) subset --parameters, (c) zero-parameter error, (d) ambiguous FQN -> exit 2", "Self-test: run against a method in RoslynTools.slnx with --dry-run and inspect the diff", "rt dump-help shows the new command and Info.Examples reflects the actual invocation", "dotnet build \"RoslynTools.slnx\" passes with zero errors and zero new warnings", "dotnet test \"tests/RoslynTools.Tests/RoslynTools.Tests.csproj\" -v minimal passes", "dotnet format \"RoslynTools.slnx\" --verify-no-changes passes"], "priority": 16, "passes": false, "notes": "Affected files: src/RoslynTools/Commands/IntroduceRecordCommand.cs (new), src/RoslynTools/Services/IntroduceRecordService.cs (new), tests/RoslynTools.Tests/IntroduceRecordCommandTests.cs (new). Item 3 in the gap log.", "epicId": "EP-004"}, {"id": "US-017", "title": "Add precondition for static types in rt extract-adapter", "description": "As a developer running rt refactor extract-adapter against a static class, I want either a clear refusal (\"static class cannot directly implement an interface â€” use --strategy wrapper\") or an automatic wrapper-class fallback so that the command does not block silently.", "acceptanceCriteria": ["Locate ExtractAdapterCommand and its service; add a precondition check that detects ITypeSymbol.IsStatic on the source type", "Default behaviour when source is static: exit 1 with stderr `error: cannot extract adapter from static type '<FQN>': static types cannot implement interfaces. Re-run with --strategy wrapper to generate a non-static wrapper that delegates to the static type.`", "Add `--strategy <direct|wrapper>` option (default `direct`); when `wrapper` is selected and source is static, generate `internal sealed class <SourceName>Wrapper : I<SourceName> { /* delegates to static methods */ }`, otherwise behave as today", "When --strategy direct is explicitly passed against a static type, still exit 1 (do not silently skip the request)", "When --strategy wrapper is passed against a non-static type, behave as if --strategy direct was passed (or document the ambiguity and exit 1 â€” pick one and document)", "Add xUnit tests covering: (a) static type with default strategy -> exit 1 with expected message, (b) static type with --strategy wrapper -> wrapper class generated, (c) non-static type unchanged behaviour", "Self-test: run against WorkspaceLoader (static) in RoslynTools.slnx â€” covers the original dogfood scenario", "Transitional scope (EP-006): this command is an aid during the static-to-instance migration. Once that migration completes the static-type case becomes rare; scope `--strategy wrapper` to the dogfood scenario only and do not invest in deep semantic translation of static call sites", "rt dump-help shows the new --strategy flag and Info.Examples reflects the actual invocation", "dotnet build \"RoslynTools.slnx\" passes with zero errors and zero new warnings", "dotnet test \"tests/RoslynTools.Tests/RoslynTools.Tests.csproj\" -v minimal passes", "dotnet format \"RoslynTools.slnx\" --verify-no-changes passes"], "priority": 17, "passes": false, "notes": "Affected files: src/RoslynTools/Commands/ExtractAdapterCommand.cs, src/RoslynTools/Services/ExtractAdapterService.cs, tests/RoslynTools.Tests/. Item 4 in the gap log.", "epicId": "EP-004"}, {"id": "US-018", "title": "Add rt refactor extract-orchestrator command", "description": "As a developer thinning fat command Build() handlers, I want rt refactor extract-orchestrator --command <CommandClass> --orchestrator-name <Name> --solution <sln> to pull the SetHandler lambda body into a named orchestrator class in Services/ so that the command class meets the â‰¤20-lines thin-shell rule.", "acceptanceCriteria": ["Add src/RoslynTools/Commands/ExtractOrchestratorCommand.cs implementing IRtCommand with Info.Category = \"refactor\", Info.JsonOutput = false, Info.Mutates = true", "Build() accepts: --command <CommandClass FQN>, --orchestrator-name <Name> (optional, defaults to <CommandName>Handler), --target-folder (optional, defaults to src/RoslynTools/Services/), --solution, --dry-run", "Behaviour: detects the SetHandler lambda within the named command's Build() method, lifts the lambda body into a new internal static class `<Name>` with `public static Task<int> RunAsync(<Name>Context ctx)`, generates a record/struct `<Name>Context` capturing exactly the inputs the lambda used, rewrites the lambda to read options, build the context, await RunAsync, return exit code", "Lifted lambda body is replaced with â‰¤20 lines (counted exclusive of brace lines per team convention)", "Edge case: command has no SetHandler call -> exit 1 with explanatory message; command not found -> exit 1; orchestrator name collides with existing type -> exit 1 with conflict description", "--dry-run emits a unified diff covering both the command file and the new orchestrator file; without --dry-run, both files are written", "Add xUnit tests using a fixture command class with a moderately complex SetHandler lambda; assert lambda is shortened, orchestrator file is created, byte-stable output between two dry-runs", "Self-test: run with --dry-run against ChangeSignatureCommand on RoslynTools.slnx and inspect the diff", "rt dump-help shows the new command and Info.Examples reflects the actual invocation", "dotnet build \"RoslynTools.slnx\" passes with zero errors and zero new warnings", "dotnet test \"tests/RoslynTools.Tests/RoslynTools.Tests.csproj\" -v minimal passes", "dotnet format \"RoslynTools.slnx\" --verify-no-changes passes"], "priority": 18, "passes": false, "notes": "Affected files: src/RoslynTools/Commands/ExtractOrchestratorCommand.cs (new), src/RoslynTools/Services/ExtractOrchestratorService.cs (new), tests/RoslynTools.Tests/ExtractOrchestratorCommandTests.cs (new). Item 6 in the gap log. RELATED TO: US-006 (manual extraction of ExtractMethodHandler) â€” once this command exists it could be used dogfood-style on remaining fat commands.", "epicId": "EP-004"}, {"id": "US-019", "title": "Add rt refactor replace-pattern general pattern-replace command", "description": "As a developer doing cross-cutting renames or API migrations (e.g. Console.Error.WriteLine -> ILogger calls), I want rt refactor replace-pattern --from <syntax-pattern> --to <syntax-pattern> --solution <sln> --dry-run so that I can preview and apply structural replacements without writing throwaway scripts.", "acceptanceCriteria": ["Add src/RoslynTools/Commands/ReplacePatternCommand.cs implementing IRtCommand with Info.Category = \"refactor\", Info.JsonOutput = false, Info.Mutates = true", "Build() accepts: --from <pattern-string>, --to <pattern-string>, --within <project-or-folder> (optional), --solution, --dry-run", "Pattern syntax: support placeholder captures `$1`, `$2`, ... in --from referenced from --to. At minimum support InvocationExpressionSyntax patterns like `Console.Error.WriteLine($1)` -> `_logger.LogWarning($1)`. Document the supported subset in xml-doc on the command class", "Implementation strategy: parse --from as a syntax tree fragment (using SyntaxFactory.ParseExpression), walk the solution finding structurally matching nodes via SyntaxNodeMatcher (new helper), produce replacements by substituting captures into --to", "Edge case: --from is unparseable -> exit 1 with parse error including position; --to references a capture not declared in --from -> exit 1 with explanatory message; zero matches -> exit 0 with stderr note `[INFO] no matches found` and no file changes", "--dry-run emits a unified diff per affected file; without --dry-run, files are written", "Self-test: run with --dry-run replacing `Console.Error.WriteLine($1)` -> `RtLog.Warning($1)` against RoslynTools.slnx and inspect output", "Add xUnit tests covering: (a) no captures, literal-to-literal, (b) one capture, (c) two captures with reordering ($2 before $1 in --to), (d) unparseable --from -> exit 1, (e) zero matches -> exit 0 with note, (f) --within scoping", "rt dump-help shows the new command and Info.Examples reflects the actual invocation", "dotnet build \"RoslynTools.slnx\" passes with zero errors and zero new warnings", "dotnet test \"tests/RoslynTools.Tests/RoslynTools.Tests.csproj\" -v minimal passes", "dotnet format \"RoslynTools.slnx\" --verify-no-changes passes"], "priority": 19, "passes": false, "notes": "Affected files: src/RoslynTools/Commands/ReplacePatternCommand.cs (new), src/RoslynTools/Services/ReplacePatternService.cs (new), src/RoslynTools/Services/SyntaxNodeMatcher.cs (new helper), tests/RoslynTools.Tests/ReplacePatternCommandTests.cs (new). Item 9 in the gap log. CONSERVATIVE: structural pattern matching is a large surface; this story scopes it to InvocationExpressionSyntax with named captures. Member access, method declarations, and other shapes can be added in follow-ups.", "epicId": "EP-004"}, {"id": "US-020", "title": "Add rt refactor move-method --to-nested-class and --from-nested-class flags", "description": "As a developer organising tests by behaviour (e.g. grouping `[Fact]` methods into `When_X` inner classes), I want rt refactor move-method --to-nested-class <name> [--create-if-missing] and the inverse --from-nested-class so that I can restructure methods into and out of nested classes without manual edits.", "acceptanceCriteria": ["Extend src/RoslynTools/Commands/MoveMethodCommand.cs (or add it if it does not exist) with --to-nested-class <name>, --from-nested-class, --create-if-missing flags", "--to-nested-class <name>: moves the named method into a nested class on the same containing type. If --create-if-missing is set and the nested class does not exist, create it; otherwise exit 1 with explanatory message", "--from-nested-class: moves the named method up one level out of its current nested class into the containing type. If the method is not already in a nested class, exit 1", "Both flags reuse existing rt move semantics for visibility, references, and call-site rewrites â€” call sites change only if access modifiers require it (e.g. private method moved into nested class becomes accessible through the nesting relationship)", "Edge cases: method does not exist -> exit 1; nested class name collides with existing member -> exit 1; method has dependencies on private fields of the containing class that are not accessible from the nested class -> exit 1 with the dependency listed", "--dry-run emits a unified diff; without --dry-run, file is written", "Add xUnit tests covering: (a) move into existing nested class, (b) move into new nested class with --create-if-missing, (c) move into new nested class without --create-if-missing -> exit 1, (d) move out of nested class, (e) move out when method is not nested -> exit 1, (f) private-field-dependency error", "Self-test: run against a test class in tests/RoslynTools.Tests/ with --dry-run, demonstrating the When_X grouping pattern", "rt dump-help shows the new flags and Info.Examples reflects the actual invocations", "dotnet build \"RoslynTools.slnx\" passes with zero errors and zero new warnings", "dotnet test \"tests/RoslynTools.Tests/RoslynTools.Tests.csproj\" -v minimal passes", "dotnet format \"RoslynTools.slnx\" --verify-no-changes passes"], "priority": 20, "passes": false, "notes": "Affected files: src/RoslynTools/Commands/MoveMethodCommand.cs (extend or new), src/RoslynTools/Services/MoveMethodService.cs, tests/RoslynTools.Tests/MoveMethodCommandTests.cs. Item 10 in the gap log.", "epicId": "EP-004"}, {"id": "US-023", "title": "Add rt refactor destatic-class command", "description": "As a developer migrating away from static-class-everywhere, I want rt refactor destatic-class <TypeFqn> --solution <sln> --dry-run to drop the static modifier from a class, make all members instance, generate a matching interface, register the class in DI, and rewrite all call sites to use injected references so that I can convert a service in one command rather than dozens of manual edits.", "acceptanceCriteria": ["Add src/RoslynTools/Commands/DestaticClassCommand.cs implementing IRtCommand with Info.Category = \"refactor\", Info.JsonOutput = false, Info.Mutates = true", "Build() accepts: <TypeFqn> positional, --interface-name <name> (optional, defaults to I<TypeName>), --no-interface (skip interface generation), --no-di-registration (skip Bootstrap.RegisterServices update), --lifetime <singleton|scoped|transient> (default singleton), --solution, --dry-run", "Behaviour for the target class: drop `static` from the class declaration, drop `static` from all members, generate a matching interface (unless --no-interface) with the public members, add a parameterless constructor (dependency-of-dependency rewrites are out of scope for v1)", "Behaviour at call sites: for each consumer that is itself a non-static class, rewrite `FooService.Bar(...)` to `_fooService.Bar(...)`, add `IFooService _fooService` field, add the parameter to the constructor (creating one if absent). For consumers that are static classes, emit `[WARN] caller \"<FQN>\" is static â€” skipped; destatic the caller first` and leave that call site unchanged", "DI registration: unless --no-di-registration, locate Bootstrap.RegisterServices (from US-022) and append the registration matching --lifetime", "Edge case: type is already non-static -> exit 1 with explanatory message; type not found -> exit 1; type has a static constructor -> exit 1 with note that static constructors must be migrated manually first; Bootstrap.RegisterServices not found and --no-di-registration not set -> exit 1 telling the user to run US-022 first", "Idempotency: running the command twice on the same type â€” second run exits 1 (already non-static)", "--dry-run emits a unified diff covering the type, all consumers, and Bootstrap.RegisterServices; without --dry-run, all files are written. Both modes are byte-stable for the same input", "Add xUnit tests covering: (a) simple static class with two non-static consumers, (b) static caller skipped with diagnostic, (c) idempotency, (d) --no-interface variant, (e) --no-di-registration variant, (f) --lifetime scoped", "Self-test: run --dry-run against `RoslynTools.Services.InspectService` on RoslynTools.slnx and inspect the diff for sanity", "rt dump-help shows the new command and Info.Examples reflects the actual invocation", "dotnet build \"RoslynTools.slnx\" passes with zero errors and zero new warnings", "dotnet test \"tests/RoslynTools.Tests/RoslynTools.Tests.csproj\" -v minimal passes", "dotnet format \"RoslynTools.slnx\" --verify-no-changes passes"], "priority": 23, "passes": false, "notes": "Affected files: src/RoslynTools/Commands/DestaticClassCommand.cs (new), src/RoslynTools/Services/DestaticClassService.cs (new), tests/RoslynTools.Tests/DestaticClassCommandTests.cs (new). DEPENDS ON: US-022 (DI host). CONSERVATIVE: v1 handles classes with no static-field state and no static-caller chain. Static-field migration and chained-caller rewrites surface during the pilot (US-025) and become follow-up stories rather than gating this one.", "epicId": "EP-006"}, {"id": "US-025", "title": "Pilot static-to-instance migration on 3 leaf services", "description": "As a maintainer validating the destatic tooling, I want to migrate three leaf services (selected from US-024 inventory output) from static to instance using rt refactor destatic-class so that the tool is exercised end-to-end including DI wiring, call-site rewrites, and the test suite remains green.", "acceptanceCriteria": ["Run `rt analyze static-class-inventory --solution RoslynTools.slnx` and pick the three lowest-difficulty leaves with the smallest call-site count. Document the choice in the commit message", "For each chosen service: run `rt refactor destatic-class <FQN>` (without --dry-run), verify build + tests pass, commit. Each service is its own commit (per feedback_incremental_changes.md)", "If destatic-class fails on any of the three services, that is a US-023 bug â€” fix the tool and resume; do not hand-edit around the gap (per feedback_dogfood_pause_on_gap.md)", "After all three: dotnet build, dotnet test, dotnet format --verify-no-changes all pass on the resulting state", "Update memory project_static_class_migration.md with current static-class count (was 69 at start of EP-006, expect ~66 after pilot) and any rough edges discovered during the pilot", "Self-test the migrated services through the existing CLI: `rt inspect describe ...` and `rt inspect outline ...` continue to work byte-for-byte identical to pre-pilot output", "dotnet build \"RoslynTools.slnx\" passes with zero errors and zero new warnings", "dotnet test \"tests/RoslynTools.Tests/RoslynTools.Tests.csproj\" -v minimal passes", "dotnet format \"RoslynTools.slnx\" --verify-no-changes passes"], "priority": 25, "passes": false, "notes": "DEPENDS ON: US-022, US-023, US-024. Dogfood story â€” deliverable is three converted services AND a battle-tested destatic-class command. Expect to iterate on US-023 mid-story; that is the point.", "epicId": "EP-006"}, {"id": "US-026", "title": "Sweep migration of remaining static services in batches", "description": "As a maintainer completing the static-to-instance migration, I want to convert the remaining ~31 static service classes using the proven destatic-class tooling so that src/RoslynTools/Services/ contains zero static classes and DI is the standard pattern.", "acceptanceCriteria": ["Re-run `rt analyze static-class-inventory --solution RoslynTools.slnx` after the pilot. Group remaining services into 3â€“4 batches by migrationDifficulty (leaf -> mid -> hub)", "Each batch is its own commit with a single `chore(destatic): batch N â€” <service-list>` message. Build + tests + format all pass at the end of each batch (commit-by-commit bisectability is required, per feedback_incremental_changes.md)", "If destatic-class breaks on any service, pause the sweep, fix the tool (extension to US-023 or new follow-up story under EP-006), then resume â€” never hand-edit around the gap", "After the sweep: zero `static class` declarations remain in src/RoslynTools/Services/. Verify with grep `^[a-z\\s]*static\\s+class` against src/RoslynTools/Services/ returning zero matches", "Update project_static_class_migration.md with final static-class count and any patterns that emerged", "Run rt analyze static-class-inventory once more and document remaining static-class hotspots outside Services/ (Commands/, Core/, etc.) â€” either log a follow-up story or close as out-of-scope for EP-006", "dotnet build \"RoslynTools.slnx\" passes with zero errors and zero new warnings", "dotnet test \"tests/RoslynTools.Tests/RoslynTools.Tests.csproj\" -v minimal passes", "dotnet format \"RoslynTools.slnx\" --verify-no-changes passes"], "priority": 26, "passes": false, "notes": "DEPENDS ON: US-025 (pilot must succeed first). Largest story by raw line count but lowest unit-of-effort because the tool does the work. Track per-batch progress in commits, not in additional stories.", "epicId": "EP-006"}, {"id": "US-029", "title": "Extract remaining 67 duplicate code groups using rt extract-method", "description": "As a developer reducing code duplication, I want the remaining 67 duplicate groups extracted into named private/static methods so that the codebase is DRY and maintenance burden is lowered.", "acceptanceCriteria": ["Triage the 67 groups by extractability: separate extractable (50+), likely_extractable (10-15), discovery_only (rare return/control-flow groups)", "For each extractable group: use rt extract-method --replace-duplicates to extract all occurrences at once. Log failures (if rt cannot extract a group) to dogfood-gaps.md.", "For likely_extractable groups: extract the first occurrence manually or via rt, then apply rt extract-method --replace-duplicates to replace remaining duplicates", "For discovery_only groups: manually extract if the return/control-flow handling is straightforward, otherwise defer to a follow-up story", "After each group extraction, run one xUnit test file to ensure no regressions (rotate through tests to keep feedback loops fast)", "After all extractions, run rt find-duplicates again and confirm the duplicate count drops from 68 to <5 (residual very-small patterns that aren't worth extracting)", "Document in commit message which groups were deferred and why", "dotnet build RoslynTools.slnx passes with zero errors and zero new warnings", "dotnet test RoslynTools.Tests.csproj -v minimal passes with all tests green", "dotnet format RoslynTools.slnx --verify-no-changes passes"], "priority": 29, "passes": false, "notes": "Affected files: src/RoslynTools/**/*.cs (widespread). This is a large refactoring; prefer batching into per-file or per-class sub-stories if one session exceeds time budget. rt extract-method --replace-duplicates is a primary tool here.\n\n[2026-05-05] Blocker fixed in c6ff45e (semantic validation in --replace-duplicates); the 67-group extraction itself remains pending.", "epicId": "EP-007"}, {"id": "US-032", "title": "Thin ChangeSignatureCommand.Build() from 191 lines to enforce thin-shell rule", "description": "As a maintainer applying the thin-shell rule, I want ChangeSignatureCommand.Build() thinned by extracting the 191-line option-building logic to a helper so that the command class stays a thin CLI shell.", "acceptanceCriteria": ["Create src/RoslynTools.Cli/CommandBuilders/ChangeSignatureCommandBuilder.cs with static BuildChangeSignatureCommand() method containing all option registration logic", "Move all var typeOpt, var methodOpt, var oldNameArg, etc. declarations and cmd.Add() calls to the builder", "ChangeSignatureCommand.Build() becomes a thin wrapper with a short SetHandler", "Thin method is less than 20 lines (excluding braces)", "rt dump-help output and Info.Examples remain byte-identical (verify via snapshot or before/after diff)", "Update ChangeSignatureCommand tests if they reference Build() internals; regression test all three modes (reorder, add, remove)", "dotnet build RoslynTools.slnx passes with zero errors and zero new warnings", "dotnet test RoslynTools.Tests.csproj -v minimal passes with all tests green", "dotnet format RoslynTools.slnx --verify-no-changes passes"], "priority": 32, "passes": false, "notes": "Affected files: src/RoslynTools.Cli/Commands/ChangeSignatureCommand.cs, src/RoslynTools.Cli/CommandBuilders/ChangeSignatureCommandBuilder.cs (new), tests/RoslynTools.Tests/. Thin-shell rule enforcement. Can pair with other thin-shell tasks (App.RunAsync, DumpHelpCommand) in one session.\n\n[2026-05-05] Build() reduced 191→95 in d985bc2 (50% reduction via ChangeSignatureCommandHandlers); AC#4 (<20 lines) not yet met. Remaining: extract option-registration into ChangeSignatureCommandBuilder.", "epicId": "EP-007"}, {"id": "US-034", "title": "Review and remove 120+ unused symbols across codebase", "description": "As a maintainer keeping the codebase clean, I want unused types, methods, and test helpers removed so that the codebase has no dead code.", "acceptanceCriteria": ["Run rt find-unused --solution RoslynTools.slnx to enumerate all unused symbols", "Triage into: (a) genuinely unused (safe to delete), (b) used via reflection/attributes, (c) deliberately exposed API", "For category (a): use rt safe-delete --symbol <FQN> to confirm zero references, then delete. Log failures to dogfood-gaps.md", "For category (b): add [UsedImplicitly] attribute and document the reason in a code comment", "For category (c): leave them and add a comment explaining why", "After removals, run rt find-unused again and confirm count drops by at least 80%", "Run all tests to ensure no breakage", "Document in commit message which symbols were deleted and which rt gaps were encountered", "dotnet build RoslynTools.slnx passes with zero errors and zero new warnings", "dotnet test RoslynTools.Tests.csproj -v minimal passes with all tests green", "dotnet format RoslynTools.slnx --verify-no-changes passes"], "priority": 34, "passes": false, "notes": "Affected files: src/RoslynTools/**/*.cs, tests/RoslynTools.Tests/**/*.cs (widespread). Use rt safe-delete extensively. Conservative: retain symbols with any doubt; deleting is harder to undo than adding a comment.", "epicId": "EP-007"}, {"id": "US-036", "title": "Add rt capabilities command that emits machine-readable command registry as JSON", "description": "As an LLM tool caller, I want rt capabilities --json to emit a stable JSON representation of all registered commands so that I can discover what rt can do without scraping --help text.", "acceptanceCriteria": ["A new file src/RoslynTools/Commands/CapabilitiesCommand.cs exists and defines internal sealed class CapabilitiesCommand implementing IRtCommand", "CapabilitiesCommand exposes a static RtCommandInfo Info property with Name = \"capabilities\"", "CapabilitiesCommand.Info.Category is one of the allowed values (\"inspect\", \"analyze\", \"refactor\", or a newly added \"meta\" category registered in App.GroupDescriptions)", "If a new \"meta\" category is introduced, App.cs registers a corresponding GroupDescription entry and App.RunAsync's category validation accepts it", "CapabilitiesCommand.Info.Mutates == false", "CapabilitiesCommand.Info.JsonOutput == true", "CapabilitiesCommand.Info.SupportedFormats includes OutputFormat.Json", "CapabilitiesCommand.Info.WhenToUse is a non-empty string describing LLM discovery use case", "CapabilitiesCommand.Info.Examples contains at least one example invoking the command with --json", "CapabilitiesCommand.Build() returns a System.CommandLine Command named \"capabilities\"", "CapabilitiesCommand is auto-discovered by the reflection registry in App.cs without manual registration code", "Running `rt capabilities --json` exits with code 0", "The JSON output is a single object with a top-level \"commands\" array", "Each entry in \"commands\" contains: name (string), category (string), mutates (bool), jsonOutput (bool), supportedFormats (string array), aliases (string array), rootInvocation (string starting with \"rt \"), groupedInvocation (string starting with \"rt <category> \"), whenToUse (string), examples (string array)", "supportedFormats values are the string names of OutputFormat enum members (e.g. \"Text\", \"Json\", \"Markdown\", \"Llm\", \"Yaml\") â€” no new supportsLlm field is introduced", "rootInvocation for command Foo equals \"rt foo\"", "groupedInvocation for command Foo with Category=\"inspect\" equals \"rt inspect foo\"", "Commands with no aliases emit aliases as an empty array, not null or missing", "The output includes the CapabilitiesCommand entry itself", "The \"commands\" array is sorted deterministically (alphabetical by name) so output is stable across runs", "A snapshot test in tests/RoslynTools.Tests/CapabilitiesCommandTests.cs asserts the JSON output matches a checked-in baseline", "The snapshot test fails with a clear diff message when a new command is added without updating the snapshot", "Running `rt capabilities` without --json defaults to JSON output (since it is JsonOutput:true) OR emits a human-readable text summary if SupportedFormats includes Text â€” behavior is documented and tested", "The command does NOT require --solution (no workspace load)", "The command exits in under 500ms when invoked on a cold process (no MSBuild load)", "Output is valid JSON parseable by System.Text.Json.JsonDocument.Parse without exceptions", "A unit test verifies every command discovered by App.Commands appears in the capabilities output", "A unit test verifies the JSON shape by deserializing into a CapabilitiesResult DTO", "Output is written via RtSerializer.Write following the ListSmellsCommand pattern", "dotnet build RoslynTools.slnx passes", "dotnet test RoslynTools.slnx passes

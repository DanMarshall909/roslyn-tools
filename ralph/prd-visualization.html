n to its folder path |\n| [`implement-interface`](#implement-interface) | `refactor` | `ii` | Generate throw-stub implementations for unimplemented interface members |\n| [`inline-method`](#inline-method) | `refactor` | `im` | Inline a method by replacing all call sites with the method body |\n| [`list-imports`](#list-imports) | `analyze` | `imports` | List using directives, including global and static imports |\n| [`list-smells`](#list-smells) | `analyze` | `smells` | Report code smells: large classes, long methods, over-injected constructors |\n| [`make-async`](#make-async) | `refactor` | `ma` | Convert a synchronous method to async Task<T> and update direct callers |\n| [`make-instance`](#make-instance) | `refactor` | `mns` | Remove static from a method and rewrite call sites to use an instance |\n| [`make-sealed`](#make-sealed) | `refactor` | `ms` | Add the sealed modifier to a class that has no derived types |\n| [`make-static`](#make-static) | `refactor` | `mst` | Convert an instance method to static when it has no instance-state dependencies |\n| [`migrate-to-ioptions`](#migrate-to-ioptions) | `refactor` | `mti` | Create an options POCO and register it with services.Configure<T> |\n| [`move`](#move) | `refactor` | — | Move a type to a different namespace, updating the declaration and all references |\n| [`move-method`](#move-method) | `refactor` | — | Move a static method to another class, rewriting all call sites |\n| [`narrow-dependency`](#narrow-dependency) | `refactor` | `nd` | Extract a member subset into a new interface and narrow consumers that only use that subset |\n| [`outline`](#outline) | `inspect` | — | List all types and member signatures in a file, glob, namespace, or regex (JSON) |\n| [`rename`](#rename) | `refactor` | `ren` | Rename a symbol and all its references across the solution |\n| [`replace-call`](#replace-call) | `refactor` | `rc` | Replace all invocations of one static method with another |\n| [`replace-datetime`](#replace-datetime) | `refactor` | — | Replace DateTime.UtcNow / DateTime.Now with injected TimeProvider, adding constructor injection |\n| [`replace-new`](#replace-new) | `refactor` | `rn` | Replace all constructor invocations of a type with a method call |\n| [`replace-xunit-asserts`](#replace-xunit-asserts) | `refactor` | `rxa` | Replace common Xunit Assert calls with Shouldly assertions |\n| [`safe-delete`](#safe-delete) | `refactor` | `sd` | Delete a type or member only if it has no references |\n| [`solid`](#solid) | `analyze` | — | Detect SOLID principle violations using heuristic analysis |\n| [`source`](#source) | `inspect` | — | Print the source code of a member or type by FQN (JSON) |\n| [`static-class-inventory`](#static-class-inventory) | `analyze` | — | List every static class with call-site count, member count, and inbound coupling for migration planning |\n| [`transform-parameters`](#transform-parameters) | `refactor` | `tp` | Extract method parameters into a new record and update all call sites. |\n\n## `rt inspect` — Read-only: examine a single symbol or file\n\n### describe\n\n_Show type shape: members, base types, interfaces, locations (JSON)_\n\n**Read-only** | JSON output\n\n**When to use:**\n\nGetting a detailed JSON description of a symbol's shape — members, base types, interfaces, constructors, locations — without opening the file. Ideal for agents that need to understand a type's surface area before planning a refactor.\n\n**Examples:**\n\n```bash\nrt inspect describe BookingService --solution C:\\code\\libraries\\ProjectX.Libraries.sln\nrt inspect describe ProjectX.Core.Services.IEmailService --kind type --solution C:\\code\\libraries\\ProjectX.Libraries.sln\nrt inspect describe IRtCommand --solution RoslynTools.slnx\n```\n\n---\n\n### find-callers\n\n_Find all invocation sites for a method_\n\n**Read-only** | Plain-text output\n\n**Aliases:** `callers`\n\n**When to use:**\n\nFinding all invocation sites of a method before renaming or deleting it, or to understand the blast radius of a signature change. Unlike find-refs, this filters to true call sites only, excluding nameof() and other non-invocation references.\n\n**Examples:**\n\n```bash\nrt inspect find-callers --symbol SendEmail --solution C:\\code\\libraries\\ProjectX.Libraries.sln\nrt inspect callers --symbol ProcessPayment --include-tests --solution C:\\code\\libraries\\ProjectX.Libraries.sln\nrt inspect find-callers --symbol BuildGraphAsync --solution RoslynTools.slnx\n```\n\n---\n\n### find-impl\n\n_Find all implementations of an interface or abstract class (JSON)_\n\n**Read-only** | JSON output\n\n**Aliases:** `impls`\n\n**When to use:**\n\nDiscovering all concrete implementations of an interface or derived classes of an abstract base, across the entire solution. Useful before making a breaking change to a contract, or to verify a new interface has been wired up everywhere expected.\n\n**Examples:**\n\n```bash\nrt inspect find-impl IEmailService --solution C:\\code\\libraries\\ProjectX.Libraries.sln\nrt inspect impls ProjectX.Core.Services.IBookingRepository --solution C:\\code\\libraries\\ProjectX.Libraries.sln\nrt inspect find-impl IRtCommand --solution RoslynTools.slnx\n```\n\n---\n\n### find-pattern\n\n_Find all solution locations structurally matching a given statement range._\n\n**Read-only** | JSON output\n\n**Aliases:** `fp`\n\n**When to use:**\n\nFind every location in the solution that structurally matches a given line range — same SyntaxKind tree shape, only identifier and literal values differ. Useful for spotting duplicated logic even when variable names differ.\n\n**Examples:**\n\n```bash\nrt inspect find-pattern --file src/Services/BookingService.cs --start-line 42 --end-line 50 --solution RoslynTools.slnx\nrt inspect fp --file src/Controllers/AdminController.cs --start-line 110 --end-line 125 --scope RoslynTools.Core --solution RoslynTools.slnx\n```\n\n---\n\n### find-refs\n\n_Find all references to a symbol across the solution_\n\n**Read-only** | Plain-text output\n\n**When to use:**\n\nFinding all references to any symbol (type, method, property, field, namespace) across the solution using Roslyn's semantic analysis. Prefer this over grep because it resolves overloads and type inference correctly and skips string literals/comments.\n\n**Examples:**\n\n```bash\nrt inspect find-refs --symbol BookingService --solution C:\\code\\libraries\\ProjectX.Libraries.sln\nrt inspect find-refs --symbol CreateBooking --kind method --solution C:\\code\\libraries\\ProjectX.Libraries.sln\nrt inspect find-refs --symbol IEmailService --kind type --solution RoslynTools.slnx\n```\n\n---\n\n### find-undocumented\n\n_Report types and members with no XML doc comment_\n\n**Read-only** | Plain-text output\n\n**Aliases:** `undoc`\n\n**When to use:**\n\nFinding types and members that have no XML documentation comment — the first step before bulk-generating docs with an LLM. Use --members to include methods and properties, not just types. Use --level to control which accessibility levels are checked (default: public).\n\n**Examples:**\n\n```bash\nrt inspect find-undocumented --solution RoslynTools.slnx\nrt inspect undoc --members --level internal --solution RoslynTools.slnx\nrt inspect undoc --members --level public,internal --scope RoslynTools.Core --solution RoslynTools.slnx\nrt inspect find-undocumented --level all --json --solution RoslynTools.slnx\n```\n\n---\n\n### find-unused\n\n_Report types and methods with no references (dead code)_\n\n**Read-only** | Plain-text output\n\n**Aliases:** `unused`\n\n**When to use:**\n\nIdentifying dead code — types and methods with zero references in the solution — before a safe-delete pass or ahead of a major refactor. Use --scope to focus on a specific namespace and filter noise from generated or test code.\n\n**Examples:**\n\n```bash\nrt inspect find-unused --solution C:\\code\\libraries\\ProjectX.Libraries.sln\nrt inspect unused --scope ProjectX.Core --solution C:\\code\\libraries\\ProjectX.Libraries.sln\nrt inspect find-unused --scope types --solution RoslynTools.slnx\n```\n\n---\n\n### outline\n\n_List all types and member signatures in a file, glob, namespace, or regex (JSON)_\n\n**Read-only** | JSON output\n\n**When to use:**\n\nGetting a JSON summary of all types and member signatures in a file or namespace without reading the raw source. Useful for agents to orient themselves in an unfamiliar module before planning a refactor, or to diff the public surface area across branches. Use --summary for a compact one-entry-per-type view (fqn, kind, line range, optional XML doc description) — ideal for directory-wide orientation.\n\n**Examples:**\n\n```bash\nrt inspect outline src/backend/TourStore.Api/Controllers/Admin/AdminController.cs --solution C:\\code\\libraries\\ProjectX.Libraries.sln\nrt inspect outline ProjectX.Core.Services --solution C:\\code\\libraries\\ProjectX.Libraries.sln\nrt inspect outline RoslynTools.Commands --solution RoslynTools.slnx\nrt inspect outline \"src/**/*.cs\" --solution RoslynTools.slnx\nrt inspect outline \"RoslynTools.*\" --solution RoslynTools.slnx\nrt inspect outline --regex \"Service\\.cs$\" --solution RoslynTools.slnx\nrt inspect outline src/RoslynTools/Core --solution RoslynTools.slnx --summary\nrt inspect outline RoslynTools.Core --solution RoslynTools.slnx --summary\n```\n\n---\n\n### source\n\n_Print the source code of a member or type by FQN (JSON)_\n\n**Read-only** | JSON output\n\n**When to use:**\n\nReading the full source of a specific method, property, type, or field by FQN without opening the file. Returns the declaration including XML doc comments, with file path and line numbers. Prefer this over Read when you know the exact member you need.\n\n**Examples:**\n\n```bash\nrt inspect source RoslynTools.Services.OutlineService.BuildTypeSummary --solution RoslynTools.slnx\nrt inspect source RoslynTools.Core.WorkspaceLoader --solution RoslynTools.slnx\nrt inspect source ProjectX.Core.Services.BookingService.CreateBookingAsync --kind method --solution C:\\code\\libraries\\ProjectX.Libraries.sln\n```\n\n---\n\n## `rt analyze` — Read-only: scan for cross-cutting issues\n\n### analyze-interface\n\n_Group interface consumers by the exact members they use_\n\n**Read-only** | JSON output\n\n**When to use:**\n\nGrouping interface consumers by the exact interface members they use so interface-segregation work can be driven by evidence instead of raw reference dumps. Use --scope to focus on one namespace or project, and --json for automation-friendly output.\n\n**Examples:**\n\n```bash\nrt analyze analyze-interface ProjectX.Core.IEmailSender --solution C:\\code\\libraries\\ProjectX.Libraries.sln\nrt analyze analyze-interface IEmailSender --scope ProjectX.Core --solution RoslynTools.slnx\nrt analyze analyze-interface ProjectX.Core.IEmailSender --json --solution RoslynTools.slnx\n```\n\n---\n\n### circular-deps\n\n_Detect circular namespace/type dependencies in the solution_\n\n**Read-only** | Plain-text output\n\n**Aliases:** `cdeps`\n\n**When to use:**\n\nDetecting circular namespace dependencies in a solution before a refactor, or after adding new inter-namespace references. Use --scope to limit analysis to your domain namespaces and ignore third-party noise.\n\n**Examples:**\n\n```bash\nrt analyze circular-deps --solution C:\\code\\libraries\\ProjectX.Libraries.sln\nrt analyze cdeps --scope ProjectX.Core --solution C:\\code\\libraries\\ProjectX.Libraries.sln\nrt analyze circular-deps --solution RoslynTools.slnx --scope RoslynTools\n```\n\n---\n\n### complexity\n\n_Measure cyclomatic/cognitive complexity, LOC, and param counts per method_\n\n**Read-only** | JSON output\n\n**Aliases:** `cx`\n\n**When to use:**\n\nMeasuring cyclomatic and cognitive complexity, lines of code, and parameter counts for methods in a solution. Use --threshold to surface only the most complex methods, --sort to rank by the metric of interest, and --top to limit output.\n\n**Examples:**\n\n```bash\nrt analyze complexity --solution RoslynTools.slnx\nrt analyze cx --threshold 10 --sort cyclomatic --solution RoslynTools.slnx\nrt analyze complexity --threshold 5 --sort cognitive --top 20 --solution C:\\code\\libraries\\ProjectX.Libraries.sln\n```\n\n---\n\n### debug\n\n_Inspect a recorded LLM trace timeline with breakpoints and assertions_\n\n**Read-only** | JSON output\n\n**When to use:**\n\nInspecting a recorded LLM or agent trace as a debugger timeline. This does not attach to a live .NET process yet. Use breakpoints such as event:model_call, tool:apply_patch, text:assume, or file:src/ and assertions such as no-tool:web, requires-event:final_response, max-events:40, or no-text:TODO.\n\n**Examples:**\n\n```bash\nrt analyze debug trace.jsonl\nrt analyze debug trace.jsonl --break tool:apply_patch --break event:model_call\nrt analyze debug trace.jsonl --from 5 --assert no-tool:web --assert requires-event:final_response --json\n```\n\n---\n\n### dependency-graph\n\n_Build a type-level dependency graph for the solution_\n\n**Read-only** | JSON output\n\n**Aliases:** `depgraph`\n\n**When to use:**\n\nVisualising the type-level dependency graph for a solution or a specific root type, to understand coupling before a large refactor. Use --format dot to pipe into Graphviz, or --format json for programmatic consumption. Use --type + --depth to focus on a single type's fan-out.\n\n**Examples:**\n\n```bash\nrt analyze dependency-graph --solution C:\\code\\libraries\\ProjectX.Libraries.sln --scope ProjectX.Core\nrt analyze depgraph --type BookingService --depth 2 --solution RoslynTools.slnx\nrt analyze dependency-graph --format dot --solution RoslynTools.slnx | dot -Tsvg -o deps.svg\n```\n\n**Known issues:**\n\n- Graph edges are built from fields, method parameters/returns, base types, and interfaces only — local variable type usages inside method bodies are missed. Static command classes with no fields appear as isolated nodes even when they reference WorkspaceLoader/SolutionWriter internally. See ai-improvements row #12.\n\n---\n\n### find-duplicates\n\n_Report exact-clone code blocks repeated across the solution_\n\n**Read-only** | JSON output\n\n**Aliases:** `fd`\n\n**When to use:**\n\nDiscovering repeated code blocks (exact clones) across a solution before an extract-method pass. Use --min-statements to tune noise vs. signal, --min-occurrences to target the most-duplicated blocks, and --scope to focus on one subsystem.\n\n**Examples:**\n\n```bash\nrt analyze find-duplicates --solution C:\\code\\libraries\\ProjectX.Libraries.sln\nrt analyze fd --min-statements 5 --solution C:\\code\\libraries\\ProjectX.Libraries.sln\nrt analyze find-duplicates --min-statements 4 --min-occurrences 3 --solution RoslynTools.slnx\nrt analyze find-duplicates --scope MyApp.Services --solution RoslynTools.slnx\nrt analyze find-duplicates --include-tests --solution RoslynTools.slnx\nrt analyze find-duplicates --max-statements 20 --solution RoslynTools.slnx\nrt analyze find-duplicates --json --solution RoslynTools.slnx\n```\n\n---\n\n### find-magic-strings\n\n_Report repeated string literals_\n\n**Read-only** | Plain-text output\n\n**Aliases:** `magic-strings`\n\n**When to use:**\n\nFinding repeated string literals that should probably be named constants before cleanup or domain refactoring. Generated files, const string declarations, and .rtignore matches are skipped.\n\n**Examples:**\n\n```bash\nrt analyze find-magic-strings --solution RoslynTools.slnx\nrt analyze magic-strings --min-length 4 --min-occurrences 3 --solution C:\\code\\app\\App.sln\nrt analyze find-magic-strings --json --solution RoslynTools.slnx\n```\n\n---\n\n### list-imports\n\n_List using directives, including global and static imports_\n\n**Read-only** | Plain-text output\n\n**Aliases:** `imports`\n\n**When to use:**\n\nAuditing C# using directives, especially global using and using static directives, before consolidating imports or introducing static member imports.\n\n**Examples:**\n\n```bash\nrt analyze list-imports --kind global --solution RoslynTools.slnx\nrt analyze imports --kind static --solution C:\\code\\app\\App.sln\nrt analyze list-imports --kind all --json --solution RoslynTools.slnx\n```\n\n---\n\n### list-smells\n\n_Report code smells: large classes, long methods, over-injected constructors_\n\n**Read-only** | Plain-text output\n\n**Aliases:** `smells`\n\n**When to use:**\n\nGetting a prioritised list of code smells — oversized classes, long methods, and constructors with too many parameters — to guide a refactor session. Use --scope to focus on your domain code and skip generated or test noise.\n\n**Examples:**\n\n```bash\nrt analyze list-smells --solution C:\\code\\libraries\\ProjectX.Libraries.sln\nrt analyze smells --scope ProjectX.Core --max-class-lines 200 --max-method-lines 30 --solution C:\\code\\libraries\\ProjectX.Libraries.sln\nrt analyze list-smells --solution RoslynTools.slnx --max-params 5\nrt analyze list-smells --solution RoslynTools.slnx --scope RoslynTools --top 30\n```\n\n---\n\n### solid\n\n_Detect SOLID principle violations using heuristic analysis_\n\n**Read-only** | JSON output\n\n**When to use:**\n\nDetect classes that may violate SOLID principles using heuristic analysis. --principle SRP flags classes with too many public methods and injected dependencies. --principle ISP flags fat interfaces and unimplemented members. --principle DIP flags concrete constructor params and inline new calls. --principle OCP flags switch/if chains that branch on concrete types. --principle LSP flags overrides and explicit interface impls that throw NotImplementedException. --principle all runs every active detector.\n\n**Examples:**\n\n```bash\nrt analyze solid --principle SRP --solution RoslynTools.slnx\nrt analyze solid --principle ISP --solution RoslynTools.slnx\nrt analyze solid --principle DIP --solution RoslynTools.slnx\nrt analyze solid --principle OCP --solution RoslynTools.slnx\nrt analyze solid --principle LSP --solution RoslynTools.slnx\nrt analyze solid --principle all --solution RoslynTools.slnx\n```\n\n---\n\n### static-class-inventory\n\n_List every static class with call-site count, member count, and inbound coupling for migration planning_\n\n**Read-only** | JSON output\n\n**When to use:**\n\nPlanning a static-to-instance migration by listing every static class with its call-site count, member count, and inbound static coupling. Results are sorted leaf-first so the safest classes to de-static appear at the top.\n\n**Examples:**\n\n```bash\nrt analyze static-class-inventory --solution RoslynTools.slnx\nrt analyze static-class-inventory --solution C:\\code\\libraries\\ProjectX.Libraries.sln\nrt static-class-inventory --solution RoslynTools.slnx --json\n```\n\n---\n\n## `rt refactor` — Mutations: rename, move, extract, replace, modify\n\n### add-dependency\n\n_Inject a constructor dependency into a class_\n\n**Mutation** (writes files) | Plain-text output\n\n**Aliases:** `ad`\n\n**When to use:**\n\nInjecting a new constructor dependency into a class without manually editing the constructor and field declarations. Prefer this over a manual edit when the class has multiple constructors or when you want to be confident the field naming convention (_camelCase) is applied consistently.\n\n**Examples:**\n\n```bash\nrt refactor add-dependency --type BookingService --dependency IEmailService --solution C:\\code\\libraries\\ProjectX.Libraries.sln\nrt refactor ad --type OrderController --dependency IPaymentGateway --field _payment --dry-run\nrt refactor add-dependency --type ReportGenerator --dependency IRepository --solution RoslynTools.slnx\n```\n\n---\n\n### add-global-import\n\n_Add a global using directive to an existing file_\n\n**Mutation** (writes files) | Plain-text output\n\n**Aliases:** `agi`\n\n**When to use:**\n\nAdding a C# `global using` directive to an existing imports file such as GlobalUsings.cs. Use this when a namespace is intentionally available project-wide.\n\n**Examples:**\n\n```bash\nrt refactor add-global-import --file tests/GlobalUsings.cs --namespace Xunit --solution RoslynTools.slnx\nrt refactor agi --file src/App/GlobalUsings.cs --namespace Microsoft.Extensions.Logging --dry-run --solution C:\\code\\app\\App.sln\nrt refactor add-global-import --file src/App/GlobalUsings.cs --namespace System.Net.Http.Json --solution C:\\code\\app\\App.sln\n```\n\n---\n\n### add-null-checks\n\n_Insert ArgumentNullException.ThrowIfNull guards for reference-type parameters_\n\n**Mutation** (writes files) | Plain-text output\n\n**Aliases:** `anc`\n\n**When to use:**\n\nRetrofitting ArgumentNullException.ThrowIfNull guards onto reference-type parameters in an existing method. Prefer this over a manual edit when a method has several parameters and you want to skip any that are already guarded or are nullable (annotated with ?).\n\n**Examples:**\n\n```bash\nrt refactor add-null-checks --type BookingService --method CreateBooking --solution C:\\code\\libraries\\ProjectX.Libraries.sln\nrt refactor anc --type OrderProcessor --method Process --dry-run\nrt refactor add-null-checks --type ReportController --method Generate --solution RoslynTools.slnx\n```\n\n---\n\n### add-static-import\n\n_Add a using static directive to a file_\n\n**Mutation** (writes files) | Plain-text output\n\n**Aliases:** `asi`\n\n**When to use:**\n\nAdding a C# `using static` directive to a specific file so static members can be referenced without qualifying the containing type. Prefer a narrow file target over solution-wide static imports.\n\n**Examples:**\n\n```bash\nrt refactor add-static-import --file tests/MathTests.cs --type Xunit.Assert --solution C:\\code\\app\\App.sln\nrt refactor asi --file src/App/Program.cs --type System.Console --dry-run --solution RoslynTools.slnx\nrt refactor add-static-import --file src/Commands/FooCommand.cs --type RoslynTools.Core.RtLog --solution RoslynTools.slnx\n```\n\n---\n\n### add-test\n\n_Append xUnit test stubs to an existing test class_\n\n**Mutation** (writes files) | Plain-text output\n\n**Aliases:** `at`\n\n**When to use:**\n\nAppending xUnit [Fact] stub methods to an existing test class. Two modes: legacy (--class with --name or --acs) adds to arbitrary test classes; command-based (--command with --scenario/--outcome or --before/--after) scaffolds organized test files by rt command category.\n\n**Examples:**\n\n```bash\nrt refactor add-test --class BookingServiceTests --name Returns_404_When_Not_Found --solution RoslynTools.slnx\nrt refactor add-test --class OrderTests --acs \"Returns total;Applies discount\" --nested-class WhenCalculatingTotal\nrt refactor add-test --command ExtractMethod --scenario \"source file as first occurrence\" --outcome \"call site updated\" --concern SourceFileCallSite --solution RoslynTools.slnx\nrt refactor add-test --command Rename --concern CrossFileRefs --before before.cs --after after.cs --solution RoslynTools.slnx\n```\n\n---\n\n### add-xml-doc\n\n_Insert XML <summary> doc comments from a JSON map_\n\n**Mutation** (writes files) | Plain-text output\n\n**Aliases:** `xmldoc`\n\n**When to use:**\n\nBulk-inserting XML <summary> doc comments from an LLM-generated JSON map. The JSON file must be a flat object mapping fully-qualified type/member names to summary strings. Skips symbols that already have a doc comment. Pair with `rt inspect find-undocumented` to generate the input list.\n\n**Examples:**\n\n```bash\nrt refactor add-xml-doc --from-json docs.json --solution RoslynTools.slnx --dry-run\nrt refactor xmldoc --from-json docs.json --solution RoslynTools.slnx\n```\n\n---\n\n### change-signature\n\n_Change method signatures._\n\n**Mutation** (writes files) | Plain-text output\n\n**When to use:**\n\nChange method signatures and update affected call sites.\n\n**Examples:**\n\n```bash\nrt refactor change-signature rename-param \"MyApp.Services.OrderService.PlaceOrder\" oldName newName --solution MyApp.sln\nrt refactor change-signature reorder \"MyApp.Services.OrderService.PlaceOrder\" \"2,0,1\" --solution MyApp.sln\nrt refactor change-signature add-param \"MyApp.Services.OrderService.PlaceOrder\" \"int timeout = 30\" --after orderId --solution MyApp.sln\nrt refactor change-signature remove-param \"MyApp.Services.OrderService.PlaceOrder\" timeout --solution MyApp.sln\n```\n\n---\n\n### convert-console-logging\n\n_Convert Console.Write/WriteLine calls to logger calls_\n\n**Mutation** (writes files) | Plain-text output\n\n**Aliases:** `ccl`\n\n**When to use:**\n\nMigrating Console.Write/WriteLine and Console.Error.Write/WriteLine calls to logger calls while preserving messages as structured templates where possible. Use this after the target logger dependency already exists, or pair it with add-dependency.\n\n**Examples:**\n\n```bash\nrt refactor convert-console-logging --solution C:\\code\\libraries\\ProjectX.Libraries.sln\nrt refactor ccl --inject-logger --solution C:\\code\\app\\App.sln\nrt refactor ccl --inject-logger --apply --solution C:\\code\\app\\App.sln\nrt refactor convert-console-logging --stream all --logger _log --information-method Info --warning-method Warn --error-method Error --dry-run --solution C:\\code\\app\\App.sln\n```\n\n**Known issues:**\n\n- Logger injection reuses add-dependency and only targets containing classes that have matching Console call sites.\n- Ambiguous non-template expressions are wrapped as {Value} and flagged by --review.\n\n---\n\n### convert-static-class\n\n_Migrate a static class to instance with DI registration and call-site rewrites_\n\n**Mutation** (writes files) | Plain-text output\n\n**When to use:**\n\nMigrating a static class to an instance class with DI: drops the static modifier, generates a matching interface, registers in Bootstrap, and rewrites consumer call sites to use injected references. Pairs with rt analyze static-class-inventory for sequencing.\n\n**Examples:**\n\n```bash\nrt refactor convert-static-class RoslynTools.Services.InspectService --solution RoslynTools.slnx --dry-run\nrt refactor convert-static-class RoslynTools.Services.RenameService --no-interface --solution RoslynTools.slnx\n```\n\n---\n\n### convert-to-record\n\n_Convert a class to a record type with positional parameters_\n\n**Mutation** (writes files) | Plain-text output\n\n**Aliases:** `ctr`\n\n**When to use:**\n\nConverting a class with init-only properties to a positional record, automatically removing redundant Equals/GetHashCode overrides and == operators that the record synthesises. Best suited to immutable DTOs and value objects.\n\n**Examples:**\n\n```bash\nrt refactor convert-to-record --type BookingRequest --solution C:\\code\\libraries\\ProjectX.Libraries.sln\nrt refactor ctr --type Money --dry-run\nrt refactor convert-to-record --type ProductDto --solution RoslynTools.slnx\n```\n\n---\n\n### extract-class\n\n_Move named members from a class into a new class file_\n\n**Mutation** (writes files) | Plain-text output\n\n**Aliases:** `ec`\n\n**When to use:**\n\nMoving a named set of members out of an oversized class into a new dedicated class file. When --static is not set, the command also wires the new class into the source class as a constructor-injected dependency, making it immediately usable without manual plumbing.\n\n**Examples:**\n\n```bash\nrt refactor extract-class --type AdminController --members ExportCsv,ImportCsv --new-type CsvController --solution C:\\code\\libraries\\ProjectX.Libraries.sln\nrt refactor ec --type ReportService --members BuildReport,FormatReport --new-type ReportFormatter --static --dry-run\nrt refactor extract-class --type ProductService --members ValidateProduct --new-type ProductValidator --solution RoslynTools.slnx --output-dir src/Validators\n```\n\n---\n\n### extract-interface\n\n_Generate IXxx interface from a class's public members_\n\n**Mutation** (writes files) | Plain-text output\n\n**Aliases:** `ei`\n\n**When to use:**\n\nGenerating an IXxx interface from an existing class's public members and updating the class declaration to implement it. Use this before injecting a service as a dependency, or when introducing a seam for testing.\n\n**Examples:**\n\n```bash\nrt refactor extract-interface --type BookingService --solution C:\\code\\libraries\\ProjectX.Libraries.sln\nrt refactor ei --type EmailSender --output-dir src/Interfaces --dry-run\nrt refactor extract-interface --type HeroApiClient --namespace ProjectX.Core.Abstractions --solution RoslynTools.slnx\n```\n\n---\n\n### extract-method\n\n_Extract a range of statements into a new private method._\n\n**Mutation** (writes files) | Plain-text output\n\n**Aliases:** `em`\n\n**When to use:**\n\nPulling a consecutive range of statements out of a long method body into a new private method. Specify the line range from the source file; the command infers parameter and return types from context. Use --after/--before to control insertion point.\n\n**Examples:**\n\n```bash\nrt refactor extract-method src/Services/BookingService.cs ValidateBooking --start-line 42 --end-line 58 --solution C:\\code\\libraries\\ProjectX.Libraries.sln\nrt refactor em src/Controllers/AdminController.cs BuildCsvRow --start-line 110 --end-line 125 --dry-run\nrt refactor extract-method src/RoslynTools/Commands/RenameCommand.cs BuildOptions --start-line 30 --end-line 45 --after Build --solution RoslynTools.slnx\n```\n\n**Known issues:**\n\n- --replace-duplicates generic type parameterization (US-049): type constraints are NOT inferred. When duplicates differ by user-defined generic type arguments (e.g. List<MyType> vs List<OtherType>), the extracted method gets <T> but no 'where T : ...' constraint is emitted. This means the generated method may not compile if the body calls type-specific members. Deferred: constraint inference requires semantic analysis of all member access on T across all call sites.\n- --replace-duplicates generic type parameterization: only user-defined type arguments (IdentifierNameSyntax) are detected as varying. Predefined keyword types (int, string, bool, etc.) produce a PatternMatcher structural mismatch so duplicates differing only in keyword types are not detected as generic candidates.\n\n---\n\n### extract-string-constant\n\n_Extract a string literal into a private const string_\n\n**Mutation** (writes files) | Plain-text output\n\n**Aliases:** `esc`\n\n**When to use:**\n\nReplacing a repeated string literal inside one containing type with a named private const string. Use find-magic-strings first to locate the file and line.\n\n**Examples:**\n\n```bash\nrt refactor extract-string-constant --file src/App/Foo.cs --line 42 --name DefaultStatus --solution C:\\code\\app\\App.sln\nrt refactor esc --file tests/FooTests.cs --line 18 --name ExpectedMessage --dry-run --solution RoslynTools.slnx\nrt refactor extract-string-constant --file src/Domain/Order.cs --line 27 --name SubmittedStatus --solution RoslynTools.slnx\n```\n\n---\n\n### fix-namespace\n\n_Align a file's namespace declaration to its folder path_\n\n**Mutation** (writes files) | Plain-text output\n\n**Aliases:** `fns`\n\n**When to use:**\n\nCorrecting a file's namespace declaration to match its folder path after moving files, or when a file was created in the wrong location. Also updates any using directives in other files that imported the old namespace.\n\n**Examples:**\n\n```bash\nrt refactor fix-namespace --file src/Services/BookingService.cs --solution C:\\code\\libraries\\ProjectX.Libraries.sln\nrt refactor fns --file src/RoslynTools/Commands/RenameCommand.cs --dry-run\nrt refactor fix-namespace --file src/Domain/Order.cs --solution RoslynTools.slnx\n```\n\n---\n\n### implement-interface\n\n_Generate throw-stub implementations for unimplemented interface members_\n\n**Mutation** (writes files) | Plain-text output\n\n**Aliases:** `ii`\n\n**When to use:**\n\nGenerating throw-stub implementations for all unimplemented interface members in a class. Use after extract-interface or when a class is added to an interface's base list and needs skeleton stubs before real implementations are written.\n\n**Examples:**\n\n```bash\nrt refactor implement-interface --type BookingRepository --interface IBookingRepository --solution C:\\code\\libraries\\ProjectX.Libraries.sln\nrt refactor ii --type EmailSender --dry-run\nrt refactor implement-interface --type HeroApiClient --solution RoslynTools.slnx\n```\n\n---\n\n### inline-method\n\n_Inline a method by replacing all call sites with the method body_\n\n**Mutation** (writes files) | Plain-text output\n\n**Aliases:** `im`\n\n**When to use:**\n\nInlining a trivial helper method (expression-bodied or single-return block) at every call site and removing the method declaration. Best for one-liner wrappers that add no clarity — over-extracted private methods that obscure intent.\n\n**Examples:**\n\n```bash\nrt refactor inline-method --type MathHelper --method Double --solution RoslynTools.slnx\nrt refactor im --type OrderService --method GetTotal --dry-run --solution C:\\code\\libraries\\ProjectX.Libraries.sln\n```\n\n---\n\n### make-async\n\n_Convert a synchronous method to async Task<T> and update direct callers_\n\n**Mutation** (writes files) | Plain-text output\n\n**Aliases:** `ma`\n\n**When to use:**\n\nConverting a synchronous method to async Task<T> and updating its direct call sites with await, without manually hunting every invocation. Use --no-rename to skip the Async suffix when the call sites already have naming that makes async clear.\n\n**Examples:**\n\n```bash\nrt refactor make-async --type BookingService --method Save --solution C:\\code\\libraries\\ProjectX.Libraries.sln\nrt refactor ma --type EmailSender --method Send --no-rename --dry-run\nrt refactor make-async --type HeroApiClient --method FetchAvailability --solution RoslynTools.slnx\n```\n\n---\n\n### make-instance\n\n_Remove static from a method and rewrite call sites to use an instance_\n\n**Mutation** (writes files) | Plain-text output\n\n**Aliases:** `mns`\n\n**When to use:**\n\nConverting a static method to an instance method. Removes the `static` modifier from the declaration and rewrites `Type.Method(...)` call sites to `instance.Method(...)` where an instance is reachable (local variable, field, or parameter of the correct type). Call sites with no reachable instance are warned and left unchanged.\n\n**Examples:**\n\n```bash\nrt refactor make-instance --method OrderService.Validate --solution C:\\code\\libraries\\ProjectX.Libraries.sln\nrt refactor mns --method MathHelper.Compute --dry-run --solution RoslynTools.slnx\n```\n\n---\n\n### make-sealed\n\n_Add the sealed modifier to a class that has no derived types_\n\n**Mutation** (writes files) | Plain-text output\n\n**Aliases:** `ms`\n\n**When to use:**\n\nAdding the sealed modifier to a class that has no derived types in the solution. Sealing classes improves runtime dispatch performance and communicates design intent. The command verifies no derived classes exist before modifying, making it safe to run without a prior manual check.\n\n**Examples:**\n\n```bash\nrt refactor make-sealed --type BookingValidator --solution C:\\code\\libraries\\ProjectX.Libraries.sln\nrt refactor ms --type CsvFormatter --dry-run\nrt refactor make-sealed --type RtCommandInfo --solution RoslynTools.slnx\n```\n\n---\n\n### make-static\n\n_Convert an instance method to static when it has no instance-state dependencies_\n\n**Mutation** (writes files) | Plain-text output\n\n**Aliases:** `mst`\n\n**When to use:**\n\nConverting an instance method to static when it has no instance-state dependencies. Validates safety (no 'this', no instance field/property access, not virtual/override/abstract) before modifying and rewrites all call sites from instance.Method() to Type.Method().\n\n**Examples:**\n\n```bash\nrt refactor make-static --method OrderValidator.Validate --solution C:\\code\\libraries\\ProjectX.Libraries.sln\nrt refactor mst --method MathHelper.Clamp --dry-run\nrt refactor make-static --method SymbolLocator.ParseSpec --solution RoslynTools.slnx\n```\n\n---\n\n### migrate-to-ioptions\n\n_Create an options POCO and register it with services.Configure<T>_\n\n**Mutation** (writes files) | Plain-text output\n\n**Aliases:** `mti`\n\n**When to use:**\n\nIntroducing a typed IOptions POCO for an existing configuration section while leaving read-site rewrites as an explicit follow-up worklist.\n\n**Examples:**\n\n```bash\nrt refactor migrate-to-ioptions --section MyFeature --name MyFeatureOptions --solution RoslynTools.slnx\nrt refactor migrate-to-ioptions --section MyFeature --name MyFeatureOptions --dry-run\n```\n\n---\n\n### move\n\n_Move a type to a different namespace, updating the declaration and all references_\n\n**Mutation** (writes files) | Plain-text output\n\n**When to use:**\n\nMoving a type to a different namespace — or batch-moving all types in a namespace — while updating the declaration and all reference sites (using directives and fully-qualified names). Use --move-file to also relocate the source file(s) to match the new namespace folder structure. Use --to-project to physically move a file across project boundaries while keeping its namespace intact.\n\n**Examples:**\n\n```bash\nrt refactor move --type ProjectX.Core.Services.BookingService --to-namespace ProjectX.Domain.Services --solution C:\\code\\libraries\\ProjectX.Libraries.sln\nrt refactor move --namespace ProjectX.Core.Models --to-namespace ProjectX.Domain.Entities --move-file --dry-run --solution C:\\code\\libraries\\ProjectX.Libraries.sln\nrt refactor move --type RoslynTools.Commands.RenameCommand --to-namespace RoslynTools.Commands.Rename --solution RoslynTools.slnx\nrt refactor move --type MyApp.Api.Models.Product --to-project MyApp.Domain --solution MyApp.sln\nrt refactor move --type MyApp.Api.Models.Product --to-project MyApp.Domain --to-namespace MyApp.Domain.Models --solution MyApp.sln\n```\n\n---\n\n### move-method\n\n_Move a static method to another class, rewriting all call sites_\n\n**Mutation** (writes files) | Plain-text output\n\n**When to use:**\n\nMoving a static method from one class to another, rewriting all call sites across the solution. Use when reorganising utility helpers or pulling methods toward the types they operate on. Pass --create-file to create the target class if it does not yet exist.\n\n**Examples:**\n\n```bash\nrt refactor move-method App.Source.Add --to-type App.Target --solution RoslynTools.slnx --dry-run\nrt refactor move-method MathApp.MathHelper.Double --to-type MathApp.MathUtils --solution MySolution.sln\nrt refactor move-method Helpers.StringUtils.Truncate --to-type Helpers.TextHelper --create-file --solution MySolution.sln\n```\n\n---\n\n### narrow-dependency\n\n_Extract a member subset into a new interface and narrow consumers that only use that subset_\n\n**Mutation** (writes files) | Plain-text output\n\n**Aliases:** `nd`\n\n**When to use:**\n\nInterface-segregation refactoring: extracts a named subset of an interface's members into a new narrower interface and rewrites consumers that only use that subset to depend on the narrower type. Consumers that require members outside the subset are left unchanged and reported. DI registration updates are reported as a manual follow-up.\n\n**Examples:**\n\n```bash\nrt refactor narrow-dependency IWideFacade --members Send --new-name ISender --solution C:\\code\\libraries\\ProjectX.Libraries.sln\nrt refactor nd IEmailService --members Send,SendBulk --new-name IEmailSender --solution RoslynTools.slnx --dry-run\nrt refactor narrow-dependency ProjectX.Core.IRepository --members GetById,GetAll --new-name IReadOnlyRepository --solution C:\\code\\libraries\\ProjectX.Libraries.sln\n```\n\n---\n\n### rename\n\n_Rename a symbol and all its references across the solution_\n\n**Mutation** (writes files) | Plain-text output\n\n**Aliases:** `ren`\n\n**When to use:**\n\nRenaming a C# symbol (type, method, property, field, namespace) and updating every reference across the solution. Prefer over grep+sed: rt uses Roslyn semantic rename so references that only bind by type inference are also updated, and string literals/comments are not accidentally rewritten. Use --csv to batch-apply a curated rename mapping file.\n\n**Examples:**\n\n```bash\nrt refactor rename OldTypeName NewTypeName --solution MySolution.sln\nrt refactor rename MyNs.MyType.OldProp NewProp --kind property --dry-run\nrt refactor rename --csv scripts/renames.csv --solution MySolution.sln --dry-run\nrt refactor ren FooService BarService              # short alias, auto-detect solution\n```\n\n---\n\n### replace-call\n\n_Replace all invocations of one static method with another_\n\n**Mutation** (writes files) | Plain-text output\n\n**Aliases:** `rc`\n\n**When to use:**\n\nReplacing all invocations of a static method with a different method name across the solution. Use when renaming a utility method that isn't captured by a semantic rename (e.g. because callers use it via a static import or the old name needs to stay as an overload).\n\n**Examples:**\n\n```bash\nrt refactor replace-call --from Logger.Log --to LogInfo --solution C:\\code\\libraries\\ProjectX.Libraries.sln\nrt refactor rc --from DateHelper.UtcNow --to TimeProvider.GetUtcNow --dry-run --solution C:\\code\\libraries\\ProjectX.Libraries.sln\nrt refactor replace-call --from Console.WriteLine --to Logger.Info --solution RoslynTools.slnx\n```\n\n---\n\n### replace-datetime\n\n_Replace DateTime.UtcNow / DateTime.Now with injected TimeProvider, adding constructor injection_\n\n**Mutation** (writes files) | Plain-text output\n\n**When to use:**\n\nReplacing all DateTime.UtcNow and DateTime.Now usages with injected TimeProvider calls (_timeProvider.GetUtcNow().UtcDateTime / GetLocalNow().DateTime) and automatically wiring TimeProvider into the affected class constructors. Run solution-wide before adding unit tests that need controllable time.\n\n**Examples:**\n\n```bash\nrt refactor replace-datetime --solution C:\\code\\libraries\\ProjectX.Libraries.sln\nrt refactor replace-datetime --dry-run --solution C:\\code\\libraries\\ProjectX.Libraries.sln\nrt refactor replace-datetime --solution RoslynTools.slnx\n```\n\n---\n\n### replace-new\n\n_Replace all constructor invocations of a type with a method call_\n\n**Mutation** (writes files) | Plain-text output\n\n**Aliases:** `rn`\n\n**When to use:**\n\nReplacing all constructor invocations of a type with a method call or different constructor. Use when consolidating option construction patterns into factory methods.\n\n**Examples:**\n\n```bash\nrt refactor replace-new --type \"Option<string>\" --with \"Factory.CreateStringOption\" --solution RoslynTools.slnx --dry-run\nrt refactor rn --type \"Option<string?>\" --with \"CreateFieldOption\" --if-arg 0 --if-arg-literal \"--field\" --solution RoslynTools.slnx\nrt refactor replace-new --type \"Option<string?>\" --with \"Factory.CreateSolutionOption\" --if-arg 0 --if-arg-literal \"--solution\" --drop-matched-arg --solution RoslynTools.slnx --dry-run\n```\n\n---\n\n### replace-xunit-asserts\n\n_Replace common Xunit Assert calls with Shouldly assertions_\n\n**Mutation** (writes files) | Plain-text output\n\n**Aliases:** `rxa`\n\n**When to use:**\n\nMigrating Xunit Assert calls in tests to Shouldly's fluent assertion style. Defaults to review mode; pass --apply to write changes.\n\n**Examples:**\n\n```bash\nrt refactor replace-xunit-asserts --solution RoslynTools.slnx\nrt refactor rxa --apply --solution C:\\code\\app\\App.sln\nrt refactor replace-xunit-asserts --dry-run --solution C:\\code\\app\\App.sln\n```\n\n**Known issues:**\n\n- Only common Assert calls are converted automatically; unsupported assertions are left unchanged.\n- Assert overloads that include comparers, precision, inspectors, or custom messages are left unchanged.\n- The command adds `using Shouldly;` to files with replacements and leaves existing Xunit imports in place for attributes such as [Fact].\n\n---\n\n### safe-delete\n\n_Delete a type or member only if it has no references_\n\n**Mutation** (writes files) | Plain-text output\n\n**Aliases:** `sd`\n\n**When to use:**\n\nDeleting a type or member only after verifying it has zero references in the solution. Safer than a manual delete because the command checks references (excluding nameof() and the declaration itself) before touching any file, and exits non-zero if references exist.\n\n**Examples:**\n\n```bash\nrt refactor safe-delete --symbol OrphanedHelper --solution C:\\code\\libraries\\ProjectX.Libraries.sln\nrt refactor sd --symbol BookingService.LegacyMethod --kind method --dry-run --solution C:\\code\\libraries\\ProjectX.Libraries.sln\nrt refactor safe-delete --symbol OldDtoType --kind type --solution RoslynTools.slnx\n```\n\n---\n\n### transform-parameters\n\n_Extract method parameters into a new record and update all call sites._\n\n**Mutation** (writes files) | Plain-text output\n\n**Aliases:** `tp`\n\n**When to use:**\n\nIntroduce a Parameter Object: extract a method's parameters into a new record and update all call sites. Useful when a method has 3+ parameters that logically belong together.\n\n**Examples:**\n\n```bash\nrt refactor transform-parameters --method OrderService.PlaceOrder --new-type PlaceOrderArgs --solution MySolution.sln\nrt refactor tp --method BookingService.Create --new-type CreateBookingArgs --dry-run\nrt refactor transform-parameters --method Calculator.Add --existing-type MyApp.AddArgs --solution RoslynTools.slnx --dry-run\n```\n\n---\n\n\n"}], "RT-004": [{"path": "docs/logging-standards.md", "content": "# Logging and Output Standards\n\nThis is the target standard for the logging migration. The `RtConsole` and `RtLog`\ninfrastructure exists now; most command and service call sites still use direct\n`Console.*` calls and should be migrated in a focused pass.\n\nUse `rt` itself where practical for the migration. Commands such as `replace-call`,\n`find-refs`, `find-pattern`, and `inspect` can handle much of the discovery and\nmechanical rewriting, with manual review reserved for stream/context choices and\nmessage-template quality.\n\n## Rules\n\n1. Production console I/O should go through `RtConsole`.\n2. Diagnostic log calls should use message templates, not dynamic expressions.\n3. Command result payloads belong on stdout; diagnostics and progress belong on stderr.\n4. Dry-run unified diffs belong on stdout.\n\n## Templates\n\nUse literal templates with named placeholders:\n\n```csharp\nRtLog.Info(\"Updated {FilePath}\", filePath);\nRtLog.Warning(\"Skipped {Count} document(s) with no file path.\", count);\n```\n\nAvoid interpolated strings, concatenation, variables, and `string.Format` for log templates:\n\n```csharp\nRtLog.Info($\"Updated: {filePath}\");\nRtLog.Info(\"Updated: \" + filePath);\nRtLog.Info(message);\n```\n\n## Output Contexts\n\nUse `RtConsole` with the appropriate `RtOutputContext` flag.\n\n| Context | Stream | Use for |\n| --- | --- | --- |\n| `Diagnostic` | stderr | Operational messages: progress, warnings, errors |\n| `Result` | stdout | Command result data: JSON payloads, plain-text summaries |\n| `Diff` | stdout | Dry-run unified diff output |\n| `Interactive` | stdout | Disambiguation prompts, numbered menus |\n| `Ui` | stdout | Decorative terminal output: colors, section headers |\n\nIf the `Diagnostic` flag is set, `RtConsole` routes to stderr. Other contexts route to stdout.\n"}]}};
    window.__PRD_REFRESH_SECONDS__ = 15;
    window.__PRD_SERVER__ = false;
    window.__PRD_SCAN_ROOT__ = "";
  </script>
  <script>
    const e = React.createElement;

    function normalizeStory(story) {
      const acceptance = Array.isArray(story && story.acceptanceCriteria) ? story.acceptanceCriteria : [];
      return {
        id: String(story && story.id || ""),
        title: String(story && story.title || ""),
        description: String(story && story.description || ""),
        acceptanceCriteria: acceptance.map((item) => String(item)),
        priority: Number(story && story.priority || 9999),
        passes: Boolean(story && story.passes),
        notes: String(story && story.notes || ""),
        epicId: String(story && story.epicId || "")
      };
    }

    function normalizeEpic(epic) {
      return {
        id: String(epic && epic.id || ""),
        title: String(epic && epic.title || ""),
        description: String(epic && epic.description || ""),
        notes: String(epic && epic.notes || "")
      };
    }

    function normalizeProject(raw, fallback) {
      const stories = Array.isArray(raw && raw.userStories) ? raw.userStories.map(normalizeStory) : [];
      const epics = Array.isArray(raw && raw.epics) ? raw.epics.map(normalizeEpic) : [];
      const sortedStories = stories.slice().sort((left, right) => {
        if (left.passes !== right.passes) return left.passes ? 1 : -1;
        if (left.priority !== right.priority) return left.priority - right.priority;
        return left.id.localeCompare(right.id);
      });
      const total = sortedStories.length;
      const complete = sortedStories.filter((story) => story.passes).length;
      const pending = total - complete;
      return {
        project: String(raw && raw.project || fallback.project || "PRD"),
        branchName: String(raw && raw.branchName || fallback.branchName || ""),
        description: String(raw && raw.description || fallback.description || ""),
        path: fallback.path || "",
        sourceUrl: fallback.sourceUrl || "",
        stats: {
          total: total,
          complete: complete,
          pending: pending,
          completionPct: total ? Math.round((complete / total) * 100) : 0
        },
        epics: epics,
        stories: sortedStories
      };
    }

    function escapeHtml(value) {
      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");
    }

    function renderInlineMarkdown(text) {
      let value = escapeHtml(text);
      value = value.replace(/`([^`]+)`/g, "<code>$1</code>");
      value = value.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
      value = value.replace(/\*([^*]+)\*/g, "<em>$1</em>");
      return value;
    }

    function renderMarkdown(text) {
      const value = String(text || "").replace(/\r\n/g, "\n").trim();
      if (!value) return "";

      const lines = value.split("\n");
      const parts = [];
      let inList = false;

      function closeList() {
        if (inList) {
          parts.push("</ul>");
          inList = false;
        }
      }

      for (const rawLine of lines) {
        const line = rawLine.trim();
        if (!line) {
          closeList();
          continue;
        }

        if (line.startsWith("- ") || line.startsWith("* ")) {
          if (!inList) {
            parts.push("<ul>");
            inList = true;
          }
          parts.push("<li>" + renderInlineMarkdown(line.slice(2).trim()) + "</li>");
          continue;
        }

        closeList();

        if (line.startsWith("### ")) {
          parts.push("<h5>" + renderInlineMarkdown(line.slice(4)) + "</h5>");
        } else if (line.startsWith("## ")) {
          parts.push("<h4>" + renderInlineMarkdown(line.slice(3)) + "</h4>");
        } else if (line.startsWith("# ")) {
          parts.push("<h3>" + renderInlineMarkdown(line.slice(2)) + "</h3>");
        } else {
          parts.push("<p>" + renderInlineMarkdown(line) + "</p>");
        }
      }

      closeList();
      return parts.join("");
    }

    function MarkdownBlock(props) {
      return e("div", {
        className: props.className || "markdown",
        dangerouslySetInnerHTML: { __html: renderMarkdown(props.text) }
      });
    }

    function renderSpecMarkdown(text) {
      if (typeof marked === "undefined") {
        return renderMarkdown(text);
      }
      return marked.parse(String(text || ""), { gfm: true, breaks: false });
    }

    function DetailsPane(props) {
      const project = props.project;
      const story = props.story;

      if (!project || !story) {
        return e("div", { className: "empty" }, "Select a story.");
      }

      return e("div", { className: "details-inner" },
        e("div", { className: "mobile-summary" },
          e("div", { className: "story-id" }, story.id),
          e("div", { className: "story-title" }, story.title)
        ),
        story.notes ? e("div", { className: "section" },
          e("h4", null, "Notes"),
          e(MarkdownBlock, { text: story.notes })
        ) : null,
        e("div", { className: "section" },
          e("h4", null, "Acceptance Criteria"),
          e("ol", { className: "acceptance-list" },
            story.acceptanceCriteria.map((item, index) =>
              e("li", { key: story.id + "-ac-" + index, className: "acceptance-item" },
                e("span", { className: "acceptance-index" }, String(index + 1).padStart(2, "0")),
                e(MarkdownBlock, { text: item })
              )
            )
          )
        )
      );
    }

    function SummaryPane(props) {
      const project = props.project;
      const story = props.story;

      if (!project || !story) {
        return e("div", { className: "empty" }, "Select a story.");
      }

      const allDocs = window.__PRD_LINKED_DOCS__ || {};
      const projectDocs = (project.path && allDocs[project.path]) || {};
      const docs = projectDocs[story.id] || [];

      return e("div", { className: "summary-inner" },
        e("div", { className: "story-id" }, story.id),
        e("h3", { className: "summary-title" }, story.title),
        e("div", { className: "summary-meta" },
          e("span", { className: "pill priority" }, "P" + story.priority),
          e("span", { className: "pill " + (story.passes ? "complete" : "pending") }, story.passes ? "Complete" : "Pending"),
          e("span", { className: "pill" }, story.acceptanceCriteria.length + " ACs")
        ),
        e(MarkdownBlock, { className: "markdown", text: story.description }),
        docs.length ? e("div", { className: "linked-docs" },
          docs.map((doc, i) =>
            e("article", { key: doc.path + "-" + i, className: "linked-doc" },
              e("div", { className: "linked-doc-path" }, doc.path),
              e("div", {
                className: "markdown spec-markdown",
                dangerouslySetInnerHTML: { __html: renderSpecMarkdown(doc.content) }
              })
            )
          )
        ) : null
      );
    }

    function EpicSummaryBar(props) {
      const epics = props.epics || [];
      const stories = props.stories || [];
      if (!epics.length) return null;
      const active = (props.activeEpic || "all").toUpperCase();
      return e("div", { className: "epic-bar" },
        e("button", {
          type: "button",
          className: "epic-chip epic-chip-all" + (active === "ALL" ? " active" : ""),
          onClick: () => props.onSelect("all")
        },
          "All",
          e("span", { className: "epic-count" }, stories.filter((s) => s.passes).length + "/" + stories.length)
        ),
        epics.map((ep) => {
          const under = stories.filter((s) => (s.epicId || "").toUpperCase() === ep.id.toUpperCase());
          const done = under.filter((s) => s.passes).length;
          const isActive = active === ep.id.toUpperCase();
          return e("button", {
            key: ep.id,
            type: "button",
            className: "epic-chip" + (isActive ? " active" : ""),
            title: ep.title,
            onClick: () => props.onSelect(isActive ? "all" : ep.id)
          },
            e("span", { className: "epic-id" }, ep.id),
            ep.title,
            e("span", { className: "epic-count" }, done + "/" + under.length)
          );
        })
      );
    }

    function StoryListPane(props) {
      return e(React.Fragment, null,
        e(EpicSummaryBar, {
          epics: props.project && props.project.epics,
          stories: props.project && props.project.stories,
          activeEpic: props.epicFilter,
          onSelect: props.onEpicFilterChange
        }),
        e("div", { className: "sidebar-top" },
          e("div", { className: "filters" },
            e("input", {
              className: "search",
              type: "search",
              placeholder: "Filter text...",
              value: props.query,
              onChange: (event) => props.onQueryChange(event.target.value)
            }),
            e("select", {
              className: "filter-select",
              value: props.statusFilter,
              onChange: (event) => props.onStatusFilterChange(event.target.value)
            },
              e("option", { value: "all" }, "All status"),
              e("option", { value: "pending" }, "Pending"),
              e("option", { value: "complete" }, "Complete")
            ),
            e("select", {
              className: "filter-select",
              value: props.urgencyFilter,
              onChange: (event) => props.onUrgencyFilterChange(event.target.value)
            },
              e("option", { value: "all" }, "All urgency"),
              e("option", { value: "high" }, "High"),
              e("option", { value: "medium" }, "Medium"),
              e("option", { value: "low" }, "Low")
            )
          )
        ),
        e("div", { className: "story-list" },
          props.filteredStories.length ? props.filteredStories.map((story) =>
            e("button", {
              key: story.id,
              className: "story-row" + ((props.selectedStory && props.selectedStory.id === story.id) ? " active" : ""),
              onClick: () => props.onSelectStory(story.id)
            },
              e("div", { className: "story-row-top" },
                e("div", null,
                  e("div", { className: "story-id" }, story.id),
                  e("div", { className: "story-title" }, story.title)
                ),
                e("span", { className: "pill " + (story.passes ? "complete" : "pending") }, story.passes ? "Done" : "Pending")
              ),
              e("div", { className: "story-desc-preview" }, story.description),
              e("div", { className: "pill-row" },
                e("span", { className: "pill priority" }, "P" + story.priority),
                story.epicId ? e("span", { className: "pill epic" }, story.epicId) : null,
                e("span", { className: "pill" }, story.acceptanceCriteria.length + " ACs")
              )
            )
          ) : e("div", { className: "empty" }, "No stories match that filter.")
        )
      );
    }

    const STORAGE_KEY = "prd-visualizer:state";
    const COOKIE_LAST_PRD = "prdViewer.lastPrd";
    const COOKIE_HIDE_COMPLETED = "prdViewer.hideCompletedPrds";
    const COOKIE_LAST_SELECTION = "prdViewer.lastSelection";
    const DEFAULT_STATE = { theme: "cream", col1Pct: 28, col2Pct: 32 };
    const THEMES = [
      { id: "cream", label: "Cream" },
      { id: "dark", label: "Dark" },
      { id: "paper", label: "Paper" }
    ];

    function setCookie(name, value) {
      const maxAge = 60 * 60 * 24 * 365;
      document.cookie = name + "=" + encodeURIComponent(value) + "; path=/; max-age=" + maxAge + "; SameSite=Lax";
    }

    function getCookie(name) {
      const prefix = name + "=";
      const parts = document.cookie ? document.cookie.split("; ") : [];
      for (const part of parts) {
        if (part.startsWith(prefix)) {
          return decodeURIComponent(part.slice(prefix.length));
        }
      }
      return "";
    }

    function loadState() {
      try {
        const raw = window.localStorage.getItem(STORAGE_KEY);
        if (!raw) return { ...DEFAULT_STATE };
        const parsed = JSON.parse(raw);
        return {
          theme: typeof parsed.theme === "string" ? parsed.theme : DEFAULT_STATE.theme,
          col1Pct: typeof parsed.col1Pct === "number" ? parsed.col1Pct : DEFAULT_STATE.col1Pct,
          col2Pct: typeof parsed.col2Pct === "number" ? parsed.col2Pct : DEFAULT_STATE.col2Pct
        };
      } catch (err) {
        return { ...DEFAULT_STATE };
      }
    }

    function saveState(state) {
      try {
        window.localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      } catch (err) {
        /* ignore quota/privacy errors */
      }
    }

    function clampPct(value, min, max) {
      if (!Number.isFinite(value)) return min;
      if (value < min) return min;
      if (value > max) return max;
      return value;
    }

    function PrdPicker(props) {
      const ref = React.useRef(null);

      React.useEffect(() => {
        if (!props.open) return undefined;
        function onDocClick(ev) {
          if (ref.current && !ref.current.contains(ev.target)) {
            props.onClose();
          }
        }
        function onKey(ev) {
          if (ev.key === "Escape") props.onClose();
        }
        window.addEventListener("mousedown", onDocClick);
        window.addEventListener("keydown", onKey);
        return () => {
          window.removeEventListener("mousedown", onDocClick);
          window.removeEventListener("keydown", onKey);
        };
      }, [props.open, props.onClose]);

      const visibleOptions = React.useMemo(() => {
        const all = props.options || [];
        const filtered = props.hideCompleted
          ? all.filter((item) => item.pending !== 0 || item.path === props.activePath)
          : all.slice();
        if (props.activePath && !filtered.some((item) => item.path === props.activePath)) {
          const activeEntry = all.find((item) => item.path === props.activePath);
          if (activeEntry) filtered.unshift(activeEntry);
        }
        return filtered;
      }, [props.options, props.activePath, props.hideCompleted]);

      const activeOption = (props.options || []).find((item) => item.path === props.activePath);
      const triggerLabel = activeOption ? activeOption.project : (props.activePath || "Choose PRD");

      return e("div", { className: "prd-picker", ref: ref },
        e("button", {
          type: "button",
          className: "prd-picker-trigger" + (props.open ? " open" : ""),
          onClick: props.onToggle,
          title: activeOption ? activeOption.path : "Choose PRD"
        },
          e("svg", { className: "prd-picker-icon", viewBox: "0 0 24 24", "aria-hidden": "true" },
            e("path", { d: "M4 6.5h6l2 2H20a1 1 0 0 1 1 1V18a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7.5a1 1 0 0 1 1-1Z" })
          ),
          e("span", { className: "prd-picker-label" }, triggerLabel),
          e("span", { className: "prd-picker-caret" }, "▾")
        ),
        props.open ? e("div", { className: "prd-picker-menu" },
          e("label", { className: "prd-picker-toggle" },
            e("input", {
              type: "checkbox",
              checked: props.hideCompleted,
              onChange: (ev) => props.onToggleHideCompleted(ev.target.checked)
            }),
            e("span", null, "Hide fully completed PRDs")
          ),
          visibleOptions.length
            ? visibleOptions.map((item) =>
                e("button", {
                  key: item.path,
                  type: "button",
                  className: "prd-option" + (item.path === props.activePath ? " active" : ""),
                  onClick: () => props.onSelect(item.path)
                },
                  e("div", { className: "prd-option-top" },
                    e("div", { className: "prd-option-title" }, item.project || item.path),
                    e("div", { className: "pill-row" },
                      e("span", { className: "pill " + (item.pending === 0 ? "complete" : "pending") },
                        item.pending === 0 ? "Complete" : (item.pending < 0 ? "Error" : item.pending + " pending")
                      )
                    )
                  ),
                  e("div", { className: "prd-option-subtitle" }, item.path)
                )
              )
            : e("div", { className: "empty" }, "No PRDs found under " + (props.scanRoot || "scan root"))
        ) : null
      );
    }

    function App() {
      const SERVER_MODE = Boolean(window.__PRD_SERVER__);
      const SCAN_ROOT = String(window.__PRD_SCAN_ROOT__ || "");
      const initialProjects = window.__PRD_DATA__ || [];
      const initialState = loadState();
      const [projects, setProjects] = React.useState(initialProjects);
      const [projectIndex, setProjectIndex] = React.useState(0);
      const [query, setQuery] = React.useState("");
      const [statusFilter, setStatusFilter] = React.useState("all");
      const [urgencyFilter, setUrgencyFilter] = React.useState("all");
      const [epicFilter, setEpicFilter] = React.useState("all");
      const [syncStatus, setSyncStatus] = React.useState("");
      const [syncError, setSyncError] = React.useState(false);
      const [theme, setTheme] = React.useState(initialState.theme);
      const [scanFiles, setScanFiles] = React.useState([]);
      const [pickerOpen, setPickerOpen] = React.useState(false);
      const [hideCompleted, setHideCompleted] = React.useState(
        SERVER_MODE ? getCookie(COOKIE_HIDE_COMPLETED) !== "false" : true
      );
      const [activePath, setActivePath] = React.useState(() => {
        if (!SERVER_MODE) return "";
        const fromCookie = getCookie(COOKIE_LAST_PRD);
        if (fromCookie) return fromCookie;
        return (initialProjects[0] && initialProjects[0].path) || "";
      });
      const [selectedStoryId, setSelectedStoryId] = React.useState(() => {
        if (SERVER_MODE) {
          try {
            const raw = getCookie(COOKIE_LAST_SELECTION);
            const initialPath = (initialProjects[0] && initialProjects[0].path) || "";
            const cookiePath = getCookie(COOKIE_LAST_PRD) || initialPath;
            if (raw) {
              const parsed = JSON.parse(raw);
              if (parsed && parsed.path === cookiePath && parsed.storyId) {
                return parsed.storyId;
              }
            }
          } catch (e) { /* ignore */ }
        }
        return initialProjects[0] && initialProjects[0].stories[0] ? initialProjects[0].stories[0].id : "";
      });

      const gridRef = React.useRef(null);
      const layoutRef = React.useRef({ col1Pct: initialState.col1Pct, col2Pct: initialState.col2Pct });

      const applyLayout = React.useCallback(() => {
        const el = gridRef.current;
        if (!el) return;
        const { col1Pct, col2Pct } = layoutRef.current;
        el.style.setProperty("--col-1", col1Pct + "%");
        el.style.setProperty("--col-2", col2Pct + "%");
      }, []);

      React.useEffect(() => {
        document.body.setAttribute("data-theme", theme);
      }, [theme]);

      React.useEffect(() => {
        applyLayout();
      }, [applyLayout]);

      const persist = React.useCallback((patch) => {
        const current = loadState();
        saveState({ ...current, ...patch });
      }, []);

      const handleThemeChange = React.useCallback((value) => {
        setTheme(value);
        persist({ theme: value });
      }, [persist]);

      const beginDrag = React.useCallback((which) => (event) => {
        const grid = gridRef.current;
        if (!grid) return;
        event.preventDefault();
        event.target.setPointerCapture(event.pointerId);
        event.target.classList.add("dragging");

        const rect = grid.getBoundingClientRect();
        const width = rect.width;
        const startX = event.clientX;
        const start = { ...layoutRef.current };
        const MIN = 12;
        const MAX_SUM = 80;

        function onMove(ev) {
          const deltaPct = ((ev.clientX - startX) / width) * 100;
          if (which === 1) {
            const next = clampPct(start.col1Pct + deltaPct, MIN, MAX_SUM - start.col2Pct);
            layoutRef.current = { ...layoutRef.current, col1Pct: next };
          } else {
            const next = clampPct(start.col2Pct + deltaPct, MIN, MAX_SUM - start.col1Pct);
            layoutRef.current = { ...layoutRef.current, col2Pct: next };
          }
          applyLayout();
        }

        function onUp(ev) {
          event.target.classList.remove("dragging");
          try { event.target.releasePointerCapture(event.pointerId); } catch (e) {}
          window.removeEventListener("pointermove", onMove);
          window.removeEventListener("pointerup", onUp);
          persist({ col1Pct: layoutRef.current.col1Pct, col2Pct: layoutRef.current.col2Pct });
        }

        window.addEventListener("pointermove", onMove);
        window.addEventListener("pointerup", onUp);
      }, [applyLayout, persist]);

      const project = projects[projectIndex] || null;

      React.useEffect(() => {
        if (SERVER_MODE) return undefined;
        const refreshSeconds = Number(window.__PRD_REFRESH_SECONDS__ || 0);
        if (!refreshSeconds || !initialProjects.length) {
          return undefined;
        }

        let cancelled = false;

        async function refreshProjects() {
          try {
            const refreshed = await Promise.all(initialProjects.map(async (item) => {
              if (!item.sourceUrl) {
                return item;
              }

              const response = await fetch(item.sourceUrl + "?t=" + Date.now(), { cache: "no-store" });
              if (!response.ok) {
                throw new Error("HTTP " + response.status);
              }

              const raw = await response.json();
              return normalizeProject(raw, item);
            }));

            if (!cancelled) {
              setProjects(refreshed);
              setSyncStatus("Auto-refreshed " + new Date().toLocaleTimeString());
              setSyncError(false);
            }
          } catch (error) {
            if (!cancelled) {
              setSyncStatus("Auto-refresh unavailable in this browser context");
              setSyncError(true);
            }
          }
        }

        refreshProjects();
        const timer = window.setInterval(refreshProjects, refreshSeconds * 1000);
        return () => {
          cancelled = true;
          window.clearInterval(timer);
        };
      }, []);

      // SERVER MODE: scan for prd.json files for the picker.
      React.useEffect(() => {
        if (!SERVER_MODE) return undefined;
        let cancelled = false;
        async function doScan() {
          try {
            const url = SCAN_ROOT
              ? "/api/scan?root=" + encodeURIComponent(SCAN_ROOT) + "&t=" + Date.now()
              : "/api/scan?t=" + Date.now();
            const r = await fetch(url, { cache: "no-store" });
            if (!r.ok) {
              const err = await r.json().catch(() => ({}));
              throw new Error(err.error || ("HTTP " + r.status));
            }
            const data = await r.json();
            if (!cancelled) setScanFiles(data.files || []);
          } catch (err) {
            if (!cancelled) {
              setSyncStatus("Scan failed: " + (err.message || "unknown"));
              setSyncError(true);
            }
          }
        }
        doScan();
        const baseInterval = Number(window.__PRD_REFRESH_SECONDS__ || 0) || 30;
        const timer = window.setInterval(doScan, Math.max(baseInterval, 10) * 1000);
        return () => {
          cancelled = true;
          window.clearInterval(timer);
        };
      }, []);

      // SERVER MODE: load PRD + linked docs whenever activePath changes.
      React.useEffect(() => {
        if (!SERVER_MODE || !activePath) return undefined;
        let cancelled = false;
        async function load() {
          try {
            const [prdRes, docsRes] = await Promise.all([
              fetch("/api/prd?path=" + encodeURIComponent(activePath) + "&t=" + Date.now(), { cache: "no-store" }),
              fetch("/api/linked-docs?path=" + encodeURIComponent(activePath) + "&t=" + Date.now(), { cache: "no-store" })
            ]);
            if (!prdRes.ok) {
              const err = await prdRes.json().catch(() => ({}));
              throw new Error(err.error || ("HTTP " + prdRes.status));
            }
            const raw = await prdRes.json();
            // /api/prd returns the already-normalized payload (key: stories, not userStories);
            // pass through unchanged, only filling fields the layer below expects.
            const normalized = {
              ...raw,
              path: raw.path || activePath,
              sourceUrl: "",
              stories: Array.isArray(raw.stories) ? raw.stories : [],
              epics: Array.isArray(raw.epics) ? raw.epics : [],
              stats: raw.stats || { total: 0, complete: 0, pending: 0, completionPct: 0 }
            };
            if (docsRes.ok) {
              const docsData = await docsRes.json();
              window.__PRD_LINKED_DOCS__ = window.__PRD_LINKED_DOCS__ || {};
              window.__PRD_LINKED_DOCS__[normalized.path] = docsData.docs || {};
            }
            if (!cancelled) {
              setProjects([normalized]);
              setProjectIndex(0);
              setSyncStatus("Loaded " + new Date().toLocaleTimeString());
              setSyncError(false);
              setSelectedStoryId((current) => {
                if (current && normalized.stories.some((s) => s.id === current)) return current;
                try {
                  const rawSel = getCookie(COOKIE_LAST_SELECTION);
                  if (rawSel) {
                    const parsed = JSON.parse(rawSel);
                    if (parsed && parsed.path === activePath && parsed.storyId &&
                        normalized.stories.some((s) => s.id === parsed.storyId)) {
                      return parsed.storyId;
                    }
                  }
                } catch (e) { /* ignore */ }
                return normalized.stories[0] ? normalized.stories[0].id : "";
              });
              setCookie(COOKIE_LAST_PRD, activePath);
            }
          } catch (err) {
            if (!cancelled) {
              setSyncStatus("Load failed: " + (err.message || "unknown"));
              setSyncError(true);
            }
          }
        }
        load();
        return () => { cancelled = true; };
      }, [activePath]);

      // SERVER MODE: periodic refresh of the active PRD's data (no doc refetch).
      React.useEffect(() => {
        if (!SERVER_MODE || !activePath) return undefined;
        const refreshSeconds = Number(window.__PRD_REFRESH_SECONDS__ || 0);
        if (!refreshSeconds) return undefined;
        let cancelled = false;
        async function tick() {
          try {
            const r = await fetch(
              "/api/prd?path=" + encodeURIComponent(activePath) + "&t=" + Date.now(),
              { cache: "no-store" }
            );
            if (!r.ok) {
              const err = await r.json().catch(() => ({}));
              throw new Error(err.error || ("HTTP " + r.status));
            }
            const raw = await r.json();
            const normalized = {
              ...raw,
              path: raw.path || activePath,
              sourceUrl: "",
              stories: Array.isArray(raw.stories) ? raw.stories : [],
              epics: Array.isArray(raw.epics) ? raw.epics : [],
              stats: raw.stats || { total: 0, complete: 0, pending: 0, completionPct: 0 }
            };
            if (!cancelled) {
              setProjects([normalized]);
              setSyncStatus("Auto-refreshed " + new Date().toLocaleTimeString());
              setSyncError(false);
            }
          } catch (err) {
            if (!cancelled) {
              setSyncStatus("Auto-refresh failed: " + (err.message || "unknown"));
              setSyncError(true);
            }
          }
        }
        const timer = window.setInterval(tick, refreshSeconds * 1000);
        return () => { cancelled = true; window.clearInterval(timer); };
      }, [activePath]);

      // SERVER MODE: persist hide-completed + selected story per PRD.
      React.useEffect(() => {
        if (!SERVER_MODE) return;
        setCookie(COOKIE_HIDE_COMPLETED, hideCompleted ? "true" : "false");
      }, [hideCompleted]);

      React.useEffect(() => {
        if (!SERVER_MODE || !activePath || !selectedStoryId) return;
        setCookie(COOKIE_LAST_SELECTION, JSON.stringify({ path: activePath, storyId: selectedStoryId }));
      }, [activePath, selectedStoryId]);

      // SERVER MODE: close picker after selection.
      React.useEffect(() => {
        if (SERVER_MODE) setPickerOpen(false);
      }, [activePath]);

      React.useEffect(() => {
        if (!project) return;
        const stories = project.stories || [];
        if (!stories.length) {
          setSelectedStoryId("");
          return;
        }
        if (!stories.some((story) => story.id === selectedStoryId)) {
          setSelectedStoryId(stories[0].id);
        }
      }, [projectIndex]);

      const filteredStories = React.useMemo(() => {
        if (!project) return [];
        const normalized = query.trim().toLowerCase();
        const epic = (epicFilter || "all").toUpperCase();
        return project.stories.filter((story) => {
          const matchesEpic =
            epic === "ALL" ||
            (story.epicId || "").toUpperCase() === epic;
          const matchesStatus =
            statusFilter === "all" ||
            (statusFilter === "complete" && story.passes) ||
            (statusFilter === "pending" && !story.passes);
          const matchesUrgency =
            urgencyFilter === "all" ||
            (urgencyFilter === "high" && story.priority <= 5) ||
            (urgencyFilter === "medium" && story.priority > 5 && story.priority <= 10) ||
            (urgencyFilter === "low" && story.priority > 10);
          if (!matchesEpic || !matchesStatus || !matchesUrgency) return false;
          const haystack = [
            story.id,
            story.title,
            story.description,
            story.notes,
            ...story.acceptanceCriteria
          ].join("\n").toLowerCase();
          return !normalized || haystack.includes(normalized);
        });
      }, [project, query, statusFilter, urgencyFilter, epicFilter]);

      const selectedStory =
        filteredStories.find((story) => story.id === selectedStoryId) ||
        (filteredStories.length ? filteredStories[0] : null);

      React.useEffect(() => {
        if (selectedStory && selectedStory.id !== selectedStoryId) {
          setSelectedStoryId(selectedStory.id);
        }
      }, [selectedStory ? selectedStory.id : ""]);

      if (!project) {
        return e("div", { className: "app" },
          e("div", { className: "shell" },
            e("h1", null, "PRD Visualization"),
            e("p", { className: "subtitle" }, "No PRD data loaded.")
          )
        );
      }

      return e("div", { className: "app" },
        e("div", { className: "shell" },
          e("div", { className: "top-bar" },
            SERVER_MODE
              ? e(PrdPicker, {
                  options: scanFiles,
                  activePath: activePath,
                  open: pickerOpen,
                  hideCompleted: hideCompleted,
                  scanRoot: SCAN_ROOT,
                  onToggle: () => setPickerOpen((cur) => !cur),
                  onClose: () => setPickerOpen(false),
                  onSelect: (path) => {
                    if (path !== activePath) {
                      setActivePath(path);
                      setQuery("");
                      setStatusFilter("all");
                      setUrgencyFilter("all");
                      setEpicFilter("all");
                    }
                    setPickerOpen(false);
                  },
                  onToggleHideCompleted: setHideCompleted
                })
              : (projects.length > 1 ? e("div", { className: "project-tabs" },

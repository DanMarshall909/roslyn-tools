<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PRD Visualization</title>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    :root, [data-theme="cream"] {
      --bg: #ece4d4;
      --panel: #fffdf7;
      --panel-2: #f8f1e6;
      --ink: #1d2433;
      --muted: #687387;
      --line: #d7cdbb;
      --accent: #0f766e;
      --accent-soft: #d8f0ec;
      --warn: #9a3412;
      --warn-soft: #ffedd5;
      --done: #166534;
      --done-soft: #dcfce7;
      --shadow: 0 20px 50px rgba(74, 59, 34, 0.12);
      --radius: 22px;
      --body-bg: radial-gradient(circle at top left, #fff8ea 0, transparent 28%), linear-gradient(180deg, #f3ecdf 0%, #e9dfcd 100%);
      --shell-bg: rgba(255, 253, 247, 0.7);
      --shell-border: rgba(215, 205, 187, 0.8);
      --card-bg: #ffffff;
      --card-bg-hover: #fffaf0;
      --card-bg-active: #fff6e8;
      --card-border-hover: #b9a88c;
      --card-border-active: #c89e58;
      --card-shadow-active: rgba(200, 158, 88, 0.22);
      --pill-bg: #f7efe2;
      --pill-priority-bg: #f8efe1;
      --pill-epic-bg: #e8ddf3;
      --pill-epic-fg: #5b3a8c;
      --pill-epic-border: #c9b6e0;
      --pill-pending-border: #f3c89d;
      --pill-complete-border: #b7e4c7;
      --epic-bar-bg: #fcf7ee;
      --acceptance-bg: #fcf7ee;
      --code-bg: #f1eadf;
      --summary-bg: linear-gradient(180deg, #fffdf7 0%, #faf4e8 100%);
      --sidebar-top-bg: linear-gradient(180deg, #fffdf7 0%, #faf4e8 100%);
      --mobile-panel-bg: linear-gradient(180deg, #fffdf7 0%, #faf4e8 100%);
      --mobile-summary-bg: #fffaf0;
      --mobile-panel-body-bg: #ffffff;
      --font-family: Georgia, "Times New Roman", serif;
      --resizer-color: rgba(215, 205, 187, 0.6);
      --resizer-color-hover: #c89e58;
    }
    [data-theme="dark"] {
      --bg: #0f1419;
      --panel: #1a2028;
      --panel-2: #232b36;
      --ink: #e6edf3;
      --muted: #8b949e;
      --line: #30363d;
      --accent: #58a6ff;
      --accent-soft: #1f2d43;
      --warn: #f0883e;
      --warn-soft: #3a220f;
      --done: #3fb950;
      --done-soft: #0f2e19;
      --shadow: 0 20px 50px rgba(0, 0, 0, 0.45);
      --radius: 22px;
      --body-bg: radial-gradient(circle at top left, #1a2430 0, transparent 30%), linear-gradient(180deg, #0d1117 0%, #161b22 100%);
      --shell-bg: rgba(26, 32, 40, 0.7);
      --shell-border: rgba(48, 54, 61, 0.8);
      --card-bg: #161b22;
      --card-bg-hover: #1c232c;
      --card-bg-active: #22303f;
      --card-border-hover: #444c56;
      --card-border-active: #58a6ff;
      --card-shadow-active: rgba(88, 166, 255, 0.22);
      --pill-bg: #22272e;
      --pill-priority-bg: #2a2e37;
      --pill-epic-bg: #2d2640;
      --pill-epic-fg: #c9a9ff;
      --pill-epic-border: #3d345a;
      --pill-pending-border: #3a220f;
      --pill-complete-border: #0f2e19;
      --epic-bar-bg: #161b22;
      --acceptance-bg: #161b22;
      --code-bg: #0d1117;
      --summary-bg: linear-gradient(180deg, #1a2028 0%, #141920 100%);
      --sidebar-top-bg: linear-gradient(180deg, #1a2028 0%, #141920 100%);
      --mobile-panel-bg: linear-gradient(180deg, #1a2028 0%, #141920 100%);
      --mobile-summary-bg: #1c232c;
      --mobile-panel-body-bg: #161b22;
      --font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --resizer-color: rgba(48, 54, 61, 0.8);
      --resizer-color-hover: #58a6ff;
    }
    [data-theme="paper"] {
      --bg: #f5f5f5;
      --panel: #ffffff;
      --panel-2: #fafafa;
      --ink: #111111;
      --muted: #666666;
      --line: #e0e0e0;
      --accent: #1a73e8;
      --accent-soft: #e8f0fe;
      --warn: #c5221f;
      --warn-soft: #fce8e6;
      --done: #137333;
      --done-soft: #e6f4ea;
      --shadow: 0 4px 14px rgba(0, 0, 0, 0.08);
      --radius: 10px;
      --body-bg: #f5f5f5;
      --shell-bg: #ffffff;
      --shell-border: #e0e0e0;
      --card-bg: #ffffff;
      --card-bg-hover: #f7f7f7;
      --card-bg-active: #e8f0fe;
      --card-border-hover: #bdbdbd;
      --card-border-active: #1a73e8;
      --card-shadow-active: rgba(26, 115, 232, 0.18);
      --pill-bg: #f0f0f0;
      --pill-priority-bg: #f0f0f0;
      --pill-epic-bg: #f3e8fd;
      --pill-epic-fg: #6b3fa0;
      --pill-epic-border: #d6c3ef;
      --pill-pending-border: #f9c7c5;
      --pill-complete-border: #b7e1c0;
      --epic-bar-bg: #fafafa;
      --acceptance-bg: #fafafa;
      --code-bg: #f0f0f0;
      --summary-bg: #ffffff;
      --sidebar-top-bg: #ffffff;
      --mobile-panel-bg: #ffffff;
      --mobile-summary-bg: #fafafa;
      --mobile-panel-body-bg: #ffffff;
      --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --resizer-color: #e0e0e0;
      --resizer-color-hover: #1a73e8;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; overflow: hidden; }
    body {
      margin: 0;
      color: var(--ink);
      background: var(--body-bg);
      font-family: var(--font-family);
    }
    #root { height: 100%; }
    .app {
      height: 100vh;
      margin: 0 auto;
      padding: 16px;
      max-width: none;
    }
    .shell {
      height: 100%;
      background: var(--shell-bg);
      border: 1px solid var(--shell-border);
      border-radius: 28px;
      padding: 18px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(10px);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .eyebrow {
      text-transform: uppercase;
      letter-spacing: 0.08em;
      font-size: 0.76rem;
      color: var(--muted);
      margin-bottom: 6px;
    }
    h1, h2, h3, h4, h5, p { margin: 0; }
    .subtitle {
      color: var(--muted);
      margin-top: 6px;
    }
    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      margin-bottom: 14px;
      flex-wrap: wrap;
    }
    .theme-picker {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 0.85rem;
      color: var(--muted);
      white-space: nowrap;
    }
    .theme-picker-label {
      text-transform: uppercase;
      letter-spacing: 0.08em;
      font-size: 0.72rem;
    }
    .theme-select {
      border: 1px solid var(--line);
      background: var(--card-bg);
      color: var(--ink);
      border-radius: 999px;
      padding: 6px 12px;
      font: inherit;
      cursor: pointer;
    }
    .project-tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }
    .project-tab {
      border: 1px solid var(--line);
      background: var(--card-bg);
      color: var(--ink);
      border-radius: 999px;
      padding: 10px 14px;
      cursor: pointer;
      font: inherit;
    }
    .project-tab.active {
      background: var(--accent);
      border-color: var(--accent);
      color: white;
    }
    .prd-picker {
      position: relative;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    .prd-picker-trigger {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      border: 1px solid var(--line);
      background: var(--card-bg);
      color: var(--ink);
      border-radius: 999px;
      padding: 8px 14px;
      cursor: pointer;
      font: inherit;
      max-width: 360px;
    }
    .prd-picker-trigger:hover {
      border-color: var(--card-border-hover);
      background: var(--card-bg-hover);
    }
    .prd-picker-trigger.open {
      border-color: var(--card-border-active);
      background: var(--card-bg-active);
    }
    .prd-picker-icon {
      width: 16px;
      height: 16px;
      flex: 0 0 auto;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .prd-picker-label {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-weight: 600;
    }
    .prd-picker-caret {
      color: var(--muted);
      font-size: 0.7rem;
      flex: 0 0 auto;
    }
    .prd-picker-menu {
      position: absolute;
      top: calc(100% + 8px);
      left: 0;
      width: min(640px, calc(100vw - 48px));
      max-height: 420px;
      overflow: auto;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: var(--panel);
      box-shadow: var(--shadow);
      padding: 10px;
      z-index: 30;
    }
    .prd-picker-toggle {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 10px 12px;
      border-bottom: 1px solid var(--line);
      margin-bottom: 10px;
      font-size: 0.84rem;
      color: var(--muted);
    }
    .prd-picker-toggle input {
      margin: 0;
    }
    .prd-option {
      display: block;
      width: 100%;
      border: 1px solid transparent;
      background: var(--card-bg);
      border-radius: 14px;
      padding: 12px 14px;
      color: var(--ink);
      font: inherit;
      text-align: left;
      cursor: pointer;
    }
    .prd-option + .prd-option {
      margin-top: 8px;
    }
    .prd-option:hover,
    .prd-option.active {
      border-color: var(--card-border-active);
      background: var(--card-bg-active);
    }
    .prd-option-top {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: center;
    }
    .prd-option-title {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-weight: 700;
    }
    .prd-option-subtitle {
      margin-top: 4px;
      color: var(--muted);
      font-size: 0.82rem;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .sync-status {
      padding: 0 6px 12px;
      font-size: 0.84rem;
      color: var(--muted);
    }
    .sync-status.error {
      color: var(--warn);
    }
    .main-grid {
      flex: 1 1 auto;
      display: grid;
      grid-template-columns: var(--col-1, 28%) 6px var(--col-2, 32%) 6px minmax(0, 1fr);
      gap: 0;
      min-height: 0;
    }
    .resizer {
      background: transparent;
      cursor: col-resize;
      position: relative;
      user-select: none;
      touch-action: none;
    }
    .resizer::before {
      content: "";
      position: absolute;
      top: 10%;
      bottom: 10%;
      left: 2px;
      right: 2px;
      background: var(--resizer-color);
      border-radius: 2px;
      transition: background 0.12s ease;
    }
    .resizer:hover::before,
    .resizer.dragging::before {
      background: var(--resizer-color-hover);
    }
    .sidebar, .summary-pane, .details {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--panel);
      overflow: hidden;
    }
    .sidebar {
      display: flex;
      flex-direction: column;
      min-width: 0;
      min-height: 0;
    }
    .sidebar-top {
      padding: 18px;
      border-bottom: 1px solid var(--line);
      background: var(--sidebar-top-bg);
    }
    .filters {
      display: grid;
      grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr) minmax(0, 1fr);
      gap: 10px;
    }
    .filter-select {
      width: 100%;
      border: 1px solid var(--line);
      background: var(--card-bg);
      border-radius: 14px;
      padding: 11px 13px;
      font: inherit;
      color: var(--ink);
    }
    .search {
      width: 100%;
      border: 1px solid var(--line);
      background: var(--card-bg);
      border-radius: 14px;
      padding: 11px 13px;
      font: inherit;
      color: var(--ink);
    }
    .search:focus {
      outline: 2px solid var(--accent-soft);
      border-color: var(--accent);
    }
    .story-list {
      flex: 1 1 auto;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 10px;
      display: grid;
      gap: 10px;
      min-height: 0;
      min-width: 0;
    }
    .story-row {
      border: 1px solid var(--line);
      background: var(--card-bg);
      border-radius: 16px;
      padding: 14px;
      cursor: pointer;
      text-align: left;
      font: inherit;
      color: inherit;
      display: grid;
      gap: 8px;
    }
    .story-row:hover {
      border-color: var(--card-border-hover);
      background: var(--card-bg-hover);
    }
    .story-row.active {
      background: var(--card-bg-active);
      border-color: var(--card-border-active);
      box-shadow: inset 0 0 0 1px var(--card-shadow-active);
    }
    .story-row-top {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: flex-start;
    }
    .story-id {
      font-size: 0.76rem;
      letter-spacing: 0.08em;
      color: var(--muted);
      text-transform: uppercase;
    }
    .story-title {
      font-size: 1rem;
      line-height: 1.25;
    }
    .story-desc-preview {
      color: var(--muted);
      font-size: 0.92rem;
      line-height: 1.35;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .pill-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .pill {
      border-radius: 999px;
      padding: 4px 10px;
      font-size: 0.78rem;
      border: 1px solid var(--line);
      white-space: nowrap;
      background: var(--pill-bg);
    }
    .pill.pending {
      background: var(--warn-soft);
      color: var(--warn);
      border-color: var(--pill-pending-border);
    }
    .pill.complete {
      background: var(--done-soft);
      color: var(--done);
      border-color: var(--pill-complete-border);
    }
    .pill.priority {
      background: var(--pill-priority-bg);
    }
    .pill.epic {
      background: var(--pill-epic-bg);
      color: var(--pill-epic-fg);
      border-color: var(--pill-epic-border);
    }
    .epic-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      padding: 10px 12px;
      border-bottom: 1px solid var(--line);
      background: var(--epic-bar-bg);
    }
    .epic-chip {
      background: var(--card-bg);
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 4px 10px;
      font-size: 0.78rem;
      color: var(--ink);
      font: inherit;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .epic-chip:hover {
      border-color: var(--card-border-hover);
      background: var(--card-bg-hover);
    }
    .epic-chip.active {
      background: var(--pill-epic-bg);
      border-color: var(--pill-epic-border);
      box-shadow: inset 0 0 0 1px var(--card-shadow-active);
    }
    .epic-chip .epic-id {
      color: var(--pill-epic-fg);
      font-weight: 600;
    }
    .epic-chip .epic-count {
      color: var(--muted);
    }
    .details {
      display: flex;
      flex-direction: column;
      min-width: 0;
      min-height: 0;
    }
    .summary-pane {
      display: flex;
      flex-direction: column;
      min-width: 0;
      min-height: 0;
    }
    .summary-inner {
      flex: 1 1 auto;
      padding: 22px;
      overflow-y: auto;
      overflow-x: hidden;
      min-height: 0;
      min-width: 0;
      background: var(--summary-bg);
    }
    .summary-title {
      font-size: 1.35rem;
      line-height: 1.25;
    }
    .summary-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 14px 0 18px;
    }
    .summary-preview {
      color: var(--muted);
      margin-top: 18px;
      font-size: 0.95rem;
      line-height: 1.45;
    }
    .details-inner {
      flex: 1 1 auto;
      padding: 28px;
      overflow-y: auto;
      overflow-x: hidden;
      min-height: 0;
      min-width: 0;
    }
    .details-top {
      display: flex;
      justify-content: space-between;
      gap: 18px;
      align-items: flex-start;
      margin-bottom: 18px;
    }
    .details-path {
      margin-top: 8px;
      color: var(--muted);
      word-break: break-word;
    }
    .section {
      margin-top: 24px;
      padding-top: 20px;
      border-top: 1px solid var(--line);
    }
    .section h4 {
      margin-bottom: 12px;
      font-size: 1rem;
    }
    .markdown {
      color: var(--ink);
      line-height: 1.55;
    }
    .markdown p {
      margin: 0 0 12px;
    }
    .markdown p:last-child {
      margin-bottom: 0;
    }
    .markdown ul, .markdown ol {
      margin: 0 0 12px 22px;
      padding: 0;
    }
    .markdown li + li {
      margin-top: 8px;
    }
    .markdown code {
      font-family: Consolas, "Courier New", monospace;
      background: var(--code-bg);
      padding: 1px 5px;
      border-radius: 6px;
      font-size: 0.92em;
    }
    .linked-docs {
      margin-top: 24px;
      padding-top: 20px;
      border-top: 1px solid var(--line);
      display: grid;
      gap: 18px;
    }
    .linked-doc-path {
      font-family: Consolas, "Courier New", monospace;
      font-size: 0.82rem;
      color: var(--muted);
      margin-bottom: 10px;
      word-break: break-all;
    }
    .spec-markdown {
      font-size: 0.95rem;
      line-height: 1.55;
      min-width: 0;
      overflow-wrap: break-word;
      word-break: break-word;
    }
    .spec-markdown img { max-width: 100%; height: auto; }
    .spec-markdown table {
      display: block;
      max-width: 100%;
      overflow-x: auto;
    }
    .spec-markdown h1, .spec-markdown h2, .spec-markdown h3 {
      margin: 18px 0 8px;
      line-height: 1.2;
    }
    .spec-markdown h1 { font-size: 1.25rem; }
    .spec-markdown h2 { font-size: 1.1rem; }
    .spec-markdown h3 { font-size: 1rem; }
    .spec-markdown p { margin: 0 0 12px; }
    .spec-markdown ul, .spec-markdown ol { margin: 0 0 12px 22px; }
    .spec-markdown li + li { margin-top: 6px; }
    .spec-markdown pre {
      background: var(--code-bg);
      padding: 12px;
      border-radius: 8px;
      overflow-x: auto;
      max-width: 100%;
      font-size: 0.88em;
      line-height: 1.45;
    }
    .spec-markdown code {
      font-family: Consolas, "Courier New", monospace;
      background: var(--code-bg);
      padding: 1px 5px;
      border-radius: 6px;
      font-size: 0.92em;
    }
    .spec-markdown pre code { background: none; padding: 0; }
    .spec-markdown table {
      border-collapse: collapse;
      margin: 12px 0;
      font-size: 0.9em;
    }
    .spec-markdown th, .spec-markdown td {
      border: 1px solid var(--line);
      padding: 6px 10px;
    }
    .spec-markdown blockquote {
      margin: 12px 0;
      padding: 4px 14px;
      border-left: 3px solid var(--line);
      color: var(--muted);
    }
    .acceptance-list {
      display: grid;
      gap: 12px;
      padding: 0;
      margin: 0;
      list-style: none;
    }
    .acceptance-item {
      background: var(--acceptance-bg);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 14px 16px;
    }
    .acceptance-index {
      display: inline-block;
      min-width: 28px;
      margin-right: 8px;
      color: var(--muted);
      font-size: 0.8rem;
    }
    .empty {
      padding: 28px;
      color: var(--muted);
    }
    .mobile-summary {
      display: none;
      margin-bottom: 14px;
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 14px;
      background: var(--mobile-summary-bg);
    }
    .mobile-accordion {
      display: none;
    }
    .mobile-panel {
      border: 1px solid var(--line);
      border-radius: 18px;
      background: var(--panel);
      overflow: hidden;
      margin-top: 14px;
    }
    .mobile-panel summary {
      list-style: none;
      cursor: pointer;
      padding: 14px 16px;
      background: var(--mobile-panel-bg);
      font-weight: 700;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }
    .mobile-panel summary::-webkit-details-marker {
      display: none;
    }
    .mobile-panel summary::after {
      content: "+";
      color: var(--muted);
      font-size: 1.1rem;
      line-height: 1;
    }
    .mobile-panel[open] summary::after {
      content: "−";
    }
    .mobile-panel-body {
      padding: 12px;
      border-top: 1px solid var(--line);
      background: var(--mobile-panel-body-bg);
    }
    @media (max-width: 1350px) {
      .main-grid {
        grid-template-columns: var(--col-1, 28%) 6px minmax(0, 1fr) !important;
      }
      .summary-pane, .resizer.resizer-2 {
        display: none;
      }
    }
    @media (max-width: 900px) {
      .app {
        padding: 14px;
        height: 100vh;
      }
      .shell {
        padding: 12px;
        border-radius: 20px;
      }
      .main-grid {
        display: none;
      }
      .mobile-accordion {
        display: block;
      }
      .mobile-summary {
        display: block;
      }
      .details-inner {
        padding: 18px;
      }
    }
  </style>

    window.__PRD_DATA__ = [{"project": "roslyn-tools", "branchName": "backlog", "description": "Triaged backlog", "path": "C:\\code\\roslyn-tools\\ralph\\backlog-prd.json", "stats": {"total": 36, "complete": 3, "pending": 33, "completionPct": 8}, "epics": [{"id": "EP-005", "title": "codebase consistency sweep", "description": "Fix formatting violations and consolidate structural duplication identified in the May 2026 consistency analysis.", "notes": "Findings from rt analyze list-smells + find-duplicates sweep on 2026-05-11."}, {"id": "EP-006", "title": "SOLID Adherence Analysis", "description": "Family of rt analyze solid subcommands that detect likely SOLID-principle violations using Roslyn semantic model. One detector per principle; output is JSON grouped by detector name.", "notes": "P2. Five child stories: SRP, ISP, DIP, OCP, LSP. Each independently shippable."}, {"id": "EP-007", "title": "Add structured JSON output to all inspect/analyze commands", "description": "All rt inspect and rt analyze commands should support --json output so automation consumers (agents, scripts, CI tools) can pipe results without text parsing. Eight commands currently output plain text only.", "notes": "P2. Affects: find-refs, find-callers, find-undocumented, find-unused, circular-deps, find-magic-strings, list-imports, list-smells. Template: see describe/outline/find-impl which already have JSON output."}, {"id": "EP-008", "title": "Platform abstractions: IWorkspaceSessionFactory + ISolutionApplier", "description": "Introduce injectable abstractions for WorkspaceLoader and SolutionWriter so commands depend on interfaces, not static helpers. Enables testability without AsyncLocal overrides and unblocks daemon workspace caching. Must be a single coordinated change across all ~30 commands.", "notes": "P2. Architecture gate NoStaticWorkspaceLoaderUse already exists in tests/. rt-006 + rt-007 from issues backlog. Must ship together — splitting doubles the 30-command churn."}, {"id": "EP-009", "title": "Consistent command contracts and migration ratchets", "description": "Make rt commands consistent across handler structure, option vocabulary, metadata, output envelopes, and symbol resolution so dogfooding workflows are predictable and architecture tests can ratchet progress.", "notes": "From rt dogfooding consistency discussion on 2026-05-15."}], "stories": [{"id": "US-037", "title": "rt: convert-static-class — interface generation", "description": "When --no-interface is not passed, generate an I<TypeName> interface file alongside the destated class, extracting all public/internal instance methods and properties. Interface only matters when consumers need to mock the dependency in tests. Discovered during US-027 df pass; command currently warns and skips.", "acceptanceCriteria": ["rt analyze solid --principle LSP --solution <sln> exits 0 and emits JSON to stdout", "Output has a top-level 'LSP' key with sub-arrays for 'ThrowingOverrides' and 'ContractNarrowings'", "Each ThrowingOverride item includes: TypeName, MemberName, ExceptionType, FilePath, Line", "Each ContractNarrowing item includes: TypeName, MemberName, BaseType, FilePath, Line", "Flags override methods whose body contains throw new NotImplementedException() or NotSupportedException()", "Flags explicit interface implementations that throw on every code path", "rt analyze solid --principle all includes LSP results"], "priority": 37, "passes": false, "notes": "P2. Enables mock-friendly DI patterns in roslyn-tools tests. Relates to US-027 df.", "epicId": ""}, {"id": "US-038", "title": "rt: convert-static-class — DI registration in Bootstrap.cs", "description": "When --no-di-registration is not passed, find a Bootstrap.RegisterServices method in the solution and add a services.Add<Lifetime><ITypeName, TypeName>() line. Discovered during US-027 df pass; command currently warns and skips.", "acceptanceCriteria": ["When --no-di-registration is not passed and a Bootstrap.RegisterServices method exists in the solution, a services.AddSingleton<ITypeName, TypeName>() line is added", "If --lifetime is scoped or transient, the correct Add method is used", "If no Bootstrap-style registration method is found, a warning is emitted and the step is skipped", "Running with --dry-run shows the Bootstrap.cs diff without writing it", "If --no-interface was also passed (no interface generated), registers the concrete type: services.AddSingleton<TypeName>()"], "priority": 38, "passes": false, "notes": "P2. Pairs with US-037 (interface gen). Relates to US-027 df.", "epicId": ""}, {"id": "US-039", "title": "rt: convert-static-class — fix field and ctor formatting in existing-constructor path", "description": "When a consumer class already has constructors, AddConstructorInjection inserts the new field without a trailing newline, causing it to merge with the existing first member on the same line. Similarly, AddConstructorParameter inserts parameters without comma spacing and prepends assignments without newlines before the closing brace. dotnet format corrects these cosmetically but they should be emitted correctly. Discovered during US-027 df dry-run.", "acceptanceCriteria": ["When a consumer class already has a constructor, the injected field is inserted on its own line (with correct indentation), not concatenated with the existing first member on the same line", "When AddConstructorParameter adds a parameter to an existing constructor, a space follows the preceding comma in the parameter list", "When AddConstructorParameter prepends an assignment to the constructor body, the assignment is on its own line before the closing brace", "All three fixes apply when multiple constructors are present in the consumer class", "Existing tests for add_dependencies_to_existing_instance_constructors remain green"], "priority": 39, "passes": false, "notes": "P2. df dogfood bug. Sibling of the no-constructor formatting bug fixed in the df/convert-static-class-interface-and-di branch commit 1fcf269.", "epicId": ""}, {"id": "US-045", "title": "rt inspect find-refs: structured JSON output", "description": "As an automation consumer, I want rt inspect find-refs to emit a JSON array when --json is passed so I can process symbol references without parsing plain text.", "acceptanceCriteria": ["--json outputs a JSON array to stdout; each element has {file, line, column, kind, snippet}", "Without --json, plain-text output is unchanged (backward compatible)", "No references found produces [] not a blank line or error", "RtCommandInfo.JsonOutput is set to true", "rt dump-help shows JSON output for find-refs", "kind field distinguishes between read/write/nameof/other reference types"], "priority": 45, "passes": false, "notes": "P2. Command: src/RoslynTools.Cli/Commands/FindRefsCommand.cs. Set RtCommandInfo.JsonOutput=true and branch on RtContext.Format==OutputFormat.Json.", "epicId": "EP-007"}, {"id": "US-046", "title": "rt inspect find-callers: structured JSON output", "description": "As an automation consumer, I want rt inspect find-callers to emit a JSON array when --json is passed so call-site data can be used programmatically.", "acceptanceCriteria": ["--json outputs a JSON array; each element has {file, line, column, snippet}", "Without --json, plain-text output is unchanged", "No callers found produces [] not a blank line", "RtCommandInfo.JsonOutput is set to true", "rt dump-help shows JSON output for find-callers"], "priority": 46, "passes": false, "notes": "P2. Command: src/RoslynTools.Cli/Commands/FindCallersCommand.cs. Set RtCommandInfo.JsonOutput=true.", "epicId": "EP-007"}, {"id": "US-047", "title": "rt inspect find-undocumented: structured JSON output", "description": "As an automation consumer, I want rt inspect find-undocumented to emit a JSON array when --json is passed so missing-doc reports can feed CI or doc generation tooling.", "acceptanceCriteria": ["--json outputs a JSON array; each element has {fqn, kind, file, line}", "kind distinguishes between type, method, property, etc.", "Without --json, plain-text output is unchanged", "No undocumented members produces [] not blank", "RtCommandInfo.JsonOutput is set to true", "rt dump-help shows JSON output for find-undocumented"], "priority": 47, "passes": false, "notes": "P2. Command: src/RoslynTools.Cli/Commands/FindUndocumentedCommand.cs. Set RtCommandInfo.JsonOutput=true.", "epicId": "EP-007"}, {"id": "US-048", "title": "rt inspect find-unused: structured JSON output", "description": "As an automation consumer, I want rt inspect find-unused to emit a JSON array when --json is passed so dead-code reports can drive automated safe-delete workflows.", "acceptanceCriteria": ["--json outputs a JSON array; each element has {fqn, kind, file, line}", "Without --json, plain-text output is unchanged", "No unused symbols produces [] not blank", "RtCommandInfo.JsonOutput is set to true", "rt dump-help shows JSON output for find-unused"], "priority": 48, "passes": false, "notes": "P2. Command: src/RoslynTools.Cli/Commands/FindUnusedCommand.cs. Set RtCommandInfo.JsonOutput=true.", "epicId": "EP-007"}, {"id": "US-049", "title": "rt analyze circular-deps: structured JSON output", "description": "As an automation consumer, I want rt analyze circular-deps to emit a JSON array of cycle objects when --json is passed so dependency violations can be processed programmatically.", "acceptanceCriteria": ["--json outputs a JSON array of cycle objects; each has {cycle: [namespace, namespace, ...]}", "Without --json, plain-text output is unchanged", "No cycles produces [] not blank or zero-line", "RtCommandInfo.JsonOutput is set to true", "rt dump-help shows JSON output for circular-deps"], "priority": 49, "passes": false, "notes": "P2. Command: src/RoslynTools.Cli/Commands/CircularDepsCommand.cs. Set RtCommandInfo.JsonOutput=true.", "epicId": "EP-007"}, {"id": "US-050", "title": "rt analyze find-magic-strings: structured JSON output", "description": "As an automation consumer, I want rt analyze find-magic-strings to emit a JSON array when --json is passed so repeated literals can be fed into automated extract-string-constant workflows.", "acceptanceCriteria": ["--json outputs a JSON array; each element has {value, count, occurrences: [{file, line}]}", "occurrences is sorted by file then line", "Without --json, plain-text output is unchanged", "No magic strings produces [] not blank", "RtCommandInfo.JsonOutput is set to true", "rt dump-help shows JSON output for find-magic-strings"], "priority": 50, "passes": false, "notes": "P2. Command: src/RoslynTools.Cli/Commands/FindMagicStringsCommand.cs. Set RtCommandInfo.JsonOutput=true.", "epicId": "EP-007"}, {"id": "US-051", "title": "rt analyze list-imports: structured JSON output", "description": "As an automation consumer, I want rt analyze list-imports to emit a JSON array per-file when --json is passed so import audits can be processed programmatically.", "acceptanceCriteria": ["--json outputs a JSON array; each element has {file, usings: [{namespace, isGlobal, isStatic}]}", "Without --json, plain-text output is unchanged", "File with no usings is omitted or represented as {file, usings: []}", "RtCommandInfo.JsonOutput is set to true", "rt dump-help shows JSON output for list-imports"], "priority": 51, "passes": false, "notes": "P2. Command: src/RoslynTools.Cli/Commands/ListImportsCommand.cs. Set RtCommandInfo.JsonOutput=true.", "epicId": "EP-007"}, {"id": "US-052", "title": "rt analyze list-smells: structured JSON output", "description": "As an automation consumer, I want rt analyze list-smells to emit a JSON array when --json is passed so code smell reports can feed automated refactor planning.", "acceptanceCriteria": ["--json outputs a JSON array; each element has {kind, description, fqn, file, line, severity}", "severity is one of: warning, info", "Without --json, plain-text output is unchanged", "No smells produces [] not blank", "RtCommandInfo.JsonOutput is set to true", "rt dump-help shows JSON output for list-smells"], "priority": 52, "passes": false, "notes": "P2. Command: src/RoslynTools.Cli/Commands/ListSmellsCommand.cs. Set RtCommandInfo.JsonOutput=true.", "epicId": "EP-007"}, {"id": "US-055", "title": "Add rt refactor extract-orchestrator command (rt-003)", "description": "As a developer, I want rt refactor extract-orchestrator to pull a command's SetHandler lambda body into a dedicated <Feature>Handler class so commands become thin CLI adapters with no workspace or business logic.", "acceptanceCriteria": ["rt refactor extract-orchestrator --type RoslynTools.Commands.ChangeSignatureCommand --name RenameParameterHandler --request RenameParameterRequest --namespace RoslynTools.Features.ChangeSignature --solution RoslynTools.slnx --dry-run produces the diff from ralph/sessions/2026-04-21-change-signature-2.md step 5", "ChangeSignatureCommand.Build() drops from 76 to ~42 lines after apply", "Command file no longer imports WorkspaceLoader or SolutionWriter after apply", "Created handler class has signature: static async Task<int> HandleAsync(<RequestType> request)", "Lambda body replaced with: context.ExitCode = await <HandlerName>.HandleAsync(new <RequestType>(...))", "Using directives in the command file updated to reference the new handler namespace", "--dry-run shows diff without writing; without flag, writes files", "IRtCommand contract satisfied; command registered under rt refactor group", "Test suite passes after apply (no broken imports)"], "priority": 55, "passes": false, "notes": "P2. Reference diff: ralph/sessions/2026-04-21-change-signature-2.md step 5. Linked to rt-004 (introduce-record) now shipped as transform-parameters. From issue rt-003.", "epicId": ""}, {"id": "US-056", "title": "rt refactor rename: accept symbol FQN from stdin JSON for pipe chains (rt-008)", "description": "As a developer, I want rt refactor rename to read a fullyQualifiedName from piped stdin JSON so that rt inspect find-refs | rt rename pipe chains work end-to-end.", "acceptanceCriteria": ["When stdin is redirected (Console.IsInputRedirected is true), rename reads the first JSON line and extracts fullyQualifiedName", "Positional <symbol> argument takes precedence over stdin FQN if both are provided", "Falls back gracefully to positional arg if stdin produces no FQN", "rt inspect find-refs --symbol WorkspaceLoader --json | rt refactor rename --new-name SolutionLoader --dry-run produces the correct diff", "No behaviour change when stdin is a TTY (non-pipe invocation)", "Works with --dry-run and --solution flags as normal"], "priority": 56, "passes": false, "notes": "P2. First of the pipe-protocol tasks. Discovered in ralph/sessions/2026-05-04-daemon-protocol.md Step 4. Command: src/RoslynTools.Cli/Commands/RenameCommand.cs. From issue rt-008.", "epicId": ""}, {"id": "US-057", "title": "Introduce a shared read-only command handler wrapper", "description": "As an rt maintainer, I want read-only commands to execute through a shared wrapper so solution loading, timing, cancellation, error mapping, and result rendering are consistent.", "acceptanceCriteria": ["A shared wrapper exists for read-only handlers with one entry point used by migrated commands", "The wrapper owns solution loading, cancellation token flow, exception-to-exit-code mapping, and output rendering", "At least one representative inspect command and one analyze command are migrated to the wrapper", "Migrated command tests cover success, not found, and invalid input paths", "An architecture test detects migrated commands that bypass the wrapper"], "priority": 57, "passes": false, "notes": "P2. Start with a low-risk read-only command already using RtResult<T>.", "epicId": "EP-009"}, {"id": "US-058", "title": "Standardize common CLI options through option factories", "description": "As an rt maintainer, I want common options to be created by shared factories so aliases, descriptions, defaults, and required flags do not drift between commands.", "acceptanceCriteria": ["CommandOptionFactory exposes factories for solution, format/json, scope, top, symbol, type, dry-run, and verbose options", "Existing migrated commands use the shared factories instead of manually declaring equivalent options", "Factory-created options preserve current public CLI behavior unless explicitly documented", "Tests assert consistent aliases and descriptions for at least solution, format/json, scope, and top", "An architecture test flags manual declarations of common options in migrated command files"], "priority": 58, "passes": false, "notes": "P2. This should precede broad command migration to reduce repeated churn.", "epicId": "EP-009"}, {"id": "US-059", "title": "Add machine-readable command capabilities to RtCommandInfo", "description": "As an automation consumer, I want every command to declare its capabilities so agents can choose commands and output formats without scraping prose help.", "acceptanceCriteria": ["RtCommandInfo includes supported formats, scope support, top support, solution requirement, prompt support, and mutation flags", "All existing commands compile with explicit capability values", "dump-help includes the new capability metadata in its machine-readable output", "Architecture tests require explicit capability values for every IRtCommand", "At least one test verifies capability metadata matches actual command options"], "priority": 59, "passes": false, "notes": "P2. Capability names should stay stable for external automation.", "epicId": "EP-009"}, {"id": "US-060", "title": "Normalize command outputs around shared result contracts", "description": "As an automation consumer, I want rt commands to return shared result envelopes so success, empty, diagnostic, and change-plan outputs are predictable.", "acceptanceCriteria": ["Read-only commands use RtResult<TOutput> or an approved equivalent", "Mutation commands use a shared change result contract such as RtChangeResult<TPlan>", "Diagnostic commands use a shared diagnostic result contract such as RtDiagnosticResult", "JSON output shape is documented and tested for success, empty, and error-like diagnostic cases", "Architecture tests ratchet migrated commands away from ad hoc Console.WriteLine rendering"], "priority": 60, "passes": false, "notes": "P2. Builds on the existing RtResult<T> migration.", "epicId": "EP-009"}, {"id": "US-061", "title": "Introduce SymbolQuery for consistent symbol resolution", "description": "As an rt user, I want commands that accept symbols to resolve names, fully qualified names, and ambiguity in the same way across inspect and refactor workflows.", "acceptanceCriteria": ["SymbolQuery represents raw input, expected symbol kind, optional scope, and ambiguity policy", "A shared resolver handles exact, fully qualified, and partial symbol matches", "Ambiguous matches produce a consistent diagnostic payload with candidate symbols", "At least two symbol-consuming commands are migrated to SymbolQuery", "Tests cover exact match, no match, ambiguous match, and kind mismatch"], "priority": 61, "passes": false, "notes": "P2. This is a prerequisite for reliable pipe chains between inspect and refactor commands.", "epicId": "EP-009"}, {"id": "US-062", "title": "Standardize command vocabulary and aliases", "description": "As an rt user, I want equivalent concepts to use the same option names across commands so I do not have to relearn each workflow.", "acceptanceCriteria": ["Canonical option names are documented for --symbol, --type, --scope, --top, --format, --json, --solution, and --dry-run", "Commands with equivalent concepts use the canonical option names and aliases", "Legacy aliases remain where needed for compatibility and are documented as aliases", "dump-help output groups canonical options consistently", "Tests catch accidental introduction of a non-canonical common option name"], "priority": 62, "passes": false, "notes": "P2. Pair with option factory work when practical.", "epicId": "EP-009"}, {"id": "US-063", "title": "Standardize command file structure", "description": "As an rt contributor, I want command files to follow a common structure so reviews and automated refactors can reason about metadata, option construction, handler wiring, and logic boundaries.", "acceptanceCriteria": ["A command file structure convention is documented with metadata, option declarations, command construction, and handler binding order", "At least three commands are migrated to the convention", "Business logic is moved out of command construction for migrated commands when feasible", "Tests or architecture rules catch obvious convention violations for migrated commands", "The convention avoids broad rewrites for commands that still need larger handler extraction"], "priority": 63, "passes": false, "notes": "P3. Keep this incremental so it supports, rather than blocks, feature work.", "epicId": "EP-009"}, {"id": "US-064", "title": "Add migration ratchets for command consistency", "description": "As an rt maintainer, I want architecture tests to enforce only migrated command slices so consistency improves without forcing unsafe all-at-once rewrites.", "acceptanceCriteria": ["A migrated-command allowlist or marker exists for each enforced convention", "Architecture tests fail when a marked command regresses from the wrapper, option factory, result contract, or metadata conventions", "Tests report actionable command names and violated rules", "Adding a command to the migrated set requires no test code duplication", "The ratchet strategy is documented in the migration playbook"], "priority": 64, "passes": false, "notes": "P2. This formalizes the dogfooding approach used during the command output migration.", "epicId": "EP-009"}, {"id": "US-065", "title": "Make dump-help metadata-driven and consistency-tested", "description": "As an automation consumer, I want rt dump-help to reflect command metadata and options consistently so it can be trusted as the command contract.", "acceptanceCriteria": ["dump-help derives command categories, output formats, and capabilities from RtCommandInfo where available", "dump-help includes consistent option metadata for common option factories", "Tests verify every registered command appears in dump-help", "Tests verify commands declaring JSON or structured formats expose matching options", "Human-readable help remains concise and does not duplicate stale hand-written metadata"], "priority": 65, "passes": false, "notes": "P2. This turns command metadata into a visible contract for agents.", "epicId": "EP-009"}, {"id": "US-066", "title": "Create a command migration playbook", "description": "As an rt contributor, I want a concise migration playbook so future command refactors follow the same sequence and know which architecture ratchets to update.", "acceptanceCriteria": ["A playbook documents the recommended order: result contract, option factories, handler wrapper, capabilities, symbol query, and ratchet update", "The playbook includes a before/after checklist for one migrated command", "The playbook explains when to use feedback for missing rt affordances", "The playbook lists verification commands including architecture tests and targeted command tests", "The playbook is linked from the relevant backlog epic or developer docs"], "priority": 66, "passes": false, "notes": "P3. Keep this short and operational; it should support ongoing dogfooding rather than becoming a design document.", "epicId": "EP-009"}, {"id": "US-067", "title": "Revisit nested-branch pattern in execute skill for trunk-based repos", "description": "As a developer running /execute on a trunk repo, I want a clear consistent policy on RT gap handling, so the skill matches the actual workflow.", "acceptanceCriteria": ["The skill documents a clear policy: nested branches OR fix-on-main for trunk repos — not both", "The Opus review section and regression handler are consistent with the chosen policy", "The branch cleanup gate is present or removed to match", "Risks of fix-on-main are documented (no revert path) if that approach is chosen"], "priority": 67, "passes": false, "notes": "P3. Deferred from 2026-05-15 retro (Proposal 4). Aggressive version in ai-rules commit 8c1a08a; conservative rollback in dae9046. Three places still inconsistent: RT gap section, Opus review section, regression handler. Must be decided and applied consistently.", "epicId": ""}, {"id": "RT-001", "title": "rt dump-help --json: emit machine-readable command catalog", "description": "As an LLM agent, I want `rt dump-help --json` to emit the full RtCommandInfo catalog as structured JSON so I can ingest the command surface programmatically instead of parsing prose.", "acceptanceCriteria": ["`rt dump-help --json` exits 0 and writes valid JSON to stdout.", "The JSON document includes every command discovered by the reflection-based registry — the command count equals what plain `rt dump-help` reports.", "Each command entry includes Name, Category, Mutates, JsonOutput, Aliases, WhenToUse, Examples, KnownIssues, and SupportedFormats from RtCommandInfo. Missing or null fields are represented explicitly (no silent drops).", "The plain `rt dump-help` (no flag) text output is byte-identical to today's — JSON is purely additive.", "An LLM can parse the JSON output and reconstruct the command surface without reading any source file or markdown.", "If `--strict-json` is passed alongside, the output is RFC 8259 compliant (non-ASCII escaped as \\uXXXX)."], "priority": 69, "passes": false, "notes": "P2. Deferred from LLM-ergonomics quick-wins plan. The RtCommandInfo record and reflection-discovered registry in App.cs already expose every field — wiring it through JsonRenderer should be near-free. Affected files: src/RoslynTools.Cli/Commands/DumpHelpCommand.cs, src/RoslynTools/Core/RtCommandInfo.cs.", "epicId": ""}, {"id": "RT-002", "title": "Expand command help text with output shape, exit codes, and error modes", "description": "As an LLM agent, I want every rt command's --help to describe its output shape, exit codes, and common error modes so I can predict behaviour without source-diving or trial-and-error.", "acceptanceCriteria": ["Every command's `--help` output includes a section stating the output format (text vs JSON vs both, mutating vs read-only).", "Every command's `--help` lists the exit codes it can return (0, 1, 2) and the trigger for each (success / error / decisions required).", "Every command's `--help` lists at least one common error mode the user should expect (e.g. \"symbol not found\", \"ambiguous match without --decisions\", \"file outside solution\").", "Information is sourced from RtCommandInfo (or a new metadata field on it) rather than hand-maintained in each Command.cs — no drift between help and reality.", "`docs/COMMANDS.md` regenerates on build and includes the new fields for every command.", "An LLM reading only `rt <cmd> --help` can predict the shape of stdout, stderr, and exit code for both success and the most common failure."], "priority": 70, "passes": false, "notes": "P2. Deferred from LLM-ergonomics quick-wins plan. Sampled commands (DescribeCommand, FindCallersCommand, ExtractMethodCommand) currently have one-line descriptions only — no failure mode docs, no output schema. Drive from RtCommandInfo so docs/COMMANDS.md stays in sync.", "epicId": ""}, {"id": "RT-003", "title": "Make --decisions YAML schema self-discoverable from the CLI", "description": "As an LLM agent, I want the --decisions YAML schema to be discoverable from rt --help (or a meta sub-command) so I can author a decisions file without reading DecisionStore.cs source.", "acceptanceCriteria": ["`rt --help` (or a sub-command such as `rt decisions --schema`) prints the YAML schema for the --decisions file.", "The printed schema documents every field used today (id, q, options, choose) with types and a one-line description per field.", "A complete worked example is included: the YAML rt would write on first run, plus the same YAML with `choose:` filled in by the user.", "An LLM that has not read source can author or edit a --decisions YAML correctly using only CLI help output.", "When --decisions YAML fails to parse or is missing a required field, stderr reports which file and which entry (id) is malformed — not a stack trace.", "Existing --decisions behaviour (exit 2, write pending entries) is unchanged."], "priority": 71, "passes": false, "notes": "P3. Deferred from LLM-ergonomics quick-wins plan. The mechanism is mentioned in --help but the file structure (fields, indices, how to fill the choose field) requires source inspection today. Affected files: src/RoslynTools/Core/Decisions/DecisionStore.cs, src/RoslynTools/Core/Decisions/DecisionEntry.cs, src/RoslynTools.Cli/App.cs.", "epicId": ""}, {"id": "RT-004", "title": "Finish stderr discipline migration: Console.Write to RtLog/RtConsole", "description": "As an LLM agent piping stdout to a parser and stderr to logs, I want every rt command to honour the stdout=results, stderr=diagnostics contract so I can rely on stream separation without per-command quirks.", "acceptanceCriteria": ["No remaining `Console.Write*` calls exist in src/RoslynTools/Commands/ or src/RoslynTools.Cli/Commands/ (verified by grep, gated in CI or a unit test).", "All progress and diagnostic messages from command handlers route through RtLog.* (stderr).", "All primary command results route through RtConsole.Write (stdout).", "Existing tests pass without modification (output contracts preserved).", "docs/logging-standards.md is updated to remove the \"migration incomplete\" notice and document the now-enforced convention.", "An LLM piping stdout to a JSON parser and stderr to logs gets clean separation across every command."], "priority": 72, "passes": false, "notes": "P2. Deferred from LLM-ergonomics quick-wins plan. docs/logging-standards.md acknowledges the migration is in progress; several commands still call Console.Write directly. Maintenance work — does not change LLM behaviour at runtime today, but eliminates a future regression vector.", "epicId": ""}, {"id": "US-069", "title": "Bring src/RoslynTools.Cli/ into Stryker mutation pilot", "description": "src/RoslynTools.Cli/Commands/MakeSealedCommand.cs, DebugCommand.cs, and Results/DebugResult.cs are matched by stryker-config.json mutate globs but silently skipped by Stryker because the configured project is src/RoslynTools/RoslynTools.csproj (core library only). The pre-commit gate fires the glob-coverage check but Stryker never mutates Cli-project code, so the contract is paper-only.", "acceptanceCriteria": ["stryker-config.json `project` is extended (or a second config introduced) so that files under `src/RoslynTools.Cli/` actually get mutated when matched by mutate globs", "Existing globs `**/Commands/MakeSealedCommand.cs`, `**/Commands/DebugCommand.cs`, `**/Commands/Results/DebugResult.cs` produce non-zero mutant counts in the Stryker report (currently zero — silently skipped)", "Each of those files reaches 100% mutation score (kill, delete, or mark equivalent per CLAUDE.md)", "Pre-commit gate continues to block on staged Cli production files that aren't covered"], "priority": 73, "passes": false, "notes": "Discovered 2026-05-20 while landing the Debug 100% mutation work. Existing Cli files in mutate globs were authored under the assumption that Stryker would cover them.", "epicId": ""}, {"id": "US-070", "title": "Bring src/RoslynTools.Mcp/ into Stryker mutation pilot", "description": "src/RoslynTools.Mcp/ is a separate csproj from the core library and the existing Cli. stryker-config.json's project field points at the core library, so Mcp files are never matched by the Stryker run even when added to mutate globs. The pre-commit gate currently has no useful path other than RT_MUTATION_ALLOW_UNSCOPED=1 when any Mcp file is staged.", "acceptanceCriteria": ["src/RoslynTools.Mcp/RoslynTools.Mcp.csproj has a matching Stryker config or is included in the existing one such that its production files participate in mutation testing", "src/RoslynTools.Mcp/Tools/CliCommandBridge.cs and ToolSchemaBuilder.cs reach 100% mutation score (kill, delete, or mark equivalent)", "Pre-commit gate runs Stryker against Mcp files when staged — RT_MUTATION_ALLOW_UNSCOPED=1 is no longer needed for Mcp commits", "tests/RoslynTools.Tests.Mcp/ is used as the Stryker test-projects entry (already present)"], "priority": 74, "passes": false, "notes": "Discovered 2026-05-20: committed df9e43a (MCP array pass-through) used the bypass for this reason. Likely solved together with the Cli pilot story (US-069) by switching to a multi-project or per-project Stryker setup.", "epicId": ""}, {"id": "US-071", "title": "rt refactor extract-interface produces malformed output for internal classes", "description": "As a roslyn-tools developer, I want extract-interface to honor source class accessibility, include internal members when the source is internal, and emit syntactically valid C# so that I can dogfood it during DI migrations on internal types.", "acceptanceCriteria": ["rt refactor extract-interface --type WorkspaceLoader --solution RoslynTools.slnx --dry-run emits a syntactically valid diff: the new interface name is inserted into the existing base list with proper formatting (space after comma, brace placement matching the file's brace style), and the resulting file would compile", "Extracting from an internal sealed class produces an internal interface (not public). Accessibility of the generated interface matches the source class accessibility", "Extracting from an internal class includes the class's internal members in the generated interface (today only public members are picked up). Public-only behaviour remains the default for public source classes", "Regression test added covering an internal class with internal members and an existing IDisposable base list, asserting both the file compiles and the interface accessibility/membership matches expectation", "rt refactor extract-interface --type WorkspaceLoader --solution RoslynTools.slnx (no dry-run) succeeds without producing files that fail dotnet build"], "priority": 75, "passes": false, "notes": "P2. Surfaced during EP-008/US-053 dogfood at branch ep-008-isessionfactory. Three bundled defects: (1) base-list insertion is malformed -- 'IDisposable\\n,IWorkspaceLoader{' (no space, brace adjacent); (2) generated interface is hardcoded public regardless of source class accessibility (internal sealed class WorkspaceLoader yielded public interface IWorkspaceLoader); (3) only public members are extracted, missing internal GetSolutionAsync/LoadWorkspaceAsync from WorkspaceLoader. Repro: rt refactor extract-interface --type WorkspaceLoader --solution RoslynTools.slnx --dry-run. Forced fallback to hand-authoring IWorkspaceSessionFactory.", "epicId": "EP-006"}, {"id": "US-072", "title": "Eliminate RtServiceProvider.Get<T> service locator in favour of ctor injection", "description": "As a roslyn-tools developer, I want commands to depend on services via constructor injection so the ambient service-locator anti-pattern (RtServiceProvider.Get<T>()) disappears and command dependencies become explicit and testable.", "acceptanceCriteria": ["IRtCommand contract revised to support instance classes — each command class is constructed by the DI container with required services injected via the constructor; the static Build() pattern is replaced with an instance Build() that closes over the injected services", "App.Discover (or its replacement) resolves each command via the service provider rather than calling a static factory", "All ~50 commands under src/RoslynTools.Cli/Commands/ (and src/RoslynTools.Cli/CommandHandlers/) refactored to declare their service dependencies as constructor parameters and reference them via private readonly fields", "All 64 RtServiceProvider.Get<T>() and RtServiceProvider.GetOrDefault<T>(…) call sites removed from src/", "RtServiceProvider class deleted (or factor rename --dry-run) work against a non-trivial Hero solution", "All NuGet packages updated to versions that support net10 with no runtime-only fallbacks", "Microsoft.CodeAnalysis.* bumped to a Roslyn version compatible with the net10 SDK toolchain", "CI workflows (if any) updated to install net10 SDK"], "priority": 77, "passes": false, "notes": "P2. Currently net8.0 across all projects. Migration touches: TFM in every csproj + Directory.Build.props, Microsoft.CodeAnalysis.* package bump (currently 4.9.2), DiffPlex/YamlDotNet/Scrutor checks for net10 support, CI image bump if any, smoke tests on roslyn-tools.slnx then a Hero solution. Watch for breakage in Roslyn syntax APIs and MSBuildLocator behavior — net10 SDK discovery may diverge.", "epicId": ""}, {"id": "US-025", "title": "fix formatting violations: CRLF and encoding errors in 4 files", "description": "As a contributor, I want all source files to pass dotnet format so that CI and editor tooling agree on line endings and encoding.", "acceptanceCriteria": ["dotnet format RoslynTools.slnx --verify-no-changes exits 0", "TransformParametersService.cs uses LF line endings", "ControlFlowUnwinder.cs, ConsumerNarrowerService.cs, InterfaceAnalyzerService.cs use project-standard encoding (no BOM)"], "priority": 25, "passes": true, "notes": "P1. Run dotnet format RoslynTools.slnx to auto-fix. Affected: src/RoslynTools/Services/TransformParametersService.cs (CRLF lines 13-14), src/RoslynTools/Core/ControlFlowUnwinder.cs, src/RoslynTools/Services/ConsumerNarrowerService.cs, src/RoslynTools/Services/InterfaceAnalyzerService.cs (encoding).", "epicId": "EP-005"}, {"id": "US-053", "title": "Introduce IWorkspaceSessionFactory + WorkspaceSession (rt-006)", "description": "As a developer, I want all commands to depend on IWorkspaceSessionFactory instead of the concrete WorkspaceLoader type so that the static coupling is broken and daemon workspace caching becomes possible.", "acceptanceCriteria": ["IWorkspaceSessionFactory interface defined in src/RoslynTools/Core/ with GetSolutionAsync(string?) and LoadWorkspaceAsync(string?) signatures matching the existing WorkspaceLoader instance methods", "WorkspaceLoader implements IWorkspaceSessionFactory (no new WorkspaceSession class required — the existing instance-API WorkspaceLoader fills that role)", "IWorkspaceSessionFactory registered in Bootstrap.cs alongside the WorkspaceLoader singleton", "All 57 production call sites depend on IWorkspaceSessionFactory, not the concrete WorkspaceLoader type (covers src/RoslynTools.Cli/Commands/, src/RoslynTools/Services/, src/RoslynTools/Core/, and MCP handlers)", "rt inspect find-refs --symbol WorkspaceLoader --solution RoslynTools.slnx shows only the type-declaration and test-fixture references (no production call sites)", "Architecture gate NoStaticWorkspaceLoaderUse strengthened to also flag concrete WorkspaceLoader references from src/ outside the class itself, and continues to pass", "Static WorkspaceLoader.LoadAsync compat surface deleted (the gate proves it has no production callers)", "WorkspaceLoader.UseOverride test-hook reworked to stub IWorkspaceSessionFactory; existing tests pass without changes to call sites", "Must ship in same PR as US-054 — partial rollout is not safe"], "priority": 53, "passes": true, "notes": "P2. Existing foundation (instance-API WorkspaceLoader, DI registration, AsyncLocal Override, passing NoStaticWorkspaceLoaderUse gate) reduces remaining work from a full re-architecture to an interface-extraction + type-reference migration. Real blast radius: 57 production call sites (45 LoadWorkspaceAsync + 12 GetSolutionAsync) and 27 test files. From issue rt-006.", "epicId": "EP-008"}, {"id": "US-054", "title": "Migrate direct SolutionWriter call sites to ISolutionChangeWriter (rt-007)", "description": "As a developer, I want all production code that mutates a solution to depend on ISolutionChangeWriter instead of calling the static SolutionWriter.ApplyChangesAsync directly, so that mutation tests can stub the writer and daemon caching doesn't fight per-call workspace ownership. Bundled with US-053 so the related command churn ships once.", "acceptanceCriteria": ["ISolutionChangeWriter interface (already defined in src/RoslynTools/Services/SolutionChangeWriter.cs with Task ApplyChangesAsync(Solution, Solution, bool dryRun)) is the sole production path to SolutionWriter — the existing name is kept; renaming to ISolutionApplier is out of scope", "5 direct SolutionWriter.ApplyChangesAsync call sites migrated to ISolutionChangeWriter via DI: src/RoslynTools/Core/ConsoleLoggingCore.cs:76, src/RoslynTools.Cli/CommandHandlers/ChangeSignatureCommandHandlers.cs (lines 32, 62, 94, 126), src/RoslynTools.Cli/Commands/ConvertConsoleLoggingCommand.cs:194, src/RoslynTools.Cli/Commands/ExtractMethodCommand.cs:112", "New architecture gate NoDirectSolutionWriterUse added under tests/RoslynTools.Tests/Architecture/, mirroring NoStaticWorkspaceLoaderUse, banning direct SolutionWriter.ApplyChangesAsync calls from src/ outside the SolutionChangeWriter adapter", "AsyncLocal Override pattern added to ISolutionChangeWriter so mutation tests can capture writes without disk I/O (matches WorkspaceLoader.UseOverride ergonomics)", "rt inspect find-refs --symbol SolutionWriter --solution RoslynTools.slnx shows only the SolutionChangeWriter adapter and SolutionWriter's own type-declaration locations after the change", "All existing tests pass", "Implemented in the same PR as US-053"], "priority": 54, "passes": true, "notes": "P2. ISolutionChangeWriter + SolutionChangeWriter adapter already exist (src/RoslynTools/Services/SolutionChangeWriter.cs) and are DI-registered. Real blast radius: 5 direct call sites (much smaller than the original '22 fan-in' estimate, because the adapter already siphons most callers). From issue rt-007.", "epicId": "EP-008"}], "sourceUrl": "backlog-prd.json"}];
    window.__PRD_LINKED_DOCS__ = {"C:\\code\\roslyn-tools\\ralph\\backlog-prd.json": {"US-056": [{"path": "ralph/sessions/2026-05-04-daemon-protocol.md", "content": "# Session: 2026-05-04 — Daemon Protocol\n\n**Goal:** Design the rt daemon: workspace caching, git-state invalidation, and composable pipe chains.\n**Solution:** RoslynTools.slnx\n\n---\n\n## Design constraints established before simulation\n\n1. **Single global daemon.** Exactly one `rt` daemon process at a time, machine-wide. Not per-solution.\n2. **Cache key:** `solutionPath + gitHeadSha + (dirty ? gitIndexMtime : \"clean\")`. Sent by client on every request; daemon reloads if any field mismatches (including solution path change).\n3. **Git is the invalidation oracle.** No file watcher. Works because `.rt-solution` is checked in — its changes appear in git state automatically.\n4. **State lives in `~/.rt/`** — single `daemon.json`, no per-solution subdirectories, no repo pollution.\n5. **Transport: named pipe** (`\\\\.\\pipe\\rt-daemon` on Windows, fixed name). One pipe, one daemon.\n6. **Protocol: newline-delimited JSON** (request → streaming responses → exit).\n7. **Auto-start:** if no daemon is running when `rt` is invoked, start one in background and wait for it to signal ready. Transparent to the user.\n8. **Opt-out:** `RT_NO_DAEMON=1` or `rt --no-daemon` falls back to in-process (current behaviour).\n\n---\n\n## Wire format\n\n### Client → Daemon (one JSON line per request)\n\n```json\n{\n  \"requestId\": \"a1b2c3d4\",\n  \"args\": [\"inspect\", \"find-refs\", \"--symbol\", \"WorkspaceLoader\", \"--solution\", \"RoslynTools.slnx\"],\n  \"gitState\": {\n    \"head\": \"8f44e7f3a\",\n    \"dirty\": false,\n    \"indexMtime\": null\n  },\n  \"stdin\": null\n}\n```\n\n`stdin` is base64-encoded bytes when the client is itself receiving piped input (enables `rt find-refs Foo | rt rename Bar` chains through the daemon).\n\n### Daemon → Client (streaming, newline-delimited)\n\n```json\n{ \"requestId\": \"a1b2c3d4\", \"type\": \"stderr\", \"data\": \"Finding references to 'RoslynTools.Core.WorkspaceLoader'...\\n\" }\n{ \"requestId\": \"a1b2c3d4\", \"type\": \"stdout\", \"data\": \"{\\\"symbol\\\":\\\"RoslynTools.Core.WorkspaceLoader\\\",\\\"references\\\":[...]}\\n\" }\n{ \"requestId\": \"a1b2c3d4\", \"type\": \"exit\", \"code\": 0 }\n```\n\nTypes: `stderr` | `stdout` | `exit`. Client forwards stderr → its own stderr, stdout → its own stdout, then exits with `code`.\n\n### Daemon state file: `~/.rt/daemon.json`\n\n```json\n{\n  \"pid\": 18432,\n  \"pipeName\": \"rt-daemon\",\n  \"solution\": \"C:/code/roslyn-tools/RoslynTools.slnx\",\n  \"cachedHead\": \"8f44e7f3a\",\n  \"cachedDirty\": false,\n  \"cachedIndexMtime\": null,\n  \"startedAt\": \"2026-05-04T09:45:00Z\",\n  \"rtVersion\": \"0.9.0\"\n}\n```\n\n---\n\n## Step 1 — rt daemon start [SIMULATED]\n\n```\nrt daemon start --solution RoslynTools.slnx\n```\n\n```\nStarting daemon for RoslynTools.slnx...\nLoading workspace (first load may take a few seconds)...\n  Loaded 3 projects, 0 diagnostics.\nDaemon ready. PID 18432, pipe: rt-a9f3c17b\nState written to C:\\Users\\DanMarshall\\.rt\\daemon.json\n```\n\nExit 0. Subsequent `rt` invocations in this directory will connect to this daemon transparently.\n\n---\n\n## Step 2 — rt daemon status [SIMULATED]\n\n```\nrt daemon status\n```\n\n```\nDaemon: RUNNING (PID 18432)\nSolution: C:\\code\\roslyn-tools\\RoslynTools.slnx\nCache:    HEAD=8f44e7f3a  dirty=false  (clean)\nUptime:   0h 2m 14s\nPipe:     \\\\.\\pipe\\rt-daemon\n```\n\nExit 0.\n\n---\n\n## Step 3 — rt inspect find-refs via daemon [REAL, but currently in-process]\n\n```\nrt inspect find-refs --symbol WorkspaceLoader --solution RoslynTools.slnx\n```\n\n**Current (in-process) timing:** ~3.8s (workspace load + query)\n\n**Expected via daemon (workspace already cached):**\n```\nFinding references to 'RoslynTools.Core.WorkspaceLoader'...\n```\n```json\n{\n  \"symbol\": \"RoslynTools.Core.WorkspaceLoader\",\n  \"fullyQualifiedName\": \"RoslynTools.Core.WorkspaceLoader\",\n  \"references\": [\n    { \"file\": \"src/RoslynTools.Cli/Program.cs\", \"line\": 1, \"column\": 5, \"snippet\": \"using RoslynTools.Core;\" },\n    { \"file\": \"src/RoslynTools.Cli/Bootstrap.cs\", \"line\": 12, \"column\": 9, \"snippet\": \"services.AddSingleton<WorkspaceLoader>();\" }\n  ],\n  \"count\": 2\n}\n```\n\n**Expected timing via daemon:** ~200ms (no workspace load, just query).\n\n---\n\n## Step 4 — pipe chain: find-refs → rename [SIMULATED]\n\n```\nrt inspect find-refs --symbol WorkspaceLoader --json | rt refactor rename --new-name SolutionLoader --dry-run\n```\n\nThe second command reads the symbol stream from stdin when stdin is not a TTY. It extracts the `fullyQualifiedName` field and uses it as the rename target — no `--symbol` arg needed.\n\n```\n[daemon] Renaming 'RoslynTools.Core.WorkspaceLoader' → 'SolutionLoader'...\n```\n```diff\n--- a/src/RoslynTools/Core/WorkspaceLoader.cs\n+++ b/src/RoslynTools/Core/WorkspaceLoader.cs\n@@ -8,7 +8,7 @@ namespace RoslynTools.Core;\n-internal sealed class WorkspaceLoader\n+internal sealed class SolutionLoader\n {\n--- a/src/RoslynTools.Cli/Program.cs\n+++ b/src/RoslynTools.Cli/Program.cs\n@@ -1,5 +1,5 @@\n-using RoslynTools.Core; // WorkspaceLoader\n+using RoslynTools.Core; // SolutionLoader\n```\n\n> **[ISSUE: rt-008]** written — `rename` command must accept symbol FQN from stdin JSON when piped; currently only accepts positional `<symbol>` argument.\n\n---\n\n## Step 5 — git commit invalidates cache [SIMULATED]\n\nUser commits a change. Next `rt` command sends new HEAD sha.\n\n```\nrt inspect find-refs --symbol WorkspaceLoader --solution RoslynTools.slnx\n```\n\nDaemon receives: `\"head\": \"c7e90a1f\"` (new) vs cached `\"head\": \"8f44e7f3a\"`.\n\n```\n[daemon] Git state changed (HEAD: 8f44e7f3a → c7e90a1f). Reloading workspace...\n  Loaded 3 projects, 0 diagnostics.\nFinding references to 'RoslynTools.Core.WorkspaceLoader'...\n```\n\nReload is ~3.8s; subsequent commands in same HEAD are fast again.\n\n---\n\n## Step 6 — dirty working tree [SIMULATED]\n\nUser edits a file without committing.\n\n```\nrt inspect find-refs --symbol WorkspaceLoader\n```\n\nClient sends: `\"dirty\": true, \"indexMtime\": 1746368400`.\n\nIf `indexMtime` matches daemon's cached value → still cache-hit (same edits).\nIf `indexMtime` differs → daemon reloads.\n\n```\n[daemon] Working tree changed (index mtime updated). Reloading workspace...\n```\n\n---\n\n## Step 7 — rt daemon stop [SIMULATED]\n\n```\nrt daemon stop\n```\n\n```\nStopping daemon (PID 18432)...\nDaemon stopped. State removed from C:\\Users\\DanMarshall\\.rt\\daemon.json\n```\n\nExit 0. Subsequent `rt` commands fall back to in-process (or auto-start a new daemon).\n\n---\n\n## Step 8 — version mismatch (rt binary rebuilt) [SIMULATED]\n\nUser rebuilds `rt` after a code change. Client and daemon have different `rtVersion`.\n\n```\nrt inspect find-refs --symbol WorkspaceLoader\n```\n\n```\n[daemon] Version mismatch (daemon: 0.9.0, client: 0.10.0). Restarting daemon...\nStarting daemon for RoslynTools.slnx...\n  Loaded 3 projects, 0 diagnostics.\nDaemon ready. PID 19110, pipe: rt-a9f3c17b\nFinding references to 'RoslynTools.Core.WorkspaceLoader'...\n```\n\nVersion is embedded in the binary at build time (e.g. from `git describe`). Mismatch → daemon kills itself, client starts a new one.\n\n---\n\n## Retrospective\n\n### Real commands used\n- `rt inspect find-refs` (Step 3 — run in-process to establish baseline timing)\n\n### Simulated commands → rt candidates\n\n| Command | Value | Feasibility |\n|---|---|---|\n| `rt daemon start` | Core lifecycle | High — named pipe + background process |\n| `rt daemon stop` | Core lifecycle | High |\n| `rt daemon status` | Observability | High |\n| `rt refactor rename` (stdin) | Pipe chains | Medium — needs stdin reader in rename handler |\n\n### Architecture decisions confirmed\n\n- **Transport:** Named pipe, one per solution hash. Cross-platform: named pipes on Windows, Unix domain sockets on Linux/Mac (same abstraction via `System.IO.Pipes`).\n- **State dir:** `~/.rt/` — single `daemon.json`, no repo impact, no per-solution subdirectories.\n- **Invalidation:** Client sends git state on every request. Daemon reloads on mismatch. No file watchers.\n- **Pipe chains:** stdin JSON consumed when `!Console.IsInputRedirected` is false. Commands extract `fullyQualifiedName` from stream.\n- **Version guard:** `rtVersion` in `daemon.json` compared to client version. Mismatch triggers daemon restart.\n- **Fallback:** `RT_NO_DAEMON=1` or `--no-daemon` for in-process execution (tests, CI).\n\n### Gaps logged\n\n- 2026-05-04: `rename` must accept piped stdin JSON — see rt-008\n- 2026-05-04: `rt daemon start/stop/status` commands do not exist\n- 2026-05-04: Client has no IPC layer — currently always runs in-process\n\n### Implementation order\n\n1. **DaemonClient** — connect to named pipe, send request, stream responses to stdout/stderr\n2. **DaemonServer** — named pipe listener, request deserialiser, workspace cache with git-state check\n3. **`rt daemon` subcommands** — start, stop, status (thin wrappers over DaemonServer lifecycle)\n4. **Auto-start** — if no daemon.json or pipe is dead, start daemon and wait for ready signal\n5. **Stdin pipe reader** — make mutation commands accept `fullyQualifiedName` from stdin JSON (rt-008)\n\n### Next session\n- Implement DaemonServer: named pipe listener + workspace cache\n- Implement DaemonClient: pipe connection + request/response streaming\n- Wire auto-start into Program.Main (between MsBuildBootstrap and App.RunAsync)\n"}], "RT-002": [{"path": "docs/COMMANDS.md", "content": "# rt Commands\n\nAuto-generated on every `dotnet build` from each command's static `RtCommandInfo Info` property. **Do not hand-edit.**\n\nTotal commands: **52**\n\nCommands are filed under one of three groups: `inspect`, `analyze`, `refactor`. Invoke either way:\n\n```bash\nrt <group> <command> [args...]   # canonical form\nrt <command> [args...]           # root shortcut (all unambiguous names)\n```\n\n## Contents\n\n- **`rt inspect`** — Read-only: examine a single symbol or file\n  - [`describe`](#describe), [`find-callers`](#find-callers) (callers), [`find-impl`](#find-impl) (impls), [`find-pattern`](#find-pattern) (fp), [`find-refs`](#find-refs), [`find-undocumented`](#find-undocumented) (undoc), [`find-unused`](#find-unused) (unused), [`outline`](#outline), [`source`](#source)\n- **`rt analyze`** — Read-only: scan for cross-cutting issues\n  - [`analyze-interface`](#analyze-interface), [`circular-deps`](#circular-deps) (cdeps), [`complexity`](#complexity) (cx), [`debug`](#debug), [`dependency-graph`](#dependency-graph) (depgraph), [`find-duplicates`](#find-duplicates) (fd), [`find-magic-strings`](#find-magic-strings) (magic-strings), [`list-imports`](#list-imports) (imports), [`list-smells`](#list-smells) (smells), [`solid`](#solid), [`static-class-inventory`](#static-class-inventory)\n- **`rt refactor`** — Mutations: rename, move, extract, replace, modify\n  - [`add-dependency`](#add-dependency) (ad), [`add-global-import`](#add-global-import) (agi), [`add-null-checks`](#add-null-checks) (anc), [`add-static-import`](#add-static-import) (asi), [`add-test`](#add-test) (at), [`add-xml-doc`](#add-xml-doc) (xmldoc), [`change-signature`](#change-signature), [`convert-console-logging`](#convert-console-logging) (ccl), [`convert-static-class`](#convert-static-class), [`convert-to-record`](#convert-to-record) (ctr), [`extract-class`](#extract-class) (ec), [`extract-interface`](#extract-interface) (ei), [`extract-method`](#extract-method) (em), [`extract-string-constant`](#extract-string-constant) (esc), [`fix-namespace`](#fix-namespace) (fns), [`implement-interface`](#implement-interface) (ii), [`inline-method`](#inline-method) (im), [`make-async`](#make-async) (ma), [`make-instance`](#make-instance) (mns), [`make-sealed`](#make-sealed) (ms), [`make-static`](#make-static) (mst), [`migrate-to-ioptions`](#migrate-to-ioptions) (mti), [`move`](#move), [`move-method`](#move-method), [`narrow-dependency`](#narrow-dependency) (nd), [`rename`](#rename) (ren), [`replace-call`](#replace-call) (rc), [`replace-datetime`](#replace-datetime), [`replace-new`](#replace-new) (rn), [`replace-xunit-asserts`](#replace-xunit-asserts) (rxa), [`safe-delete`](#safe-delete) (sd), [`transform-parameters`](#transform-parameters) (tp)\n\n## Index\n\n| Command | Group | Aliases | Description |\n|---------|-------|---------|-------------|\n| [`add-dependency`](#add-dependency) | `refactor` | `ad` | Inject a constructor dependency into a class |\n| [`add-global-import`](#add-global-import) | `refactor` | `agi` | Add a global using directive to an existing file |\n| [`add-null-checks`](#add-null-checks) | `refactor` | `anc` | Insert ArgumentNullException.ThrowIfNull guards for reference-type parameters |\n| [`add-static-import`](#add-static-import) | `refactor` | `asi` | Add a using static directive to a file |\n| [`add-test`](#add-test) | `refactor` | `at` | Append xUnit test stubs to an existing test class |\n| [`add-xml-doc`](#add-xml-doc) | `refactor` | `xmldoc` | Insert XML <summary> doc comments from a JSON map |\n| [`analyze-interface`](#analyze-interface) | `analyze` | — | Group interface consumers by the exact members they use |\n| [`change-signature`](#change-signature) | `refactor` | — | Change method signatures. |\n| [`circular-deps`](#circular-deps) | `analyze` | `cdeps` | Detect circular namespace/type dependencies in the solution |\n| [`complexity`](#complexity) | `analyze` | `cx` | Measure cyclomatic/cognitive complexity, LOC, and param counts per method |\n| [`convert-console-logging`](#convert-console-logging) | `refactor` | `ccl` | Convert Console.Write/WriteLine calls to logger calls |\n| [`convert-static-class`](#convert-static-class) | `refactor` | — | Migrate a static class to instance with DI registration and call-site rewrites |\n| [`convert-to-record`](#convert-to-record) | `refactor` | `ctr` | Convert a class to a record type with positional parameters |\n| [`debug`](#debug) | `analyze` | — | Inspect a recorded LLM trace timeline with breakpoints and assertions |\n| [`dependency-graph`](#dependency-graph) | `analyze` | `depgraph` | Build a type-level dependency graph for the solution |\n| [`describe`](#describe) | `inspect` | — | Show type shape: members, base types, interfaces, locations (JSON) |\n| [`extract-class`](#extract-class) | `refactor` | `ec` | Move named members from a class into a new class file |\n| [`extract-interface`](#extract-interface) | `refactor` | `ei` | Generate IXxx interface from a class's public members |\n| [`extract-method`](#extract-method) | `refactor` | `em` | Extract a range of statements into a new private method. |\n| [`extract-string-constant`](#extract-string-constant) | `refactor` | `esc` | Extract a string literal into a private const string |\n| [`find-callers`](#find-callers) | `inspect` | `callers` | Find all invocation sites for a method |\n| [`find-duplicates`](#find-duplicates) | `analyze` | `fd` | Report exact-clone code blocks repeated across the solution |\n| [`find-impl`](#find-impl) | `inspect` | `impls` | Find all implementations of an interface or abstract class (JSON) |\n| [`find-magic-strings`](#find-magic-strings) | `analyze` | `magic-strings` | Report repeated string literals |\n| [`find-pattern`](#find-pattern) | `inspect` | `fp` | Find all solution locations structurally matching a given statement range. |\n| [`find-refs`](#find-refs) | `inspect` | — | Find all references to a symbol across the solution |\n| [`find-undocumented`](#find-undocumented) | `inspect` | `undoc` | Report types and members with no XML doc comment |\n| [`find-unused`](#find-unused) | `inspect` | `unused` | Report types and methods with no references (dead code) |\n| [`fix-namespace`](#fix-namespace) | `refactor` | `fns` | Align a file's namespace declaratio

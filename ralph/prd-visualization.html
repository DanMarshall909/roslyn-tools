<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PRD Visualization</title>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    :root, [data-theme="cream"] {
      --bg: #ece4d4;
      --panel: #fffdf7;
      --panel-2: #f8f1e6;
      --ink: #1d2433;
      --muted: #687387;
      --line: #d7cdbb;
      --accent: #0f766e;
      --accent-soft: #d8f0ec;
      --warn: #9a3412;
      --warn-soft: #ffedd5;
      --done: #166534;
      --done-soft: #dcfce7;
      --shadow: 0 20px 50px rgba(74, 59, 34, 0.12);
      --radius: 22px;
      --body-bg: radial-gradient(circle at top left, #fff8ea 0, transparent 28%), linear-gradient(180deg, #f3ecdf 0%, #e9dfcd 100%);
      --shell-bg: rgba(255, 253, 247, 0.7);
      --shell-border: rgba(215, 205, 187, 0.8);
      --card-bg: #ffffff;
      --card-bg-hover: #fffaf0;
      --card-bg-active: #fff6e8;
      --card-border-hover: #b9a88c;
      --card-border-active: #c89e58;
      --card-shadow-active: rgba(200, 158, 88, 0.22);
      --pill-bg: #f7efe2;
      --pill-priority-bg: #f8efe1;
      --pill-epic-bg: #e8ddf3;
      --pill-epic-fg: #5b3a8c;
      --pill-epic-border: #c9b6e0;
      --pill-pending-border: #f3c89d;
      --pill-complete-border: #b7e4c7;
      --epic-bar-bg: #fcf7ee;
      --acceptance-bg: #fcf7ee;
      --code-bg: #f1eadf;
      --summary-bg: linear-gradient(180deg, #fffdf7 0%, #faf4e8 100%);
      --sidebar-top-bg: linear-gradient(180deg, #fffdf7 0%, #faf4e8 100%);
      --mobile-panel-bg: linear-gradient(180deg, #fffdf7 0%, #faf4e8 100%);
      --mobile-summary-bg: #fffaf0;
      --mobile-panel-body-bg: #ffffff;
      --font-family: Georgia, "Times New Roman", serif;
      --resizer-color: rgba(215, 205, 187, 0.6);
      --resizer-color-hover: #c89e58;
    }
    [data-theme="dark"] {
      --bg: #0f1419;
      --panel: #1a2028;
      --panel-2: #232b36;
      --ink: #e6edf3;
      --muted: #8b949e;
      --line: #30363d;
      --accent: #58a6ff;
      --accent-soft: #1f2d43;
      --warn: #f0883e;
      --warn-soft: #3a220f;
      --done: #3fb950;
      --done-soft: #0f2e19;
      --shadow: 0 20px 50px rgba(0, 0, 0, 0.45);
      --radius: 22px;
      --body-bg: radial-gradient(circle at top left, #1a2430 0, transparent 30%), linear-gradient(180deg, #0d1117 0%, #161b22 100%);
      --shell-bg: rgba(26, 32, 40, 0.7);
      --shell-border: rgba(48, 54, 61, 0.8);
      --card-bg: #161b22;
      --card-bg-hover: #1c232c;
      --card-bg-active: #22303f;
      --card-border-hover: #444c56;
      --card-border-active: #58a6ff;
      --card-shadow-active: rgba(88, 166, 255, 0.22);
      --pill-bg: #22272e;
      --pill-priority-bg: #2a2e37;
      --pill-epic-bg: #2d2640;
      --pill-epic-fg: #c9a9ff;
      --pill-epic-border: #3d345a;
      --pill-pending-border: #3a220f;
      --pill-complete-border: #0f2e19;
      --epic-bar-bg: #161b22;
      --acceptance-bg: #161b22;
      --code-bg: #0d1117;
      --summary-bg: linear-gradient(180deg, #1a2028 0%, #141920 100%);
      --sidebar-top-bg: linear-gradient(180deg, #1a2028 0%, #141920 100%);
      --mobile-panel-bg: linear-gradient(180deg, #1a2028 0%, #141920 100%);
      --mobile-summary-bg: #1c232c;
      --mobile-panel-body-bg: #161b22;
      --font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --resizer-color: rgba(48, 54, 61, 0.8);
      --resizer-color-hover: #58a6ff;
    }
    [data-theme="paper"] {
      --bg: #f5f5f5;
      --panel: #ffffff;
      --panel-2: #fafafa;
      --ink: #111111;
      --muted: #666666;
      --line: #e0e0e0;
      --accent: #1a73e8;
      --accent-soft: #e8f0fe;
      --warn: #c5221f;
      --warn-soft: #fce8e6;
      --done: #137333;
      --done-soft: #e6f4ea;
      --shadow: 0 4px 14px rgba(0, 0, 0, 0.08);
      --radius: 10px;
      --body-bg: #f5f5f5;
      --shell-bg: #ffffff;
      --shell-border: #e0e0e0;
      --card-bg: #ffffff;
      --card-bg-hover: #f7f7f7;
      --card-bg-active: #e8f0fe;
      --card-border-hover: #bdbdbd;
      --card-border-active: #1a73e8;
      --card-shadow-active: rgba(26, 115, 232, 0.18);
      --pill-bg: #f0f0f0;
      --pill-priority-bg: #f0f0f0;
      --pill-epic-bg: #f3e8fd;
      --pill-epic-fg: #6b3fa0;
      --pill-epic-border: #d6c3ef;
      --pill-pending-border: #f9c7c5;
      --pill-complete-border: #b7e1c0;
      --epic-bar-bg: #fafafa;
      --acceptance-bg: #fafafa;
      --code-bg: #f0f0f0;
      --summary-bg: #ffffff;
      --sidebar-top-bg: #ffffff;
      --mobile-panel-bg: #ffffff;
      --mobile-summary-bg: #fafafa;
      --mobile-panel-body-bg: #ffffff;
      --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --resizer-color: #e0e0e0;
      --resizer-color-hover: #1a73e8;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; overflow: hidden; }
    body {
      margin: 0;
      color: var(--ink);
      background: var(--body-bg);
      font-family: var(--font-family);
    }
    #root { height: 100%; }
    .app {
      height: 100vh;
      margin: 0 auto;
      padding: 16px;
      max-width: none;
    }
    .shell {
      height: 100%;
      background: var(--shell-bg);
      border: 1px solid var(--shell-border);
      border-radius: 28px;
      padding: 18px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(10px);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .eyebrow {
      text-transform: uppercase;
      letter-spacing: 0.08em;
      font-size: 0.76rem;
      color: var(--muted);
      margin-bottom: 6px;
    }
    h1, h2, h3, h4, h5, p { margin: 0; }
    .subtitle {
      color: var(--muted);
      margin-top: 6px;
    }
    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      margin-bottom: 14px;
      flex-wrap: wrap;
    }
    .theme-picker {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 0.85rem;
      color: var(--muted);
      white-space: nowrap;
    }
    .theme-picker-label {
      text-transform: uppercase;
      letter-spacing: 0.08em;
      font-size: 0.72rem;
    }
    .theme-select {
      border: 1px solid var(--line);
      background: var(--card-bg);
      color: var(--ink);
      border-radius: 999px;
      padding: 6px 12px;
      font: inherit;
      cursor: pointer;
    }
    .project-tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }
    .project-tab {
      border: 1px solid var(--line);
      background: var(--card-bg);
      color: var(--ink);
      border-radius: 999px;
      padding: 10px 14px;
      cursor: pointer;
      font: inherit;
    }
    .project-tab.active {
      background: var(--accent);
      border-color: var(--accent);
      color: white;
    }
    .prd-picker {
      position: relative;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    .prd-picker-trigger {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      border: 1px solid var(--line);
      background: var(--card-bg);
      color: var(--ink);
      border-radius: 999px;
      padding: 8px 14px;
      cursor: pointer;
      font: inherit;
      max-width: 360px;
    }
    .prd-picker-trigger:hover {
      border-color: var(--card-border-hover);
      background: var(--card-bg-hover);
    }
    .prd-picker-trigger.open {
      border-color: var(--card-border-active);
      background: var(--card-bg-active);
    }
    .prd-picker-icon {
      width: 16px;
      height: 16px;
      flex: 0 0 auto;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .prd-picker-label {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-weight: 600;
    }
    .prd-picker-caret {
      color: var(--muted);
      font-size: 0.7rem;
      flex: 0 0 auto;
    }
    .prd-picker-menu {
      position: absolute;
      top: calc(100% + 8px);
      left: 0;
      width: min(640px, calc(100vw - 48px));
      max-height: 420px;
      overflow: auto;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: var(--panel);
      box-shadow: var(--shadow);
      padding: 10px;
      z-index: 30;
    }
    .prd-picker-toggle {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 10px 12px;
      border-bottom: 1px solid var(--line);
      margin-bottom: 10px;
      font-size: 0.84rem;
      color: var(--muted);
    }
    .prd-picker-toggle input {
      margin: 0;
    }
    .prd-option {
      display: block;
      width: 100%;
      border: 1px solid transparent;
      background: var(--card-bg);
      border-radius: 14px;
      padding: 12px 14px;
      color: var(--ink);
      font: inherit;
      text-align: left;
      cursor: pointer;
    }
    .prd-option + .prd-option {
      margin-top: 8px;
    }
    .prd-option:hover,
    .prd-option.active {
      border-color: var(--card-border-active);
      background: var(--card-bg-active);
    }
    .prd-option-top {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: center;
    }
    .prd-option-title {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-weight: 700;
    }
    .prd-option-subtitle {
      margin-top: 4px;
      color: var(--muted);
      font-size: 0.82rem;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .sync-status {
      padding: 0 6px 12px;
      font-size: 0.84rem;
      color: var(--muted);
    }
    .sync-status.error {
      color: var(--warn);
    }
    .main-grid {
      flex: 1 1 auto;
      display: grid;
      grid-template-columns: var(--col-1, 28%) 6px var(--col-2, 32%) 6px minmax(0, 1fr);
      gap: 0;
      min-height: 0;
    }
    .resizer {
      background: transparent;
      cursor: col-resize;
      position: relative;
      user-select: none;
      touch-action: none;
    }
    .resizer::before {
      content: "";
      position: absolute;
      top: 10%;
      bottom: 10%;
      left: 2px;
      right: 2px;
      background: var(--resizer-color);
      border-radius: 2px;
      transition: background 0.12s ease;
    }
    .resizer:hover::before,
    .resizer.dragging::before {
      background: var(--resizer-color-hover);
    }
    .sidebar, .summary-pane, .details {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--panel);
      overflow: hidden;
    }
    .sidebar {
      display: flex;
      flex-direction: column;
      min-width: 0;
      min-height: 0;
    }
    .sidebar-top {
      padding: 18px;
      border-bottom: 1px solid var(--line);
      background: var(--sidebar-top-bg);
    }
    .filters {
      display: grid;
      grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr) minmax(0, 1fr);
      gap: 10px;
    }
    .filter-select {
      width: 100%;
      border: 1px solid var(--line);
      background: var(--card-bg);
      border-radius: 14px;
      padding: 11px 13px;
      font: inherit;
      color: var(--ink);
    }
    .search {
      width: 100%;
      border: 1px solid var(--line);
      background: var(--card-bg);
      border-radius: 14px;
      padding: 11px 13px;
      font: inherit;
      color: var(--ink);
    }
    .search:focus {
      outline: 2px solid var(--accent-soft);
      border-color: var(--accent);
    }
    .story-list {
      flex: 1 1 auto;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 10px;
      display: grid;
      gap: 10px;
      min-height: 0;
      min-width: 0;
    }
    .story-row {
      border: 1px solid var(--line);
      background: var(--card-bg);
      border-radius: 16px;
      padding: 14px;
      cursor: pointer;
      text-align: left;
      font: inherit;
      color: inherit;
      display: grid;
      gap: 8px;
    }
    .story-row:hover {
      border-color: var(--card-border-hover);
      background: var(--card-bg-hover);
    }
    .story-row.active {
      background: var(--card-bg-active);
      border-color: var(--card-border-active);
      box-shadow: inset 0 0 0 1px var(--card-shadow-active);
    }
    .story-row-top {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: flex-start;
    }
    .story-id {
      font-size: 0.76rem;
      letter-spacing: 0.08em;
      color: var(--muted);
      text-transform: uppercase;
    }
    .story-title {
      font-size: 1rem;
      line-height: 1.25;
    }
    .story-desc-preview {
      color: var(--muted);
      font-size: 0.92rem;
      line-height: 1.35;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .pill-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .pill {
      border-radius: 999px;
      padding: 4px 10px;
      font-size: 0.78rem;
      border: 1px solid var(--line);
      white-space: nowrap;
      background: var(--pill-bg);
    }
    .pill.pending {
      background: var(--warn-soft);
      color: var(--warn);
      border-color: var(--pill-pending-border);
    }
    .pill.complete {
      background: var(--done-soft);
      color: var(--done);
      border-color: var(--pill-complete-border);
    }
    .pill.priority {
      background: var(--pill-priority-bg);
    }
    .pill.epic {
      background: var(--pill-epic-bg);
      color: var(--pill-epic-fg);
      border-color: var(--pill-epic-border);
    }
    .epic-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      padding: 10px 12px;
      border-bottom: 1px solid var(--line);
      background: var(--epic-bar-bg);
    }
    .epic-chip {
      background: var(--card-bg);
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 4px 10px;
      font-size: 0.78rem;
      color: var(--ink);
      font: inherit;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .epic-chip:hover {
      border-color: var(--card-border-hover);
      background: var(--card-bg-hover);
    }
    .epic-chip.active {
      background: var(--pill-epic-bg);
      border-color: var(--pill-epic-border);
      box-shadow: inset 0 0 0 1px var(--card-shadow-active);
    }
    .epic-chip .epic-id {
      color: var(--pill-epic-fg);
      font-weight: 600;
    }
    .epic-chip .epic-count {
      color: var(--muted);
    }
    .details {
      display: flex;
      flex-direction: column;
      min-width: 0;
      min-height: 0;
    }
    .summary-pane {
      display: flex;
      flex-direction: column;
      min-width: 0;
      min-height: 0;
    }
    .summary-inner {
      flex: 1 1 auto;
      padding: 22px;
      overflow-y: auto;
      overflow-x: hidden;
      min-height: 0;
      min-width: 0;
      background: var(--summary-bg);
    }
    .summary-title {
      font-size: 1.35rem;
      line-height: 1.25;
    }
    .summary-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 14px 0 18px;
    }
    .summary-preview {
      color: var(--muted);
      margin-top: 18px;
      font-size: 0.95rem;
      line-height: 1.45;
    }
    .details-inner {
      flex: 1 1 auto;
      padding: 28px;
      overflow-y: auto;
      overflow-x: hidden;
      min-height: 0;
      min-width: 0;
    }
    .details-top {
      display: flex;
      justify-content: space-between;
      gap: 18px;
      align-items: flex-start;
      margin-bottom: 18px;
    }
    .details-path {
      margin-top: 8px;
      color: var(--muted);
      word-break: break-word;
    }
    .section {
      margin-top: 24px;
      padding-top: 20px;
      border-top: 1px solid var(--line);
    }
    .section h4 {
      margin-bottom: 12px;
      font-size: 1rem;
    }
    .markdown {
      color: var(--ink);
      line-height: 1.55;
    }
    .markdown p {
      margin: 0 0 12px;
    }
    .markdown p:last-child {
      margin-bottom: 0;
    }
    .markdown ul, .markdown ol {
      margin: 0 0 12px 22px;
      padding: 0;
    }
    .markdown li + li {
      margin-top: 8px;
    }
    .markdown code {
      font-family: Consolas, "Courier New", monospace;
      background: var(--code-bg);
      padding: 1px 5px;
      border-radius: 6px;
      font-size: 0.92em;
    }
    .linked-docs {
      margin-top: 24px;
      padding-top: 20px;
      border-top: 1px solid var(--line);
      display: grid;
      gap: 18px;
    }
    .linked-doc-path {
      font-family: Consolas, "Courier New", monospace;
      font-size: 0.82rem;
      color: var(--muted);
      margin-bottom: 10px;
      word-break: break-all;
    }
    .spec-markdown {
      font-size: 0.95rem;
      line-height: 1.55;
      min-width: 0;
      overflow-wrap: break-word;
      word-break: break-word;
    }
    .spec-markdown img { max-width: 100%; height: auto; }
    .spec-markdown table {
      display: block;
      max-width: 100%;
      overflow-x: auto;
    }
    .spec-markdown h1, .spec-markdown h2, .spec-markdown h3 {
      margin: 18px 0 8px;
      line-height: 1.2;
    }
    .spec-markdown h1 { font-size: 1.25rem; }
    .spec-markdown h2 { font-size: 1.1rem; }
    .spec-markdown h3 { font-size: 1rem; }
    .spec-markdown p { margin: 0 0 12px; }
    .spec-markdown ul, .spec-markdown ol { margin: 0 0 12px 22px; }
    .spec-markdown li + li { margin-top: 6px; }
    .spec-markdown pre {
      background: var(--code-bg);
      padding: 12px;
      border-radius: 8px;
      overflow-x: auto;
      max-width: 100%;
      font-size: 0.88em;
      line-height: 1.45;
    }
    .spec-markdown code {
      font-family: Consolas, "Courier New", monospace;
      background: var(--code-bg);
      padding: 1px 5px;
      border-radius: 6px;
      font-size: 0.92em;
    }
    .spec-markdown pre code { background: none; padding: 0; }
    .spec-markdown table {
      border-collapse: collapse;
      margin: 12px 0;
      font-size: 0.9em;
    }
    .spec-markdown th, .spec-markdown td {
      border: 1px solid var(--line);
      padding: 6px 10px;
    }
    .spec-markdown blockquote {
      margin: 12px 0;
      padding: 4px 14px;
      border-left: 3px solid var(--line);
      color: var(--muted);
    }
    .acceptance-list {
      display: grid;
      gap: 12px;
      padding: 0;
      margin: 0;
      list-style: none;
    }
    .acceptance-item {
      background: var(--acceptance-bg);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 14px 16px;
    }
    .acceptance-index {
      display: inline-block;
      min-width: 28px;
      margin-right: 8px;
      color: var(--muted);
      font-size: 0.8rem;
    }
    .empty {
      padding: 28px;
      color: var(--muted);
    }
    .mobile-summary {
      display: none;
      margin-bottom: 14px;
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 14px;
      background: var(--mobile-summary-bg);
    }
    .mobile-accordion {
      display: none;
    }
    .mobile-panel {
      border: 1px solid var(--line);
      border-radius: 18px;
      background: var(--panel);
      overflow: hidden;
      margin-top: 14px;
    }
    .mobile-panel summary {
      list-style: none;
      cursor: pointer;
      padding: 14px 16px;
      background: var(--mobile-panel-bg);
      font-weight: 700;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }
    .mobile-panel summary::-webkit-details-marker {
      display: none;
    }
    .mobile-panel summary::after {
      content: "+";
      color: var(--muted);
      font-size: 1.1rem;
      line-height: 1;
    }
    .mobile-panel[open] summary::after {
      content: "−";
    }
    .mobile-panel-body {
      padding: 12px;
      border-top: 1px solid var(--line);
      background: var(--mobile-panel-body-bg);
    }
    @media (max-width: 1350px) {
      .main-grid {
        grid-template-columns: var(--col-1, 28%) 6px minmax(0, 1fr) !important;
      }
      .summary-pane, .resizer.resizer-2 {
        display: none;
      }
    }
    @media (max-width: 900px) {
      .app {
        padding: 14px;
        height: 100vh;
      }
      .shell {
        padding: 12px;
        border-radius: 20px;
      }
      .main-grid {
        display: none;
      }
      .mobile-accordion {
        display: block;
      }
      .mobile-summary {
        display: block;
      }
      .details-inner {
        padding: 18px;
      }
    }

onExpressionSyntax whose target is string.Format (System.String.Format) when used as the first argument to Console.Write / Console.WriteLine", "Decompose the format string literal into the same structured template the existing literal-string path produces, preserving the order of arguments after the format string as message-template arguments", "Support both the (string format, params object[] args) overload and (IFormatProvider, string, params object[]) overloads (the latter degrades gracefully or is rejected with a TODO comment)", "Numeric placeholders ({0}, {1}, ...) are translated into named placeholders consistent with how the existing decomposer names parameters (e.g. {Arg0}, {Arg1}) — match existing naming convention if any, otherwise document the chosen scheme in code comments", "Non-string.Format invocations passed as the first argument continue to fall back to the existing {Value} placeholder — no behaviour regression for unrelated code", "Add xUnit tests under tests/RoslynTools.Tests/ covering: (a) Console.WriteLine(string.Format(\"x={0}\", x)), (b) Console.Write with two args, (c) string.Format with no args (constant string — should be treated as plain string), (d) string.Format with IFormatProvider overload, (e) negative case ensuring a non-string.Format invocation still uses the {Value} fallback", "dotnet build \"RoslynTools.slnx\" passes with zero errors and zero new warnings", "dotnet test \"tests/RoslynTools.Tests/RoslynTools.Tests.csproj\" -v minimal passes with all new and existing tests green", "dotnet format \"RoslynTools.slnx\" --verify-no-changes passes"], "priority": 1, "passes": false, "notes": "Affected files: src/RoslynTools/Services/ConsoleLoggingService.cs (verify exact path post-rename), tests/RoslynTools.Tests/<new ConsoleLoggingService tests file>. Bug, no live regression yet but pre-emptive. Conservative scope: only handle string.Format as direct first arg to Console.Write/WriteLine; nested expressions (e.g. ternary returning string.Format) remain on fallback path.", "epicId": "EP-001"}, {"id": "US-002", "title": "Fix silent failure in rt extract-method on conditional expression blocks", "description": "As a developer running rt refactor extract-method against a method containing ternary or conditional-expression statements, I want the command to either succeed or fail with a clear, actionable error so that I do not see exit 0 with no output and no file change.", "acceptanceCriteria": ["Reproduce the silent failure: write a fixture method roughly mirroring the AdminScrapingController.ParseAiImages shape (a ternary spanning a list/select projection) and run rt extract-method against it; capture exit code, stdout, stderr", "Determine the root cause: either the line-range selection misses the statements, MethodExtractor returns an empty change set, or the SolutionWriter swallows it. Record findings in the commit message", "If the cause is missing line-range argument support, add validation: when no explicit range is supplied and the heuristic fails, exit non-zero with a message like \"extract-method: could not infer statement range; pass --start-line and --end-line\"", "If the cause is conditional-expression handling, extend the statement-selection / dataflow logic in src/RoslynTools/Services/MethodExtractor* to recurse into ConditionalExpressionSyntax / parenthesised conditional bodies", "When extraction genuinely cannot succeed (e.g. crosses a yield-return boundary), exit code 1 with a single-line stderr diagnostic naming the obstruction; never exit 0 silently", "Add an xUnit regression test using the reproducing fixture asserting either successful extraction or non-zero exit with the expected stderr message", "Ensure no other extract-method tests regress — run the full filter `--filter \"FullyQualifiedName~ExtractMethod\"` and report timings", "dotnet build \"RoslynTools.slnx\" passes with zero errors and zero new warnings", "dotnet test \"tests/RoslynTools.Tests/RoslynTools.Tests.csproj\" -v minimal passes", "dotnet format \"RoslynTools.slnx\" --verify-no-changes passes"], "priority": 2, "passes": false, "notes": "Affected files: src/RoslynTools/Services/MethodExtractor.cs and friends, src/RoslynTools/Commands/ExtractMethodCommand.cs (only if validation surface changes), tests/RoslynTools.Tests/ExtractMethodTests.cs. Conservative interpretation: prefer the validation/error path over speculative AST work if root-cause analysis is inconclusive in one session — silent exit-0 is the bug to kill first.", "epicId": "EP-001"}, {"id": "US-003", "title": "Fix line-range drift in MethodExtractorDuplicates.ReplaceDuplicatesAsync", "description": "As a developer running rt extract-method --replace-duplicates against a file with multiple matches, I want every duplicate to be replaced correctly so that earlier replacements do not shift later line ranges and cause SelectStatementsInRange to pick the wrong statements.", "acceptanceCriteria": ["Add a regression test that constructs a file with three identical extractable blocks and asserts all three are replaced after a single ReplaceDuplicatesAsync call", "Choose one of the three documented fix strategies and apply it: (a) sort matches per-file in descending start-line order then replace bottom-up, (b) re-run FindMatchesAsync between replacements, or (c) annotate matched nodes with SyntaxAnnotation and rewrite by annotation rather than line range. The chosen strategy is documented in the commit message", "Cross-file behaviour is preserved: when matches span multiple files, the order they are processed across files does not affect correctness", "Existing single-match path remains untouched and its tests stay green", "Edge case: two matches that share a starting line (overlapping) are handled deterministically — either both replaced (if non-overlapping spans) or one rejected with a warning (if overlapping); behaviour documented in test", "Edge case: a match whose line range spans across the file boundary or onto the last line of the file does not throw", "dotnet build \"RoslynTools.slnx\" passes with zero errors and zero new warnings", "dotnet test \"tests/RoslynTools.Tests/RoslynTools.Tests.csproj\" -v minimal passes", "dotnet format \"RoslynTools.slnx\" --verify-no-changes passes"], "priority": 3, "passes": false, "notes": "Affected files: src/RoslynTools/Services/MethodExtractorDuplicates.cs (verify post-rename), tests/RoslynTools.Tests/MethodExtractorDuplicatesTests.cs. From US-016 in the gap log. Recommend strategy (c) SyntaxAnnotation as the most robust, but accept (a) bottom-up if simpler.", "epicId": "EP-001"}, {"id": "US-004", "title": "Migrate MoveService WARNING messages to RtLog.Warning", "description": "As a maintainer cleaning up the RtConsole/RtLog migration, I want the two residual WARNING:-prefixed messages in MoveService.cs (formerly MoveCore.cs) routed through RtLog.Warning so that warning routing is consistent across the codebase and stderr-grep consumers see a uniform [WARNING] prefix.", "acceptanceCriteria": ["Locate the two WARNING: messages (formerly lines 328 and 344 of MoveCore.cs; verify exact lines in MoveService.cs after the rename)", "Replace each `RtConsole.WriteLine(Result, \"WARNING: ...\")` call with `RtLog.Warning(\"...\")`, dropping the inline WARNING: prefix since RtLog.Warning prepends [WARNING]", "Confirm the messages are now routed to stderr (matching RtLog.Warning's existing behaviour) and not stdout", "Verify no test or downstream consumer parses the literal string `WARNING:` from MoveCommand stdout — search for `WARNING:` across tests/ and update any dependent assertion to match the new `[WARNING]` prefix on stderr", "Add or update a MoveCommand test asserting (a) the warning text appears on stderr with the [WARNING] prefix and (b) stdout no longer contains the WARNING: prefix", "dotnet build \"RoslynTools.slnx\" passes with zero errors and zero new warnings", "dotnet test \"tests/RoslynTools.Tests/RoslynTools.Tests.csproj\" -v minimal passes", "dotnet format \"RoslynTools.slnx\" --verify-no-changes passes"], "priority": 4, "passes": false, "notes": "Affected files: src/RoslynTools/Services/MoveService.cs (verify), tests/RoslynTools.Tests/MoveCommandTests.cs (or equivalent). Item 2 in the gap log. Format change for stderr-grep consumers — call out in commit message and changelog.", "epicId": "EP-002"}, {"id": "US-005", "title": "Repair non-buildable commit 0445c01 via interactive rebase", "description": "As a maintainer who relies on git bisect, I want commit 0445c01 to build standalone so that bisect across the US-012/US-016 range does not fail spuriously.", "acceptanceCriteria": ["Confirm the failure: `git checkout 0445c01 && dotnet build \"RoslynTools.slnx\"` fails because MethodExtractor.ExtractAsync(replaceDuplicates: ...) does not yet exist", "Plan the interactive rebase: identify the ExtractMethodCommand.cs hunk in 0445c01 that references the not-yet-added parameter and identify 31765bc as the commit where the parameter is added", "Move the offending ExtractMethodCommand.cs hunk forward from 0445c01 into 31765bc, leaving 0445c01 with only US-012 changes that build standalone", "After the rebase, verify both commits build: checkout 0445c01 -> dotnet build passes; checkout 31765bc -> dotnet build passes; checkout HEAD -> full test suite passes", "Run a smoke bisect: `git bisect start HEAD <commit before 0445c01> -- src/RoslynTools/Services/MethodExtractor*.cs` then bisect run dotnet build to confirm no spurious failures across the range", "Force-push only after a fast-forward dry-run on the dev branch confirms no other branches/PRs are based on the rewritten commits — if any are, document a coordination plan in the commit/PR description rather than rewriting unilaterally", "dotnet build \"RoslynTools.slnx\" passes at HEAD with zero errors and zero new warnings", "dotnet test \"tests/RoslynTools.Tests/RoslynTools.Tests.csproj\" -v minimal passes", "dotnet format \"RoslynTools.slnx\" --verify-no-changes passes"], "priority": 5, "passes": false, "notes": "Affected files: history rewrite of commits 0445c01 and 31765bc. From the gap log bisect-hazard entry. CONSERVATIVE: history rewrites are risky on shared branches — a session may end with the rebase staged but not pushed if any other branch is based on the affected commits. Document blockers and stop rather than coordinate force-pushes mid-session.", "epicId": "EP-005"}, {"id": "US-006", "title": "Extract ExtractMethodHandler.RunAsync to enforce thin-shell rule on ExtractMethodCommand", "description": "As a maintainer applying the \"Command ExecuteAsync ≤ 20 lines\" thin-shell rule, I want the ~40-line SetHandler lambda in ExtractMethodCommand pulled into a Services-side ExtractMethodHandler.RunAsync(ctx) helper so that the command class stays a thin CLI shell.", "acceptanceCriteria": ["Create src/RoslynTools/Services/ExtractMethodHandler.cs with `internal static class ExtractMethodHandler` exposing `RunAsync(ExtractMethodContext ctx)` (or equivalent record/struct carrying the parsed CLI args)", "Move all logic currently in the SetHandler lambda into RunAsync, leaving the lambda body short — read options, build the context, await ExtractMethodHandler.RunAsync, return the int exit code", "Lambda body is ≤ 20 lines (counted exclusive of brace lines per the team rule)", "Define an ExtractMethodContext record (or similar) at the top of the new file capturing exactly the inputs the handler needs — no leakage of System.CommandLine types into the Services layer", "Update existing ExtractMethodCommand tests if they reference internals; add at least one direct unit test for ExtractMethodHandler.RunAsync that bypasses the command-line layer", "rt dump-help shows the same examples and Info as before (Info.Examples reflects actual invocation)", "Output (stdout/stderr/exit code) is byte-stable across the refactor — confirm with a snapshot test or a before/after diff captured in the commit message", "dotnet build \"RoslynTools.slnx\" passes with zero errors and zero new warnings", "dotnet test \"tests/RoslynTools.Tests/RoslynTools.Tests.csproj\" -v minimal passes", "dotnet format \"RoslynTools.slnx\" --verify-no-changes passes"], "priority": 6, "passes": false, "notes": "Affected files: src/RoslynTools/Commands/ExtractMethodCommand.cs, src/RoslynTools/Services/ExtractMethodHandler.cs (new), tests/RoslynTools.Tests/. Item 12 in the gap log.", "epicId": "EP-005"}, {"id": "US-007", "title": "Audit RtCommandInfo fields exposed in dump-help --json", "description": "As a maintainer enforcing the external-action rule, I want every RtCommandInfo field either exposed in dump-help --json output or deleted as cruft so that no field is unobservable to external consumers.", "acceptanceCriteria": ["List every field of RtCommandInfo (Name, Category, Mutates, JsonOutput, Examples, KnownIssues, plus any others) and check whether each is currently included in DumpHelpCommand --json output", "For each field not exposed, decide: expose it (preferred for Category, Mutates, JsonOutput) or delete it. Decision and rationale for each is documented in the commit message", "Update DumpHelpCommand to serialise the agreed-upon set of fields under stable JSON keys (camelCase to match existing convention; verify by looking at current output)", "Add an xUnit test asserting the JSON shape against a small sample command (one field per type — string, bool, string[]) — uses Verify.Xunit if already adopted in the project, otherwise a strict-equality assertion", "Run rt dump-help --json against the full command set and confirm it parses as valid JSON (`| ConvertFrom-Json` round-trip)", "Update any KnownIssues entries on commands that are now resolved by this change", "rt dump-help shows the audited shape and Info.Examples reflects the actual invocation", "dotnet build \"RoslynTools.slnx\" passes with zero errors and zero new warnings", "dotnet test \"tests/RoslynTools.Tests/RoslynTools.Tests.csproj\" -v minimal passes", "dotnet format \"RoslynTools.slnx\" --verify-no-changes passes"], "priority": 7, "passes": false, "notes": "Affected files: src/RoslynTools/Core/RtCommandInfo.cs (verify path), src/RoslynTools/Commands/DumpHelpCommand.cs, tests/RoslynTools.Tests/DumpHelpCommandTests.cs. Item 16 in the gap log. Conservative default: expose rather than delete for ambiguous fields — deletion is reversible only by re-implementing.", "epicId": "EP-003"}, {"id": "US-008", "title": "Add rt dump-help --json --normalize for stable snapshots", "description": "As a maintainer using Verify.Xunit snapshots over dump-help output, I want a --normalize flag on dump-help --json that strips non-deterministic fields (version strings, absolute paths, build timestamps) so that snapshots stop churning across machines and builds.", "acceptanceCriteria": ["Add a `--normalize` boolean flag to DumpHelpCommand alongside the existing `--json` flag (use --normalize without --json -> error with explanatory message, or apply normalization to plain output too — pick one; document in Info.Examples)", "When --normalize is set, the JSON output: (a) replaces absolute paths under cwd with relative paths, (b) replaces or omits any version field, (c) omits any timestamp field, (d) sorts arrays/object keys deterministically where ordering is not semantic", "Run dump-help --json --normalize twice on the same machine and assert byte-for-byte identical output (same hash)", "Run dump-help --json --normalize on Windows and (if reachable in CI) on Linux/macOS — output should match modulo line endings; document any platform-specific stripping", "Add a Verify.Xunit (or assertion-based) snapshot test using --normalize, demonstrating stable output", "Without --normalize, output is unchanged byte-for-byte (no behaviour regression)", "rt dump-help shows the new flag and Info.Examples reflects the actual invocation including --normalize", "dotnet build \"RoslynTools.slnx\" passes with zero errors and zero new warnings", "dotnet test \"tests/RoslynTools.Tests/RoslynTools.Tests.csproj\" -v minimal passes", "dotnet format \"RoslynTools.slnx\" --verify-no-changes passes"], "priority": 8, "passes": false, "notes": "Affected files: src/RoslynTools/Commands/DumpHelpCommand.cs, tests/RoslynTools.Tests/DumpHelpCommandTests.cs. Item 15 in the gap log. DEPENDS ON: US-007 (audit settles which fields exist in --json before normalisation rules are written).", "epicId": "EP-005"}, {"id": "US-009", "title": "Add rt add-test --cli mode for CLI-invocation test scaffolding", "description": "As a developer adding a new rt command, I want rt add-test --cli <CommandClass> to scaffold a CLI-invocation test class that runs `Command.Parse(...).InvokeAsync(...)` and asserts on stdout/stderr/exit-code so that my new command gets coverage for required-arg-missing, help output, and a dry-run happy-path without me hand-writing boilerplate.", "acceptanceCriteria": ["Add `--cli` flag to AddTestCommand; when set, scaffolding emits a test class targeting CLI invocation rather than Core/Service unit tests", "Generated class includes at minimum three test methods: (a) RequiredArgsMissing_ReturnsNonZeroExit, (b) HelpFlag_PrintsHelpAndExitsZero, (c) DryRun_HappyPath_ReturnsZeroAndProducesExpectedDiff", "Generated tests use Command.Parse(...).InvokeAsync(...) (or the project's equivalent harness if one exists — search for existing patterns first)", "Stdout/stderr capture uses TextWriter / TextReader redirection that survives parallel xUnit runs (or marks the class non-parallel if the harness is process-global)", "Generated file path: tests/RoslynTools.Tests/Cli/<CommandName>CliTests.cs (verify Cli/ subfolder convention by looking at existing layout — fall back to flat tests/RoslynTools.Tests/ if no Cli/ folder exists)", "Without --cli, AddTestCommand behaviour is unchanged (regression coverage on existing scaffolding tests)", "Self-test: run `rt add-test --cli ExtractMethodCommand --dry-run`, capture diff, assert it includes the three olution to verify they still pass when --solution is passed; add new tests for the auto-detect path (cwd inside repo with a single .slnx) and the failure path (cwd in /tmp)", "rt dump-help notes the auto-detection behaviour in either the global help section or each command's --solution help text", "dotnet build \"RoslynTools.slnx\" passes with zero errors and zero new warnings", "dotnet test \"tests/RoslynTools.Tests/RoslynTools.Tests.csproj\" -v minimal passes", "dotnet format \"RoslynTools.slnx\" --verify-no-changes passes"], "priority": 10, "passes": false, "notes": "Affected files: src/RoslynTools/Services/WorkspaceLoader.cs, src/RoslynTools/Commands/* (only --solution help text), tests/RoslynTools.Tests/WorkspaceLoaderTests.cs (new), tests/RoslynTools.Tests/Cli/<command>Tests.cs. Item 17 in the gap log. CONSERVATIVE: .rtconfig is split out — adds config-file format and parser surface that won't fit one session.", "epicId": "EP-003"}, {"id": "US-011", "title": "Separate workspace diagnostics from results in --json output", "description": "As a developer running an rt analyze/inspect command in --json mode, I want non-fatal workspace warnings (NuGet audit warnings, locked obj/dll files) to appear under a separate `diagnostics:` key rather than mixed into results so that I can pipe results into jq without filtering noise.", "acceptanceCriteria": ["Pick a single helper (likely in WorkspaceLoader or a new RtDiagnosticsCollector) that captures non-fatal Roslyn workspace diagnostics during load", "Top-level --json envelope across all read-only commands is `{ \"diagnostics\": [ ... ], \"results\": <command-specific> }` — `diagnostics` is always present (empty array if none), `results` shape is unchanged", "Each diagnostic item has at minimum: `severity` (info/warning/error), `message`, `source` (e.g. \"workspace-load\", \"nuget-audit\", \"file-lock\")", "When --json is not set, diagnostics are written to stderr in their existing form — no behaviour change for plain-text consumers", "Apply the envelope to at least three representative read-only commands (e.g. inspect describe, inspect find-refs, analyze dependency-graph) and add tests for each", "Add a test that loads a workspace producing at least one warning (e.g. a project with a deliberately broken NuGet reference in a fixture) and asserts the warning appears under diagnostics with empty/normal results", "rt dump-help notes the envelope shape in either global help or per-command help; Info.Examples updated where appropriate", "dotnet build \"RoslynTools.slnx\" passes with zero errors and zero new warnings", "dotnet test \"tests/RoslynTools.Tests/RoslynTools.Tests.csproj\" -v minimal passes", "dotnet format \"RoslynTools.slnx\" --verify-no-changes passes"], "priority": 11, "passes": false, "notes": "Affected files: src/RoslynTools/Services/WorkspaceLoader.cs, src/RoslynTools/Services/SymbolFormatter.cs (or similar JSON envelope helper), src/RoslynTools/Commands/* (per-command JSON serialisation), tests/RoslynTools.Tests/. Item 18 in the gap log. CONSERVATIVE: rolling out across all read-only commands at once may exceed one session — apply to three representative commands and file a follow-up to extend coverage.", "epicId": "EP-003"}, {"id": "US-012", "title": "Add rt analyze responsibility-map command", "description": "As a developer hunting SoC violations in fat command/handler classes, I want rt analyze responsibility-map <type> --solution <sln> to classify the type's members by AST pattern (parsing, business logic, IO, presentation) and output a heatmap-style JSON summary so that I can target the worst offenders for refactoring.", "acceptanceCriteria": ["Add new src/RoslynTools/Commands/ResponsibilityMapCommand.cs implementing IRtCommand with Info.Category = \"analyze\", Info.JsonOutput = true, Info.Mutates = false", "Build() registers the command under the analyze group and accepts a positional <type> (FQN) plus the global --solution", "Classification rules — at minimum: (a) parsing — methods invoking string.Split / Regex / int.Parse / JsonSerializer.Deserialize, (b) IO — methods invoking File.* / Directory.* / Process.Start / HttpClient.*, (c) presentation — methods invoking Console.* / RtConsole.* / ILogger.* / RtLog.*, (d) business — anything else. Each rule documented in code comment", "JSON output shape: `{ \"diagnostics\": [...], \"results\": { \"type\": \"FQN\", \"members\": [ { \"name\": \"...\", \"kind\": \"method\", \"categories\": [\"parsing\",\"io\"], \"locationPath\": \"...\", \"line\": 42 } ], \"summary\": { \"parsing\": 3, \"businessLogic\": 5, \"io\": 2, \"presentation\": 1 } } }`", "Members with multiple categories are reported under each (no double-counting in summary; summary counts unique members per category)", "Edge cases: type not found -> exit 1 with clear message; type has no members -> empty members array, all-zero summary, exit 0", "Add xUnit tests using a fixture with one method per category plus one mixed-category method; assert classification and summary", "Self-test: run against ChangeSignatureCommand on RoslynTools.slnx and inspect output for sanity (member count > 0, categories non-empty)", "rt dump-help shows the new command and Info.Examples reflects the actual invocation", "dotnet build \"RoslynTools.slnx\" passes with zero errors and zero new warnings", "dotnet test \"tests/RoslynTools.Tests/RoslynTools.Tests.csproj\" -v minimal passes", "dotnet format \"RoslynTools.slnx\" --verify-no-changes passes"], "priority": 12, "passes": false, "notes": "Affected files: src/RoslynTools/Commands/ResponsibilityMapCommand.cs (new), src/RoslynTools/Services/ResponsibilityMapService.cs (new), tests/RoslynTools.Tests/ResponsibilityMapCommandTests.cs (new). Item 5 in the gap log.", "epicId": "EP-003"}, {"id": "US-013", "title": "Add rt analyze interface member-usage command", "description": "As a developer doing interface-segregation work, I want rt analyze interface <fqn> --solution <sln> to produce a consumer-by-consumer member-usage view so that I can see which members each consumer actually calls and identify candidates for narrower interfaces.", "acceptanceCriteria": ["Add new src/RoslynTools/Commands/AnalyzeInterfaceCommand.cs implementing IRtCommand with Info.Category = \"analyze\", Info.JsonOutput = true, Info.Mutates = false", "Build() registers the command under the analyze group as `interface` (so `rt analyze interface <fqn>`), positional <fqn>, plus --solution", "JSON output shape: `{ \"diagnostics\": [...], \"results\": { \"interface\": \"FQN\", \"consumers\": [ { \"consumer\": \"FQN\", \"membersUsed\": [\"MemberA\",\"MemberB\"], \"membersUnused\": [\"MemberC\"], \"locations\": [{\"file\":\"...\",\"line\":N}] } ], \"unusedAcrossAllConsumers\": [\"MemberD\"] } }`", "Consumer detection: any type that takes the interface as a constructor parameter, field, property, method parameter, or local — covers DI-injected and direct-use cases", "Member usage detection: usages within the consumer that resolve (via SemanticModel) to one of the interface's members through that injected reference", "Edge case: interface has zero implementations / zero consumers -> empty consumers array, full member list under unusedAcrossAllConsumers, exit 0", "Edge case: interface FQN not found -> exit 1 with clear message", "Add xUnit tests using a fixture interface with three members and three consumers each calling a different subset; assert membersUsed/membersUnused per consumer and unusedAcrossAllConsumers", "Self-test: run against IRtCommand or another interface in roslyn-tools and inspect output for sanity", "rt dump-help shows the new command and Info.Examples reflects the actual invocation", "dotnet build \"RoslynTools.slnx\" passes with zero errors and zero new warnings", "dotnet test \"tests/RoslynTools.Tests/RoslynTools.Tests.csproj\" -v minimal passes", "dotnet format \"RoslynTools.slnx\" --verify-no-changes passes"], "priority": 13, "passes": false, "notes": "Affected files: src/RoslynTools/Commands/AnalyzeInterfaceCommand.cs (new), src/RoslynTools/Services/AnalyzeInterfaceService.cs (new), tests/RoslynTools.Tests/AnalyzeInterfaceCommandTests.cs (new). Item 19 in the gap log. CONSERVATIVE: the gap log mentions sub-commands `why-type-needed` and `unused-members-on-interface` — split into US-014 to keep this story sized for one session.", "epicId": "EP-003"}, {"id": "US-014", "title": "Add rt analyze why-type-needed and unused-members-on-interface sub-commands", "description": "As a developer following up the analyze-interface output, I want rt analyze why-type-needed <interface> <consumer> and rt analyze unused-members-on-interface <interface> --within <project> so that I can drill into a single consumer's reason for needing the interface and scope unused-member analysis to a single project.", "acceptanceCriteria": ["Add src/RoslynTools/Commands/WhyTypeNeededCommand.cs (analyze category, JSON output, no mutate) — positional <interface> <consumer>, returns the exact members and call sites the consumer uses", "Add src/RoslynTools/Commands/UnusedMembersOnInterfaceCommand.cs (analyze category, JSON output, no mutate) — positional <interface> with --within <project> filter; returns members not called by any consumer in that project", "Reuse the AnalyzeInterfaceService from US-013 — these sub-commands are filtered/projected views of the same underlying analysis", "JSON shapes: why-type-needed -> `{ \"diagnostics\": [...], \"results\": { \"consumer\": \"FQN\", \"membersUsed\": [...], \"locations\": [...] } }`; unused-members-on-interface -> `{ \"diagnostics\": [...], \"results\": { \"project\": \"...\", \"unusedMembers\": [...] } }`", "Edge cases: consumer does not depend on interface -> empty result with diagnostic note, exit 0; project does not contain interface or consumers -> empty result, exit 0; consumer or interface FQN not found -> exit 1", "Add xUnit tests for both commands using fixtures from US-013", "rt dump-help shows both new commands a > exit 0 with empty violations and a diagnostic note; malformed YAML -> exit 1 with parse error including line number", "Bootstrap a sample rules file at .rtarch.yaml committed in the repo encoding at least: `Commands must not reference Microsoft.CodeAnalysis directly` (the analyze-interface lesson)", "Add xUnit tests with fixture rules + fixture violations across at least three rule types (banned namespace, banned type, banned project reference)", "rt dump-help shows the new command and Info.Examples reflects the actual invocation", "dotnet build \"RoslynTools.slnx\" passes with zero errors and zero new warnings", "dotnet test \"tests/RoslynTools.Tests/RoslynTools.Tests.csproj\" -v minimal passes", "dotnet format \"RoslynTools.slnx\" --verify-no-changes passes"], "priority": 15, "passes": false, "notes": "Affected files: src/RoslynTools/Commands/ArchitectureVerifyCommand.cs (new), src/RoslynTools/Services/Architecture/* (new), tests/RoslynTools.Tests/ArchitectureVerifyCommandTests.cs (new), .rtarch.yaml (new, committed). Item 7 in the gap log.", "epicId": "EP-003"}, {"id": "US-016", "title": "Add rt refactor introduce-record command", "description": "As a developer with a long method signature, I want rt refactor introduce-record --method <symbol> --record-name <name> --solution <sln> to extract a record type from selected parameter names/types so that I can collapse the parameter list and update all call sites.", "acceptanceCriteria": ["Add src/RoslynTools/Commands/IntroduceRecordCommand.cs implementing IRtCommand with Info.Category = \"refactor\", Info.JsonOutput = false, Info.Mutates = true", "Build() registers the command and accepts: --method <symbol-fqn-with-method>, --record-name <Name>, --record-namespace <ns> (optional, defaults to method's containing namespace), --parameters <comma-separated list> (optional, defaults to all parameters), --solution, --dry-run", "Behaviour: emits a new file <RecordName>.cs with `internal record <RecordName>(<Type1> <Param1> — use --strategy wrapper\") or an automatic wrapper-class fallback so that the command does not block silently.", "acceptanceCriteria": ["Locate ExtractAdapterCommand and its service; add a precondition check that detects ITypeSymbol.IsStatic on the source type", "Default behaviour when source is static: exit 1 with stderr `error: cannot extract adapter from static type '<FQN>': static types cannot implement interfaces. Re-run with --strategy wrapper to generate a non-static wrapper that delegates to the static type.`", "Add `--strategy <direct|wrapper>` option (default `direct`); when `wrapper` is selected and source is static, generate `internal sealed class <SourceName>Wrapper : I<SourceName> { /* delegates to static methods */ }`, otherwise behave as today", "When --strategy direct is explicitly passed against a static type, still exit 1 (do not silently skip the request)", "When --strategy wrapper is passed against a non-static type, behave as if --strategy direct was passed (or document the ambiguity and exit 1 — pick one and document)", "Add xUnit tests covering: (a) static type with default strategy -> exit 1 with expected message, (b) static type with --strategy wrapper -> wrapper class generated, (c) non-static type unchanged behaviour", "Self-test: run against WorkspaceLoader (static) in RoslynTools.slnx — covers the original dogfood scenario", "rt dump-help shows the new --strategy flag and Info.Examples reflects the actual invocation", "dotnet build \"RoslynTools.slnx\" passes with zero errors and zero new warnings", "dotnet test \"tests/RoslynTools.Tests/RoslynTools.Tests.csproj\" -v minimal passes", "dotnet format \"RoslynTools.slnx\" --verify-no-changes passes"], "priority": 17, "passes": false, "notes": "Affected files: src/RoslynTools/Commands/ExtractAdapterCommand.cs, src/RoslynTools/Services/ExtractAdapterService.cs, tests/RoslynTools.Tests/. Item 4 in the gap log.", "epicId": "EP-004"}, {"id": "US-018", "title": "Add rt refactor extract-orchestr eclared in --from -> exit 1 with explanatory message; zero matches -> exit 0 with stderr note `[INFO] no matches found` and no file changes", "--dry-run emits a unified diff per affected file; without --dry-run, files are written", "Self-test: run with --dry-run replacing `Console.Error.WriteLine($1)` -> `RtLog.Warning($1)` against RoslynTools.slnx and inspect output", "Add xUnit tests covering: (a) no captures, literal-to-literal, (b) one capture, (c) two captures with reordering ($2 before $1 in --to), (d) unparseable --from -> exit 1, (e) zero matches -> exit 0 with note, (f) --within scoping", "rt dump-help shows the new command and Info.Examples reflects the actual invocation", "dotnet build \"RoslynTools.slnx\" passes with zero errors and zero new warnings", "dotnet test \"tests/RoslynTools.Tests/RoslynTools.Tests.csproj\" -v minimal passes", "dotnet format \"RoslynTools.slnx\" --verify-no-changes passes"], "priority": 19, "passes": false, "notes": "Affected files: src/RoslynTools/Commands/ReplacePatternCommand.cs (new), src/RoslynTools/Services/ReplacePatternService.cs (new), src/RoslynTools/Services/SyntaxNodeMatcher.cs (new helper), tests/RoslynTools.Tests/ReplacePatternCommandTests.cs (new). Item 9 in the gap log. CONSERVATIVE: structural pattern matching is a large surface; this story scopes it to InvocationExpressionSyntax with named captures. Member access, method declarations, and other shapes can be added in follow-ups.", "epicId": "EP-004"}, {"id": "US-020", "title": "Add rt refactor move-method --to-nested-class and --from-nested-class flags", "description": "As a developer organising tests by behaviour (e.g. grouping `[Fact]` methods into `When_X` inner classes), I want rt refactor move-method --to-nested-class <name> [--create-if-missing] and the inverse --from-nested-class so that I can restructure methods into and out of nested classes without manual edits.", "acceptanceCriteria": ["Extend src/RoslynTools/Commands/MoveMethodCommand.cs (or add it sts/RoslynTools.Tests/MoveMethodCommandTests.cs. Item 10 in the gap log.", "epicId": "EP-004"}, {"id": "US-021", "title": "Add rt refactor narrow-dependency / extract-narrow-interface command", "description": "As a developer following up on rt analyze interface output, I want rt refactor extract-narrow-interface --interface <fqn> --members <comma-list> --new-interface <fqn> --solution <sln> --dry-run to extract selected members into a new narrower interface and narrow constructor parameter and field types in consumers so that I can implement Interface Segregation safely.", "acceptanceCriteria": ["Add src/RoslynTools/Commands/ExtractNarrowInterfaceCommand.cs implementing IRtCommand with Info.Category = \"refactor\", Info.JsonOutput = false, Info.Mutates = true", "Build() accepts: --interface <fqn>, --members <comma-list>, --new-interface <fqn>, --narrow-consumers <comma-list-of-consumer-fqns> (optional, defaults to all consumers using only the listed members), --add-di-registration (optional), --solution, --dry-run", "Behaviour: (a) generates the new interface file with the listed members, (b) makes the original interface inherit from it (or duplicates members — pick one strategy and document; inheriting is preferred), (c) for each named consumer (or auto-detected eligible consumer), changes its constructor parameter and field type from the original interface to the new one, (d) if --add-di-registration is set, scans for typical DI registration patterns (`services.AddScoped<IFoo, Foo>()`) and adds a forwarding registration `services.AddScoped<INarrowFoo>(sp => sp.GetRequiredService<IFoo>())`", "Edge case: --members references a member not on --interface -> exit 1 with the missing member listed", "Edge case: a named consumer in --narrow-consumers actually uses members not in --members -> exit 1 with usage breakdown (consumer, extra members) so the user can adjust", "Edge case: --new-interface FQN already exists -> exit 1 with conflict description", "--dry-run emits a   <script>
    const e = React.createElement;

    function normalizeStory(story) {
      const acceptance = Array.isArray(story && story.acceptanceCriteria) ? story.acceptanceCriteria : [];
      return {
        id: String(story && story.id || ""),
        title: String(story && story.title || ""),
        description: String(story && story.description || ""),
        acceptanceCriteria: acceptance.map((item) => String(item)),
        priority: Number(story && story.priority || 9999),
        passes: Boolean(story && story.passes),
        notes: String(story && story.notes || ""),
        epicId: String(story && story.epicId || "")
      };
    }

    function normalizeEpic(epic) {
      return {
        id: String(epic && epic.id || ""),
        title: String(epic && epic.title || ""),
        description: String(epic && epic.description || ""),
        notes: String(epic && epic.notes || "")
      };
    }

    function normalizeProject(raw, fallback) {
      const stories = Array.isArray(raw && raw.userStories) ? raw.userStories.map(normalizeStory) : [];
      const epics = Array.isArray(raw && raw.epics) ? raw.epics.map(normalizeEpic) : [];
      const sortedStories = stories.slice().sort((left, right) => {
        if (left.passes !== right.passes) return left.passes ? 1 : -1;
        if (left.priority !== right.priority) return left.priority - right.priority;
        return left.id.localeCompare(right.id);
      });
      const total = sortedStories.length;
      const complete = sortedStories.filter((story) => story.passes).length;
      const pending = total - complete;
      return {
        project: String(raw && raw.project || fallback.project || "PRD"),
        branchName: String(raw && raw.branchName || fallback.branchName || ""),
        description: String(raw && raw.description || fallback.description || ""),
        path: fallback.path || "",
        sourceUrl: fallback.sourceUrl || "",
        stats: {
          total: total,
          complete: complete,
          pending: pending,
          completionPct: total ? Math.round((complete / total) * 100) : 0
        },
        epics: epics,
        stories: sortedStories
      };
    }

    function escapeHtml(value) {
      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");
    }

    function renderInlineMarkdown(text) {
      let value = escapeHtml(text);
      value = value.replace(/`([^`]+)`/g, "<code>$1</code>");
      value = value.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
      value = value.replace(/\*([^*]+)\*/g, "<em>$1</em>");
      return value;
    }

    function renderMarkdown(text) {
      const value = String(text || "").replace(/\r\n/g, "\n").trim();
      if (!value) return "";

      const lines = value.split("\n");
      const parts = [];
      let inList = false;

      function closeList() {
        if (inList) {
          parts.push("</ul>");
          inList = false;
        }
      }

      for (const rawLine of lines) {
        const line = rawLine.trim();
        if (!line) {
          closeList();
          continue;
        }

        if (line.startsWith("- ") || line.startsWith("* ")) {
          if (!inList) {
            parts.push("<ul>");
            inList = true;
          }
          parts.push("<li>" + renderInlineMarkdown(line.slice(2).trim()) + "</li>");
          continue;
        }

        closeList();

        if (line.startsWith("### ")) {
          parts.push("<h5>" + renderInlineMarkdown(line.slice(4)) + "</h5>");
        } else if (line.startsWith("## ")) {
          parts.push("<h4>" + renderInlineMarkdown(line.slice(3)) + "</h4>");
        } else if (line.startsWith("# ")) {
          parts.push("<h3>" + renderInlineMarkdown(line.slice(2)) + "</h3>");
        } else {
          parts.push("<p>" + renderInlineMarkdown(line) + "</p>");
        }
      }

      closeList();
      return parts.join("");
    }

    function setCookie(name, value) {
      const maxAge = 60 * 60 * 24 * 365;
      document.cookie = name + "=" + encodeURIComponent(value) + "; path=/; max-age=" + maxAge + "; SameSite=Lax";
    }

    function getCookie(name) {
      const prefix = name + "=";
      const parts = document.cookie ? document.cookie.split("; ") : [];
      for (const part of parts) {
        if (part.startsWith(prefix)) {
          return decodeURIComponent(part.slice(prefix.length));
        }
      }
      return "";
    }

          col1Pct: typeof parsed.col1Pct === "number" ? parsed.col1Pct : DEFAULT_STATE.col1Pct,
          col2Pct: typeof parsed.col2Pct === "number" ? parsed.col2Pct : DEFAULT_STATE.col2Pct
        };
      } catch (err) {
        return { ...DEFAULT_STATE };
      }
    }

    function clampPct(value, min, max) {
      if (!Number.isFinite(value)) return min;
      if (value < min) return min;
      if (value > max) return max;

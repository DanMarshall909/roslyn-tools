<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PRD Visualization</title>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    :root, [data-theme="cream"] {
      --bg: #ece4d4;
      --panel: #fffdf7;
      --panel-2: #f8f1e6;
      --ink: #1d2433;
      --muted: #687387;
      --line: #d7cdbb;
      --accent: #0f766e;
      --accent-soft: #d8f0ec;
      --warn: #9a3412;
      --warn-soft: #ffedd5;
      --done: #166534;
      --done-soft: #dcfce7;
      --shadow: 0 20px 50px rgba(74, 59, 34, 0.12);
      --radius: 22px;
      --body-bg: radial-gradient(circle at top left, #fff8ea 0, transparent 28%), linear-gradient(180deg, #f3ecdf 0%, #e9dfcd 100%);
      --shell-bg: rgba(255, 253, 247, 0.7);
      --shell-border: rgba(215, 205, 187, 0.8);
      --card-bg: #ffffff;
      --card-bg-hover: #fffaf0;
      --card-bg-active: #fff6e8;
      --card-border-hover: #b9a88c;
      --card-border-active: #c89e58;
      --card-shadow-active: rgba(200, 158, 88, 0.22);
      --pill-bg: #f7efe2;
      --pill-priority-bg: #f8efe1;
      --pill-epic-bg: #e8ddf3;
      --pill-epic-fg: #5b3a8c;
      --pill-epic-border: #c9b6e0;
      --pill-pending-border: #f3c89d;
      --pill-complete-border: #b7e4c7;
      --epic-bar-bg: #fcf7ee;
      --acceptance-bg: #fcf7ee;
      --code-bg: #f1eadf;
      --summary-bg: linear-gradient(180deg, #fffdf7 0%, #faf4e8 100%);
      --sidebar-top-bg: linear-gradient(180deg, #fffdf7 0%, #faf4e8 100%);
      --mobile-panel-bg: linear-gradient(180deg, #fffdf7 0%, #faf4e8 100%);
      --mobile-summary-bg: #fffaf0;
      --mobile-panel-body-bg: #ffffff;
      --font-family: Georgia, "Times New Roman", serif;
      --resizer-color: rgba(215, 205, 187, 0.6);
      --resizer-color-hover: #c89e58;
    }
    [data-theme="dark"] {
      --bg: #0f1419;
      --panel: #1a2028;
      --panel-2: #232b36;
      --ink: #e6edf3;
      --muted: #8b949e;
      --line: #30363d;
      --accent: #58a6ff;
      --accent-soft: #1f2d43;
      --warn: #f0883e;
      --warn-soft: #3a220f;
      --done: #3fb950;
      --done-soft: #0f2e19;
      --shadow: 0 20px 50px rgba(0, 0, 0, 0.45);
      --radius: 22px;
      --body-bg: radial-gradient(circle at top left, #1a2430 0, transparent 30%), linear-gradient(180deg, #0d1117 0%, #161b22 100%);
      --shell-bg: rgba(26, 32, 40, 0.7);
      --shell-border: rgba(48, 54, 61, 0.8);
      --card-bg: #161b22;
      --card-bg-hover: #1c232c;
      --card-bg-active: #22303f;
      --card-border-hover: #444c56;
      --card-border-active: #58a6ff;
      --card-shadow-active: rgba(88, 166, 255, 0.22);
      --pill-bg: #22272e;
      --pill-priority-bg: #2a2e37;
      --pill-epic-bg: #2d2640;
      --pill-epic-fg: #c9a9ff;
      --pill-epic-border: #3d345a;
      --pill-pending-border: #3a220f;
      --pill-complete-border: #0f2e19;
      --epic-bar-bg: #161b22;
      --acceptance-bg: #161b22;
      --code-bg: #0d1117;
      --summary-bg: linear-gradient(180deg, #1a2028 0%, #141920 100%);
      --sidebar-top-bg: linear-gradient(180deg, #1a2028 0%, #141920 100%);
      --mobile-panel-bg: linear-gradient(180deg, #1a2028 0%, #141920 100%);
      --mobile-summary-bg: #1c232c;
      --mobile-panel-body-bg: #161b22;
      --font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --resizer-color: rgba(48, 54, 61, 0.8);
      --resizer-color-hover: #58a6ff;
    }
    [data-theme="paper"] {
      --bg: #f5f5f5;
      --panel: #ffffff;
      --panel-2: #fafafa;
      --ink: #111111;
      --muted: #666666;
      --line: #e0e0e0;
      --accent: #1a73e8;
      --accent-soft: #e8f0fe;
      --warn: #c5221f;
      --warn-soft: #fce8e6;
      --done: #137333;
      --done-soft: #e6f4ea;
      --shadow: 0 4px 14px rgba(0, 0, 0, 0.08);
      --radius: 10px;
      --body-bg: #f5f5f5;
      --shell-bg: #ffffff;
      --shell-border: #e0e0e0;
      --card-bg: #ffffff;
      --card-bg-hover: #f7f7f7;
      --card-bg-active: #e8f0fe;
      --card-border-hover: #bdbdbd;
      --card-border-active: #1a73e8;
      --card-shadow-active: rgba(26, 115, 232, 0.18);
      --pill-bg: #f0f0f0;
      --pill-priority-bg: #f0f0f0;
      --pill-epic-bg: #f3e8fd;
      --pill-epic-fg: #6b3fa0;
      --pill-epic-border: #d6c3ef;
      --pill-pending-border: #f9c7c5;
      --pill-complete-border: #b7e1c0;
      --epic-bar-bg: #fafafa;
      --acceptance-bg: #fafafa;
      --code-bg: #f0f0f0;
      --summary-bg: #ffffff;
      --sidebar-top-bg: #ffffff;
      --mobile-panel-bg: #ffffff;
      --mobile-summary-bg: #fafafa;
      --mobile-panel-body-bg: #ffffff;
      --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --resizer-color: #e0e0e0;
      --resizer-color-hover: #1a73e8;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; overflow: hidden; }
    body {
      margin: 0;
      color: var(--ink);
      background: var(--body-bg);
      font-family: var(--font-family);
    }
    #root { height: 100%; }
    .app {
      height: 100vh;
      margin: 0 auto;
      padding: 16px;
      max-width: none;
    }
    .shell {
      height: 100%;
      background: var(--shell-bg);
      border: 1px solid var(--shell-border);
      border-radius: 28px;
      padding: 18px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(10px);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .eyebrow {
      text-transform: uppercase;
      letter-spacing: 0.08em;
      font-size: 0.76rem;
      color: var(--muted);
      margin-bottom: 6px;
    }
    h1, h2, h3, h4, h5, p { margin: 0; }
    .subtitle {
      color: var(--muted);
      margin-top: 6px;
    }
    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      margin-bottom: 14px;
      flex-wrap: wrap;
    }
    .theme-picker {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 0.85rem;
      color: var(--muted);
      white-space: nowrap;
    }
    .theme-picker-label {
      text-transform: uppercase;
      letter-spacing: 0.08em;
      font-size: 0.72rem;
    }
    .theme-select {
      border: 1px solid var(--line);
      background: var(--card-bg);
      color: var(--ink);
      border-radius: 999px;
      padding: 6px 12px;
      font: inherit;
      cursor: pointer;
    }
    .project-tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }
    .project-tab {
      border: 1px solid var(--line);
      background: var(--card-bg);
      color: var(--ink);
      border-radius: 999px;
      padding: 10px 14px;
      cursor: pointer;
      font: inherit;
    }
    .project-tab.active {
      background: var(--accent);
      border-color: var(--accent);
      color: white;
    }
    .prd-picker {
      position: relative;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    .prd-picker-trigger {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      border: 1px solid var(--line);
      background: var(--card-bg);
      color: var(--ink);
      border-radius: 999px;
      padding: 8px 14px;
      cursor: pointer;
      font: inherit;
      max-width: 360px;
    }
    .prd-picker-trigger:hover {
      border-color: var(--card-border-hover);
      background: var(--card-bg-hover);
    }
    .prd-picker-trigger.open {
      border-color: var(--card-border-active);
      background: var(--card-bg-active);
    }
    .prd-picker-icon {
      width: 16px;
      height: 16px;
      flex: 0 0 auto;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .prd-picker-label {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-weight: 600;
    }
    .prd-picker-caret {
      color: var(--muted);
      font-size: 0.7rem;
      flex: 0 0 auto;
    }
    .prd-picker-menu {
      position: absolute;
      top: calc(100% + 8px);
      left: 0;
      width: min(640px, calc(100vw - 48px));
      max-height: 420px;
      overflow: auto;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: var(--panel);
      box-shadow: var(--shadow);
      padding: 10px;
      z-index: 30;
    }
    .prd-picker-toggle {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 10px 12px;
      border-bottom: 1px solid var(--line);
      margin-bottom: 10px;
      font-size: 0.84rem;
      color: var(--muted);
    }
    .prd-picker-toggle input {
      margin: 0;
    }
    .prd-option {
      display: block;
      width: 100%;
      border: 1px solid transparent;
      background: var(--card-bg);
      border-radius: 14px;
      padding: 12px 14px;
      color: var(--ink);
      font: inherit;
      text-align: left;
      cursor: pointer;
    }
    .prd-option + .prd-option {
      margin-top: 8px;
    }
    .prd-option:hover,
    .prd-option.active {
      border-color: var(--card-border-active);
      background: var(--card-bg-active);
    }
    .prd-option-top {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: center;
    }
    .prd-option-title {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-weight: 700;
    }
    .prd-option-subtitle {
      margin-top: 4px;
      color: var(--muted);
      font-size: 0.82rem;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .sync-status {
      padding: 0 6px 12px;
      font-size: 0.84rem;
      color: var(--muted);
    }
    .sync-status.error {
      color: var(--warn);
    }
    .main-grid {
      flex: 1 1 auto;
      display: grid;
      grid-template-columns: var(--col-1, 28%) 6px var(--col-2, 32%) 6px minmax(0, 1fr);
      gap: 0;
      min-height: 0;
    }
    .resizer {
      background: transparent;
      cursor: col-resize;
      position: relative;
      user-select: none;
      touch-action: none;
    }
    .resizer::before {
      content: "";
      position: absolute;
      top: 10%;
      bottom: 10%;
      left: 2px;
      right: 2px;
      background: var(--resizer-color);
      border-radius: 2px;
      transition: background 0.12s ease;
    }
    .resizer:hover::before,
    .resizer.dragging::before {
      background: var(--resizer-color-hover);
    }
    .sidebar, .summary-pane, .details {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--panel);
      overflow: hidden;
    }
    .sidebar {
      display: flex;
      flex-direction: column;
      min-width: 0;
      min-height: 0;
    }
    .sidebar-top {
      padding: 18px;
      border-bottom: 1px solid var(--line);
      background: var(--sidebar-top-bg);
    }
    .filters {
      display: grid;
      grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr) minmax(0, 1fr);
      gap: 10px;
    }
    .filter-select {
      width: 100%;
      border: 1px solid var(--line);
      background: var(--card-bg);
      border-radius: 14px;
      padding: 11px 13px;
      font: inherit;
      color: var(--ink);
    }
    .search {
      width: 100%;
      border: 1px solid var(--line);
      background: var(--card-bg);
      border-radius: 14px;
      padding: 11px 13px;
      font: inherit;
      color: var(--ink);
    }
    .search:focus {
      outline: 2px solid var(--accent-soft);
      border-color: var(--accent);
    }
    .story-list {
      flex: 1 1 auto;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 10px;
      display: grid;
      gap: 10px;
      min-height: 0;
      min-width: 0;
    }
    .story-row {
      border: 1px solid var(--line);
      background: var(--card-bg);
      border-radius: 16px;
      padding: 14px;
      cursor: pointer;
      text-align: left;
      font: inherit;
      color: inherit;
      display: grid;
      gap: 8px;
    }
    .story-row:hover {
      border-color: var(--card-border-hover);
      background: var(--card-bg-hover);
    }
    .story-row.active {
      background: var(--card-bg-active);
      border-color: var(--card-border-active);
      box-shadow: inset 0 0 0 1px var(--card-shadow-active);
    }
    .story-row-top {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: flex-start;
    }
    .story-id {
      font-size: 0.76rem;
      letter-spacing: 0.08em;
      color: var(--muted);
      text-transform: uppercase;
    }
    .story-title {
      font-size: 1rem;
      line-height: 1.25;
    }
    .story-desc-preview {
      color: var(--muted);
      font-size: 0.92rem;
      line-height: 1.35;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .pill-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .pill {
      border-radius: 999px;
      padding: 4px 10px;
      font-size: 0.78rem;
      border: 1px solid var(--line);
      white-space: nowrap;
      background: var(--pill-bg);
    }
    .pill.pending {
      background: var(--warn-soft);
      color: var(--warn);
      border-color: var(--pill-pending-border);
    }
    .pill.complete {
      background: var(--done-soft);
      color: var(--done);
      border-color: var(--pill-complete-border);
    }
    .pill.priority {
      background: var(--pill-priority-bg);
    }
    .pill.epic {
      background: var(--pill-epic-bg);
      color: var(--pill-epic-fg);
      border-color: var(--pill-epic-border);
    }
    .epic-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      padding: 10px 12px;
      border-bottom: 1px solid var(--line);
      background: var(--epic-bar-bg);
    }
    .epic-chip {
      background: var(--card-bg);
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 4px 10px;
      font-size: 0.78rem;
      color: var(--ink);
      font: inherit;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .epic-chip:hover {
      border-color: var(--card-border-hover);
      background: var(--card-bg-hover);
    }
    .epic-chip.active {
      background: var(--pill-epic-bg);
      border-color: var(--pill-epic-border);
      box-shadow: inset 0 0 0 1px var(--card-shadow-active);
    }
    .epic-chip .epic-id {
      color: var(--pill-epic-fg);
      font-weight: 600;
    }
    .epic-chip .epic-count {
      color: var(--muted);
    }
    .details {
      display: flex;
      flex-direction: column;
      min-width: 0;
      min-height: 0;
    }
    .summary-pane {
      display: flex;
      flex-direction: column;
      min-width: 0;
      min-height: 0;
    }
    .summary-inner {
      flex: 1 1 auto;
      padding: 22px;
      overflow-y: auto;
      overflow-x: hidden;
      min-height: 0;
      min-width: 0;
      background: var(--summary-bg);
    }
    .summary-title {
      font-size: 1.35rem;
      line-height: 1.25;
    }
    .summary-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 14px 0 18px;
    }
    .summary-preview {
      color: var(--muted);
      margin-top: 18px;
      font-size: 0.95rem;
      line-height: 1.45;
    }
    .details-inner {
      flex: 1 1 auto;
      padding: 28px;
      overflow-y: auto;
      overflow-x: hidden;
      min-height: 0;
      min-width: 0;
    }
    .details-top {
      display: flex;
      justify-content: space-between;
      gap: 18px;
      align-items: flex-start;
      margin-bottom: 18px;
    }
    .details-path {
      margin-top: 8px;
      color: var(--muted);
      word-break: break-word;
    }
    .section {
      margin-top: 24px;
      padding-top: 20px;
      border-top: 1px solid var(--line);
    }
    .section h4 {
      margin-bottom: 12px;
      font-size: 1rem;
    }
    .markdown {
      color: var(--ink);
      line-height: 1.55;
    }
    .markdown p {
      margin: 0 0 12px;
    }
    .markdown p:last-child {
      margin-bottom: 0;
    }
    .markdown ul, .markdown ol {
      margin: 0 0 12px 22px;
      padding: 0;
    }
    .markdown li + li {
      margin-top: 8px;
    }
    .markdown code {
      font-family: Consolas, "Courier New", monospace;
      background: var(--code-bg);
      padding: 1px 5px;
      border-radius: 6px;
      font-size: 0.92em;
    }
    .linked-docs {
      margin-top: 24px;
      padding-top: 20px;
      border-top: 1px solid var(--line);
      display: grid;
      gap: 18px;
    }
    .linked-doc-path {
      font-family: Consolas, "Courier New", monospace;
      font-size: 0.82rem;
      color: var(--muted);
      margin-bottom: 10px;
      word-break: break-all;
    }
    .spec-markdown {
      font-size: 0.95rem;
      line-height: 1.55;
      min-width: 0;
      overflow-wrap: break-word;
      word-break: break-word;
    }
    .spec-markdown img { max-width: 100%; height: auto; }
    .spec-markdown table {
      display: block;
      max-width: 100%;
      overflow-x: auto;
    }
    .spec-markdown h1, .spec-markdown h2, .spec-markdown h3 {
      margin: 18px 0 8px;
      line-height: 1.2;
    }
    .spec-markdown h1 { font-size: 1.25rem; }
    .spec-markdown h2 { font-size: 1.1rem; }
    .spec-markdown h3 { font-size: 1rem; }
    .spec-markdown p { margin: 0 0 12px; }
    .spec-markdown ul, .spec-markdown ol { margin: 0 0 12px 22px; }
    .spec-markdown li + li { margin-top: 6px; }
    .spec-markdown pre {
      background: var(--code-bg);
      padding: 12px;
      border-radius: 8px;
      overflow-x: auto;
      max-width: 100%;
      font-size: 0.88em;
      line-height: 1.45;
    }
    .spec-markdown code {
      font-family: Consolas, "Courier New", monospace;
      background: var(--code-bg);
      padding: 1px 5px;
      border-radius: 6px;
      font-size: 0.92em;
    }
    .spec-markdown pre code { background: none; padding: 0; }
    .spec-markdown table {
      border-collapse: collapse;
      margin: 12px 0;
      font-size: 0.9em;
    }
    .spec-markdown th, .spec-markdown td {
      border: 1px solid var(--line);
      padding: 6px 10px;
    }
    .spec-markdown blockquote {
      margin: 12px 0;
      padding: 4px 14px;
      border-left: 3px solid var(--line);
      color: var(--muted);
    }
    .acceptance-list {
      display: grid;
      gap: 12px;
      padding: 0;
      margin: 0;
      list-style: none;
    }
    .acceptance-item {
      background: var(--acceptance-bg);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 14px 16px;
    }
    .acceptance-index {
      display: inline-block;
      min-width: 28px;
      margin-right: 8px;
      color: var(--muted);
      font-size: 0.8rem;
    }
    .empty {
      padding: 28px;
      color: var(--muted);
    }
    .mobile-summary {
      display: none;
      margin-bottom: 14px;
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 14px;
      background: var(--mobile-summary-bg);
    }
    .mobile-accordion {
      display: none;
    }
    .mobile-panel {
      border: 1px solid var(--line);
      border-radius: 18px;
      background: var(--panel);
      overflow: hidden;
      margin-top: 14px;
    }
    .mobile-panel summary {
      list-style: none;
      cursor: pointer;
      padding: 14px 16px;
      background: var(--mobile-panel-bg);
      font-weight: 700;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }
    .mobile-panel summary::-webkit-details-marker {
      display: none;
    }
    .mobile-panel summary::after {
      content: "+";
      color: var(--muted);
      font-size: 1.1rem;
      line-height: 1;
    }
    .mobile-panel[open] summary::after {
      content: "−";
    }
    .mobile-panel-body {
      padding: 12px;
      border-top: 1px solid var(--line);
      background: var(--mobile-panel-body-bg);
    }
    @media (max-width: 1350px) {
      .main-grid {
        grid-template-columns: var(--col-1, 28%) 6px minmax(0, 1fr) !important;
      }
      .summary-pane, .resizer.resizer-2 {
        display: none;
      }
    }
    @media (max-width: 900px) {
      .app {
        padding: 14px;
        height: 100vh;
      }
      .shell {
        padding: 12px;
        border-radius: 20px;
      }
      .main-grid {
        display: none;
      }
      .mobile-accordion {
        display: block;
      }
      .mobile-summary {
        display: block;
      }
      .details-inner {
        padding: 18px;
      }
    }
  </style>

  <script>
    window.__PRD_DATA__ = [{"project": "roslyn-tools", "branchName": "backlog", "description": "Triaged backlog", "path": "C:\\code\\roslyn-tools\\ralph\\backlog-prd.json", "stats": {"total": 68, "complete": 26, "pending": 42, "completionPct": 38}, "epics": [{"id": "EP-005", "title": "codebase consistency sweep", "description": "Fix formatting violations and consolidate structural duplication identified in the May 2026 consistency analysis.", "notes": "Findings from rt analyze list-smells + find-duplicates sweep on 2026-05-11."}, {"id": "EP-006", "title": "SOLID Adherence Analysis", "description": "Family of rt analyze solid subcommands that detect likely SOLID-principle violations using Roslyn semantic model. One detector per principle; output is JSON grouped by detector name.", "notes": "P2. Five child stories: SRP, ISP, DIP, OCP, LSP. Each independently shippable."}, {"id": "EP-007", "title": "Add structured JSON output to all inspect/analyze commands", "description": "All rt inspect and rt analyze commands should support --json output so automation consumers (agents, scripts, CI tools) can pipe results without text parsing. Eight commands currently output plain text only.", "notes": "P2. Affects: find-refs, find-callers, find-undocumented, find-unused, circular-deps, find-magic-strings, list-imports, list-smells. Template: see describe/outline/find-impl which already have JSON output."}, {"id": "EP-008", "title": "Platform abstractions: IWorkspaceSessionFactory + ISolutionApplier", "description": "Introduce injectable abstractions for WorkspaceLoader and SolutionWriter so commands depend on interfaces, not static helpers. Enables testability without AsyncLocal overrides and unblocks daemon workspace caching. Must be a single coordinated change across all ~30 commands.", "notes": "P2. Architecture gate NoStaticWorkspaceLoaderUse already exists in tests/. rt-006 + rt-007 from issues backlog. Must ship together — splitting doubles the 30-command churn."}, {"id": "EP-009", "title": "Consistent command contracts and migration ratchets", "description": "Make rt commands consistent across handler structure, option vocabulary, metadata, output envelopes, and symbol resolution so dogfooding workflows are predictable and architecture tests can ratchet progress.", "notes": "From rt dogfooding consistency discussion on 2026-05-15."}, {"id": "EP-010", "title": "Error-handling architecture: Result<T,RtError> rollout", "description": "Replace throw-and-catch-substring-match for routine user-error flows with a typed Result<T, RtError> ADT in src/RoslynTools/Core/. Three sub-stories migrate the core services (SymbolLocator + App handler, WorkspaceLoader, MethodExtractor) in sequence; downstream US-060 wraps these into command-level RtResult<T> envelopes once the service surface is consistent.", "notes": "Split from the originally-paused US-068 (archived in 2026-05-22-feat-analyze-complexity). Decision 2026-05-22: sequence incrementally to keep blast radius per /execute run bounded."}, {"id": "EP-011", "title": "rt suggest — LLM-friendly command discovery and cross-linking", "description": "Make the rt command catalog queryable by natural-language task. Adds a flat top-level rt suggest <task> meta-command (BM25 + hand-curated synonyms + JSON/text output), a SeeAlso field on RtCommandInfo for inverse/workflow/sibling cross-links, and reuses the same BM25 engine to fix unknown-command parse errors with 'did you mean' suggestions. Purely additive — no command moves or renames.", "notes": "Decision 2026-05-22: command name = rt suggest; JSON default when stdout is not a TTY. Source plan at ~/.claude/plans/how-can-we-further-soft-pie.md. Pre-existing US-080 (rt suggest synonyms thesaurus) is a follow-up to this epic and depends on the core command landing first."}, {"id": "EP-012", "title": "Complete thin-host-adapter migration", "description": "Apply the Core-service + thin-host-adapter pattern (established in the suggest + outline POC, docs/pattern-core-service.md) to every command. Today most commands route through CliCommandBridge text-capture for MCP, losing structure and forcing dry-run-always for mutations. The POC proved the pattern works; this epic finishes the rollout, drops the unusual RoslynTools.Mcp → RoslynTools.Cli exec-to-exec project reference, and locks the pattern with an architectural ratchet test.", "notes": "POC learnings to carry into each migration: (1) For commands already ctor-injected post-US-072 (e.g. OutlineCommand), the CLI side needs minimal change - consolidate parameters into a Request DTO. (2) Native MCP handlers return ToolResult{content=JSON} directly; do not route through CapturingConsole. (3) ICommandCatalog abstraction (Core) lets the service stay host-agnostic. (4) Asymmetries are acceptable: CLI has --json/--yaml/--markdown formatting; MCP always returns native JSON; CLI shows progress on stderr, MCP doesn't. Document any new asymmetry in pattern-core-service.md. (5) Mutating commands (refactor/*) raise a design question: MCP currently force-dry-runs them via CliCommandBridge; native handlers need an explicit decision (carve-out or design). US-098 in this epic owns that decision."}], "stories": [{"id": "US-055", "title": "Add rt refactor extract-orchestrator command (rt-003)", "description": "As a developer, I want rt refactor extract-orchestrator to pull a command's SetHandler lambda body into a dedicated <Feature>Handler class so commands become thin CLI adapters with no workspace or business logic.", "acceptanceCriteria": ["rt refactor extract-orchestrator --type RoslynTools.Commands.ChangeSignatureCommand --name RenameParameterHandler --request RenameParameterRequest --namespace RoslynTools.Features.ChangeSignature --solution RoslynTools.slnx --dry-run produces the diff from ralph/sessions/2026-04-21-change-signature-2.md step 5", "ChangeSignatureCommand.Build() drops from 76 to ~42 lines after apply", "Command file no longer imports WorkspaceLoader or SolutionWriter after apply", "Created handler class has signature: static async Task<int> HandleAsync(<RequestType> request)", "Lambda body replaced with: context.ExitCode = await <HandlerName>.HandleAsync(new <RequestType>(...))", "Using directives in the command file updated to reference the new handler namespace", "--dry-run shows diff without writing; without flag, writes files", "IRtCommand contract satisfied; command registered under rt refactor group", "Test suite passes after apply (no broken imports)"], "priority": 55, "passes": false, "notes": "P2. Reference diff: ralph/sessions/2026-04-21-change-signature-2.md step 5. Linked to rt-004 (introduce-record) now shipped as transform-parameters. From issue rt-003.", "epicId": ""}, {"id": "US-056", "title": "rt refactor rename: accept symbol FQN from stdin JSON for pipe chains (rt-008)", "description": "As a developer, I want rt refactor rename to read a fullyQualifiedName from piped stdin JSON so that rt inspect find-refs | rt rename pipe chains work end-to-end.", "acceptanceCriteria": ["When stdin is redirected (Console.IsInputRedirected is true), rename reads the first JSON line and extracts fullyQualifiedName", "Positional <symbol> argument takes precedence over stdin FQN if both are provided", "Falls back gracefully to positional arg if stdin produces no FQN", "rt inspect find-refs --symbol WorkspaceLoader --json | rt refactor rename --new-name SolutionLoader --dry-run produces the correct diff", "No behaviour change when stdin is a TTY (non-pipe invocation)", "Works with --dry-run and --solution flags as normal"], "priority": 56, "passes": false, "notes": "P2. First of the pipe-protocol tasks. Discovered in ralph/sessions/2026-05-04-daemon-protocol.md Step 4. Command: src/RoslynTools.Cli/Commands/RenameCommand.cs. From issue rt-008.", "epicId": ""}, {"id": "US-057", "title": "Introduce a shared read-only command handler wrapper", "description": "As an rt maintainer, I want read-only commands to execute through a shared wrapper so solution loading, timing, cancellation, error mapping, and result rendering are consistent.", "acceptanceCriteria": ["A new class src/RoslynTools/Cli/Handlers/ReadOnlyCommandHandler.cs (or similar) provides a single async entry point: HandleAsync<TInput, TOutput>(RtContext context, TInput input, Func<Solution, TInput, CancellationToken, Task<Result<TOutput, RtError>>> body) where: solution is loaded once from RtContext.Solution, the body callback receives the loaded solution + input + cancellation token, the Result is mapped to (stdout=JSON of TOutput on Ok, stderr=Error: {message} + exit 1 on Err).", "The wrapper owns: solution load (via the existing IWorkspaceSessionFactory from US-053), cancellation token propagation from Console.CancelKeyPress, timing/diagnostic logging via RtLog.Debug, exception-to-exit-code mapping for the typed catch ladder from US-077.", "At least one representative inspect command (e.g. OutlineCommand or DescribeCommand) is migrated to call the wrapper instead of hand-rolling solution-load + try/catch.", "At least one representative analyze command (e.g. CircularDepsCommand or ListSmellsCommand) is migrated to call the wrapper.", "Migrated commands shrink in line count by at least 20% each (verified by diff stats in the PR description).", "Tests for migrated commands cover: happy path (returns Ok, exit 0, JSON stdout); not-found path (returns RtError.NotFound, exit 1, single stderr line); cancellation (Ctrl+C mid-load, exit 130 or similar); invalid input (returns RtError.InvalidInput, exit 1).", "Architecture test tests/RoslynTools.Tests/Architecture/ReadOnlyHandlerRatchetTests.cs lists migrated commands in a marker file (docs/readonly-handler-migrated.txt) and asserts each migrated command does NOT directly call WorkspaceLoader.LoadAsync or hand-roll its own try/catch for solution-load errors.", "Marker file only grows — never shrinks (matches the US-086 ratchet pattern).", "dotnet build clean; dotnet format --verify-no-changes clean; existing tests pass; new architecture test green.", "Smoke: rt inspect outline src/RoslynTools/Core/SymbolLocator.cs --solution RoslynTools.slnx and rt analyze list-smells --solution RoslynTools.slnx both exit 0 with unchanged JSON output after migration."], "priority": 57, "passes": false, "notes": "P2. Start with a low-risk read-only command already using RtResult<T>.", "epicId": "EP-009"}, {"id": "US-060", "title": "Normalize command outputs around shared result contracts", "description": "As an automation consumer, I want rt commands to return shared result envelopes so success, empty, diagnostic, and change-plan outputs are predictable. Once the EP-010 Result<T,RtError> rollout (US-077/078/079) lands the typed-error ADT across SymbolLocator + WorkspaceLoader + MethodExtractor, this story wraps the now-consistent service surface into command-level RtResult<T> / RtChangeResult<T> / RtDiagnosticResult envelopes. Avoid duplicating the ADT design conversation — extend, don't re-litigate.", "acceptanceCriteria": ["Read-only commands use RtResult<TOutput> or an approved equivalent", "Mutation commands use a shared change result contract such as RtChangeResult<TPlan>", "Diagnostic commands use a shared diagnostic result contract such as RtDiagnosticResult", "JSON output shape is documented and tested for success, empty, and error-like diagnostic cases", "Architecture tests ratchet migrated commands away from ad hoc Console.WriteLine rendering"], "priority": 60, "passes": false, "notes": "P2. Builds on the existing RtResult<T> migration.", "epicId": "EP-009"}, {"id": "US-061", "title": "Introduce SymbolQuery for consistent symbol resolution", "description": "As an rt user, I want commands that accept symbols to resolve names, fully qualified names, and ambiguity in the same way across inspect and refactor workflows.", "acceptanceCriteria": ["SymbolQuery is a record in src/RoslynTools/Core/Symbols/SymbolQuery.cs with fields: RawInput (string), ExpectedKind (SymbolKindFilter? — Class/Method/Property/Field/Namespace/Any), Scope (ScopeFilter? — Solution/Project/Namespace path), AmbiguityPolicy (FailOnAmbiguous | PickFirst | PromptViaDecisions).", "SymbolResolver (a new service or extension to SymbolLocator) consumes SymbolQuery and returns Result<ISymbol, RtError>: matches exact short names, fully qualified names, and partial dotted paths against the loaded solution.", "Exact match: input \"WorkspaceLoader\" finds the single type named WorkspaceLoader; FQN match: input \"RoslynTools.Core.WorkspaceLoader\" finds the same; partial match: input \"Core.WorkspaceLoader\" finds it if no ambiguity in the loaded solution.", "Ambiguous matches: when N matches exist and AmbiguityPolicy is FailOnAmbiguous, return RtError.AmbiguousMatch with Context[\"candidates\"] listing each candidate FQN.", "No match: return RtError.NotFound with the query input in Context[\"query\"].", "Kind mismatch: input matches a symbol whose kind doesn't satisfy ExpectedKind — return RtError.NotFound with Context[\"foundKind\"] set so the caller can produce a precise error message.", "At least two existing commands are migrated to consume SymbolQuery: one read-only (e.g. DescribeCommand or FindRefsCommand) and one refactor (e.g. RenameCommand). The migrated commands stop hand-rolling FQN parsing.", "AmbiguityPolicy.PromptViaDecisions integrates with the existing DecisionStore: when set, an ambiguous match writes pending entries to the decisions YAML and returns RtError.AmbiguousMatch (caller maps to exit code 2).", "Tests cover: exact match, FQN match, partial match success, partial match ambiguous (returns AmbiguousMatch), no match (returns NotFound), kind mismatch (returns NotFound with foundKind), each AmbiguityPolicy branch.", "dotnet build clean; dotnet format --verify-no-changes clean; existing tests pass; new SymbolResolver tests green.", "Pipe-chain smoke: rt inspect find-refs --symbol WorkspaceLoader --json | rt refactor rename --new-name SolutionLoader --dry-run works end-to-end (the FQN-via-stdin from US-056 + SymbolQuery resolution from this story compose cleanly)."], "priority": 61, "passes": false, "notes": "P2. This is a prerequisite for reliable pipe chains between inspect and refactor commands.", "epicId": "EP-009"}, {"id": "US-067", "title": "Revisit nested-branch pattern in execute skill for trunk-based repos", "description": "As a developer running /execute on a trunk repo, I want a clear consistent policy on RT gap handling, so the skill matches the actual workflow.", "acceptanceCriteria": ["docs/skills/execute.md (or wherever the /execute skill body lives) documents ONE policy for handling rt gaps discovered mid-batch: either (a) park-the-story-fix-the-gap-on-main or (b) abandon-the-batch-and-create-a-blocker-story. The two are mutually exclusive — pick one and remove the other from the skill prose.", "The Opus review section of the skill references the chosen policy by name and includes a one-line decision tree (gap found → branch-X path or branch-Y path).", "The regression handler section uses the same vocabulary as the Opus review section (no \"if branch... if main...\" forks that contradict the chosen policy).", "If the chosen policy is fix-on-main: the skill documents that there is no revert path, and instructs the agent to commit each fix in isolation so individual commits can be reverted with git revert.", "If the chosen policy is park-and-blocker: the skill documents how the blocker story is logged (which file, which template, what status field) and how the original work resumes once the blocker lands.", "The branch-cleanup gate in /execute matches the chosen policy: present if branches are used, removed if main-only.", "After the skill is updated, run /execute against one trivial open story to confirm the new policy works end-to-end (no contradictions surface mid-run).", "ai-rules commit 8c1a08a (aggressive nested-branch version) and dae9046 (conservative rollback) are referenced in the commit message landing this change so the history is traceable.", "The 2026-05-15 retro Proposal 4 (which deferred this work) is marked resolved in ralph/sessions/ or wherever the retro lives."], "priority": 67, "passes": false, "notes": "P3. Deferred from 2026-05-15 retro (Proposal 4). Aggressive version in ai-rules commit 8c1a08a; conservative rollback in dae9046. Three places still inconsistent: RT gap section, Opus review section, regression handler. Must be decided and applied consistently.", "epicId": ""}, {"id": "RT-002", "title": "Expand command help text with output shape, exit codes, and error modes", "description": "As an LLM agent, I want every rt command's --help to describe its output shape, exit codes, and common error modes so I can predict behaviour without source-diving or trial-and-error. Depends on US-084 (metadata catalog) landing first — the expanded help text reads from RtCommandInfo.SeeAlso / SupportedFormats / Aliases fields that US-084 introduces.", "acceptanceCriteria": ["Every command's `--help` output includes a section stating the output format (text vs JSON vs both, mutating vs read-only).", "Every command's `--help` lists the exit codes it can return (0, 1, 2) and the trigger for each (success / error / decisions required).", "Every command's `--help` lists at least one common error mode the user should expect (e.g. \"symbol not found\", \"ambiguous match without --decisions\", \"file outside solution\").", "Information is sourced from RtCommandInfo (or a new metadata field on it) rather than hand-maintained in each Command.cs — no drift between help and reality.", "`docs/COMMANDS.md` regenerates on build and includes the new fields for every command.", "An LLM reading only `rt <cmd> --help` can predict the shape of stdout, stderr, and exit code for both success and the most common failure."], "priority": 70, "passes": false, "notes": "P2. Deferred from LLM-ergonomics quick-wins plan. Sampled commands (DescribeCommand, FindCallersCommand, ExtractMethodCommand) currently have one-line descriptions only — no failure mode docs, no output schema. Drive from RtCommandInfo so docs/COMMANDS.md stays in sync.", "epicId": ""}, {"id": "RT-003", "title": "Make --decisions YAML schema self-discoverable from the CLI", "description": "As an LLM agent, I want the --decisions YAML schema to be discoverable from rt --help (or a meta sub-command) so I can author a decisions file without reading DecisionStore.cs source.", "acceptanceCriteria": ["`rt --help` (or a sub-command such as `rt decisions --schema`) prints the YAML schema for the --decisions file.", "The printed schema documents every field used today (id, q, options, choose) with types and a one-line description per field.", "A complete worked example is included: the YAML rt would write on first run, plus the same YAML with `choose:` filled in by the user.", "An LLM that has not read source can author or edit a --decisions YAML correctly using only CLI help output.", "When --decisions YAML fails to parse or is missing a required field, stderr reports which file and which entry (id) is malformed — not a stack trace.", "Existing --decisions behaviour (exit 2, write pending entries) is unchanged."], "priority": 71, "passes": false, "notes": "P3. Deferred from LLM-ergonomics quick-wins plan. The mechanism is mentioned in --help but the file structure (fields, indices, how to fill the choose field) requires source inspection today. Affected files: src/RoslynTools/Core/Decisions/DecisionStore.cs, src/RoslynTools/Core/Decisions/DecisionEntry.cs, src/RoslynTools.Cli/App.cs.", "epicId": ""}, {"id": "US-073", "title": "migrate solution to .NET 10", "description": "As a maintainer, I want the solution targeting .NET 10 so that we stay on a supported runtime and get access to language/runtime improvements ahead of net8.0 going out of mainstream support.", "acceptanceCriteria": ["All projects in RoslynTools.slnx target net10.0 (TargetFramework + any Directory.Build.props)", "dotnet build RoslynTools.slnx succeeds with no new warnings", "dotnet test RoslynTools.slnx passes the full suite", "dotnet format RoslynTools.slnx --verify-no-changes is clean", "rt dump-help runs to completion against RoslynTools.slnx", "rt smoke tests (inspect describe, refactor rename --dry-run) work against a non-trivial Hero solution", "All NuGet packages updated to versions that support net10 with no runtime-only fallbacks", "Microsoft.CodeAnalysis.* bumped to a Roslyn version compatible with the net10 SDK toolchain", "CI workflows (if any) updated to install net10 SDK"], "priority": 77, "passes": false, "notes": "P2. Currently net8.0 across all projects. Migration touches: TFM in every csproj + Directory.Build.props, Microsoft.CodeAnalysis.* package bump (currently 4.9.2), DiffPlex/YamlDotNet/Scrutor checks for net10 support, CI image bump if any, smoke tests on roslyn-tools.slnx then a Hero solution. Watch for breakage in Roslyn syntax APIs and MSBuildLocator behavior — net10 SDK discovery may diverge.", "epicId": ""}, {"id": "US-078", "title": "Result<T,RtError> migration: WorkspaceLoader.LoadAsync", "description": "As a developer, I want WorkspaceLoader.LoadAsync to return Result<(MSBuildWorkspace, Solution), RtError> for missing-solution and zero-projects cases, so solution-load failures surface as clean exit-1 messages routed through the same typed handler introduced in US-077 (formerly US-068a) — no separate FileNotFoundException special-case needed.", "acceptanceCriteria": ["WorkspaceLoader.LoadAsync returns Result<(MSBuildWorkspace workspace, Solution solution), RtError>.", "The 'solution file not found' case produces Result.Err(RtError.NotFound) with the solution path in Context['solution']; the 'solution loaded but contains zero projects' case produces Result.Err(RtError.WorkspaceLoadFailure) with the failure-diagnostic text in Context['diagnostic'].", "MSBuildWorkspace.WorkspaceFailed handler downgrades from throw to Result.Err when the diagnostic is a Failure rather than a Warning; warnings still flow through RtContext.ShowWorkspaceWarnings unchanged.", "Every existing caller of WorkspaceLoader.LoadAsync is updated to consume the Result; commands surface RtError via the shared helper added in US-068a (no new helpers introduced here).", "App.CaptureExceptionAsync no longer needs a FileNotFoundException branch specifically for solution-file-missing — that path is now Result-routed before the catch ladder runs.", "Integration test: rt inspect describe Foo --solution missing.slnx exits 1 with exactly one 'Error: ...' line to stderr referencing the missing path; no stack trace; feedback.json count unchanged.", "Integration test: rt inspect describe Foo --solution malformed.slnx (file exists but isn't a valid solution) exits 1 with RtError.WorkspaceLoadFailure formatting that includes the MSBuild diagnostic.", "dotnet build clean; dotnet format --verify-no-changes clean; existing tests pass.", "rt dogfood smoke: rt inspect describe RoslynTools.Core.WorkspaceLoader --solution RoslynTools.slnx still exits 0 with unchanged stdout JSON shape."], "priority": 79, "passes": false, "notes": "Second of three sub-stories from the US-068 split. Depends on the ADT and shared command helper landed in US-077. Smaller migration than US-077 — single API surface, well-defined two failure modes.", "epicId": "EP-010"}, {"id": "US-079", "title": "Result<T,RtError> migration: MethodExtractor user-input validations", "description": "As a developer, I want MethodExtractor's user-input rejections (no statements in range, multiple parent blocks, return statements in selection, --after/--before conflict) to return Result.Err(RtError.InvalidInput) instead of throwing, so extract-method failures surface as clean exit-1 messages while AST-rewrite invariant violations remain genuine exceptions.", "acceptanceCriteria": ["MethodExtractor's user-input validation paths return Result<MethodExtractionPlan, RtError> (or the existing plan type wrapped in Result) instead of throwing InvalidOperationException.", "The 'no statements found in lines X-Y' check produces RtError.InvalidInput with Context['startLine']/Context['endLine'].", "The 'multiple parent blocks in selection' check produces RtError.InvalidInput with Context['blockCount'].", "The 'return statements present in selection' check produces RtError.InvalidInput with Context['returnLineNumbers'].", "The '--after and --before are mutually exclusive' check produces RtError.InvalidInput with Context['conflictingFlags'].", "AST-rewrite-produced-no-changes and similar internal-invariant violations remain exceptions (they should never be hit from valid user input; if they fire they're bugs).", "ExtractMethodCommand consumes the Result and surfaces RtError via the shared helper from US-068a; no per-validation-path duplication.", "Integration test: rt refactor extract-method src/Foo.cs Bar --start-line 9000 --end-line 9001 --solution X.slnx exits 1 with one 'Error: No statements found in lines 9000-9001' line; no stack trace; feedback.json count unchanged.", "Integration test: rt refactor extract-method ... --start-line A --end-line B where the selection spans multiple parent blocks exits 1 with the multiple-parent-blocks RtError message.", "Integration test: rt refactor extract-method --after Foo --before Bar (mutually-exclusive flags) exits 1 with the conflicting-flags RtError message.", "dotnet build clean; dotnet format --verify-no-changes clean; existing MethodExtractor and ExtractMethodCommand tests pass.", "After this story lands, US-060 (Normalize command outputs around shared result contracts) becomes the next step: it wraps the now-consistent Result<T, RtError> service surface into command-level RtResult<T> envelopes."], "priority": 80, "passes": false, "notes": "Third of three sub-stories from the US-068 split. Depends on US-077 (ADT, shared helper) and US-078 (proven pattern). After this lands, US-060 (Normalize command outputs around shared result contracts) becomes the next step in EP-009 — wrapping the now-consistent service surface into command-level RtResult<T> envelopes.", "epicId": "EP-010"}, {"id": "US-080", "title": "Replace hand-curated synonyms with real thesaurus in rt suggest", "description": "As an LLM/user invoking rt suggest, I want the ranker to leverage a broad English thesaurus (not just ~50 hand-curated synonyms) so that natural-language variants like 'rechristen' or 'expunge' still find the right command without anyone hand-maintaining a map.", "acceptanceCriteria": ["`rt suggest \"remove dead code\"` still ranks `safe-delete` and `find-unused` within the top 3 results.", "`rt suggest \"rechristen this method\"` (uncommon English synonym) returns `rename` within the top 3 results, proving broad thesaurus coverage.", "`rt suggest \"utcnow\"` still ranks `replace-datetime` first via the tech-specific overlay (thesaurus has no entry for this term).", "Thesaurus parse on first use completes in <=2s on a typical developer machine; subsequent calls are sub-100ms.", "Total rt binary size growth from embedding the thesaurus is <=10MB compressed.", "All existing Bm25Scorer and SuggestService tests continue to pass without modification.", "Hand-curated `src/RoslynTools/Services/Suggest/Synonyms.cs` is removed (or repurposed as `TechSynonyms.cs` containing only the small tech-term overlay).", "Query expansion is query-time only - catalog tokens are NOT pre-expanded (so thesaurus updates don't require a rebuild)."], "priority": 81, "passes": false, "notes": "P2. Source = Moby Thesaurus (~24MB embedded, public domain, parsed lazily). Tech-term overlay (TechSynonyms.cs, ~20 entries) for terms general thesauruses don't cover (utcnow->replace-datetime, ioptions->migrate-to-ioptions, destatic->convert-static-class). Query-time expansion (not index-time): tokenize query, expand each non-stopword token via thesaurus, weight expansions lower than original token. Replaces existing src/RoslynTools/Services/Suggest/Synonyms.cs (~50 entries) shipped in the rt suggest POC. Follow-up to EP-011 Story 1 (US-087): triggered only if hand-curated synonyms prove insufficient in dogfood. Defer until US-087 ships and we have measurement data.", "epicId": "EP-011"}, {"id": "US-081", "title": "rt refactor convert-static-class: finish interface generation, DI registration, and ctor/field formatting", "description": "As a roslyn-tools developer, I want rt refactor convert-static-class to produce a complete, buildable destatification: it should generate an I<TypeName> interface (when --no-interface is not passed), register the new instance class in Bootstrap.RegisterServices (when --no-di-registration is not passed), and emit correctly-formatted field and constructor code (no merged-line bugs). All three gaps were discovered during one dogfood pass on the same command and share the same code paths.", "acceptanceCriteria": ["Interface generation (formerly US-037): when --no-interface is NOT passed, rt refactor convert-static-class generates an I<TypeName>.cs file in the same folder containing the extracted public/internal instance method and property signatures.", "Interface generation: the generated I<TypeName> interface declares the same accessibility as the source class (public for public, internal for internal) and is added to the workspace as a new document.", "Interface generation: the converted class declares `: I<TypeName>` in its base list with correct whitespace and brace placement (no `IDisposable\\n,IFoo{` style malformations).", "Interface generation: each public/internal instance method on the converted class implements the interface signature 1:1; private methods and fields are excluded.", "Interface generation: --no-interface flag suppresses interface file creation and base list update; only the class itself is destatified.", "DI registration (formerly US-038): when --no-di-registration is NOT passed, the command locates Bootstrap.RegisterServices(IServiceCollection services) in the solution and inserts services.AddSingleton<I<TypeName>, <TypeName>>() (or the configured lifetime).", "DI registration: --lifetime singleton|scoped|transient flag selects the registration shape; default is singleton.", "DI registration: when no Bootstrap.RegisterServices method is found in the solution, the command emits a warning to stderr and skips DI registration without failing the run.", "DI registration: when the registration line already exists, the command is idempotent — no duplicate line added.", "Field and ctor formatting (formerly US-039): the AddConstructorInjection rewrite places the injected field on its own line with the correct trailing newline; it does NOT merge with the existing first member.", "Field and ctor formatting: when the consumer class already has constructors, the new field/parameter pair is inserted with consistent indentation (4 spaces) matching the existing constructor formatting.", "Field and ctor formatting: the constructor parameter list is wrapped to one parameter per line when adding to a class that already uses one-per-line wrapping; otherwise stays single-line.", "Dry-run (--dry-run) emits a unified diff showing: interface file creation, class signature change, DI registration line addition, and any ctor/field rewrites.", "rt refactor convert-static-class src/RoslynTools/Core/SymbolFormatter.cs --solution RoslynTools.slnx --dry-run produces output that, when applied, results in a buildable solution (verified by piping the dry-run apply through dotnet build).", "Integration test fixture covers: (a) static class with no consumers — interface + DI registration only; (b) static class with one consumer using empty ctor — both consumer rewrite paths; (c) static class with one consumer using existing ctor — exercises the field/formatting path from US-039; (d) --no-interface and --no-di-registration flags.", "dotnet build clean; dotnet format --verify-no-changes clean; existing convert-static-class tests pass; mutation score on ConvertStaticClassCommand stays at or above current baseline."], "priority": 82, "passes": false, "notes": "Consolidates US-037 + US-038 + US-039 (all marked superseded 2026-05-23). Each was a focused bug-fix in convert-static-class; they ship together because they exercise the same rewrite pipeline. Anchored to the existing df/convert-static-class-interface-and-di branch's commit 1fcf269 for the no-constructor formatting fix that preceded this work.", "epicId": ""}, {"id": "US-082", "title": "EP-007 umbrella: structured JSON output across all 8 inspect/analyze read commands", "description": "As an automation consumer, I want every read-only rt inspect/analyze command to emit structured JSON when --json is passed (or when stdout is piped) so I can pipe rt output into parsers, agents, or CI tools without text-scraping. Covers find-refs, find-callers, find-undocumented, find-unused, circular-deps, find-magic-strings, list-imports, list-smells. Sub-AC matrix per command — /execute may parallelise within this umbrella.", "acceptanceCriteria": ["find-refs (formerly US-045): rt inspect find-refs --json emits a JSON array of { symbol, kind, file, line, column, snippet } objects; one entry per reference site; sorted by (file, line).", "find-refs: RtCommandInfo.JsonOutput = true; help text describes the schema; --help shows the JSON shape under an 'Output' section.", "find-callers (formerly US-046): rt inspect find-callers --json emits a JSON array of { caller, file, line, column, callerSignature } objects.", "find-callers: RtCommandInfo.JsonOutput = true; integration test covers a method with two callers in two files.", "find-undocumented (formerly US-047): rt inspect find-undocumented --json emits a JSON array of { symbol, kind, file, line, accessibility } objects; one entry per public/internal API lacking xml doc.", "find-undocumented: respects existing --include-internal flag; integration test covers a class with mixed documented/undocumented members.", "find-unused (formerly US-048): rt inspect find-unused --json emits a JSON array of { symbol, kind, file, line, accessibility, reason } objects.", "find-unused: reason is one of 'no-references' | 'only-self-references' | 'only-test-references'; matches the existing plain-text categories.", "circular-deps (formerly US-049): rt analyze circular-deps --json emits a JSON array of cycle objects, each with { cycleId, projects: [...] } where projects is an ordered list forming the cycle (last project depends on first).", "circular-deps: when no cycles exist, emits an empty array '[]' to stdout (not '{}' or null); exit code 0.", "find-magic-strings (formerly US-050): rt analyze find-magic-strings --json emits a JSON array of { literal, occurrenceCount, sites: [{ file, line, column, contextSnippet }] } objects.", "find-magic-strings: respects existing --min-occurrences flag; sorted by occurrenceCount descending.", "list-imports (formerly US-051): rt analyze list-imports --json emits a JSON array of { file, imports: [{ namespace, alias, isStatic, isGlobal }] } objects; one entry per source file.", "list-imports: --top N (if it exists today) flag still works in JSON mode.", "list-smells (formerly US-052): rt analyze list-smells --json emits a JSON array of { smell, severity, file, line, message, suggestion } objects sorted by severity descending then file.", "list-smells: severity is one of 'low' | 'medium' | 'high' | 'critical'; matches the plain-text output classification.", "All eight commands honour the existing --json global flag plumbing (no per-command --json reinvention); RtContext.Format == OutputFormat.Json triggers the JSON branch.", "All eight commands route diagnostics/progress to stderr; only the JSON document goes to stdout in JSON mode; stdout JSON parses cleanly via System.Text.Json.JsonDocument.Parse with zero leading/trailing non-JSON text.", "rt dump-help output reflects JsonOutput=true for all eight commands after the change; docs/COMMANDS.md regenerates locally with updated metadata.", "Architecture test enforces the JSON-shape contract: a per-command snapshot test runs each command against a fixture solution and asserts the JSON output matches an approved snapshot (e.g. tests/RoslynTools.Tests/Cli/JsonOutputSnapshotTests.cs).", "dotnet build clean; dotnet format --verify-no-changes clean; existing tests pass; new snapshot tests added under tests/RoslynTools.Tests/Cli/.", "Smoke: each of the eight commands invoked against RoslynTools.slnx with --json exits 0 and produces parseable JSON in under 60 seconds.", "Stories can be parallelised inside this umbrella: each command is independently shippable as a sub-batch under EP-007. /execute may pick any subset of the eight ACs to land per run."], "priority": 83, "passes": false, "notes": "Consolidates US-045 + US-046 + US-047 + US-048 + US-049 + US-050 + US-051 + US-052 (all marked superseded 2026-05-23). Template is identical: RtCommandInfo.JsonOutput=true + branch on RtContext.Format==OutputFormat.Json. Eight focused PRs collapsed to one umbrella with snapshot tests pinning the shape per command.", "epicId": "EP-007"}, {"id": "US-083", "title": "Bring src/RoslynTools.Cli/ and src/RoslynTools.Mcp/ into the Stryker mutation pilot", "description": "As a roslyn-tools maintainer, I want Stryker.NET to mutate files in src/RoslynTools.Cli/ and src/RoslynTools.Mcp/ (not just the core library) so the mutation-score gate covers the full production surface. Today the configured Stryker project field points at the core library and files in the other two projects are silently skipped even when they appear in the mutate globs.", "acceptanceCriteria": ["stryker-config.json (or sibling configs in stryker-cli.json / stryker-mcp.json) is restructured so Stryker mutates files from src/RoslynTools/, src/RoslynTools.Cli/, and src/RoslynTools.Mcp/ — not just the core library.", "Per-project configuration: either a single multi-project Stryker setup (project array) or three per-project config files invoked in sequence; whichever shape Stryker supports without bypass flags.", "Running `dotnet stryker` mutates and reports survivors for files in all three projects; CLI files (MakeSealedCommand.cs, DebugCommand.cs, DebugResult.cs flagged in US-069 notes) and Mcp files (the array pass-through in commit df9e43a flagged in US-070 notes) are no longer silently skipped.", "The pre-commit gate (`scripts/pre-commit-gates.ps1`) honours the multi-project setup: when a staged file lives in any of the three projects' mutate globs, the gate runs Stryker against the corresponding project config and applies --break-at 95.", "RT_MUTATION_ALLOW_UNSCOPED bypass still works as a documented escape hatch (no semantic change), but no longer needed for routine CLI / MCP edits.", "Integration check: staging a deliberate mutation-killable change to src/RoslynTools.Mcp/<some-file>.cs and running the pre-commit gate produces a Stryker survivor report (or passes if test coverage exists); previously this would have silently passed.", "Document the new shape in CLAUDE.md → 'Mutation Testing' section so contributors know all three projects are now in scope.", "dotnet build clean; existing mutation gates on src/RoslynTools/Commands/ keep their 100% score target unchanged."], "priority": 84, "passes": false, "notes": "Consolidates US-069 + US-070 (both marked superseded 2026-05-23). The US-070 notes flagged 'likely solved together' — confirmed: per-project Stryker config is the only sensible shape. Switch to either a multi-project Stryker setup or three per-project configs invoked by the pre-commit gate.", "epicId": ""}, {"id": "US-084", "title": "Metadata catalog: RtCommandInfo schema + dump-help --json + consistency test", "description": "As an LLM agent and as a tooling maintainer, I want one coherent source of truth for the rt command catalog: an extended RtCommandInfo schema (Aliases/SeeAlso/SupportedFormats), a rt dump-help --json surface that emits the full schema, and an architecture test that asserts the docs and the in-process catalog never drift. The three concerns are not independently shippable — the schema needs the surface to prove it, the surface needs the test to stay honest.", "acceptanceCriteria": ["RtCommandInfo schema extended (formerly US-059): adds nullable string[]? Aliases, string[]? SeeAlso, OutputFormat[]? SupportedFormats fields. Existing fields (Name, Category, Mutates, JsonOutput, WhenToUse, Examples, KnownIssues) unchanged. Aliases/SeeAlso/SupportedFormats are additive — default null means 'not specified'.", "Startup validator in App.cs is extended to assert: every SeeAlso entry resolves to a known command name; no self-references; no duplicates; every Alias is unique across the command registry; every SupportedFormat is a valid OutputFormat enum value.", "dump-help --json surface (formerly RT-001): rt dump-help --json emits a JSON document with shape { schemaVersion: '1.0', commands: [{ name, category, mutates, jsonOutput, whenToUse, examples, aliases, seeAlso, supportedFormats, knownIssues }] }; one entry per command in the registry.", "dump-help --json: every field has a deterministic JSON shape (strings for strings, booleans for booleans, arrays for arrays, null for null); no fields are silently omitted.", "dump-help --json: exit code 0 always; stdout is parseable via System.Text.Json.JsonDocument.Parse with no leading or trailing non-JSON text.", "dump-help --json: schemaVersion is a string semver-style field; consumers can rely on it for forward compatibility.", "Metadata-driven regeneration (formerly US-065): docs/COMMANDS.md is regenerated from RtCommandInfo on every build (existing post-build target); the regeneration honours the new Aliases/SeeAlso/SupportedFormats fields and renders them in the per-command markdown sections.", "Consistency test: tests/RoslynTools.Tests/Architecture/CommandMetadataConsistencyTests.cs asserts (a) every command's Info.Name matches the first arg of its new Command(...) call in Build(); (b) every Info.Examples entry parses against the command's options without unknown-flag errors; (c) dump-help --json output round-trips through System.Text.Json without loss; (d) docs/COMMANDS.md generated from the JSON matches the build-time output byte-for-byte.", "Backwards-compatibility: rt dump-help (no --json) plain-text output is unchanged for any command that doesn't set Aliases/SeeAlso/SupportedFormats; commands that do set them gain new See-also/Aliases/Formats sections in their plain-text help.", "Architecture test enforces SchemaVersion only changes via an explicit version bump (a sentinel file in docs/ records the current version; the test fails if dump-help emits a different value without the sentinel updating).", "dotnet build clean; dotnet format --verify-no-changes clean; existing tests pass; new architecture test + consistency test green.", "Smoke: rt dump-help --json | jq '.commands | length' returns the same number as `rt dump-help` lists; rt dump-help --json | jq '.commands[].name' lists every command without duplicates."], "priority": 85, "passes": false, "notes": "Consolidates US-059 (schema) + RT-001 (dump-help --json) + US-065 (consistency test) (all marked superseded 2026-05-23). They were three angles on the same metadata layer. Single coherent story makes the contract reviewable as one PR.", "epicId": "EP-009"}, {"id": "US-085", "title": "Standardize CLI options through CommandOptionFactory with consistent vocabulary and aliases", "description": "As an rt user, I want common CLI options (--solution, --symbol, --file, --dry-run, --json, --decisions, --threshold, --top, --sort) to be constructed by shared factories so option names, descriptions, defaults, and aliases stay consistent across commands. The factory naming and the vocabulary decision are inseparable: every factory method commits to one canonical option name, so the vocabulary standardisation IS the factory work.", "acceptanceCriteria": ["CommandOptionFactory in src/RoslynTools/Cli/ defines static factory methods for every option that appears in 2+ commands: CreateSolutionOption(), CreateSymbolOption(), CreateFqnOption(), CreateFileOption(), CreateDryRunOption(), CreateJsonOption(), CreateDecisionsOption(), CreateThresholdOption(), CreateTopOption(), CreateSortOption().", "Each factory method returns a fully-configured System.CommandLine.Option<T> with: consistent name, consistent description text, consistent default, and any required Alias[] (e.g. --solution accepts -s alias everywhere or nowhere — pick one and apply).", "Vocabulary contract: option names are standardised across commands — e.g. --symbol means 'symbol name or FQN to operate on' everywhere it appears; --file means 'a single source file path' everywhere it appears; --top means 'limit output to N entries after sorting' everywhere it appears. Mismatches in existing commands are fixed (with backwards-compatibility aliases for the old names if Dan flags any breaking changes).", "All commands that previously hand-rolled these options are migrated to use the factory. Mechanical change — easy to verify via grep that `new Option<string>(\"--solution\"` returns zero hits in src/RoslynTools.Cli/Commands/ after migration.", "Architecture test enforces: any new Option<T> declared directly inside a Build() method (not via the factory) for one of the factory-owned names fails the build.", "Help text for migrated commands is unchanged in behaviour but the wording is now consistent across the catalog (e.g. --solution help reads the same in every command's --help).", "Aliases: where two commands had different aliases for the same conceptual flag (e.g. --sln vs --solution-path), the factory picks one canonical and reuses; the discarded alias either becomes a deprecation alias or is removed if no usage exists.", "rt dump-help output reflects the unified option vocabulary; docs/COMMANDS.md regenerates with consistent option descriptions across all commands.", "dotnet build clean; dotnet format --verify-no-changes clean; existing tests pass.", "Smoke: 10 sampled commands from inspect/analyze/refactor exercised via dotnet run still parse the same arg strings they accepted before (regression test array of (command, args) tuples)."], "priority": 86, "passes": false, "notes": "Consolidates US-058 (option factories) + US-062 (vocabulary standardisation) (both marked superseded 2026-05-23). Anchors to the existing CommandOptionFactory.CreateSolutionOption helper that already exists (per the closed US-026). Extends it to cover the full set of shared options.", "epicId": "EP-009"}, {"id": "US-086", "title": "Command file structure convention + architecture ratchet + migration playbook", "description": "As an rt contributor, I want a canonical command file structure (Info → Build → handlers), an architecture test that ratchets migrated commands toward it, and a concise playbook that walks contributors through the migration. The three pieces are one body of work: the playbook references the structure, the ratchet enforces it, and the structure is meaningless without both. One CONTRIBUTING-style doc + one architecture test, not three meta-process stories.", "acceptanceCriteria": ["Command file structure convention (formerly US-063) is documented in docs/command-structure.md: every src/RoslynTools.Cli/Commands/*Command.cs file follows the order — using directives, namespace, class declaration with IRtCommand, public static readonly Info field, public static Command Build() method, private static handler method(s), no other top-level declarations.", "Convention: handler methods live inside the Command class as private static methods; no separate service classes; service logic stays in src/RoslynTools/Services/ and src/RoslynTools/Core/.", "Convention: Build() is at most 60 lines; if a Build() exceeds that, split option construction into private static methods.", "Architecture ratchet (formerly US-064) in tests/RoslynTools.Tests/Architecture/CommandFileStructureTests.cs: a marker file docs/structure-migrated-commands.txt lists commands that have been migrated to the canonical structure; the test asserts every listed command passes the structure invariants (Info first, Build second, no other public members, no top-level statements).", "Architecture ratchet: a separate test enforces the marker file only grows — never shrinks. Removing a command from the marker file requires deleting the corresponding Command class.", "Architecture ratchet: when all commands in src/RoslynTools.Cli/Commands/ are in the marker file, the test transitions from ratchet mode to enforcement mode (asserts ALL commands pass without consulting the marker).", "Migration playbook (formerly US-066) in docs/command-migration-playbook.md: a concise (under 200 lines) document with sections: (1) when to use the playbook, (2) the 8-step migration sequence — read existing command, identify hand-rolled options to replace, migrate to CommandOptionFactory, restructure Build() to canonical order, add Info metadata fields (Aliases/SeeAlso/SupportedFormats), add structure-migrated-commands.txt entry, run rt dump-help to verify, ship; (3) what NOT to do during migration (no behaviour changes, no AC changes, no test refactoring beyond what the structure ratchet requires); (4) how to back out if a migration breaks.", "Playbook references the option factory contract from US-084 (formerly US-058+US-062) and the metadata contract from US-083 (formerly US-059+RT-001+US-065).", "First command migration demonstrates the playbook end-to-end: pick one simple read-only command (e.g. OutlineCommand or DescribeCommand), apply all 8 steps, land as a separate commit that the playbook references as the canonical example.", "dotnet build clean; dotnet format --verify-no-changes clean; existing tests pass; new architecture tests green.", "Architecture test exposes a `ListUnmigratedCommands` helper that prints the remaining commands when run — useful for future migration sweeps."], "priority": 87, "passes": false, "notes": "Consolidates US-063 (file structure) + US-064 (architecture ratchets) + US-066 (migration playbook) (all marked superseded 2026-05-23). Depends on US-084 (option factory) and US-083 (metadata catalog) landing first so the playbook can reference both as authoritative contracts.", "epicId": "EP-009"}, {"id": "US-087", "title": "rt suggest <task>: BM25 scorer + synonym map + JSON/text output", "description": "As an LLM agent, I want a flat top-level rt suggest <task> command that returns the most likely rt commands for a natural-language task description, so I can map intent to command name without scanning the full help page. BM25 + hand-curated synonyms over Name/WhenToUse/Examples — no embeddings, no LLM-at-runtime, no external deps. JSON-by-default when piped (per CLAUDE.md convention).", "acceptanceCriteria": ["New top-level meta-command rt suggest <task> wired into App.RunCoreAsync next to DumpHelpCommand.Build() — not registered as IRtCommand, does not appear under inspect/analyze/refactor groups.", "Implementation lives in src/RoslynTools.Cli/Suggest/: SuggestCommand.cs (Build() returns a Command), Bm25Scorer.cs (pure function: IReadOnlyList<RtCommandInfo>, string query, int top → IReadOnlyList<SuggestResult>), Synonyms.cs (static readonly map of command-name → string[] synonyms).", "Bm25Scorer scores each command against the tokenised query across three fields: Name (and its synonyms) at weight 3.0×, WhenToUse at weight 1.0×, Examples (joined) at weight 0.3×.", "Tokenisation: split on whitespace + punctuation, lowercase, drop a small fixed stopword set {a, an, the, is, of, to, in, for, this, that, all}.", "BM25 length normalisation prevents a long WhenToUse with one match from dominating a short WhenToUse with one match; k1 and b parameters use standard defaults (k1=1.2, b=0.75).", "Output flags: --top N (default 3), --json (explicit override).", "Text mode (default at TTY): numbered list, each entry shows name + score + first line of WhenToUse + one example. Colour the name (reuse DumpHelpCommand colour helpers).", "JSON mode (--json or stdout not a TTY): array of { name, score, category, whenToUse, example, allExamples }. Designed for LLM ingestion.", "Default behaviour: when stdout is not a TTY, emit JSON (matches CLAUDE.md 'read-only inspection commands: JSON to stdout' convention). --json flag forces JSON regardless.", "Exit code: 0 always — empty results are a valid answer (a JSON empty array). No exit-1 / exit-2 paths in this command.", "Synonym map seed: ~10 high-traffic mismatches — safe-delete←{delete,remove}, replace-datetime←{datetime,utcnow,timeprovider}, convert-static-class←{destatic,to instance,instance class}, convert-to-record←{record,to record}, make-async←{async,task}, extract-method←{extract block,pull out method}, find-callers←{callers,who calls}, find-refs←{references,uses of,usages}, outline←{list members,type members}, describe←{type shape,interface members}. Per-command lists, not free-form.", "Theory test tests/RoslynTools.Tests/Cli/SuggestCommandTests.cs pins (query, expected-top-result) pairs: ('extract a method from a block','extract-method'), ('remove DateTime.UtcNow','replace-datetime'), ('convert static class to instance','convert-static-class'), ('find callers of a method','find-callers'), ('rename a symbol','rename'). Tests resolve commands from RoslynTools.Bootstrap.RegisterServices per the feedback_test_di_resolution memory.", "BM25 unit tests tests/RoslynTools.Tests/Cli/Bm25ScorerTests.cs cover: single-match-name-wins, WhenToUse-stronger-than-Examples weighting, no-match-returns-empty, length-normalisation-prevents-long-text-dominance.", "Documentation: skills/use-rt/SKILL.md gains a one-paragraph 'If you don't know the command name, run rt suggest \"<task>\" first' pointer; CLAUDE.md → Commands section gains the line 'Don\\'t know the name? rt suggest \"<task>\"'.", "rt dump-help shows suggest under top-level commands; rt --help lists it next to dump-help.", "dotnet build clean; dotnet format --verify-no-changes clean; all tests pass; mutation score on Bm25Scorer.cs at or above 95%.", "Dogfood smoke: rt suggest 'extract a block of statements into a new method' returns extract-method as top result; rt suggest 'remove DateTime.UtcNow' --json parses cleanly; rt suggest 'rename a symbol across the solution' --top 5 returns 5 ranked entries."], "priority": 88, "passes": false, "notes": "First of 4 stories under EP-011 (rt suggest discovery epic). Source plan ~/.claude/plans/how-can-we-further-soft-pie.md steps 1-6 + step 12. Pre-existing US-080 (synonym thesaurus) is the follow-up if BM25+hand-curated proves insufficient.", "epicId": "EP-011"}, {"id": "US-088", "title": "RtCommandInfo.SeeAlso: schema + startup validator + help/markdown rendering", "description": "As an LLM agent landing on a command via any route (suggest, --help, dump-help, use-rt skill), I want to see related commands — inverse pairs, workflow chains, sibling operations — so I can pivot to a better-fitting command without re-querying. Add SeeAlso to RtCommandInfo, validate at startup, render in --help and docs/COMMANDS.md, surface in rt suggest output.", "acceptanceCriteria": ["RtCommandInfo gains a nullable string[]? SeeAlso field (default null). Entries are bare command names (e.g. 'extract-method', not 'rt refactor extract-method').", "Startup validator in App.cs (existing static-ctor block) is extended to assert every SeeAlso entry resolves to a known command name in the registry; an unknown name throws at the same point the existing category check does, failing the post-build docs/COMMANDS.md generation.", "Validator also asserts no self-references (a command's SeeAlso list does not include its own name) and no duplicates within a single SeeAlso list.", "Architecture test tests/RoslynTools.Tests/Architecture/SeeAlsoValidationTests.cs covers the three invariants (unknown name, self-reference, duplicate) by exercising the validator against the live registry.", "rt <cmd> --help renders a 'See also:' section after Examples when SeeAlso is non-empty. Extend BuildHelpLayout in App.cs and DumpHelpCommand.RenderColouredCommandHeader so the layout is consistent between live --help and dump-help.", "docs/COMMANDS.md per-command section gains a '**See also:**' line with markdown anchor links to each related command's section.", "rt suggest output extension: when returning the top result, also surface the top result's SeeAlso list as a 'related' block (text mode, lower-prominence, no score) or a separate 'related' array (JSON mode). The SeeAlso candidates are NOT scored — they're labelled 'related to top result'.", "Opt-in bidirectionality diagnostic: add --check-bidirectional flag on dump-help (or rt suggest --diagnose-see-alsos) that reports asymmetric pairs (A lists B but B doesn't list A). Exits 0 always — informational lint, not a hard rule.", "No new dependencies; no behaviour changes to existing commands other than the addition of the See-also section when SeeAlso is non-empty.", "dotnet build clean; dotnet format --verify-no-changes clean; existing tests pass; new architecture test green.", "Smoke: adding a deliberate SeeAlso=['nonexistent-cmd'] to one command fails the post-build dump-help generation with a clear error message."], "priority": 89, "passes": false, "notes": "Second of 4 stories under EP-011. Source plan steps 7-9. Touches RtCommandInfo schema (same area US-084 modifies — sequence US-084 before this if both ship in the same window, or land this independently if US-084 is deferred).", "epicId": "EP-011"}, {"id": "US-089", "title": "Seed SeeAlso data across the command catalog", "description": "As a roslyn-tools maintainer, I want every command's SeeAlso field populated with the right inverse pairs, workflow chains, and sibling operations so that LLM agents using --help, dump-help, or rt suggest can pivot between related commands without re-querying. Touches ~20-30 command files; additive only."

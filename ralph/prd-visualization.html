<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PRD Visualization</title>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    :root, [data-theme="cream"] {
      --bg: #ece4d4;
      --panel: #fffdf7;
      --panel-2: #f8f1e6;
      --ink: #1d2433;
      --muted: #687387;
      --line: #d7cdbb;
      --accent: #0f766e;
      --accent-soft: #d8f0ec;
      --warn: #9a3412;
      --warn-soft: #ffedd5;
      --done: #166534;
      --done-soft: #dcfce7;
      --shadow: 0 20px 50px rgba(74, 59, 34, 0.12);
      --radius: 22px;
      --body-bg: radial-gradient(circle at top left, #fff8ea 0, transparent 28%), linear-gradient(180deg, #f3ecdf 0%, #e9dfcd 100%);
      --shell-bg: rgba(255, 253, 247, 0.7);
      --shell-border: rgba(215, 205, 187, 0.8);
      --card-bg: #ffffff;
      --card-bg-hover: #fffaf0;
      --card-bg-active: #fff6e8;
      --card-border-hover: #b9a88c;
      --card-border-active: #c89e58;
      --card-shadow-active: rgba(200, 158, 88, 0.22);
      --pill-bg: #f7efe2;
      --pill-priority-bg: #f8efe1;
      --pill-epic-bg: #e8ddf3;
      --pill-epic-fg: #5b3a8c;
      --pill-epic-border: #c9b6e0;
      --pill-pending-border: #f3c89d;
      --pill-complete-border: #b7e4c7;
      --epic-bar-bg: #fcf7ee;
      --acceptance-bg: #fcf7ee;
      --code-bg: #f1eadf;
      --summary-bg: linear-gradient(180deg, #fffdf7 0%, #faf4e8 100%);
      --sidebar-top-bg: linear-gradient(180deg, #fffdf7 0%, #faf4e8 100%);
      --mobile-panel-bg: linear-gradient(180deg, #fffdf7 0%, #faf4e8 100%);
      --mobile-summary-bg: #fffaf0;
      --mobile-panel-body-bg: #ffffff;
      --font-family: Georgia, "Times New Roman", serif;
      --resizer-color: rgba(215, 205, 187, 0.6);
      --resizer-color-hover: #c89e58;
    }
    [data-theme="dark"] {
      --bg: #0f1419;
      --panel: #1a2028;
      --panel-2: #232b36;
      --ink: #e6edf3;
      --muted: #8b949e;
      --line: #30363d;
      --accent: #58a6ff;
      --accent-soft: #1f2d43;
      --warn: #f0883e;
      --warn-soft: #3a220f;
      --done: #3fb950;
      --done-soft: #0f2e19;
      --shadow: 0 20px 50px rgba(0, 0, 0, 0.45);
      --radius: 22px;
      --body-bg: radial-gradient(circle at top left, #1a2430 0, transparent 30%), linear-gradient(180deg, #0d1117 0%, #161b22 100%);
      --shell-bg: rgba(26, 32, 40, 0.7);
      --shell-border: rgba(48, 54, 61, 0.8);
      --card-bg: #161b22;
      --card-bg-hover: #1c232c;
      --card-bg-active: #22303f;
      --card-border-hover: #444c56;
      --card-border-active: #58a6ff;
      --card-shadow-active: rgba(88, 166, 255, 0.22);
      --pill-bg: #22272e;
      --pill-priority-bg: #2a2e37;
      --pill-epic-bg: #2d2640;
      --pill-epic-fg: #c9a9ff;
      --pill-epic-border: #3d345a;
      --pill-pending-border: #3a220f;
      --pill-complete-border: #0f2e19;
      --epic-bar-bg: #161b22;
      --acceptance-bg: #161b22;
      --code-bg: #0d1117;
      --summary-bg: linear-gradient(180deg, #1a2028 0%, #141920 100%);
      --sidebar-top-bg: linear-gradient(180deg, #1a2028 0%, #141920 100%);
      --mobile-panel-bg: linear-gradient(180deg, #1a2028 0%, #141920 100%);
      --mobile-summary-bg: #1c232c;
      --mobile-panel-body-bg: #161b22;
      --font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --resizer-color: rgba(48, 54, 61, 0.8);
      --resizer-color-hover: #58a6ff;
    }
    [data-theme="paper"] {
      --bg: #f5f5f5;
      --panel: #ffffff;
      --panel-2: #fafafa;
      --ink: #111111;
      --muted: #666666;
      --line: #e0e0e0;
      --accent: #1a73e8;
      --accent-soft: #e8f0fe;
      --warn: #c5221f;
      --warn-soft: #fce8e6;
      --done: #137333;
      --done-soft: #e6f4ea;
      --shadow: 0 4px 14px rgba(0, 0, 0, 0.08);
      --radius: 10px;
      --body-bg: #f5f5f5;
      --shell-bg: #ffffff;
      --shell-border: #e0e0e0;
      --card-bg: #ffffff;
      --card-bg-hover: #f7f7f7;
      --card-bg-active: #e8f0fe;
      --card-border-hover: #bdbdbd;
      --card-border-active: #1a73e8;
      --card-shadow-active: rgba(26, 115, 232, 0.18);
      --pill-bg: #f0f0f0;
      --pill-priority-bg: #f0f0f0;
      --pill-epic-bg: #f3e8fd;
      --pill-epic-fg: #6b3fa0;
      --pill-epic-border: #d6c3ef;
      --pill-pending-border: #f9c7c5;
      --pill-complete-border: #b7e1c0;
      --epic-bar-bg: #fafafa;
      --acceptance-bg: #fafafa;
      --code-bg: #f0f0f0;
      --summary-bg: #ffffff;
      --sidebar-top-bg: #ffffff;
      --mobile-panel-bg: #ffffff;
      --mobile-summary-bg: #fafafa;
      --mobile-panel-body-bg: #ffffff;
      --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --resizer-color: #e0e0e0;
      --resizer-color-hover: #1a73e8;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; overflow: hidden; }
    body {
      margin: 0;
      color: var(--ink);
      background: var(--body-bg);
      font-family: var(--font-family);
    }
    #root { height: 100%; }
    .app {
      height: 100vh;
      margin: 0 auto;
      padding: 16px;
      max-width: none;
    }
    .shell {
      height: 100%;
      background: var(--shell-bg);
      border: 1px solid var(--shell-border);
      border-radius: 28px;
      padding: 18px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(10px);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .eyebrow {
      text-transform: uppercase;
      letter-spacing: 0.08em;
      font-size: 0.76rem;
      color: var(--muted);
      margin-bottom: 6px;
    }
    h1, h2, h3, h4, h5, p { margin: 0; }
    .subtitle {
      color: var(--muted);
      margin-top: 6px;
    }
    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      margin-bottom: 14px;
      flex-wrap: wrap;
    }
    .theme-picker {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 0.85rem;
      color: var(--muted);
      white-space: nowrap;
    }
    .theme-picker-label {
      text-transform: uppercase;
      letter-spacing: 0.08em;
      font-size: 0.72rem;
    }
    .theme-select {
      border: 1px solid var(--line);
      background: var(--card-bg);
      color: var(--ink);
      border-radius: 999px;
      padding: 6px 12px;
      font: inherit;
      cursor: pointer;
    }
    .project-tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }
    .project-tab {
      border: 1px solid var(--line);
      background: var(--card-bg);
      color: var(--ink);
      border-radius: 999px;
      padding: 10px 14px;
      cursor: pointer;
      font: inherit;
    }
    .project-tab.active {
      background: var(--accent);
      border-color: var(--accent);
      color: white;
    }
    .prd-picker {
      position: relative;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    .prd-picker-trigger {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      border: 1px solid var(--line);
      background: var(--card-bg);
      color: var(--ink);
      border-radius: 999px;
      padding: 8px 14px;
      cursor: pointer;
      font: inherit;
      max-width: 360px;
    }
    .prd-picker-trigger:hover {
      border-color: var(--card-border-hover);
      background: var(--card-bg-hover);
    }
    .prd-picker-trigger.open {
      border-color: var(--card-border-active);
      background: var(--card-bg-active);
    }
    .prd-picker-icon {
      width: 16px;
      height: 16px;
      flex: 0 0 auto;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .prd-picker-label {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-weight: 600;
    }
    .prd-picker-caret {
      color: var(--muted);
      font-size: 0.7rem;
      flex: 0 0 auto;
    }
    .prd-picker-menu {
      position: absolute;
      top: calc(100% + 8px);
      left: 0;
      width: min(640px, calc(100vw - 48px));
      max-height: 420px;
      overflow: auto;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: var(--panel);
      box-shadow: var(--shadow);
      padding: 10px;
      z-index: 30;
    }
    .prd-picker-toggle {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 10px 12px;
      border-bottom: 1px solid var(--line);
      margin-bottom: 10px;
      font-size: 0.84rem;
      color: var(--muted);
    }
    .prd-picker-toggle input {
      margin: 0;
    }
    .prd-option {
      display: block;
      width: 100%;
      border: 1px solid transparent;
      background: var(--card-bg);
      border-radius: 14px;
      padding: 12px 14px;
      color: var(--ink);
      font: inherit;
      text-align: left;
      cursor: pointer;
    }
    .prd-option + .prd-option {
      margin-top: 8px;
    }
    .prd-option:hover,
    .prd-option.active {
      border-color: var(--card-border-active);
      background: var(--card-bg-active);
    }
    .prd-option-top {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: center;
    }
    .prd-option-title {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-weight: 700;
    }
    .prd-option-subtitle {
      margin-top: 4px;
      color: var(--muted);
      font-size: 0.82rem;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .sync-status {
      padding: 0 6px 12px;
      font-size: 0.84rem;
      color: var(--muted);
    }
    .sync-status.error {
      color: var(--warn);
    }
    .main-grid {
      flex: 1 1 auto;
      display: grid;
      grid-template-columns: var(--col-1, 28%) 6px var(--col-2, 32%) 6px minmax(0, 1fr);
      gap: 0;
      min-height: 0;
    }
    .resizer {
      background: transparent;
      cursor: col-resize;
      position: relative;
      user-select: none;
      touch-action: none;
    }
    .resizer::before {
      content: "";
      position: absolute;
      top: 10%;
      bottom: 10%;
      left: 2px;
      right: 2px;
      background: var(--resizer-color);
      border-radius: 2px;
      transition: background 0.12s ease;
    }
    .resizer:hover::before,
    .resizer.dragging::before {
      background: var(--resizer-color-hover);
    }
    .sidebar, .summary-pane, .details {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--panel);
      overflow: hidden;
    }
    .sidebar {
      display: flex;
      flex-direction: column;
      min-width: 0;
      min-height: 0;
    }
    .sidebar-top {
      padding: 18px;
      border-bottom: 1px solid var(--line);
      background: var(--sidebar-top-bg);
    }
    .filters {
      display: grid;
      grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr) minmax(0, 1fr);
      gap: 10px;
    }
    .filter-select {
      width: 100%;
      border: 1px solid var(--line);
      background: var(--card-bg);
      border-radius: 14px;
      padding: 11px 13px;
      font: inherit;
      color: var(--ink);
    }
    .search {
      width: 100%;
      border: 1px solid var(--line);
      background: var(--card-bg);
      border-radius: 14px;
      padding: 11px 13px;
      font: inherit;
      color: var(--ink);
    }
    .search:focus {
      outline: 2px solid var(--accent-soft);
      border-color: var(--accent);
    }
    .story-list {
      flex: 1 1 auto;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 10px;
      display: grid;
      gap: 10px;
      min-height: 0;
      min-width: 0;
    }
    .story-row {
      border: 1px solid var(--line);
      background: var(--card-bg);
      border-radius: 16px;
      padding: 14px;
      cursor: pointer;
      text-align: left;
      font: inherit;
      color: inherit;
      display: grid;
      gap: 8px;
    }
    .story-row:hover {
      border-color: var(--card-border-hover);
      background: var(--card-bg-hover);
    }
    .story-row.active {
      background: var(--card-bg-active);
      border-color: var(--card-border-active);
      box-shadow: inset 0 0 0 1px var(--card-shadow-active);
    }
    .story-row-top {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: flex-start;
    }
    .story-id {
      font-size: 0.76rem;
      letter-spacing: 0.08em;
      color: var(--muted);
      text-transform: uppercase;
    }
    .story-title {
      font-size: 1rem;
      line-height: 1.25;
    }
    .story-desc-preview {
      color: var(--muted);
      font-size: 0.92rem;
      line-height: 1.35;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .pill-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .pill {
      border-radius: 999px;
      padding: 4px 10px;
      font-size: 0.78rem;
      border: 1px solid var(--line);
      white-space: nowrap;
      background: var(--pill-bg);
    }
    .pill.pending {
      background: var(--warn-soft);
      color: var(--warn);
      border-color: var(--pill-pending-border);
    }
    .pill.complete {
      background: var(--done-soft);
      color: var(--done);
      border-color: var(--pill-complete-border);
    }
    .pill.priority {
      background: var(--pill-priority-bg);
    }
    .pill.epic {
      background: var(--pill-epic-bg);
      color: var(--pill-epic-fg);
      border-color: var(--pill-epic-border);
    }
    .epic-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      padding: 10px 12px;
      border-bottom: 1px solid var(--line);
      background: var(--epic-bar-bg);
    }
    .epic-chip {
      background: var(--card-bg);
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 4px 10px;
      font-size: 0.78rem;
      color: var(--ink);
      font: inherit;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .epic-chip:hover {
      border-color: var(--card-border-hover);
      background: var(--card-bg-hover);
    }
    .epic-chip.active {
      background: var(--pill-epic-bg);
      border-color: var(--pill-epic-border);
      box-shadow: inset 0 0 0 1px var(--card-shadow-active);
    }
    .epic-chip .epic-id {
      color: var(--pill-epic-fg);
      font-weight: 600;
    }
    .epic-chip .epic-count {
      color: var(--muted);
    }
    .details {
      display: flex;
      flex-direction: column;
      min-width: 0;
      min-height: 0;
    }
    .summary-pane {
      display: flex;
      flex-direction: column;
      min-width: 0;
      min-height: 0;
    }
    .summary-inner {
      flex: 1 1 auto;
      padding: 22px;
      overflow-y: auto;
      overflow-x: hidden;
      min-height: 0;
      min-width: 0;
      background: var(--summary-bg);
    }
    .summary-title {
      font-size: 1.35rem;
      line-height: 1.25;
    }
    .summary-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 14px 0 18px;
    }
    .summary-preview {
      color: var(--muted);
      margin-top: 18px;
      font-size: 0.95rem;
      line-height: 1.45;
    }
    .details-inner {
      flex: 1 1 auto;
      padding: 28px;
      overflow-y: auto;
      overflow-x: hidden;
      min-height: 0;
      min-width: 0;
    }
    .details-top {
      display: flex;
      justify-content: space-between;
      gap: 18px;
      align-items: flex-start;
      margin-bottom: 18px;
    }
    .details-path {
      margin-top: 8px;
      color: var(--muted);
      word-break: break-word;
    }
    .section {
      margin-top: 24px;
      padding-top: 20px;
      border-top: 1px solid var(--line);
    }
    .section h4 {
      margin-bottom: 12px;
      font-size: 1rem;
    }
    .markdown {
      color: var(--ink);
      line-height: 1.55;
    }
    .markdown p {
      margin: 0 0 12px;
    }
    .markdown p:last-child {
      margin-bottom: 0;
    }
    .markdown ul, .markdown ol {
      margin: 0 0 12px 22px;
      padding: 0;
    }
    .markdown li + li {
      margin-top: 8px;
    }
    .markdown code {
      font-family: Consolas, "Courier New", monospace;
      background: var(--code-bg);
      padding: 1px 5px;
      border-radius: 6px;
      font-size: 0.92em;
    }
    .linked-docs {
      margin-top: 24px;
      padding-top: 20px;
      border-top: 1px solid var(--line);
      display: grid;
      gap: 18px;
    }
    .linked-doc-path {
      font-family: Consolas, "Courier New", monospace;
      font-size: 0.82rem;
      color: var(--muted);
      margin-bottom: 10px;
      word-break: break-all;
    }
    .spec-markdown {
      font-size: 0.95rem;
      line-height: 1.55;
      min-width: 0;
      overflow-wrap: break-word;
      word-break: break-word;
    }
    .spec-markdown img { max-width: 100%; height: auto; }
    .spec-markdown table {
      display: block;
      max-width: 100%;
      overflow-x: auto;
    }
    .spec-markdown h1, .spec-markdown h2, .spec-markdown h3 {
      margin: 18px 0 8px;
      line-height: 1.2;
    }
    .spec-markdown h1 { font-size: 1.25rem; }
    .spec-markdown h2 { font-size: 1.1rem; }
    .spec-markdown h3 { font-size: 1rem; }
    .spec-markdown p { margin: 0 0 12px; }
    .spec-markdown ul, .spec-markdown ol { margin: 0 0 12px 22px; }
    .spec-markdown li + li { margin-top: 6px; }
    .spec-markdown pre {
      background: var(--code-bg);
      padding: 12px;
      border-radius: 8px;
      overflow-x: auto;
      max-width: 100%;
      font-size: 0.88em;
      line-height: 1.45;
    }
    .spec-markdown code {
      font-family: Consolas, "Courier New", monospace;
      background: var(--code-bg);
      padding: 1px 5px;
      border-radius: 6px;
      font-size: 0.92em;
    }
    .spec-markdown pre code { background: none; padding: 0; }
    .spec-markdown table {
      border-collapse: collapse;
      margin: 12px 0;
      font-size: 0.9em;
    }
    .spec-markdown th, .spec-markdown td {
      border: 1px solid var(--line);
      padding: 6px 10px;
    }
    .spec-markdown blockquote {
      margin: 12px 0;
      padding: 4px 14px;
      border-left: 3px solid var(--line);
      color: var(--muted);
    }
    .acceptance-list {
      display: grid;
      gap: 12px;
      padding: 0;
      margin: 0;
      list-style: none;
    }
    .acceptance-item {
      background: var(--acceptance-bg);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 14px 16px;
    }
    .acceptance-index {
      display: inline-block;
      min-width: 28px;
      margin-right: 8px;
      color: var(--muted);
      font-size: 0.8rem;
    }
    .empty {
      padding: 28px;
      color: var(--muted);
    }
    .mobile-summary {
      display: none;
      margin-bottom: 14px;
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 14px;
      background: var(--mobile-summary-bg);
    }
    .mobile-accordion {
      display: none;
    }
    .mobile-panel {
      border: 1px solid var(--line);
      border-radius: 18px;
      background: var(--panel);
      overflow: hidden;
      margin-top: 14px;
    }
    .mobile-panel summary {
      list-style: none;
      cursor: pointer;
      padding: 14px 16px;
      background: var(--mobile-panel-bg);
      font-weight: 700;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }
    .mobile-panel summary::-webkit-details-marker {
      display: none;
    }

    }

        border-radius: 20px;
      }
      .main-grid {

      .mobile-accordion {
        display: block;
      }
      .mobile-summary {
        display: block;
      }

      }
    }

ror + context.ExitCode = 1 helper.", "Add a typed-only catch ladder in App.CaptureExceptionAsync for FileNotFoundException, DirectoryNotFoundException, ArgumentException, JsonException — these are routine OS/parse errors. No substring-matching of exception messages anywhere.", "feedback.json still captures every exception with the full diagnostic payload from US-042; only the user-facing stderr shape changes.", "Tests: SymbolLocator returns RtError.NotFound for unknown symbol; OutlineCommand returns exit 1 + single stderr line for missing file; build remains clean.", "Documentation: add a short Result-types section to CLAUDE.md / AGENTS.md so new commands follow the pattern."], "priority": 68, "passes": false, "notes": "Driven by quality-first rule (2026-05-15): refuses the substring-matching shortcut and instead models routine vs bug differences in the type system. Replaces the deferred classification half of US-042. Large change — touches ~10-15 throw sites and every caller — sequence carefully via /execute with TDD.", "epicId": ""}, {"id": "US-001", "title": "Add rt analyze complexity command", "description": "As a developer, I want to run rt analyze complexity --solution X to get cyclomatic complexity, cognitive complexity, LOC, and parameter count per method across the solution, so that I can identify hotspots for refactoring.", "acceptanceCriteria": ["ComplexityCommand class exists at src/RoslynTools/Commands/ComplexityCommand.cs as internal sealed class ComplexityCommand : IRtCommand", "ComplexityCommand.Info.Name equals \"complexity\" and matches the first argument passed to new Command(...) in Build()", "ComplexityCommand.Info.Category equals \"analyze\"", "ComplexityCommand.Info.JsonOutput is true", "ComplexityCommand.Info.Mutates is false", "ComplexityCommand.Info.Examples contains at least one runnable invocation including rt analyze complexity --solution RoslynTools.slnx", "Running rt analyze complexity --help prints help text describing --solution, --threshold, --sort, and --top flags", "rt analyze complexity is reachable both as rt analyze complexity and as the unqualified rt complexity form, matching the existing convention enforced by App.RunAsync", "dotnet build RoslynTools.slnx succeeds with zero errors after ComplexityCommand is added", "dotnet format RoslynTools.slnx --verify-no-changes exits 0 after ComplexityCommand is added", "dotnet test RoslynTools.slnx -v minimal passes with the new ComplexityCommand tests included", "The startup registry assertion in App.cs does not throw when ComplexityCommand is reflection-discovered (Info.Category is one of the accepted values)", "With a valid --solution path, command exits 0 and writes a single JSON document to stdout", "With a valid --solution path, all progress and diagnostic messages are written to stderr, never stdout", "Stdout JSON parses successfully via System.Text.Json.JsonDocument.Parse with no trailing or leading non-JSON text", "JSON root object contains a methods array, a typeRollups array, and a namespaceRollups array", "Each entry in methods contains exactly the keys method, type, namespace, file, line, cyclomatic, cognitive, loc, params with correct JSON types (string/string/string/string/number/number/number/number/number)", "method field is the fully qualified method name including the containing type (e.g. RoslynTools.Core.WorkspaceLoader.OpenAsync)", "type field is the fully qualified containing type name without the method portion", "namespace field is the containing namespace string, or an empty string for types in the global namespace", "file field is an absolute path to the source file containing the method declaration", "line field is the 1-based line number of the method declaration opening in file", "For an empty method void M() {}, cyclomatic equals 1 (base path)", "For a method with a single if statement and no else, cyclomatic is 2 (base + 1 decision)", "For a method with if / else if / else, each if and else if increments cyclomatic by 1; bare else does not add to cyclomatic", "For a method with a switch containing N non-default case labels, cyclomatic increases by N over the base", "for, foreach, while, and do-while loops each contribute +1 to cyclomatic", "Each catch clause contributes +1 to cyclomatic", "Each ternary (?:) operator contributes +1 to cyclomatic", "Each ?? null-coalescing operator contributes +1 to cyclomatic", "Each ?. null-conditional member access contributes +1 to cyclomatic", "Each && and each || binary logical operator contributes +1 to cyclomatic", "Each ??= null-coalescing assignment operator contributes +1 to cyclomatic", "Non-default pattern switch expression arms each contribute +1 to cyclomatic; the default discard arm _ does not", "cognitive for an empty method is 0", "cognitive adds +1 per structural break (if, switch, loop, catch, ternary) at the outermost nesting level of the method body", "cognitive applies a nesting multiplier: a structural break at nesting depth d adds 1 + d (e.g. an if directly inside a method body at depth 0 adds 1; the same if nested inside another if adds 2)", "cognitive adds +1 for each else or else-if clause that interrupts linear flow", "cognitive adds +1 for each transition between binary logical operator types in a sequence (e.g. a && b || c counts as 2: one && sequence and one || sequence), not +1 per individual operator", "cognitive adds +1 for each direct recursive call to the enclosing method", "loc counts only non-blank, non-comment physical lines inside the method body braces", "loc for void M() {} is 0", "loc for a method containing only return; on one line is 1", "loc excludes lines consisting solely of // single-line comments", "loc excludes lines that fall entirely inside a /* ... */ block comment and contain no executable tokens", "loc excludes the opening and closing brace lines of the method body when those lines contain no tokens other than the brace", "loc for an expression-bodied method int M() => 1; is 1", "params equals the number of formal parameters declared on the method signature", "params for static int M(this string s, int x) (an extension method) is 1, not counting the this parameter", "params for a parameterless method is 0", "Constructors are included in the methods array with method set to TypeFQN.ctor (or equivalent clear convention) and metrics computed as for regular methods", "Property accessors get, set, and init are each included as separate entries with method names using a TypeFQN.PropertyName.get / .set / .init convention", "Local functions declared inside a method body are reported as separate entries with method names scoped to their enclosing method", "Lambda expressions and anonymous methods are NOT reported as separate entries; their complexity is folded into the enclosing named method or accessor", "Abstract method declarations and partial method declarations without bodies produce no entry in methods", "Auto-implemented properties with no explicit accessor body produce no entry in methods", "Source files containing an <auto-generated> header comment are skipped entirely", "Source files with a .g.cs or .Designer.cs suffix are skipped entirely", "typeRollups entries contain type, namespace, methodCount, cyclomaticTotal, cognitiveTotal, locTotal, paramsTotal fields", "typeRollups totals equal the sum of the corresponding per-method metric values for all methods of that type (across all methods, not just filtered ones)", "namespaceRollups entries contain namespace, methodCount, cyclomaticTotal, cognitiveTotal, locTotal, paramsTotal fields", "namespaceRollups totals equal the sum of the typeRollups values for all types in that namespace", "With --threshold 0 (default), every analyzed method appears in the methods array", "With --threshold 5, a method where every metric value is strictly less than 5 is excluded from the methods array", "With --threshold 5, a method where cyclomatic equals exactly 5 is included (>= comparison, not >)", "With --threshold 5, a method where cognitive is 7 but all other metrics are below 5 is included", "--threshold does not affect typeRollups or namespaceRollups totals; rollups are always computed over all analyzed methods regardless of the threshold filter", "--threshold -1 exits with code 1 and a descriptive stderr message stating the threshold must be >= 0; no JSON is written to stdout", "--sort cyclomatic (the default) orders the methods array by cyclomatic descending; ties are broken by method name ascending", "--sort cognitive orders the methods array by cognitive descending; ties are broken by method name ascending", "--sort loc orders the methods array by loc descending; ties are broken by method name ascending", "--sort params orders the methods array by params descending; ties are broken by method name ascending", "--sort with an unrecognized value exits with code 1 and a stderr message listing the accepted values (cyclomatic, cognitive, loc, params); no JSON is written to stdout", "--top 0 (default) does not truncate the methods array", "--top 5 truncates the methods array to at most 5 entries after sorting is applied", "--top N where N exceeds the total method count returns all methods without padding or error", "--top -1 exits with code 1 and a descriptive stderr message; no JSON is written to stdout", "--top truncation does not affect typeRollups or namespaceRollups; rollups still cover all methods", "With no --solution flag and exactly one .sln or .slnx file in the current working directory, the command auto-detects it and proceeds successfully", "With no --solution flag and no .sln or .slnx file in the current working directory, the command exits with code 1 and a stderr message indicating that no solution file was found", "With no --solution flag and multiple .sln or .slnx files in the current working directory, the command exits with code 1 and a stderr message listing the candidate paths", "--solution pointing to a path that does not exist exits with code 1 and a stderr error message; no unhandled exception propagates", "--solution pointing to a file that exists but is not a valid solution exits with code 1 and a stderr error message; no unhandled exception propagates", "Running rt analyze complexity --solution RoslynTools.slnx completes successfully, exits 0, and the JSON output includes at least one entry in methods referencing a method from the RoslynTools source (dogfood)", "A solution that compiles but contains zero method declarations produces a JSON document with empty methods, typeRollups, and namespaceRollups arrays and exits 0", "Async methods (async Task) are analyzed and the await expression does not add to cyclomatic or cognitive beyond the surrounding control structures", "Iterator methods using yield return are analyzed and yield return / yield break do not add to cyclomatic or cognitive beyond surrounding control structures", "--sort and --threshold and --top flags may all be combined in a single invocation and each behaves independently: threshold filters first, sorting is applied to filtered results, then top truncates", "Tests are located under tests/RoslynTools.Tests/ in an Analyze subfolder (or the matching existing analyze test folder convention) and use with_<scenario>_<outcome> naming", "Tests use a real .slnx fixture and do not mock the Roslyn workspace, compilation, or syntax tree APIs", "Test suite includes cases for: empty method cyclomatic baseline, each decision branch type (if, switch case, for, foreach, while, do-while, catch, ternary, ??, ?., &&, ||, ??=, pattern switch arm), extension method param exclusion, threshold filtering (below, equal, above), each sort option, top truncation, auto-detect success / fail / ambiguous, missing solution path", "After implementation, rt dump-help output lists analyze complexity with --threshold, --sort, --top, and --solution flags plus at least one example", "rt analyze complexity --solution RoslynTools.slnx --top 10 exits 0 in under 60 seconds when run against the roslyn-tools solution"], "priority": 1, "passes": true, "notes": "New ComplexityCommand.cs in src/RoslynTools/Commands/. IRtCommand contract: Category=analyze, JsonOutput=true, Mutates=false. Metrics: cyclomatic (decision branches), cognitive (nesting-weighted), LOC (non-blank non-comment lines in body), params (excl. this for extensions). Flags: --threshold 0 (show all, >= filter), --sort cyclomatic|cognitive|loc|params, --top N. JSON output: methods[] + typeRollups[] + namespaceRollups[]. Rollups always cover all methods regardless of threshold/top. Solution auto-detection via existing pattern.", "epicId": ""}, {"id": "US-004", "title": "rt refactor add-dependency: mangles fallback constructors and parameter list formatting", "description": "Injecting into an existing service rewrites the fallback constructor instead of delegating it. Also emits poorly formatted constructor parameter lists.", "acceptanceCriteria": ["Given a target class with a fallback constructor that delegates via `: this(...)` AND a full constructor that already has the dependency parameter and assignment, when `add-dependency` runs, the rewriter exits with status `AlreadyInjected` and reports no changes (Changed == false).", "Given a class with a delegating fallback constructor (`: this(...)`) and a full constructor missing the dependency, when `add-dependency` runs, only the full (non-delegating) constructor receives the new parameter and field assignment; the fallback constructor is left textually unchanged.", "Given a class with multiple chained delegating constructors (`: this(...)`) plus one terminal full constructor, the rewriter modifies only the terminal full constructor and leaves all delegating constructors untouched.", "Existing behaviour preserved: a class with a single constructor that does NOT have `: this(...)` initializer still gets the parameter and assignment added (regression guard for non-delegating ctors).", "Existing behaviour preserved: a class with no constructors istently.", "acceptanceCriteria": ["BuildPreview exists in a single shared location", "PatternMatcher and FindDuplicatesService both delegate to it", "Both private copies are removed", "All existing tests pass"], "priority": 30, "passes": true, "notes": "P3. Duplication: src/RoslynTools/Core/PatternMatcher.cs:293 and src/RoslynTools/Services/FindDuplicatesService.cs:416. find-duplicates GRP-3-74806dae.", "epicId": "EP-005"}, {"id": "US-031", "title": "rt: replace-new argument-reshaping — drop matched arg, keep remaining args", "description": "As a developer dogfooding rt, I want replace-new to support argument reshaping so that I can replace new Option<string?>(\"--solution\", helpText) with Factory.CreateSolutionOption(helpText) in one command.", "acceptanceCriteria": ["rt refactor replace-new --with accepts a template syntax (e.g. --with \"Factory.X({arg1})\") that maps constructor argument positions to factory call arguments", "When --if-arg 0 --if-arg-literal \"--solution\" is used, the matched first arg is dropped and remaining args are passed to the replacement method", "Dry-run output shows the reshaped call correctly", "The feature handles the common single-remaining-arg case: new Foo(\"lit\", help) -> Factory.Method(help)"], "priority": 31, "passes": true, "notes": "P2. Discovered during US-026 EP-005 planning. rt gap prevents dogfooding replace-new for option factory standardisation pattern. Manual edit fallback was used for US-026.", "epicId": ""}, {"id": "US-032", "title": "rt analyze solid: SRP detector — flag classes with high method/dependency count", "description": "As a developer, I want rt analyze solid --principle SRP to flag classes likely violating SRP so that I can identify candidates for decomposition.", "acceptanceCriteria": ["rt analyze solid --principle SRP --solution <sln> exits 0 and emits JSON to stdout", "Output has a top-level 'SRP' key containing an array of violation items", "Each item includes: TypeName, FilePath, Line, PublicMethod e", "The [workspace-warnings] block does not appear in normal output"], "priority": 40, "passes": true, "notes": "P2. Affects WorkspaceLoader / MSBuildWorkspace diagnostic handling. Suppress all MSBuildWorkspace diagnostics by default; add --show-workspace-warnings global flag to restore them. Genuine load errors (exit 1) must still surface.", "epicId": ""}, {"id": "US-041", "title": "Convert solution-not-found crash to clean exit-1 error message", "description": "As a developer using rt, I want a missing solution file to produce a clear error message and exit 1, not an unhandled FileNotFoundException stack trace.", "acceptanceCriteria": ["When the --solution path does not exist, rt prints a single error line to stderr (e.g. 'Error: solution not found: <path>') and exits 1 — no stack trace", "The same clean exit-1 pattern applies to any FileNotFoundException thrown during solution loading", "The UseExceptionHandler in App.cs (or equivalent top-level handler) catches FileNotFoundException and formats it as a user-facing error", "Exit code is 1 (not 0, not unhandled crash code)", "No stack trace or 'Unhandled exception:' prefix appears in output"], "priority": 41, "passes": true, "notes": "P1. WorkspaceLoader.cs:84 throws FileNotFoundException; it propagates unhandled through the System.CommandLine pipeline. Catch at the top-level UseExceptionHandler in App.cs (or at the throw site) and emit a single stderr line. No stack trace in normal output.", "epicId": ""}, {"id": "US-042", "title": "Catch common exception types in UseExceptionHandler and emit clean exit-1 messages", "description": "As a developer using rt, I want routine exceptions (bad file, bad JSON, not-found) to produce a single clean error line to stderr, not an unhandled exception stack trace.", "acceptanceCriteria": ["UseExceptionHandler in App.cs catches FileNotFoundException, IOException, InvalidOperationException, JsonException, and YamlException and emits a single 'Error: <message>' line to stderr with exit code 1", "No stack trace or 'Unhandled exception:' prefix appears for these exception types", "Exceptions from DecisionStore.Load/Save (FileNotFoundException, YamlException, IOException) are handled the same way", "Exceptions from AddXmlDocCommand JSON file loading are handled the same way", "Unexpected exceptions (not in the list above) still surface as unhandled so they are visible during development"], "priority": 42, "passes": true, "notes": "P1. App.cs UseExceptionHandler currently does not catch typed exceptions. Catch: FileNotFoundException, IOException, InvalidOperationException, JsonException, YamlException. Format as 'Error: <ex.Message>' to stderr, exit 1. Covers: WorkspaceLoader throws beyond the missing-solution case (US-041), DecisionStore.Load/Save, AddXmlDocCommand JSON load, MigrateToIOptionsService.", "epicId": ""}, {"id": "US-043", "title": "Replace Environment.Exit(1) in OutlineCommand with context.ExitCode = 1", "description": "As a developer, I want OutlineCommand to exit consistently with all other commands so that graceful cleanup runs on error.", "acceptanceCriteria": ["OutlineCommand no longer calls Environment.Exit(1) for any error condition", "Error cases in OutlineCommand set context.ExitCode = 1 and return, consistent with all other commands", "Process exit allows graceful cleanup (log flushing, disposables) to run"], "priority": 43, "passes": true, "notes": "P2. OutlineCommand.cs line ~90 calls Environment.Exit(1). Replace with context.ExitCode = 1; return; — same pattern as every other command in the codebase.", "epicId": ""}, {"id": "US-044", "title": "Guard .First()/.Last() calls in SymbolLocator and MethodExtractor against empty sequences", "description": "As a developer using rt, I want empty-sequence edge cases to produce a clear error rather than an InvalidOperationException crash.", "acceptanceCriteria": ["No .First() or .Last() call in SymbolLocator or MethodExtractor throws InvalidOperationException when the sequence is empty", "Each call site uses FirstOrDefault with a null check, or validates the collection is non-empty before calling First/Last", "When an expected symbol or statement is not found, the command emits a descriptive error to stderr and exits 1 rather than crashing"], "priority": 44, "passes": true, "notes": "P2. SymbolLocator.cs lines ~49, 96, 135, 188 and MethodExtractor.cs lines ~57, 164, 168, 378, 501, 529-532 call .First()/.Last() on sequences that could be empty under certain inputs. Replace with FirstOrDefault + null check or add pre-call validation.", "epicId": ""}], "sourceUrl": "prd.json"}];

  <script>
    const e = React.createElement;

    function normalizeStory(story) {
      const acceptance = Array.isArray(story && story.acceptanceCriteria) ? story.acceptanceCriteria : [];
      return {
        id: String(story && story.id || ""),
        title: String(story && story.title || ""),
        description: String(story && story.description || ""),
        acceptanceCriteria: acceptance.map((item) => String(item)),
        priority: Number(story && story.priority || 9999),
        passes: Boolean(story && story.passes),
        notes: String(story && story.notes || ""),
        epicId: String(story && story.epicId || "")
      };
    }

    function normalizeEpic(epic) {
      return {
        id: String(epic && epic.id || ""),
        title: String(epic && epic.title || ""),
        description: String(epic && epic.description || ""),
        notes: String(epic && epic.notes || "")
      };
    }

    function normalizeProject(raw, fallback) {
      const stories = Array.isArray(raw && raw.userStories) ? raw.userStories.map(normalizeStory) : [];
      const epics = Array.isArray(raw && raw.epics) ? raw.epics.map(normalizeEpic) : [];
      const sortedStories = stories.slice().sort((left, right) => {
        if (left.passes !== right.passes) return left.passes ? 1 : -1;
        if (left.priority !== right.priority) return left.priority - right.priority;
        return left.id.localeCompare(right.id);
      });
      const total = sortedStories.length;
      const complete = sortedStories.filter((story) => story.passes).length;
      const pending = total - complete;
      return {
        project: String(raw && raw.project || fallback.project || "PRD"),
        branchName: String(raw && raw.branchName || fallback.branchName || ""),
        description: String(raw && raw.description || fallback.description || ""),
        path: fallback.path || "",
        sourceUrl: fallback.sourceUrl || "",
        stats: {
          total: total,
          complete: complete,
          pending: pending,
          completionPct: total ? Math.round((complete / total) * 100) : 0
        },
        epics: epics,
        stories: sortedStories
      };
    }

    function escapeHtml(value) {
      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");
    }

    function renderInlineMarkdown(text) {
      let value = escapeHtml(text);
      value = value.replace(/`([^`]+)`/g, "<code>$1</code>");
      value = value.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
      value = value.replace(/\*([^*]+)\*/g, "<em>$1</em>");
      return value;
    }

    function renderMarkdown(text) {
      const value = String(text || "").replace(/\r\n/g, "\n").trim();
      if (!value) return "";

      const lines = value.split("\n");
      const parts = [];
      let inList = false;

      function closeList() {
        if (inList) {
          parts.push("</ul>");
          inList = false;
        }
      }

      for (const rawLine of lines) {
        const line = rawLine.trim();
        if (!line) {
          closeList();
          continue;
        }

        if (line.startsWith("- ") || line.startsWith("* ")) {
          if (!inList) {
            parts.push("<ul>");
            inList = true;
          }
          parts.push("<li>" + renderInlineMarkdown(line.slice(2).trim()) + "</li>");
          continue;
        }

        closeList();

        if (line.startsWith("### ")) {
          parts.push("<h5>" + renderInlineMarkdown(line.slice(4)) + "</h5>");
        } else if (line.startsWith("## ")) {
          parts.push("<h4>" + renderInlineMarkdown(line.slice(3)) + "</h4>");
        } else if (line.startsWith("# ")) {
          parts.push("<h3>" + renderInlineMarkdown(line.slice(2)) + "</h3>");
        } else {
          parts.push("<p>" + renderInlineMarkdown(line) + "</p>");
        }
      }

      closeList();
      return parts.join("");
    }

    function MarkdownBlock(props) {
      return e("div", {
        className: props.className || "markdown",
        dangerouslySetInnerHTML: { __html: renderMarkdown(props.text) }
      });
    }

    function renderSpecMarkdown(text) {
      if (typeof marked === "undefined") {
        return renderMarkdown(text);
      }
      return marked.parse(String(text || ""), { gfm: true, breaks: false });
    }

    function DetailsPane(props) {

    function setCookie(name, value) {
      const maxAge = 60 * 60 * 24 * 365;
      document.cookie = name + "=" + encodeURIComponent(value) + "; path=/; max-age=" + maxAge + "; SameSite=Lax";
    }

    function getCookie(name) {
      const prefix = name + "=";
      const parts = document.cookie ? document.cookie.split("; ") : [];
      for (const part of parts) {
        if (part.startsWith(prefix)) {
          return decodeURIComponent(part.slice(prefix.length));
        }
      }
      return "";
    }

    function loadState() {
      try {
        const raw = window.localStorage.getItem(STORAGE_KEY);
        if (!raw) return { ...DEFAULT_STATE };
        const parsed = JSON.parse(raw);
        return {
          theme: typeof parsed.theme === "string" ? parsed.theme : DEFAULT_STATE.theme,
          col1Pct: typeof parsed.col1Pct === "number" ? parsed.col1Pct : DEFAULT_STATE.col1Pct,
          col2Pct: typeof parsed.col2Pct === "number" ? parsed.col2Pct : DEFAULT_STATE.col2Pct
        };
      } catch (err) {
        return { ...DEFAULT_STATE };

    function clampPct(value, min, max) {
      if (!Number.isFinite(value)) return min;
      if (value < min) return min;
      if (value > max) return max;

    function PrdPicker(props) {
      const ref = React.useRef(null);

      React.useEffect(() => {
        if (!props.open) return undefined;
        function onDocClick(ev) {
          if (ref.current && !ref.current.contains(ev.target)) {
            props.onClose();
          }
        }
        function onKey(ev) {
          if (ev.key === "Escape") props.onClose();
        }
        window.addEventListener("mousedown", onDocClick);
        window.addEventListener("keydown", onKey);
        return () => {
          window.removeEventListener("mousedown", onDocClick);
          window.removeEventListener("keydown", onKey);

      const visibleOptions = React.useMemo(() => {

    function App() {
      const SERVER_MODE = Boolean(window.__PRD_SERVER__);

      const [projectIndex, setProjectIndex] = React.useState(0);
      const [query, setQuery] = React.useState("");
      const [statusFilter, setStatusFilter] = React.useState("all");
      const [urgencyFilter, setUrgencyFilter] = React.useState("all");
      const [epicFilter, setEpicFilter] = React.useState("all");
      const [syncStatus, setSyncStatus] = React.useState("");
      const [syncError, setSyncError] = React.useState(false);
      const [theme, setTheme] = React.useState(initialState.theme);
      const [scanFiles, setScanFiles] = React.useState([]);
      const [pickerOpen, setPickerOpen] = React.useState(false);
      const [hideCompleted, setHideCompleted] = React.useState(
        SERVER_MODE ? getCookie(COOKIE_HIDE_COMPLETED) !== "false" : true
      );
      const [activePath, setActivePath] = React.useState(() => {
        if (!SERVER_MODE) return "";
        const fromCookie = getCookie(COOKIE_LAST_PRD);
        if (fromCookie) return fromCookie;
        return (initialProjects[0] && initialProjects[0].path) || "";
      });
      const [selectedStoryId, setSelectedStoryId] = React.useState(() => {
        if (SERVER_MODE) {
          try {
            const raw = getCookie(COOKIE_LAST_SELECTION);
            const initialPath = (initialProjects[0] && initialProjects[0].path) || "";
            const cookiePath = getCookie(COOKIE_LAST_PRD) || initialPath;
            if (raw) {
              const parsed = JSON.parse(raw);
              if (parsed && parsed.path === cookiePath && parsed.storyId) {
                return parsed.storyId;
              }
            }
          } catch (e) { /* ignore */ }
        }
        return initialProjects[0] && initialProjects[0].stories[0] ? initialProjects[0].stories[0].id : "";
      });

      const gridRef = React.useRef(null);
      const layoutRef = React.useRef({ col1Pct: initialState.col1Pct, col2Pct: initialState.col2Pct });

      const applyLayout = React.useCallback(() => {
        const el = gridRef.current;
        if (!el) return;
        const { col1Pct, col2Pct } = layoutRef.current;
        el.style.setProperty("--col-1", col1Pct + "%");
        el.style.setProperty("--col-2", col2Pct + "%");
      }, []);

      React.useEffect(() => {
        document.body.setAttribute("data-theme", theme);
      }, [theme]);

      React.useEffect(() => {
        applyLayout();
      }, [applyLayout]);

      const persist = React.useCallback((patch) => {
        const current = loadState();
        saveState({ ...current, ...patch });
      }, []);

      const handleThemeChange = React.useCallback((value) => {
        setTheme(value);
        persist({ theme: value });
      }, [persist]);

      const beginDrag = React.useCallback((which) => (event) => {
        const grid = gridRef.current;
        if (!grid) return;
        event.preventDefault();
        event.target.setPointerCapture(event.pointerId);
        event.target.classList.add("dragging");

        const rect = grid.getBoundingClientRect();
        const width = rect.width;
        const startX = event.clientX;
        const start = { ...layoutRef.current };
        const MIN = 12;
        const MAX_SUM = 80;

        function onMove(ev) {
          const deltaPct = ((ev.clientX - startX) / width) * 100;
          if (which === 1) {
            const next = clampPct(start.col1Pct + deltaPct, MIN, MAX_SUM - start.col2Pct);
            layoutRef.current = { ...layoutRef.current, col1Pct: next };
          } else {
            const next = clampPct(start.col2Pct + deltaPct, MIN, MAX_SUM - start.col1Pct);
            layoutRef.current = { ...layoutRef.current, col2Pct: next };
          }
          applyLayout();
        }

        function onUp(ev) {
          event.target.classList.remove("dragging");
          try { event.target.releasePointerCapture(event.pointerId); } catch (e) {}
          window.removeEventListener("pointermove", onMove);
          window.removeEventListener("pointerup", onUp);
          persist({ col1Pct: layoutRef.current.col1Pct, col2Pct: layoutRef.current.col2Pct });
        }

        window.addEventListener("pointermove", onMove);
        window.addEventListener("pointerup", onUp);
      }, [applyLayout, persist]);

      const project = projects[projectIndex] || null;

      React.useEffect(() => {
        if (SERVER_MODE) return undefined;
        const refreshSeconds = Number(window.__PRD_REFRESH_SECONDS__ || 0);
        if (!refreshSeconds || !initialProjects.length) {
          return undefined;
        }

        let cancelled = false;

        async function refreshProjects() {
          try {
            const refreshed = await Promise.all(initialProjects.map(async (item) => {
              if (!item.sourceUrl) {
                return item;
              }

              const response = await fetch(item.sourceUrl + "?t=" + Date.now(), { cache: "no-store" });
              if (!response.ok) {
                throw new Error("HTTP " + response.status);
              }

              const raw = await response.json();
              return normalizeProject(raw, item);
            }));

            if (!cancelled) {
              setProjects(refreshed);
              setSyncStatus("Auto-refreshed " + new Date().toLocaleTimeString());
              setSyncError(false);
            }
          } catch (error) {
            if (!cancelled) {
              setSyncStatus("Auto-refresh unavailable in this browser context");
              setSyncError(true);
            }
          }
        }

        refreshProjects();
        const timer = window.setInterval(refreshProjects, refreshSeconds * 1000);
        return () => {
          cancelled = true;
          window.clearInterval(timer);
        };
      }, []);

      // SERVER MODE: scan for prd.json files for the picker.
      React.useEffect(() => {
        if (!SERVER_MODE) return undefined;
        let cancelled = false;
        async function doScan() {
          try {
            const url = SCAN_ROOT
              ? "/api/scan?root=" + encodeURIComponent(SCAN_ROOT) + "&t=" + Date.now()
              : "/api/scan?t=" + Date.now();
            const r = await fetch(url, { cache: "no-store" });
            if (!r.ok) {
              const err = await r.json().catch(() => ({}));
              throw new Error(err.error || ("HTTP " + r.status));
            }
            const data = await r.json();
            if (!cancelled) setScanFiles(data.files || []);
          } catch (err) {
            if (!cancelled) {
              setSyncStatus("Scan failed: " + (err.message || "unknown"));
              setSyncError(true);
            }
          }
        }
        doScan();
        const baseInterval = Number(window.__PRD_REFRESH_SECONDS__ || 0) || 30;
        const timer = window.setInterval(doScan, Math.max(baseInterval, 10) * 1000);
        return () => {
          cancelled = true;
          window.clearInterval(timer);
        };
      }, []);

      // SERVER MODE: load PRD + linked docs whenever activePath changes.
      React.useEffect(() => {
        if (!SERVER_MODE || !activePath) return undefined;
        let cancelled = false;
        async function load() {
          try {
            const [prdRes, docsRes] = await Promise.all([
              fetch("/api/prd?path=" + encodeURIComponent(activePath) + "&t=" + Date.now(), { cache: "no-store" }),
              fetch("/api/linked-docs?path=" + encodeURIComponent(activePath) + "&t=" + Date.now(), { cache: "no-store" })
            ]);
            if (!prdRes.ok) {
              const err = await prdRes.json().catch(() => ({}));
              throw new Error(err.error || ("HTTP " + prdRes.status));
            }
            const raw = await prdRes.json();
            // /api/prd returns the already-normalized payload (key: stories, not userStories);
            // pass through unchanged, only filling fields the layer below expects.
            const normalized = {
              ...raw,
              path: raw.path || activePath,
              sourceUrl: "",
              stories: Array.isArray(raw.stories) ? raw.stories : [],
              epics: Array.isArray(raw.epics) ? raw.epics : [],
              stats: raw.stats || { total: 0, complete: 0, pending: 0, completionPct: 0 }
            };
            if (docsRes.ok) {
              const docsData = await docsRes.json();
              window.__PRD_LINKED_DOCS__ = window.__PRD_LINKED_DOCS__ || {};
              window.__PRD_LINKED_DOCS__[normalized.path] = docsData.docs || {};
            }
            if (!cancelled) {
              setProjects([normalized]);
              setProjectIndex(0);
              setSyncStatus("Loaded " + new Date().toLocaleTimeString());
              setSyncError(false);
              setSelectedStoryId((current) => {
                if (current && normalized.stories.some((s) => s.id === current)) return current;
                try {
                  const rawSel = getCookie(COOKIE_LAST_SELECTION);
                  if (rawSel) {
                    const parsed = JSON.parse(rawSel);
                    if (parsed && parsed.path === activePath && parsed.storyId &&
                        normalized.stories.some((s) => s.id === parsed.storyId)) {
                      return parsed.storyId;
                    }
                  }
                } catch (e) { /* ignore */ }
                return normalized.stories[0] ? normalized.stories[0].id : "";
              });
              setCookie(COOKIE_LAST_PRD, activePath);
            }
          } catch (err) {
            if (!cancelled) {
              setSyncStatus("Load failed: " + (err.message || "unknown"));
              setSyncError(true);
            }
          }
        }
        load();
        return () => { cancelled = true; };
      }, [activePath]);

      // SERVER MODE: periodic refresh of the active PRD's data (no doc refetch).
      React.useEffect(() => {
        if (!SERVER_MODE || !activePath) return undefined;
        const refreshSeconds = Number(window.__PRD_REFRESH_SECONDS__ || 0);
        if (!refreshSeconds) return undefined;
        let cancelled = false;
        async function tick() {
          try {
            const r = await fetch(
              "/api/prd?path=" + encodeURIComponent(activePath) + "&t=" + Date.now(),
              { cache: "no-store" }
            );
            if (!r.ok) {
              const err = await r.json().catch(() => ({}));
              throw new Error(err.error || ("HTTP " + r.status));
            }
            const raw = await r.json();
            const normalized = {
              ...raw,
              path: raw.path || activePath,
              sourceUrl: "",
              stories: Array.isArray(raw.stories) ? raw.stories : [],
              epics: Array.isArray(raw.epics) ? raw.epics : [],
              stats: raw.stats || { total: 0, complete: 0, pending: 0, completionPct: 0 }
            };
            if (!cancelled) {
              setProjects([normalized]);
              setSyncStatus("Auto-refreshed " + new Date().toLocaleTimeString());
              setSyncError(false);
            }
          } catch (err) {
            if (!cancelled) {
              setSyncStatus("Auto-refresh failed: " + (err.message || "unknown"));
              setSyncError(true);
            }
          }
        }
        const timer = window.setInterval(tick, refreshSeconds * 1000);
        return () => { cancelled = true; window.clearInterval(timer); };
      }, [activePath]);

      // SERVER MODE: persist hide-completed + selected story per PRD.
      React.useEffect(() => {
        if (!SERVER_MODE) return;
        setCookie(COOKIE_HIDE_COMPLETED, hideCompleted ? "true" : "false");
      }, [hideCompleted]);

      React.useEffect(() => {
        if (!SERVER_MODE || !activePath || !selectedStoryId) return;
        setCookie(COOKIE_LAST_SELECTION, JSON.stringify({ path: activePath, storyId: selectedStoryId }));
      }, [activePath, selectedStoryId]);

      // SERVER MODE: close picker after selection.
      React.useEffect(() => {
        if (SERVER_MODE) setPickerOpen(false);
      }, [activePath]);

      React.useEffect(() => {
        if (!project) return;
        const stories = project.stories || [];
        if (!stories.length) {
          setSelectedStoryId("");
          return;
        }
        if (!stories.some((story) => story.id === selectedStoryId)) {
          setSelectedStoryId(stories[0].id);
        }
      }, [projectIndex]);

      const filteredStories = React.useMemo(() => {
        if (!project) return [];
        const normalized = query.trim().toLowerCase();
        const epic = (epicFilter || "all").toUpperCase();
        return project.stories.filter((story) => {
          const matchesEpic =
            epic === "ALL" ||
            (story.epicId || "").toUpperCase() === epic;
          const matchesStatus =
            statusFilter === "all" ||
            (statusFilter === "complete" && story.passes) ||
            (statusFilter === "pending" && !story.passes);
          const matchesUrgency =
            urgencyFilter === "all" ||
            (urgencyFilter === "high" && story.priority <= 5) ||
            (urgencyFilter === "medium" && story.priority > 5 && story.priority <= 10) ||
            (urgencyFilter === "low" && story.priority > 10);
          if (!matchesEpic || !matchesStatus || !matchesUrgency) return false;
          const haystack = [
            story.id,
            story.title,
            story.description,
            story.notes,
            ...story.acceptanceCriteria
          ].join("\n").toLowerCase();
          return !normalized || haystack.includes(normalized);
        });
      }, [project, query, statusFilter, urgencyFilter, epicFilter]);

      const selectedStory =
        filteredStories.find((story) => story.id === selectedStoryId) ||
        (filteredStories.length ? filteredStories[0] : null);

      React.useEffect(() => {
        if (selectedStory && selectedStory.id !== selectedStoryId) {
          setSelectedStoryId(selectedStory.id);
        }
      }, [selectedStory ? selectedStory.id : ""]);

      if (!project) {
        return e("div", { className: "app" },
          e("div", { className: "shell" },
            e("h1", null, "PRD Visualization"),
            e("p", { className: "subtitle" }, "No PRD data loaded.")
          )
        );
      }

      return e("div", { className: "app" },
        e("div", { className: "shell" },
          e("div", { className: "top-bar" },
            SERVER_MODE
              ? e(PrdPicker, {
                  options: scanFiles,
                  activePath: activePath,
                  open: pickerOpen,
                  hideCompleted: hideCompleted,
                  scanRoot: SCAN_ROOT,
                  onToggle: () => setPickerOpen((cur) => !cur),
                  onClose: () => setPickerOpen(false),
                  onSelect: (path) => {
                    if (path !== activePath) {
                      setActivePath(path);
                      setQuery("");
                      setStatusFilter("all");
                      setUrgencyFilter("all");
                      setEpicFilter("all");
                    }
                    setPickerOpen(false);
                  },
                  onToggleHideCompleted: setHideCompleted
                })
              : (projects.length > 1 ? e("div", { className: "project-tabs" },
                  projects.map((item, index) =>
                    e("button", {
                      key: item.path,
                      className: "project-tab" + (index === projectIndex ? " active" : ""),
                      onClick: () => {
                        setProjectIndex(index);
                        setQuery("");
                        setStatusFilter("all");
                        setUrgencyFilter("all");
                        setEpicFilter("all");
                        setSelectedStoryId(item.stories[0] ? item.stories[0].id : "");
                      }
                    }, item.project)
                  )
                ) : e("div", null)),
            e("label", { className: "theme-picker" },
              e("span", { className: "theme-picker-label" }, "Theme"),
              e("select", {
                className: "theme-select",
                value: theme,
                onChange: (ev) => handleThemeChange(ev.target.value)
              },
                THEMES.map((t) => e("option", { key: t.id, value: t.id }, t.label))
              )
            )
          ),
          syncStatus ? e("div", { className: "sync-status" + (syncError ? " error" : "") }, syncStatus) : null,
          e("div", { className: "main-grid", ref: gridRef },
            e("aside", { className: "sidebar" },
              e(StoryListPane, {
                project: project,
                query: query,
                statusFilter: statusFilter,
                urgencyFilter: urgencyFilter,
                epicFilter: epicFilter,
                filteredStories: filteredStories,
                selectedStory: selectedStory,
                onQueryChange: setQuery,
                onStatusFilterChange: setStatusFilter,
                onUrgencyFilterChange: setUrgencyFilter,
                onEpicFilterChange: setEpicFilter,
                onSelectStory: setSelectedStoryId
              })
            ),
            e("div", { className: "resizer resizer-1", onPointerDown: beginDrag(1), title: "Drag to resize" }),
            e("section", { className: "summary-pane" },
              e(SummaryPane, { project: project, story: selectedStory })
            ),
            e("div", { className: "resizer resizer-2", onPointerDown: beginDrag(2), title: "Drag to resize" }),
            e("section", { className: "details" },
              e(DetailsPane, { project: project, story: selectedStory })
            )
          ),
          e("div", { className: "mobile-accordion" },
            e("details", { className: "mobile-panel", open: true },
              e("summary", null, "Tickets"),
              e("div", { className: "mobile-panel-body" },
                e("div", { className: "sidebar" },
                  e(StoryListPane, {
                    project: project,
                    query: query,
                    statusFilter: statusFilter,
                    urgencyFilter: urgencyFilter,
                    epicFilter: epicFilter,
                    filteredStories: filteredStories,
                    selectedStory: selectedStory,
                    onQueryChange: setQuery,
                    onStatusFilterChange: setStatusFilter,
                    onUrgencyFilterChange: setUrgencyFilter,
                    onEpicFilterChange: setEpicFilter,
                    onSelectStory: setSelectedStoryId
                  })
                )
              )
            ),
            e("details", { className: "mobile-panel", open: true },
              e("summary", null, "Description"),
              e("div", { className: "mobile-panel-body" },
                e("div", { className: "summary-pane" },
                  e(SummaryPane, { project: project, story: selectedStory })
                )
              )
            ),
            e("details", { className: "mobile-panel" },
              e("summary", null, "Details"),
              e("div", { className: "mobile-panel-body" },
                e("div", { className: "details" },
                  e(DetailsPane, { project: project, story: selectedStory })
                )
              )
            )
          )
        )
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(e(App));
  </script>
</body>
</html>

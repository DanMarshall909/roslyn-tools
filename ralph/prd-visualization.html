                  projects.map((item, index) =>
                    e("button", {
                      key: item.path,
                      className: "project-tab" + (index === projectIndex ? " active" : ""),
                      onClick: () => {
                        setProjectIndex(index);
                        setQuery("");
                        setStatusFilter("all");
                        setUrgencyFilter("all");
                        setEpicFilter("all");
                        setSelectedStoryId(item.stories[0] ? item.stories[0].id : "");
                      }
                    }, item.project)
                  )
                ) : e("div", null)),
            e("label", { className: "theme-picker" },
              e("span", { className: "theme-picker-label" }, "Theme"),
              e("select", {
                className: "theme-select",
                value: theme,
                onChange: (ev) => handleThemeChange(ev.target.value)
              },
                THEMES.map((t) => e("option", { key: t.id, value: t.id }, t.label))
              )
            )
          ),
          syncStatus ? e("div", { className: "sync-status" + (syncError ? " error" : "") }, syncStatus) : null,
          e("div", { className: "main-grid", ref: gridRef },
            e("aside", { className: "sidebar" },
              e(StoryListPane, {
                project: project,
                query: query,
                statusFilter: statusFilter,
                urgencyFilter: urgencyFilter,
                epicFilter: epicFilter,
                filteredStories: filteredStories,
                selectedStory: selectedStory,
                onQueryChange: setQuery,
                onStatusFilterChange: setStatusFilter,
                onUrgencyFilterChange: setUrgencyFilter,
                onEpicFilterChange: setEpicFilter,
                onSelectStory: setSelectedStoryId
              })
            ),
            e("div", { className: "resizer resizer-1", onPointerDown: beginDrag(1), title: "Drag to resize" }),
            e("section", { className: "summary-pane" },
              e(SummaryPane, { project: project, story: selectedStory })
            ),
            e("div", { className: "resizer resizer-2", onPointerDown: beginDrag(2), title: "Drag to resize" }),
            e("section", { className: "details" },
              e(DetailsPane, { project: project, story: selectedStory })
            )
          ),
          e("div", { className: "mobile-accordion" },
            e("details", { className: "mobile-panel", open: true },
              e("summary", null, "Tickets"),
              e("div", { className: "mobile-panel-body" },
                e("div", { className: "sidebar" },
                  e(StoryListPane, {
                    project: project,
                    query: query,
                    statusFilter: statusFilter,
                    urgencyFilter: urgencyFilter,
                    epicFilter: epicFilter,
                    filteredStories: filteredStories,
                    selectedStory: selectedStory,
                    onQueryChange: setQuery,
                    onStatusFilterChange: setStatusFilter,
                    onUrgencyFilterChange: setUrgencyFilter,
                    onEpicFilterChange: setEpicFilter,
                    onSelectStory: setSelectedStoryId
                  })
                )
              )
            ),
            e("details", { className: "mobile-panel", open: true },
              e("summary", null, "Description"),
              e("div", { className: "mobile-panel-body" },
                e("div", { className: "summary-pane" },
                  e(SummaryPane, { project: project, story: selectedStory })
                )
              )
            ),
            e("details", { className: "mobile-panel" },
              e("summary", null, "Details"),
              e("div", { className: "mobile-panel-body" },
                e("div", { className: "details" },
                  e(DetailsPane, { project: project, story: selectedStory })
                )
              )
            )
          )
        )
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(e(App));
  </script>
</body>
</html>

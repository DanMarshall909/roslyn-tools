<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PRD Visualization</title>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    :root, [data-theme="cream"] {
      --bg: #ece4d4;
      --panel: #fffdf7;
      --panel-2: #f8f1e6;
      --ink: #1d2433;
      --muted: #687387;
      --line: #d7cdbb;
      --accent: #0f766e;
      --accent-soft: #d8f0ec;
      --warn: #9a3412;
      --warn-soft: #ffedd5;
      --done: #166534;
      --done-soft: #dcfce7;
      --shadow: 0 20px 50px rgba(74, 59, 34, 0.12);
      --radius: 22px;
      --body-bg: radial-gradient(circle at top left, #fff8ea 0, transparent 28%), linear-gradient(180deg, #f3ecdf 0%, #e9dfcd 100%);
      --shell-bg: rgba(255, 253, 247, 0.7);
      --shell-border: rgba(215, 205, 187, 0.8);
      --card-bg: #ffffff;
      --card-bg-hover: #fffaf0;
      --card-bg-active: #fff6e8;
      --card-border-hover: #b9a88c;
      --card-border-active: #c89e58;
      --card-shadow-active: rgba(200, 158, 88, 0.22);
      --pill-bg: #f7efe2;
      --pill-priority-bg: #f8efe1;
      --pill-epic-bg: #e8ddf3;
      --pill-epic-fg: #5b3a8c;
      --pill-epic-border: #c9b6e0;
      --pill-pending-border: #f3c89d;
      --pill-complete-border: #b7e4c7;
      --epic-bar-bg: #fcf7ee;
      --acceptance-bg: #fcf7ee;
      --code-bg: #f1eadf;
      --summary-bg: linear-gradient(180deg, #fffdf7 0%, #faf4e8 100%);
      --sidebar-top-bg: linear-gradient(180deg, #fffdf7 0%, #faf4e8 100%);
      --mobile-panel-bg: linear-gradient(180deg, #fffdf7 0%, #faf4e8 100%);
      --mobile-summary-bg: #fffaf0;
      --mobile-panel-body-bg: #ffffff;
      --font-family: Georgia, "Times New Roman", serif;
      --resizer-color: rgba(215, 205, 187, 0.6);
      --resizer-color-hover: #c89e58;
    }
    [data-theme="dark"] {
      --bg: #0f1419;
      --panel: #1a2028;
      --panel-2: #232b36;
      --ink: #e6edf3;
      --muted: #8b949e;
      --line: #30363d;
      --accent: #58a6ff;
      --accent-soft: #1f2d43;
      --warn: #f0883e;
      --warn-soft: #3a220f;
      --done: #3fb950;
      --done-soft: #0f2e19;
      --shadow: 0 20px 50px rgba(0, 0, 0, 0.45);
      --radius: 22px;
      --body-bg: radial-gradient(circle at top left, #1a2430 0, transparent 30%), linear-gradient(180deg, #0d1117 0%, #161b22 100%);
      --shell-bg: rgba(26, 32, 40, 0.7);
      --shell-border: rgba(48, 54, 61, 0.8);
      --card-bg: #161b22;
      --card-bg-hover: #1c232c;
      --card-bg-active: #22303f;
      --card-border-hover: #444c56;
      --card-border-active: #58a6ff;
      --card-shadow-active: rgba(88, 166, 255, 0.22);
      --pill-bg: #22272e;
      --pill-priority-bg: #2a2e37;
      --pill-epic-bg: #2d2640;
      --pill-epic-fg: #c9a9ff;
      --pill-epic-border: #3d345a;
      --pill-pending-border: #3a220f;
      --pill-complete-border: #0f2e19;
      --epic-bar-bg: #161b22;
      --acceptance-bg: #161b22;
      --code-bg: #0d1117;
      --summary-bg: linear-gradient(180deg, #1a2028 0%, #141920 100%);
      --sidebar-top-bg: linear-gradient(180deg, #1a2028 0%, #141920 100%);
      --mobile-panel-bg: linear-gradient(180deg, #1a2028 0%, #141920 100%);
      --mobile-summary-bg: #1c232c;
      --mobile-panel-body-bg: #161b22;
      --font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --resizer-color: rgba(48, 54, 61, 0.8);
      --resizer-color-hover: #58a6ff;
    }
    [data-theme="paper"] {
      --bg: #f5f5f5;
      --panel: #ffffff;
      --panel-2: #fafafa;
      --ink: #111111;
      --muted: #666666;
      --line: #e0e0e0;
      --accent: #1a73e8;
      --accent-soft: #e8f0fe;
      --warn: #c5221f;
      --warn-soft: #fce8e6;
      --done: #137333;
      --done-soft: #e6f4ea;
      --shadow: 0 4px 14px rgba(0, 0, 0, 0.08);
      --radius: 10px;
      --body-bg: #f5f5f5;
      --shell-bg: #ffffff;
      --shell-border: #e0e0e0;
      --card-bg: #ffffff;
      --card-bg-hover: #f7f7f7;
      --card-bg-active: #e8f0fe;
      --card-border-hover: #bdbdbd;
      --card-border-active: #1a73e8;
      --card-shadow-active: rgba(26, 115, 232, 0.18);
      --pill-bg: #f0f0f0;
      --pill-priority-bg: #f0f0f0;
      --pill-epic-bg: #f3e8fd;
      --pill-epic-fg: #6b3fa0;
      --pill-epic-border: #d6c3ef;
      --pill-pending-border: #f9c7c5;
      --pill-complete-border: #b7e1c0;
      --epic-bar-bg: #fafafa;
      --acceptance-bg: #fafafa;
      --code-bg: #f0f0f0;
      --summary-bg: #ffffff;
      --sidebar-top-bg: #ffffff;
      --mobile-panel-bg: #ffffff;
      --mobile-summary-bg: #fafafa;
      --mobile-panel-body-bg: #ffffff;
      --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --resizer-color: #e0e0e0;
      --resizer-color-hover: #1a73e8;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; overflow: hidden; }
    body {
      margin: 0;
      color: var(--ink);
      background: var(--body-bg);
      font-family: var(--font-family);
    }
    #root { height: 100%; }
    .app {
      height: 100vh;
      margin: 0 auto;
      padding: 16px;
      max-width: none;
    }
    .shell {
      height: 100%;
      background: var(--shell-bg);
      border: 1px solid var(--shell-border);
      border-radius: 28px;
      padding: 18px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(10px);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .eyebrow {
      text-transform: uppercase;
      letter-spacing: 0.08em;
      font-size: 0.76rem;
      color: var(--muted);
      margin-bottom: 6px;
    }
    h1, h2, h3, h4, h5, p { margin: 0; }
    .subtitle {
      color: var(--muted);
      margin-top: 6px;
    }
    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      margin-bottom: 14px;
      flex-wrap: wrap;
    }
    .theme-picker {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 0.85rem;
      color: var(--muted);
      white-space: nowrap;
    }
    .theme-picker-label {
      text-transform: uppercase;
      letter-spacing: 0.08em;
      font-size: 0.72rem;
    }
    .theme-select {
      border: 1px solid var(--line);
      background: var(--card-bg);
      color: var(--ink);
      border-radius: 999px;
      padding: 6px 12px;
      font: inherit;
      cursor: pointer;
    }
    .project-tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }
    .project-tab {
      border: 1px solid var(--line);
      background: var(--card-bg);
      color: var(--ink);
      border-radius: 999px;
      padding: 10px 14px;
      cursor: pointer;
      font: inherit;
    }
    .project-tab.active {
      background: var(--accent);
      border-color: var(--accent);
      color: white;
    }
    .prd-picker {
      position: relative;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    .prd-picker-trigger {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      border: 1px solid var(--line);
      background: var(--card-bg);
      color: var(--ink);
      border-radius: 999px;
      padding: 8px 14px;
      cursor: pointer;
      font: inherit;
      max-width: 360px;
    }
    .prd-picker-trigger:hover {
      border-color: var(--card-border-hover);
      background: var(--card-bg-hover);
    }
    .prd-picker-trigger.open {
      border-color: var(--card-border-active);
      background: var(--card-bg-active);
    }
    .prd-picker-icon {
      width: 16px;
      height: 16px;
      flex: 0 0 auto;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .prd-picker-label {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-weight: 600;
    }
    .prd-picker-caret {
      color: var(--muted);
      font-size: 0.7rem;
      flex: 0 0 auto;
    }
    .prd-picker-menu {
      position: absolute;
      top: calc(100% + 8px);
      left: 0;
      width: min(640px, calc(100vw - 48px));
      max-height: 420px;
      overflow: auto;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: var(--panel);
      box-shadow: var(--shadow);
      padding: 10px;
      z-index: 30;
    }
    .prd-picker-toggle {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 10px 12px;
      border-bottom: 1px solid var(--line);
      margin-bottom: 10px;
      font-size: 0.84rem;
      color: var(--muted);
    }
    .prd-picker-toggle input {
      margin: 0;
    }
    .prd-option {
      display: block;
      width: 100%;
      border: 1px solid transparent;
      background: var(--card-bg);
      border-radius: 14px;
      padding: 12px 14px;
      color: var(--ink);
      font: inherit;
      text-align: left;
      cursor: pointer;
    }
    .prd-option + .prd-option {
      margin-top: 8px;
    }
    .prd-option:hover,
    .prd-option.active {
      border-color: var(--card-border-active);
      background: var(--card-bg-active);
    }
    .prd-option-top {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: center;
    }
    .prd-option-title {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-weight: 700;
    }
    .prd-option-subtitle {
      margin-top: 4px;
      color: var(--muted);
      font-size: 0.82rem;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .sync-status {
      padding: 0 6px 12px;
      font-size: 0.84rem;
      color: var(--muted);
    }
    .sync-status.error {
      color: var(--warn);
    }
    .main-grid {
      flex: 1 1 auto;
      display: grid;
      grid-template-columns: var(--col-1, 28%) 6px var(--col-2, 32%) 6px minmax(0, 1fr);
      gap: 0;
      min-height: 0;
    }
    .resizer {
      background: transparent;
      cursor: col-resize;
      position: relative;
      user-select: none;
      touch-action: none;
    }
    .resizer::before {
      content: "";
      position: absolute;
      top: 10%;
      bottom: 10%;
      left: 2px;
      right: 2px;
      background: var(--resizer-color);
      border-radius: 2px;
      transition: background 0.12s ease;
    }
    .resizer:hover::before,
    .resizer.dragging::before {
      background: var(--resizer-color-hover);
    }
    .sidebar, .summary-pane, .details {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--panel);
      overflow: hidden;
    }
    .sidebar {
      display: flex;
      flex-direction: column;
      min-width: 0;
      min-height: 0;
    }
    .sidebar-top {
      padding: 18px;
      border-bottom: 1px solid var(--line);
      background: var(--sidebar-top-bg);
    }
    .filters {
      display: grid;
      grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr) minmax(0, 1fr);
      gap: 10px;
    }
    .filter-select {
      width: 100%;
      border: 1px solid var(--line);
      background: var(--card-bg);
      border-radius: 14px;
      padding: 11px 13px;
      font: inherit;
      color: var(--ink);
    }
    .search {
      width: 100%;
      border: 1px solid var(--line);
      background: var(--card-bg);
      border-radius: 14px;
      padding: 11px 13px;
      font: inherit;
      color: var(--ink);
    }
    .search:focus {
      outline: 2px solid var(--accent-soft);
      border-color: var(--accent);
    }
    .story-list {
      flex: 1 1 auto;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 10px;
      display: grid;
      gap: 10px;
      min-height: 0;
      min-width: 0;
    }
    .story-row {
      border: 1px solid var(--line);
      background: var(--card-bg);
      border-radius: 16px;
      padding: 14px;
      cursor: pointer;
      text-align: left;
      font: inherit;
      color: inherit;
      display: grid;
      gap: 8px;
    }
    .story-row:hover {
      border-color: var(--card-border-hover);
      background: var(--card-bg-hover);
    }
    .story-row.active {
      background: var(--card-bg-active);
      border-color: var(--card-border-active);
      box-shadow: inset 0 0 0 1px var(--card-shadow-active);
    }
    .story-row-top {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: flex-start;
    }
    .story-id {
      font-size: 0.76rem;
      letter-spacing: 0.08em;
      color: var(--muted);
      text-transform: uppercase;
    }
    .story-title {
      font-size: 1rem;
      line-height: 1.25;
    }
    .story-desc-preview {
      color: var(--muted);
      font-size: 0.92rem;
      line-height: 1.35;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .pill-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .pill {
      border-radius: 999px;
      padding: 4px 10px;
      font-size: 0.78rem;
      border: 1px solid var(--line);
      white-space: nowrap;
      background: var(--pill-bg);
    }
    .pill.pending {
      background: var(--warn-soft);
      color: var(--warn);
      border-color: var(--pill-pending-border);
    }
    .pill.complete {
      background: var(--done-soft);
      color: var(--done);
      border-color: var(--pill-complete-border);
    }
    .pill.priority {
      background: var(--pill-priority-bg);
    }
    .pill.epic {
      background: var(--pill-epic-bg);
      color: var(--pill-epic-fg);
      border-color: var(--pill-epic-border);
    }
    .epic-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      padding: 10px 12px;
      border-bottom: 1px solid var(--line);
      background: var(--epic-bar-bg);
    }
    .epic-chip {
      background: var(--card-bg);
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 4px 10px;
      font-size: 0.78rem;
      color: var(--ink);
      font: inherit;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .epic-chip:hover {
      border-color: var(--card-border-hover);
      background: var(--card-bg-hover);
    }
    .epic-chip.active {
      background: var(--pill-epic-bg);
      border-color: var(--pill-epic-border);
      box-shadow: inset 0 0 0 1px var(--card-shadow-active);
    }
    .epic-chip .epic-id {
      color: var(--pill-epic-fg);
      font-weight: 600;
    }
    .epic-chip .epic-count {
      color: var(--muted);
    }
    .details {
      display: flex;
      flex-direction: column;
      min-width: 0;
      min-height: 0;
    }
    .summary-pane {
      display: flex;
      flex-direction: column;
      min-width: 0;
      min-height: 0;
    }
    .summary-inner {
      flex: 1 1 auto;
      padding: 22px;
      overflow-y: auto;
      overflow-x: hidden;
      min-height: 0;
      min-width: 0;
      background: var(--summary-bg);
    }
    .summary-title {
      font-size: 1.35rem;
      line-height: 1.25;
    }
    .summary-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 14px 0 18px;
    }
    .summary-preview {
      color: var(--muted);
      margin-top: 18px;
      font-size: 0.95rem;
      line-height: 1.45;
    }
    .details-inner {
      flex: 1 1 auto;
      padding: 28px;
      overflow-y: auto;
      overflow-x: hidden;
      min-height: 0;
      min-width: 0;
    }
    .details-top {
      display: flex;
      justify-content: space-between;
      gap: 18px;
      align-items: flex-start;
      margin-bottom: 18px;
    }
    .details-path {
      margin-top: 8px;
      color: var(--muted);
      word-break: break-word;
    }
    .section {
      margin-top: 24px;
      padding-top: 20px;
      border-top: 1px solid var(--line);
    }
    .section h4 {
      margin-bottom: 12px;
      font-size: 1rem;
    }
    .markdown {
      color: var(--ink);
      line-height: 1.55;
    }
    .markdown p {
      margin: 0 0 12px;
    }
    .markdown p:last-child {
      margin-bottom: 0;
    }
    .markdown ul, .markdown ol {
      margin: 0 0 12px 22px;
      padding: 0;
    }
    .markdown li + li {
      margin-top: 8px;
    }
    .markdown code {
      font-family: Consolas, "Courier New", monospace;
      background: var(--code-bg);
      padding: 1px 5px;
      border-radius: 6px;
      font-size: 0.92em;
    }
    .linked-docs {
      margin-top: 24px;
      padding-top: 20px;
      border-top: 1px solid var(--line);
      display: grid;
      gap: 18px;
    }
    .linked-doc-path {
      font-family: Consolas, "Courier New", monospace;
      font-size: 0.82rem;
      color: var(--muted);
      margin-bottom: 10px;
      word-break: break-all;
    }
    .spec-markdown {
      font-size: 0.95rem;
      line-height: 1.55;
      min-width: 0;
      overflow-wrap: break-word;
      word-break: break-word;
    }
    .spec-markdown img { max-width: 100%; height: auto; }
    .spec-markdown table {
      display: block;
      max-width: 100%;
      overflow-x: auto;
    }
    .spec-markdown h1, .spec-markdown h2, .spec-markdown h3 {
      margin: 18px 0 8px;
      line-height: 1.2;
    }
    .spec-markdown h1 { font-size: 1.25rem; }
    .spec-markdown h2 { font-size: 1.1rem; }
    .spec-markdown h3 { font-size: 1rem; }
    .spec-markdown p { margin: 0 0 12px; }
    .spec-markdown ul, .spec-markdown ol { margin: 0 0 12px 22px; }
    .spec-markdown li + li { margin-top: 6px; }
    .spec-markdown pre {
      background: var(--code-bg);
      padding: 12px;
      border-radius: 8px;
      overflow-x: auto;
      max-width: 100%;
      font-size: 0.88em;
      line-height: 1.45;
    }
    .spec-markdown code {
      font-family: Consolas, "Courier New", monospace;
      background: var(--code-bg);
      padding: 1px 5px;
      border-radius: 6px;
      font-size: 0.92em;
    }
    .spec-markdown pre code { background: none; padding: 0; }
    .spec-markdown table {
      border-collapse: collapse;
      margin: 12px 0;
      font-size: 0.9em;
    }
    .spec-markdown th, .spec-markdown td {
      border: 1px solid var(--line);
      padding: 6px 10px;
    }
    .spec-markdown blockquote {
      margin: 12px 0;
      padding: 4px 14px;
      border-left: 3px solid var(--line);
      color: var(--muted);
    }
    .acceptance-list {
      display: grid;
      gap: 12px;
      padding: 0;
      margin: 0;
      list-style: none;
    }
    .acceptance-item {
      background: var(--acceptance-bg);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 14px 16px;
    }
    .acceptance-index {
      display: inline-block;
      min-width: 28px;
      margin-right: 8px;
      color: var(--muted);
      font-size: 0.8rem;
    }
    .empty {
      padding: 28px;
      color: var(--muted);
    }
    .mobile-summary {
      display: none;
      margin-bottom: 14px;
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 14px;
      background: var(--mobile-summary-bg);
    }
    .mobile-accordion {
      display: none;
    }
    .mobile-panel {
      border: 1px solid var(--line);
      border-radius: 18px;
      background: var(--panel);
      overflow: hidden;
      margin-top: 14px;
    }
    .mobile-panel summary {
      list-style: none;
      cursor: pointer;
      padding: 14px 16px;
      background: var(--mobile-panel-bg);
      font-weight: 700;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }
    .mobile-panel summary::-webkit-details-marker {
      display: none;
    }
    .mobile-panel summary::after {
      content: "+";
      color: var(--muted);
      font-size: 1.1rem;
      line-height: 1;
    }
    .mobile-panel[open] summary::after {
      content: "−";
    }
    .mobile-panel-body {
      padding: 12px;
      border-top: 1px solid var(--line);
      background: var(--mobile-panel-body-bg);
    }
    @media (max-width: 1350px) {
      .main-grid {
        grid-template-columns: var(--col-1, 28%) 6px minmax(0, 1fr) !important;
      }
      .summary-pane, .resizer.resizer-2 {
        display: none;
      }
    }
    @media (max-width: 900px) {
      .app {
        padding: 14px;
        height: 100vh;
      }
      .shell {
        padding: 12px;
        border-radius: 20px;
      }
      .main-grid {
        display: none;
      }
      .mobile-accordion {
        display: block;
      }
      .mobile-summary {
        display: block;
      }
      .details-inner {
        padding: 18px;
      }
    }

    window.__PRD_DATA__ = [{"project": "roslyn-tools", "branchName": "result-type-and-cleanup", "description": "Result<T,RtError> rollout (US-068 split) + feedback noise reduction + parallel-safety + extract-interface fix. Promoted from triaged backlog after 2026-05-22 refinement.", "path": "C:\\code\\roslyn-tools\\ralph\\prd.json", "stats": {"total": 12, "complete": 7, "pending": 5, "completionPct": 58}, "epics": [], "stories": [{"id": "US-075", "title": "make rt parallel-safe for agent dogfooding (feedback file, wrapper rebuild, deploy-skill, MSBuild obj)", "description": "As an agent running /execute-style parallel rt invocations across worktrees, I want rt and its build/deploy plumbing to be safe under concurrency so that parallel dogfooding does not corrupt feedback.json, race the rt.cmd rebuild, fight deploy-skill Copy-Item, or trip MSBuild obj/Debug file locks.", "acceptanceCriteria": ["rt feedback add is safe under concurrent invocation: parallel calls each get a unique FB-id and every entry is persisted (regression test runs N parallel `rt feedback add` and asserts N distinct ids + N items on disk)", "Concurrent ./rt.cmd / rt.ps1 invocations after a source edit serialise on a build mutex so only one rebuild runs at a time; subsequent invocations wait then execute against the freshly built binary (no CS2012 / rt.exe copy-lock warnings)", "deploy-skill Copy-Item retries on file-lock with bounded backoff, or skips with a clear stderr message when the destination is locked by a concurrent build (no unhandled IOException)", "Read-only `rt analyze …` commands accept a flag (e.g. --isolated-obj) or unconditionally redirect BaseIntermediateOutputPath to a per-process temp dir so parallel analyses do not race on shared obj/Debug files", "Integration test exercises FB-007/FB-008/FB-013 reproduction scenarios in parallel and confirms no exceptions and no MSBuild lock warnings on stderr", "Documentation update in AGENTS.md and CLAUDE.md noting that rt is now parallel-safe for agent use"], "priority": 70, "passes": false, "notes": "P2. Source cluster: FB-007, FB-008, FB-012, FB-013 (feedback.json, 2026-05-15). Four distinct race sites but one story — each is a small fix and they share the same trigger (parallel agent invocation). Implementation order: (1) feedback file mutex (FileStream with FileShare.None + retry loop on id allocation), (2) rt.cmd build mutex via named mutex around dotnet build, (3) deploy-skill retry, (4) MSBuildWorkspace BaseIntermediateOutputPath isolation for read-only commands. Audit 2026-05-26: no design changes; start with feedback-file mutex. See EP-015.", "epicId": ""}, {"id": "US-071", "title": "rt refactor extract-interface produces malformed output for internal classes", "description": "[DISPOSITION: DEFERRED] extract-interface dogfood bug — schedule after the sweep; touches one command.\n\nAs a roslyn-tools developer, I want extract-interface to honor source class accessibility, include internal members when the source is internal, and emit syntactically valid C# so that I can dogfood it during DI migrations on internal types.", "acceptanceCriteria": ["rt refactor extract-interface --type WorkspaceLoader --solution RoslynTools.slnx --dry-run emits a syntactically valid diff: the new interface name is inserted into the existing base list with proper formatting (space after comma, brace placement matching the file's brace style), and the resulting file would compile", "Extracting from an internal sealed class produces an internal interface (not public). Accessibility of the generated interface matches the source class accessibility", "Extracting from an internal class includes the class's internal members in the generated interface (today only public members are picked up). Public-only behaviour remains the default for public source classes", "Regression test added covering an internal class with internal members and an existing IDisposable base list, asserting both the file compiles and the interface accessibility/membership matches expectation", "rt refactor extract-interface --type WorkspaceLoader --solution RoslynTools.slnx (no dry-run) succeeds without producing files that fail dotnet build"], "priority": 75, "passes": false, "notes": "P2. Surfaced during EP-008/US-053 dogfood at branch ep-008-isessionfactory. Three bundled defects: (1) base-list insertion is malformed -- 'IDisposable\\n,IWorkspaceLoader{' (no space, brace adjacent); (2) generated interface is hardcoded public regardless of source class accessibility (internal sealed class WorkspaceLoader yielded public interface IWorkspaceLoader); (3) only public members are extracted, missing internal GetSolutionAsync/LoadWorkspaceAsync from WorkspaceLoader. Repro: rt refactor extract-interface --type WorkspaceLoader --solution RoslynTools.slnx --dry-run. Forced fallback to hand-authoring IWorkspaceSessionFactory.", "epicId": "EP-006"}, {"id": "US-077", "title": "Result<T,RtError> ADT + SymbolLocator migration + App exception ladder", "description": "As a developer, I want SymbolLocator's four lookup methods to return Result<ISymbol, RtError> for routine not-found / ambiguous cases instead of throwing InvalidOperationException, so the App-level exception handler can route handled errors via a typed ladder (no substring-matching) while still surfacing genuine bugs with full stack traces.", "acceptanceCriteria": ["src/RoslynTools/Core/Result.cs defines an internal sealed record Result<T, TError> ADT with Ok(T value) and Err(TError error) factory methods plus IsOk/IsErr predicates and Match/Map combinators (no nullable-T trickery; either branch is total).", "src/RoslynTools/Core/RtError.cs defines an internal sealed record RtError(RtErrorKind Kind, string Message, IReadOnlyDictionary<string,string>? Context = null).", "src/RoslynTools/Core/RtErrorKind.cs defines an enum with NotFound, InvalidInput, AmbiguousMatch, and WorkspaceLoadFailure entries (no others in this story; further kinds added only when a real call-site needs them).", "SymbolLocator.FindSymbolAsync, FindSymbolByFqnAsync, FindTypeByFqnAsync, and FindMethodBySpecAsync return Result<ISymbol, RtError>; symbol-not-found and ambiguous-match cases produce RtError.NotFound / RtError.AmbiguousMatch — never throw InvalidOperationException.", "Every existing caller of those four SymbolLocator methods is updated to consume Result<ISymbol, RtError>; commands surface RtError via a single shared RtLog.Error(...) + context.ExitCode = 1 helper (no per-command if/else ladder).", "App.CaptureExceptionAsync gains a typed-only catch ladder for FileNotFoundException, DirectoryNotFoundException, ArgumentException, and JsonException that emits a single 'Error: <message>' line to stderr with exit 1.", "No substring-matching of Exception.Message exists anywhere in App.cs after this change (grep for `ex.Message.Contains` / `ex.Message.StartsWith` / `ex.Message.IndexOf` returns zero matches in the file).", "feedback.json still receives an entry for every exception not in the typed ladder; handled-via-Result paths do NOT add a feedback entry (regression test verifies the count stays unchanged across one symbol-not-found scenario).", "Integration test: rt inspect find-refs --symbol DoesNotExistSymbolFoo exits 1, writes exactly one 'Error: ...' line to stderr, writes nothing to stdout, and does not append to feedback.json.", "Integration test: rt inspect describe Foo.Bar (ambiguous match across two namespaces) exits 1 with an RtError.AmbiguousMatch-formatted message that lists candidate FQNs.", "CLAUDE.md gains a 'Result types' section that explains when to use Result<T, RtError> (routine user-error flows in core services) vs when to throw (invariant violations and genuinely unexpected failures).", "dotnet build RoslynTools.slnx succeeds with zero errors; dotnet format --verify-no-changes exits 0; existing test suite passes; rt dump-help output unchanged.", "rt dogfood smoke: running rt inspect describe RoslynTools.Core.SymbolLocator --solution RoslynTools.slnx exits 0 with the same JSON shape as before; running it with a typo'd symbol exits 1 cleanly without a stack trace."], "priority": 78, "passes": false, "notes": "First of three sub-stories split from the originally-paused US-068. Lands the ADT, the first migration target (SymbolLocator), and the typed catch ladder that replaces App.TryHandleUserErrorAsync's substring-matching. US-068b (WorkspaceLoader) and US-068c (MethodExtractor) follow with smaller migrations once the pattern is proven here. Audit 2026-05-26: re-spec SymbolLocator↔DaemonServer error contract before coding (does DaemonServer translate Result<T, RtError> to wire envelope or vice versa?). See EP-015.", "epicId": "EP-010"}, {"id": "US-100", "title": "Unify RtResultRenderer call shape and enforce IStructuredOutputCommand for every JSON-output command", "description": "As an rt maintainer, I want every structured-output command to call RtResultRenderer through one consistent entry point and to declare its JSON output by implementing IStructuredOutputCommand, so renderer behaviour cannot drift between commands and RtCommandInfo.JsonOutput=true is reliably synchronised with the interface implementation.", "acceptanceCriteria": ["RtResultRenderer exposes one canonical method that structured-output commands call (the default JSON options are encapsulated inside the renderer; callers do not pass options).", "The previously-divergent overload (Write with explicit JsonOptions) is removed, or restricted to a clearly-scoped use case that no command currently needs.", "Every command with RtCommandInfo.JsonOutput=true implements IStructuredOutputCommand; every command that implements IStructuredOutputCommand has JsonOutput=true.", "App.cs startup validator enforces this biconditional and fails at startup (and therefore fails post-build docs/COMMANDS.md generation) if a new command violates it.", "rt inspect find-refs --json, rt inspect find-callers --json, and rt inspect find-impl --json produce byte-identical output before and after the change.", "Architecture test under tests/RoslynTools.Tests/Architecture/ covers the biconditional invariant by exercising the validator against the live command registry.", "dotnet build clean, dotnet format --verify-no-changes clean, full test suite passes."], "priority": 101, "passes": false, "notes": "P2. Source: architectural audit on 2026-05-24. RtResultRenderer exposes three methods: Write(RtResult<T>, JsonOptions), WriteOutput<T>(RtResult<T>), WriteText(RtResult<string>). Today FindRefsCommand:58 and FindCallersCommand:61 call WriteOutput, while FindImplementationsCommand:79-81 calls Write(..., SymbolFormatter.DefaultJsonOptions). IStructuredOutputCommand marker exists but only FindImplementationsCommand implements it; the other two do not. App.cs has a static-ctor check that the category enum stays in sync — extend it to enforce the JsonOutput=true ⇔ IStructuredOutputCommand biconditional. Audit 2026-05-26: pick (a) collapse RtResultRenderer to one overload, or (b) keep three and add IStructuredOutputCommand to FindRefs/FindCallers. See EP-015.", "epicId": ""}, {"id": "US-114", "title": "Represent shared CLI flags as reusable capability interfaces backed by a central option registry", "description": "As an rt maintainer, I want every reusable CLI flag to be represented by a real capability interface with shared binding/parsing behavior and registered in one central option catalog, so commands reuse flag code, standardize semantics, and keep CLI/MCP/help surfaces from drifting.", "acceptanceCriteria": ["A central flag catalog exists in src/RoslynTools.Cli/ (or a shared command-surface project if US-099 has landed) that owns every reusable System.CommandLine option definition: solution, dry-run, json/format, scope, top, symbol, type, file, kind, decisions, apply, skip, verbose, and any other flag used by 2+ commands.", "Each reusable flag has a corresponding capability interface in Core or the command-surface project with real reusable contract members, not an empty tag. Examples: IHasSolutionOption exposes string? SolutionPath; ISupportsDryRun exposes bool DryRun; ISupportsTopOption exposes int? Top; IHasSymbolTarget exposes string Symbol; ISupportsApplySkipOptions exposes IReadOnlySet<string> ApplyIds and SkipIds.", "Each capability interface has one shared binder/parser that reads the central catalog option from ParseResult and populates the typed capability/request object; commands do not call GetValueForOption directly for catalog-owned flags.", "Shared flag validation lives with the capability binder, not in individual commands: examples include --top >= 0, --apply/--skip mutual exclusion, solution path normalization/autodetection, output format normalization, and deprecated-alias warnings.", "Commands consume typed request/context objects composed from these interfaces rather than raw option variables.", "Service-layer APIs remain flag-agnostic: services receive domain request objects that say what to do or ask (for example symbol, target type, desired transformation, limit/count), not how that request arrived from CLI/MCP flags.", "CLI/MCP adapters and shared binders are responsible for translating flag capability objects into service-domain requests; services do not reference System.CommandLine, ParseResult, option catalog types, MCP schema types, or flag capability interfaces unless the capability is also a true domain concept.", "Reusable service-layer request models may share plain domain interfaces only when they describe the operation itself, not transport/input mechanics; for example a query may expose Limit, but not ISupportsTopOption.", "Command classes or command request types implement the flag capability interfaces for every reusable flag they expose; command category interfaces may inherit common capabilities where universal, e.g. IRefactorCommand implies ISupportsDryRun if the US-112 exception has been closed.", "The command builder path reads capability interfaces and registers options from the central catalog, then attaches the shared binder pipeline, so command files no longer manually instantiate reusable Option<T> objects or call ad hoc factory methods for common flags.", "The central catalog is the single source of truth for flag name, aliases, description, default value, required/optional status, parse validation, and deprecation aliases.", "Architecture test asserts the biconditional: if a command implements a flag capability interface, its built System.CommandLine.Command exposes exactly the catalog option; if a command exposes a reusable catalog flag, it implements the matching capability interface.", "Architecture test flags direct `new Option<T>(\"--known-flag\"...)` declarations for catalog-owned flags anywhere under src/RoslynTools.Cli/Commands/.", "Architecture test flags direct ParseResult.GetValueForOption calls for catalog-owned flags outside the shared capability binders.", "dump-help and dump-help --json derive flag metadata from the central catalog so generated docs show consistent names, aliases, defaults, and descriptions.", "Native MCP schema generation reuses the same flag catalog metadata for command inputs, so CLI and MCP required fields/defaults remain aligned.", "Backward-compatible aliases are preserved for any previously shipped flag spellings unless explicitly documented as a breaking change in the story notes.", "CommandOptionFactory is either removed or reduced to a thin compatibility wrapper over the new catalog; no second source of option truth remains.", "Migration can be ratcheted: a checked-in marker file may list commands migrated to capability-driven options, and the architecture test enforces the full contract for listed commands until all commands are migrated.", "docs/per-command-checklist.md is updated to replace the manual 'options constructed via CommandOptionFactory' row with the new interface/catalog rule and its enforcing architecture test.", "Tests cover at least solution, dry-run, json/format, top, symbol, and apply/skip capabilities against representative inspect/analyze/refactor commands, including the shared binder output and validation errors.", "dotnet build RoslynTools.slnx clean; dotnet format RoslynTools.slnx --verify-no-changes clean; relevant architecture tests pass; rt dump-help output changes only where option descriptions/aliases are intentionally standardized."], "priority": 115, "passes": false, "notes": "P2 consistency and reuse feature. Seeded by 2026-05-25 design note: flags should be declared as interfaces so reusable option support is visible in the type system, centrally registered, mechanically enforced, and backed by shared binders/validation instead of empty marker tags. Keep the boundary clean: flag capabilities belong to adapters/binders; services should only do or answer the domain thing. This likely supersedes or sharpens US-085/US-062's CommandOptionFactory-only approach; preserve compatibility aliases while migrating.", "epicId": "EP-009"}, {"id": "US-074", "title": "rt analyze list-smells: add --top N limiter", "description": "As an agent driving rt, I want `rt analyze list-smells --top N` to cap the output to the N highest-priority smells so that I can run concise smell scans without paging through thousands of lines of JSON.", "acceptanceCriteria": ["rt analyze list-smells --solution <sln> --top 30 exits 0 and emits at most 30 smell entries to stdout", "Ordering is deterministic and matches the existing default ordering (highest severity/score first; tie-break by file path then line)", "Omitting --top preserves current behaviour (no limit)", "--top 0 emits an empty smells array (still valid JSON with metadata intact)", "--top with a negative integer exits 1 with stderr 'Invalid --top value: must be >= 0' (no stack trace)", "rt dump-help shows --top in the list-smells command help", "ListSmellsCommand.Info.Examples includes a --top example"], "priority": 60, "passes": true, "notes": "P2. Source: FB-006 (feedback.json, 2026-05-15). Pure CLI surface — slice the result list after ranking, before JSON serialisation. No behavioural change to the analyser itself.", "epicId": ""}, {"id": "US-076", "title": "stop capturing handled user-error exceptions to feedback.json", "description": "As a roslyn-tools maintainer, I want App.CaptureExceptionAsync to skip exception types that App.TryHandleUserErrorAsync already maps to a clean exit-1 + stderr UX, so feedback.json only collects genuinely unexpected failures that need human triage — not the expected bad-input UX paths that the dogfood/integration harness exercises on every run.", "acceptanceCriteria": ["App.TryHandleUserErrorAsync (src/RoslynTools.Cli/App.cs:342) no longer calls CaptureExceptionAsync for exception types it already translates (FileNotFoundException, IOException, InvalidOperationException, JsonException, YamlException) — those are documented, expected user errors with a clean stderr message and exit 1; capturing them adds noise without adding signal", "Exceptions that fall through TryHandleUserErrorAsync (return false → rethrow) ARE still captured to feedback.json — the unmapped path is the one that needs human triage", "Running the bad-input integration scenarios (`refactor add-xml-doc --from-json <invalid.json>`, `inspect describe Foo --decisions <invalid.yaml>`, `inspect describe Foo --solution <missing.slnx>`, `analyze analyze-interface <non-interface>`) leaves feedback.json untouched — exit code is still 1, stderr is still the friendly message, but no FB-NNN entry is appended", "Regression test added under tests/RoslynTools.Tests/Cli/ that runs one of the four scenarios end-to-end and asserts feedback.json count is unchanged", "Existing tests pass; dotnet format --verify-no-changes clean"], "priority": 65, "passes": true, "notes": "P3. Source cluster: FB-280 through FB-299 (feedback.json, 2026-05-22) — 5 repeated runs of 4 identical scenarios from a dogfood/integration harness that exercises bad-input UX paths. All four scenarios are already handled correctly by TryHandleUserErrorAsync (exit 1 + stderr); the only output of those captures was 20 lines of feedback.json noise. Implementation: invert the order in TryHandleUserErrorAsync — only capture when the exception is NOT in the handled set (i.e. capture inside the trailing `return false` branch, not at the top). The 20 FB-280..FB-299 entries themselves are discarded; this story will be the audit trail.", "epicId": ""}, {"id": "US-107", "title": "Category + capability interfaces to enforce command consistency at the type system", "description": "As a maintainer, I want IInspectCommand/IAnalyzeCommand/IRefactorCommand marker interfaces plus capability interfaces (IMutatingCommand, IStructuredOutputCommand, IBatchMutationCommand, INativeMcpExposable) so the compiler and architecture tests enforce category-specific contracts (mutates, JSON output, dry-run, MCP exposure), replacing several rows of the per-command checklist with mechanical checks.", "acceptanceCriteria": ["src/RoslynTools/Core/ defines three marker category interfaces inheriting from IRtCommand: IInspectCommand, IAnalyzeCommand, IRefactorCommand. They are empty subinterfaces — no member additions — so existing commands implement them by declaration only.", "Every concrete *Command class in src/RoslynTools/Commands/ implements exactly one of the three category interfaces. Picking zero or more than one is a compile error or an architecture-test failure.", "Capability interfaces also defined in src/RoslynTools/Core/: IMutatingCommand (commands that produce file changes; must expose a dry-run option and emit a diff or change summary), IStructuredOutputCommand (commands that emit JSON; consolidates with the US-100 IStructuredOutputCommand if that lands first), IBatchMutationCommand (commands that use the BatchMutationRunner/FixId pipeline; ties into US-092), INativeMcpExposable (commands that should have a corresponding native IMcpHandler; ties into US-094).", "Architecture test (under tests/RoslynTools.Tests/Architecture/) asserts: every IInspectCommand has Info.Category == \"inspect\", Info.Mutates == false, Info.JsonOutput == true", "Architecture test asserts: every IAnalyzeCommand has Info.Category == \"analyze\", Info.Mutates == false, Info.JsonOutput == true", "Architecture test asserts: every IRefactorCommand has Info.Category == \"refactor\", Info.Mutates == true, implements IMutatingCommand, and its Build() registers a --dry-run option (detected by inspecting the System.CommandLine surface)", "Architecture test asserts: every IInspectCommand and IAnalyzeCommand also implements INativeMcpExposable AND has a registered IMcpHandler with matching ToolName (replaces the bespoke ratchet from US-094 if US-094 hasn't landed yet, or extends it if it has)", "Awkward outliers are handled explicitly, not by relaxing the rules: debug (analyze category but operates on a JSONL trace, not the solution) gets an explicit ITraceAnalyzeCommand subinterface OR a documented [DoesNotRequireSolution] marker so the solution-scoped checks skip it", "docs/per-command-checklist.md updated: every checklist row that is now compiler- or test-enforced is annotated with \"(enforced)\" and dropped from the manual checklist. The remaining manual items are the genuinely-human ones (Examples freshness, SeeAlso correctness, behaviour-vs-Mutates accuracy).", "All 52 existing commands compile and pass after the interfaces are introduced (no behaviour change; pure type-system + ratchet)", "dotnet build RoslynTools.slnx clean; dotnet format --verify-no-changes clean; existing tests pass; new architecture tests green", "Pattern reference: commit 6d767b1 (feat(mcp): wire find_refs and rename as native MCP handlers) for the native-handler conventions the INativeMcpExposable rule encodes"], "priority": 108, "passes": true, "notes": "P2. EP-009 consistency enabler. Shrinks docs/per-command-checklist.md to the genuinely-human items. Composes with: US-094 (MCP ratchet — INativeMcpExposable encodes this), US-100 (IStructuredOutputCommand — consolidate), US-092 (BatchMutationRunner — IBatchMutationCommand marks adopters), US-097 (refactor MCP shape — IRefactorCommand + IMutatingCommand contract owns this). Awkward commands (debug, outline) get explicit carve-out subinterfaces or markers — do NOT relax the universal rules to fit them.", "epicId": "EP-009"}, {"id": "US-121", "title": "Semantic comparison engine for C# (FQN-keyed, trivia-insensitive)", "description": "As a developer, I want a pure comparison engine that takes two sets of C# sources and reports the semantic delta, so the CLI and MCP can share one source of truth.", "acceptanceCriteria": ["Given a \"before\" and \"after\" set of C# sources, produces a structured result listing each declaration (type, method, property, field, etc.) as added, removed, changed, or unchanged.", "Declarations are matched by fully-qualified name, independent of which file they live in — a declaration present in both sides counts as the same declaration even if it moved files.", "Comment-only and whitespace-only differences in a declaration's body produce unchanged, not changed.", "A declaration that exists on both sides with an equivalent normalized body is unchanged even when its containing file path differs (the \"moved file\" case); the result records the old and new file location.", "The engine takes its inputs as in-memory source text (no git/CLI/Console dependency) and is unit-testable in isolation.", "Member reordering and using-directive reordering within a file do not, by themselves, mark a declaration as changed."], "priority": 121, "passes": true, "notes": "P1. Part of EP-016 semantic diff. Foundational engine; pure service, no host deps. Matches by fully-qualified name so a moved-file declaration is unchanged. Candidate reuse: BlockNormalizer, FindDuplicatesService normalized-block walk.", "epicId": "EP-016"}, {"id": "US-122", "title": "Git version source + rt analyze semantic-diff command", "description": "As a developer, I want to run the semantic diff against git so I can review what I have actually changed.", "acceptanceCriteria": ["`rt analyze semantic-diff` with no version flags compares the working tree against HEAD.", "`--from <ref> --to <ref>` compares two arbitrary git refs (e.g. --from HEAD~3 --to HEAD).", "Only C# (.cs) files in the changed set are parsed and fed to the engine; non-C# changes are ignored.", "Runs from inside any git repo; a clear error (exit 1, stderr) when not in a git repo or a ref is invalid.", "Default output is text rendered to look very similar to a standard git diff (per-declaration hunks, +/- lines, file headers), with moved-but-unchanged declarations suppressed or shown as a relocation note rather than delete+add.", "Diagnostics/progress to stderr, results to stdout; exits 0 on success."], "priority": 122, "passes": true, "notes": "P1. Part of EP-016 semantic diff. Default working-tree-vs-HEAD; --from/--to arbitrary refs. git-diff-style text output, moved-but-unchanged suppressed. Two-version loading is new (WorkspaceLoader opens one solution today).", "epicId": "EP-016"}, {"id": "US-125", "title": "First-class MCP handler for semantic-diff", "description": "As an MCP client, I want a native semantic-diff tool that returns the structured result directly.", "acceptanceCriteria": ["An MCP handler exposes semantic-diff and returns the engine's structured result as native JSON (not text-captured CLI output).", "The handler accepts the same inputs the CLI supports: git working-vs-HEAD, from/to refs, and two file paths.", "The handler is registered in MCP service registration and resolves the same engine/service the CLI uses (no logic duplicated between adapters).", "Invalid inputs return a structured error rather than throwing."], "priority": 125, "passes": true, "notes": "P1. Part of EP-016 semantic diff. Native JSON handler (not text-captured), registered in MCP service registration, resolves the same engine the CLI uses. Accepts git working-vs-HEAD, from/to refs, and two file paths.", "epicId": "EP-016"}, {"id": "US-126", "title": "Semantic diff engine hardening: container-scoped rename pairing + edge guards", "description": "As a developer, I want the semantic diff engine to avoid cross-container rename false-positives and handle edge inputs, so the diff stays trustworthy as the host adapters surface it.", "acceptanceCriteria": ["Rename detection is scoped so a Removed and Added of the same kind only pair when they share a container (members: same containing type FQN; types: same namespace), so two identical-bodied declarations in unrelated namespaces/types no longer mis-pair as a single Renamed.", "Engine guards against null Before/After source lists in the request (clear behaviour, not an NRE).", "A parse-error / malformed-source tree is handled gracefully (no crash; declarations that do parse are still reported).", "SemanticDiffService LongMethod/LargeClass smells (Walk, DetectRenames, Compare) are reviewed and either split where it genuinely improves readability or explicitly accepted with rationale.", "Weak tautological tests (e.g. Enum.IsDefined on the Renamed status) are replaced with or backed by behavioural assertions."], "priority": 126, "passes": true, "notes": "P2. Follow-up from US-121 close (Opus review + rt list-smells). Cross-container rename mis-pairing (One.A<->Two.B) is the chief footgun; v1 pairs by equivalent-body-modulo-name across all containers. Also: null list guards, parse-error trees, LongMethod smells on Walk(139)/DetectRenames(67)/Compare(44), tautological Renamed-status test.", "epicId": "EP-016"}], "sourceUrl": "prd.json"}];
    window.__PRD_LINKED_DOCS__ = {"C:\\code\\roslyn-tools\\ralph\\prd.json": {"US-107": [{"path": "docs/per-command-checklist.md", "content": "# Per-Command Consistency Checklist\n\n> See [consistency-roadmap.md](consistency-roadmap.md) for **EP-013**, the umbrella plan that sequences the stories making most of this checklist compiler- or architecture-test-enforced. The rows annotated *(enforced — US-NNN)* below will be deleted as that work lands.\n\nWhen you touch an `rt` command for *any* reason — feature, bug fix, refactor, MCP handler — scan this checklist before opening a PR. The point is to knock several pending stories out in one pass while the file is already open and the test harness already warm.\n\nThe list is divided into:\n\n1. **Universal checklist** — every command, every change.\n2. **MCP exposure** — native handler conventions (EP-012).\n3. **Test coverage** — quality bar.\n4. **Per-command pending work** — open backlog stories that touch a specific command.\n5. **Cross-cutting work** — not pinned to a command; here so you don't think it's missing.\n\nIf an item doesn't apply (e.g. `Info.Mutates` for a read-only command), tick it anyway — the goal is \"verified\", not \"changed\".\n\n---\n\n## 1. Universal checklist (every command)\n\n> **US-107 has landed.** The category interfaces (`IInspectCommand`, `IAnalyzeCommand`, `IRefactorCommand`) and capability interfaces (`IMutatingCommand`, `IBatchMutationCommand`, `ITraceAnalyzeCommand`) now drive architecture-test ratchets in `tests/RoslynTools.Tests/Architecture/CategoryInterface*.cs` and `tests/RoslynTools.Tests.Mcp/Architecture/McpHandlerNameContract.cs`. Rows marked **(enforced — US-NNN)** below fail the architecture-test suite if violated. Future work removes them from this manual list once the corresponding tracking story lands.\n\n- [x] `IRtCommand` contract satisfied — static `RtCommandInfo Info` + `Command Build()` *(enforced — App.cs static ctor)*\n- [x] Command implements exactly one category interface — `IInspectCommand` / `IAnalyzeCommand` / `IRefactorCommand` (or `ITraceAnalyzeCommand` for trace-scoped analyze) *(enforced — US-107, App.cs static ctor + `CategoryInterfaceCoverage`)*\n- [x] `Info.Category` matches the category interface (`\"inspect\"`/`\"analyze\"`/`\"refactor\"`) *(enforced — US-107, `CategoryInterfaceContracts`; field slated for removal — US-108)*\n- [x] `Info.Mutates` matches the category interface (refactor = true, inspect/analyze = false) *(enforced — US-107, `CategoryInterfaceContracts`; field slated for removal — US-108)*\n- [x] `IRefactorCommand.Build()` registers a `--dry-run` option *(enforced — US-107, `CategoryInterfaceContracts`; known exception `change-signature` tracked by US-112)*\n- [ ] Reusable flags come from the central flag catalog/binder where migrated; do not hand-roll catalog-owned options or parsing (US-114 supersedes the factory-only US-085 direction)\n- [ ] `Info.Examples` reflect actual current invocations (not stale syntax)\n- [ ] `Info.JsonOutput` accurate for inspect/analyze (currently soft-ratcheted via skipped test in `CategoryInterfaceContracts.with_every_inspect_or_analyze_command_jsonoutput_is_true` — owned by US-082 / EP-007 umbrella; unskip once 8 outliers gain JSON output)\n- [ ] `Info.SeeAlso` lists related commands (US-088, US-089)\n- [ ] `RtCommandInfo` metadata in canonical shape (US-084)\n- [ ] File structure follows the playbook (US-086)\n- [ ] If JSON-output: result type uses the shared result contract (US-060, US-100)\n- [ ] Service lives in `src/RoslynTools/Services/` — no `System.CommandLine`, no `Console` in the service layer\n- [ ] Service auto-registered via `Bootstrap.RegisterServices` (implements `IRtService`)\n- [ ] Exit codes flow via `System.CommandLine` middleware, not `Environment.ExitCode` (US-093)\n- [ ] No parameterless service constructor that hand-rolls concrete dependencies (US-103)\n- [ ] Diagnostics/progress → stderr; results → stdout\n- [ ] Routine errors return non-zero exit + stderr (no unhandled exceptions)\n\n## 2. MCP exposure (EP-012)\n\n- [ ] Native `IMcpHandler` exists if this is an inspect/analyze read command (US-095, US-096)\n- [ ] If native: schema declares all *required* fields explicitly\n- [ ] If native: response is camelCase JSON via `JsonNamingPolicy.CamelCase`\n- [ ] If native and mutating: `dry-run` defaults to true (or follows the explicit decision in US-097)\n- [x] Native `ToolName` matches the command name with hyphens replaced by underscores (so it overrides the auto-bridge by name) *(enforced — US-107, `McpHandlerNameContract.with_every_imcphandler_the_toolname_matches_a_known_cli_command_name`; documented meta-handler exceptions live in `KnownMetaHandlerNames`)*\n- [x] No two native handlers share a `ToolName` *(enforced — US-107, `McpHandlerNameContract.with_every_imcphandler_the_toolname_is_unique`)*\n- [ ] Registered in `McpServiceRegistration.AddMcpServices`\n- [ ] `tools/list` snapshot test still passes (US-094)\n- [ ] If the CLI command has a hidden-from-auto-bridge alias (meta-commands), the native handler covers the visible name\n\n**Canonical reference**: commit `6d767b1` (feat(mcp): wire find_refs and rename as native MCP handlers). Read those handlers before writing a new one — same pattern, same JSON conventions.\n\n## 3. Test coverage\n\n- [ ] Tests under `tests/RoslynTools.Tests/<Category>/` (or `tests/RoslynTools.Tests.Mcp/Handlers/` for MCP)\n- [ ] Test method names: snake_case `with_<scenario>_<outcome>`\n- [ ] Tests resolve dependencies from `Bootstrap.RegisterServices` (no hand-constructed services)\n- [ ] Integration tests use the real `.slnx` fixture, not mocks of the Roslyn API surface\n- [ ] MCP handler tests parse the returned JSON and assert on structured fields (not `string.Contains`)\n- [ ] At least one missing-required-field error test per MCP handler\n- [ ] Line + branch coverage ≥ project thresholds\n- [ ] If file is in `stryker-config.json` `mutate` globs: mutation score ≥ e generation |\n| `convert-to-record` | — | None |\n| `extract-class` | — | None |\n| `extract-interface` | — | None |\n| `extract-method` | US-079 | `MethodExtractor` → `Result<T, RtError>` |\n| `extract-string-constant` | — | None |\n| `fix-namespace` | — | None |\n| `implement-interface` | — | None |\n| `inline-method` | — | None |\n| `make-async` | — | None |\n| `make-instance` | — | None |\n| `make-sealed` | — | None |\n| `make-static` | — | None |\n| `migrate-to-ioptions` | — | None |\n| `move` | *(new — EP-012)* | Fix MCP schema: declare required fields (or one-of `type` vs `namespace`). |\n| `move-method` | — | None |\n| `narrow-dependency` | — | None |\n| `rename` | — | ✓ Native handler in `6d767b1` |\n| `replace-call` | — | None |\n| `replace-datetime` | — | None |\n| `replace-new` | — | None |\n| `replace-xunit-asserts` | — | None |\n| `safe-delete` | — | None |\n| `transform-parameters` | — | None |\n\n### `rt suggest` — meta\n\n| Command | Open stories | Notes |\n|---|---|---|\n| `suggest` | US-087, US-080, *(new — EP-012)* | Build the BM25 top-level command (US-087); replace hand-curated synonyms (US-080); align native MCP `ToolName` from `suggest_command` to `suggest` |\n\n---\n\n## 5. Cross-cutting (not pinned to a command)\n\nThese don't fit the per-command rows but might land in the same pass:\n\n- **US-067** — `/execute` skill nested-branch pattern revisit\n- **US-073** — Migrate solution to .NET 10\n- **US-078** — `WorkspaceLoader.LoadAsync` → `Result<T, RtError>`\n- **US-083** — Bring `src/RoslynTools.Cli/` and `src/RoslynTools.Mcp/` into Stryker mutation pilot\n- **US-090** — Unknown-command fallback in `App.cs` (BM25 \"did you mean\")\n- **US-091** — Diff renderer enrichment in `SolutionWriter.PrintDiff`\n- **US-092** — Stable fix IDs + `--apply`/`--skip` for batch mutation commands (affects all batch mutators uniformly via `BatchMutationRunner`)\n- **US-097** — Decide MCP shape for mutating refactor commands (the dry-run-by-default policy)\n- **US-098** — Drop `RoslynTools.Mcp` → `RoslynTools.Cli` project reference\n- **US-099** — Extract `IRtCommand` registry into a new `RoslynTools.Commands` project\n- **US-102** — Complete `IWorkspaceSessionFactory` migration — remove `LoadWorkspaceAsync` compat surface\n"}]}};

  <script>
    const e = React.createElement;

    function normalizeStory(story) {
      const acceptance = Array.isArray(story && story.acceptanceCriteria) ? story.acceptanceCriteria : [];
      return {
        id: String(story && story.id || ""),
        title: String(story && story.title || ""),
        description: String(story && story.description || ""),
        acceptanceCriteria: acceptance.map((item) => String(item)),
        priority: Number(story && story.priority || 9999),
        passes: Boolean(story && story.passes),
        notes: String(story && story.notes || ""),
        epicId: String(story && story.epicId || "")
      };
    }

    function normalizeEpic(epic) {
      return {
        id: String(epic && epic.id || ""),
        title: String(epic && epic.title || ""),
        description: String(epic && epic.description || ""),
        notes: String(epic && epic.notes || "")
      };
    }

    function normalizeProject(raw, fallback) {
      const stories = Array.isArray(raw && raw.userStories) ? raw.userStories.map(normalizeStory) : [];
      const epics = Array.isArray(raw && raw.epics) ? raw.epics.map(normalizeEpic) : [];
      const sortedStories = stories.slice().sort((left, right) => {
        if (left.passes !== right.passes) return left.passes ? 1 : -1;
        if (left.priority !== right.priority) return left.priority - right.priority;
        return left.id.localeCompare(right.id);
      });
      const total = sortedStories.length;
      const complete = sortedStories.filter((story) => story.passes).length;
      const pending = total - complete;
      return {
        project: String(raw && raw.project || fallback.project || "PRD"),
        branchName: String(raw && raw.branchName || fallback.branchName || ""),
        description: String(raw && raw.description || fallback.description || ""),
        path: fallback.path || "",
        sourceUrl: fallback.sourceUrl || "",
        stats: {
          total: total,
          complete: complete,
          pending: pending,
          completionPct: total ? Math.round((complete / total) * 100) : 0
        },
        epics: epics,
        stories: sortedStories
      };
    }

    function escapeHtml(value) {
      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");
    }

    function renderInlineMarkdown(text) {
      let value = escapeHtml(text);
      value = value.replace(/`([^`]+)`/g, "<code>$1</code>");
      value = value.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
      value = value.replace(/\*([^*]+)\*/g, "<em>$1</em>");
      return value;
    }

    function renderMarkdown(text) {
      const value = String(text || "").replace(/\r\n/g, "\n").trim();
      if (!value) return "";

      const lines = value.split("\n");
      const parts = [];
      let inList = false;

      function closeList() {
        if (inList) {
          parts.push("</ul>");
          inList = false;
        }
      }

      for (const rawLine of lines) {
        const line = rawLine.trim();
        if (!line) {
          closeList();
          continue;
        }

        if (line.startsWith("- ") || line.startsWith("* ")) {
          if (!inList) {
            parts.push("<ul>");
            inList = true;
          }
          parts.push("<li>" + renderInlineMarkdown(line.slice(2).trim()) + "</li>");
          continue;
        }

        closeList();

        if (line.startsWith("### ")) {
          parts.push("<h5>" + renderInlineMarkdown(line.slice(4)) + "</h5>");
        } else if (line.startsWith("## ")) {
          parts.push("<h4>" + renderInlineMarkdown(line.slice(3)) + "</h4>");
        } else if (line.startsWith("# ")) {
          parts.push("<h3>" + renderInlineMarkdown(line.slice(2)) + "</h3>");
        } else {
          parts.push("<p>" + renderInlineMarkdown(line) + "</p>");
        }
      }

      closeList();
      return parts.join("");
    }

    function MarkdownBlock(props) {

    function setCookie(name, value) {
      const maxAge = 60 * 60 * 24 * 365;
      document.cookie = name + "=" + encodeURIComponent(value) + "; path=/; max-age=" + maxAge + "; SameSite=Lax";
    }

    function getCookie(name) {
      const prefix = name + "=";
      const parts = document.cookie ? document.cookie.split("; ") : [];
      for (const part of parts) {
        if (part.startsWith(prefix)) {
          return decodeURIComponent(part.slice(prefix.length));
        }
      }
      return "";

    function PrdPicker(props) {

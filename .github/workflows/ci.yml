name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            **/*.csproj
            **/packages.lock.json

      - name: Restore
        run: dotnet restore RoslynTools.slnx

      - name: Verify formatting
        run: dotnet format RoslynTools.slnx --verify-no-changes --no-restore

      - name: Verify portable distribution contract
        run: ./scripts/test-distribution.sh

      - name: Build
        run: dotnet build RoslynTools.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test RoslynTools.slnx --configuration Release --no-build --logger "trx;LogFileName=test-results.trx" --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/**/*.trx
          if-no-files-found: warn

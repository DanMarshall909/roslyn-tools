name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            **/*.csproj
            **/packages.lock.json

      - name: Restore
        run: dotnet restore RoslynTools.slnx

      - name: Check formatting
        id: formatting
        continue-on-error: true
        run: dotnet format RoslynTools.slnx --verify-no-changes --no-restore

      - name: Report formatting warning
        if: steps.formatting.outcome == 'failure'
        shell: pwsh
        run: Write-Warning "dotnet format found formatting differences. Build and tests will continue."

      - name: Build
        run: dotnet build RoslynTools.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test RoslynTools.slnx --configuration Release --no-build --logger "trx;LogFileName=test-results.trx" --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/**/*.trx
          if-no-files-found: warn

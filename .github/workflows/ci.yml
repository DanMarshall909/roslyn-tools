name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-purity:
    name: Verify restore, build, and test purity
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Test purity detector
        run: node --test tests/build-purity.test.mjs

      - name: Verify plain restore, Debug build, and test
        run: node scripts/check-build-purity.mjs

  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            **/*.csproj
            **/packages.lock.json

      - name: Restore
        run: dotnet restore RoslynTools.slnx

      - name: Verify formatting
        run: dotnet format RoslynTools.slnx --verify-no-changes --no-restore

      - name: Verify portable distribution contract
        run: ./scripts/test-distribution.sh

      - name: Build
        run: dotnet build RoslynTools.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test RoslynTools.slnx --configuration Release --no-build --logger "trx;LogFileName=test-results.trx" --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/**/*.trx
          if-no-files-found: warn

  net11-preview-build:
    name: Build with .NET 11 preview
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 11 preview
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 11.0.x
          dotnet-quality: preview

      - name: Disable the .NET 10 SDK pin for this compatibility build
        run: mv global.json global.json.net10

      - name: Show selected preview SDK
        run: dotnet --version

      - name: Restore with .NET 11 preview
        run: dotnet restore RoslynTools.slnx

      - name: Build with .NET 11 preview
        run: dotnet build RoslynTools.slnx --configuration Release --no-restore
